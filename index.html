  // botões de exportação limpa as faturas anexadas deste cliente (repositório
  // faturasAnalise, só este NIF — nunca outros clientes) E a análise gravada em
  // dados-privados/, deixando a vista pronta para um ciclo novo (ex. mês seguinte).
  // Idempotente por construção — nunca precisa de um "já limpei, não repetir": apagar
  // um registo já apagado ou um ficheiro já inexistente é sempre um no-op seguro
  // (removerJsonDadosPrivados já ignora ficheiro em falta), por isso clicar os 2
  // botões em sequência (ex. Imprimir depois Argumentos) nunca dá erro na 2ª limpeza.
  const finalizarAposExportar = async () => {
    const nif = nifSelecionado;
    if (nuvemAtivaAnalise) {
      const faturasDoCliente = await listarFaturasAnaliseNuvem(nif);
      for (const f of faturasDoCliente) await removerFaturaAnaliseAnexadaNuvem(f.id);
      await removerAnaliseFaturasCacheNuvem(nif);
    } else {
      const faturasDoCliente = await listarFaturasAnaliseDoCliente(nif);
      for (const f of faturasDoCliente) await removerFaturaAnaliseAnexada(f.id);
      if (ligacaoPasta.pronto && clienteAtual) {
        await removerJsonDadosPrivados(ligacaoPasta.handle, nomeFicheiroAnaliseFaturas(clienteAtual.e));
      }
    }
    setFaturas([]);
    setResumo(null);
    setAnalisadoEm(null);
    setAnaliseVersaoAntiga(false);
  };

  const imprimirClick = async () => {
    if (!htmlPainel) return;
    setAImprimir(true);
    const nomeCliente = clienteAtual.e;
    const sufixoData = dataISOCurta(dataAnalise);
    const nomeFicheiroHtml = `_Analise_Faturas_${sufixoData}.html`;
    let aviso;
    if (nuvemAtivaAnalise) {
      const ok = await guardarExportAnaliseFaturasNuvem(nifSelecionado, nomeFicheiroHtml, htmlPainel, "text/html");
      aviso = ok
        ? `Painel gravado na nuvem (${nomeFicheiroHtml}) — faturas e análise deste cliente limpas, pronto para o próximo ciclo.`
        : `Não foi possível gravar o painel na nuvem — faturas e análise deste cliente limpas na mesma.`;
    } else {
      const handleProjeto = ligacaoPasta.pronto ? ligacaoPasta.handle : null;
      const r = await guardarFicheiroTexto(handleProjeto, nomeCliente, nomeFicheiroHtml, htmlPainel, "text/html");
      aviso = r.gravadoNaPasta
        ? `Painel gravado em 03_Analise Faturas/${nomeCliente}/Analise/${r.nomeFicheiro} — faturas e análise deste cliente limpas, pronto para o próximo ciclo.`
        : `Painel descarregado: ${r.nomeFicheiro} — faturas e análise deste cliente limpas, pronto para o próximo ciclo.`;
    }
    setAvisoSucesso(aviso);
    setAImprimir(false);
    setTimeout(() => setAvisoSucesso(""), 8000);
    // window.print() é SÍNCRONO no Chrome — bloqueia o separador até o utilizador
    // fechar o diálogo, o que só se descobriu ao testar (nada depois de print()
    // corria enquanto o diálogo estivesse aberto). Por isso finalizar/limpar tem de
    // vir ANTES do print(), nunca depois — senão a limpeza fica pendente de Augusto
    // fechar o diálogo (ou nunca acontece, se ele cancelar de forma a não disparar o
    // resto do código). As chamadas setState aqui só se refletem no DOM no próximo
    // render (React agrupa-as) — o iframe continua montado no momento em que
    // print() é chamado a seguir, por isso a impressão continua a mostrar o
    // conteúdo certo.
    await finalizarAposExportar();
    // Diálogo de impressão do browser sobre o MESMO conteúdo já em ecrã (iframe) —
    // nunca um ficheiro/janela à parte, para nunca divergir do que Augusto está a ver.
    if (iframeRef.current && iframeRef.current.contentWindow) iframeRef.current.contentWindow.print();
  };

  const argumentosClick = async () => {
    if (!resumo || !resumo.contas.length) return;
    const nomeCliente = clienteAtual.e;
    const sufixoData = dataISOCurta(dataAnalise);
    const md = gerarArgumentosReuniao(nomeCliente, resumo.contas, dataAnalise);
    const nomeFicheiroMd = `_Argumentos_Reuniao_${sufixoData}.md`;
    setTextoArgumentos(md);
    setMostrarArgumentos(true);
    let aviso;
    if (nuvemAtivaAnalise) {
      const ok = await guardarExportAnaliseFaturasNuvem(nifSelecionado, nomeFicheiroMd, md, "text/markdown");
      aviso = ok
        ? `Argumentos gravados na nuvem (${nomeFicheiroMd}) — faturas e análise deste cliente limpas, pronto para o próximo ciclo.`
        : `Não foi possível gravar os argumentos na nuvem — faturas e análise deste cliente limpas na mesma.`;
    } else {
      const handleProjeto = ligacaoPasta.pronto ? ligacaoPasta.handle : null;
      const r = await guardarFicheiroTexto(handleProjeto, nomeCliente, nomeFicheiroMd, md, "text/markdown");
      aviso = r.gravadoNaPasta
        ? `Argumentos gravados em 03_Analise Faturas/${nomeCliente}/Analise/${r.nomeFicheiro} — faturas e análise deste cliente limpas, pronto para o próximo ciclo.`
        : `Argumentos descarregados: ${r.nomeFicheiro} — faturas e análise deste cliente limpas, pronto para o próximo ciclo.`;
    }
    setAvisoSucesso(aviso);
    setTimeout(() => setAvisoSucesso(""), 8000);
    // O painel gerador (resumo/htmlPainel) some da vista depois disto — o texto dos
    // argumentos já foi copiado para textoArgumentos/mostrarArgumentos (estado
    // independente, ver render abaixo, fora do bloco condicionado a "resumo"), por
    // isso continua visível mesmo depois da limpeza.
    await finalizarAposExportar();
  };

  // Item 4 (2026-09-25) — gera o email de análise mensal, mesmo princípio de
  // argumentosClick (texto client-facing derivado dos dados já calculados, nunca
  // enviado sozinho). Decisão de desenho (a confirmar com Augusto, não pedida
  // explicitamente): tratado como o 3º "output" desta análise, tal como Imprimir/
  // Argumentos — finaliza o ciclo (limpa faturas/resumo) da mesma forma, para manter
  // só 1 comportamento em vez de uma exceção. Se Augusto preferir poder gerar o email
  // sem fechar o ciclo (ex. para o rever/ajustar várias vezes antes do PDF final),
  // é uma alteração pequena, mas fica assim por agora.
  const emailAnaliseClick = async () => {
    if (!resumo || !resumo.contas.length) return;
    const nomeCliente = clienteAtual.e;
    // "Contacto principal" (ver EXTRA_FIELDS, Clientes) — opcional, para a saudação
    // pelo primeiro nome (2026-09-26, tom pedido por Augusto). Sem ele, o email cai
    // para uma saudação genérica em vez de inventar um nome.
    const extrasCliente = (await obterExtras(nifSelecionado)) || {};
    const { assunto, corpo } = gerarEmailAnaliseFaturas(nomeCliente, resumo.contas, dataAnalise, extrasCliente.contactoNome);
    setAssuntoEmail(assunto);
    setTextoEmail(corpo);
    setMostrarEmail(true);
    setAvisoSucesso("Email de análise preparado — revê o texto e copia para o teu cliente de email. Faturas e análise deste cliente limpas, pronto para o próximo ciclo.");
    setTimeout(() => setAvisoSucesso(""), 8000);
    await finalizarAposExportar();
  };
  const copiarEmail = async (texto, label) => {
    const ok = await copiarParaAreaTransferencia(texto);
    setCopiadoEmail(ok ? label : `erro-${label}`);
    setTimeout(() => setCopiadoEmail(""), 2500);
  };

  return (
    <div className="space-y-3">
      {avisoSucesso && <div className="flex items-center gap-1.5 text-xs text-neutral-600 bg-neutral-50 border border-neutral-200 rounded-md px-3 py-2">{avisoSucesso}</div>}
      {avisoNuvemFalhou && <div className="flex items-center gap-1.5 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-md px-3 py-2">{avisoNuvemFalhou}</div>}
      <MigracaoNuvemBanner nome="a Análise de Faturas" firebaseUser={firebaseUserAnalise} nuvemAtiva={nuvemAtivaAnalise}
        migrarParaNuvem={migrarAnaliseParaNuvem} aMigrar={aMigrarAnalise} nParaMigrar={nParaMigrarAnalise} />
      <ClientePicker todosClientes={todosClientes} nifSelecionado={nifSelecionado} ehNovo={false}
        onSelecionar={selecionarCliente}
        onNovo={() => setAvisoSucesso('Para criar um cliente novo, usa o separador "Clientes" — aqui só se analisam clientes já existentes.')}
        labelNovo="+ Novo Cliente" labelPicker="cliente" />

      {!clienteAtual && (
        <div className="border border-dashed border-neutral-300 rounded-lg p-8 text-center text-sm text-neutral-400">
          Seleciona um cliente para analisar as faturas dele.
        </div>
      )}

      {clienteAtual && (
        <>
          <div className="border border-neutral-200 rounded-lg bg-white p-4">
            <div className="text-base font-medium">{clienteAtual.e}</div>
            <div className="text-sm text-neutral-500 mt-0.5">NIF {clienteAtual.n} · {clienteAtual.t}</div>
          </div>

          <div className="border border-neutral-200 rounded-lg bg-white p-4 space-y-3">
            <div className="flex items-center justify-between">
              <div className="text-xs font-medium text-neutral-400">FATURAS DESTE CLIENTE</div>
              {!ligacaoPasta.pronto && <div className="text-[11px] text-neutral-400">liga a pasta do projeto no aviso do topo para guardar cópias aqui</div>}
            </div>
            <DropzoneFaturas onFicheiros={anexarFicheiros}
              titulo="Arrasta faturas para aqui, ou clica para escolher"
              subtitulo="PDF, JPG ou PNG — todas entram na análise agregada deste cliente."
              accept=".pdf,.jpg,.jpeg,.png" />
            {aAnexar && <div className="text-xs text-neutral-400">A anexar…</div>}
            {faturas.length > 0 && (
              <div className="space-y-1.5">
                {faturas.map((f) => (
                  <div key={f.id} className="flex items-center justify-between gap-2 bg-neutral-50 rounded-md px-3 py-2 text-xs">
                    <button onClick={() => verFatura(f)} className="text-left flex-1 hover:underline"><Icone nome="documento" className="w-4 h-4 shrink-0" />
                      {f.nome} <span className="text-neutral-400">({formatarTamanhoFicheiro(f.tamanho)})</span>
                    </button>
                    <button onClick={() => removerFatura(f.id)} className="text-neutral-400 hover:text-red-600">✕</button>
                  </div>
                ))}
              </div>
            )}
            <button onClick={analisarClick} disabled={aAnalisar || !faturas.length}
              className="text-sm px-3.5 py-2 rounded-md bg-neutral-900 text-white font-medium hover:bg-neutral-800 disabled:opacity-40 whitespace-nowrap"><Icone nome="lupa" className="w-4 h-4 shrink-0" />
              {aAnalisar ? "A analisar…" : "Analisar faturas"}
            </button>
          </div>

          {!resumo && analiseVersaoAntiga && (
            <div className="border border-dashed border-amber-300 bg-amber-50 rounded-lg p-4 text-center text-sm text-amber-700">
              ⚠ Sem análise gravada, ou desatualizada — a lógica de análise mudou desde a última vez. Clica "Analisar faturas" para recalcular.
            </div>
          )}

          {kpisFatura && (
            <>
              <CartoesKpi itens={[
                { rotulo: "Valor da fatura", valor: kpisFatura.gastoMesRecente !== null ? formatEuroArredondado(kpisFatura.gastoMesRecente) : "—", detalhe: kpisFatura.mesRecenteLabel ? `${kpisFatura.mesRecenteLabel}, sem IVA` : "sem IVA", tom: "vermelho" },
                { rotulo: "Acessos", valor: kpisFatura.nLinhasRecente, detalhe: "no mês mais recente" },
                { rotulo: "% fixo", valor: kpisFatura.custoFixoPercent !== null ? `${kpisFatura.custoFixoPercent}%` : "—", detalhe: "mensalidades e suplementares, antes de descontos" },
                { rotulo: "% variável", valor: kpisFatura.custoVariavelPercent !== null ? `${kpisFatura.custoVariavelPercent}%` : "—", detalhe: "consumo fora da mensalidade" },
              ]} />
              <div className="flex gap-6 items-start">
                <div className="flex-1 min-w-0 bg-white border rounded-[20px] p-5" style={{ borderColor: "var(--vf-border)" }}>
                  <div className="font-display font-bold text-xl">Evolução do valor</div>
                  <div className="text-xs mt-0.5 mb-4" style={{ color: "var(--vf-muted)" }}>Total por mês, sem IVA</div>
                  <BarrasEvolucao pontos={kpisFatura.totalPorMes} />
                </div>
                <aside className="w-[470px] shrink-0 bg-white border rounded-[20px] p-5 space-y-4" style={{ borderColor: "var(--vf-border)" }}>
                  <div className="font-display font-bold text-xl">Email para o cliente</div>
                  {!mostrarEmail ? (
                    <>
                      <div className="text-sm" style={{ color: "var(--vf-muted)" }}>
                        Prepara o email de análise mensal a partir destes números. Tal como Imprimir e Argumentos, isto finaliza a análise
                        (limpa as faturas anexadas e o resumo gravado, pronto para o próximo ciclo).
                      </div>
                      <button onClick={emailAnaliseClick} disabled={!resumo} className="w-full bg-red-600 disabled:opacity-40">
                        <Icone nome="email" className="w-4 h-4 shrink-0" />
                        Preparar email para o cliente
                      </button>
                    </>
                  ) : (
                    <>
                      <div>
                        <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--vf-muted)" }}>Para</div>
                        <input type="email" value={emailDestino} onChange={(e) => setEmailDestino(e.target.value)}
                          placeholder="cliente@empresa.pt" className="w-full px-3 border text-sm bg-white" />
                      </div>
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-1.5">
                          <div className="text-xs font-semibold" style={{ color: "var(--vf-muted)" }}>Assunto</div>
                          <button onClick={() => copiarEmail(assuntoEmail, "assunto")} className="vf-sec">
                            <Icone nome={copiadoEmail === "assunto" ? "check" : "copiar"} className="w-4 h-4" />
                            {copiadoEmail === "assunto" ? "Assunto copiado" : copiadoEmail === "erro-assunto" ? "Não foi possível copiar" : "Copiar assunto"}
                          </button>
                        </div>
                        <div className="text-sm border rounded-xl px-3 py-2.5" style={{ borderColor: "var(--vf-border)" }}>{assuntoEmail}</div>
                      </div>
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-1.5">
                          <div className="text-xs font-semibold" style={{ color: "var(--vf-muted)" }}>Corpo</div>
                          <button onClick={() => copiarEmail(textoEmail, "corpo")} className="bg-red-600">
                            <Icone nome={copiadoEmail === "corpo" ? "check" : "copiar"} className="w-4 h-4" />
                            {copiadoEmail === "corpo" ? "Corpo copiado" : copiadoEmail === "erro-corpo" ? "Não foi possível copiar" : "Copiar corpo"}
                          </button>
                        </div>
                        <pre className="text-sm whitespace-pre-wrap font-sans border rounded-xl p-3 max-h-[420px] overflow-auto" style={{ borderColor: "var(--vf-border)" }}>{textoEmail}</pre>
                      </div>
                    </>
                  )}
                </aside>
              </div>
            </>
          )}

          {resumo && htmlPainel && (
            <div className="border border-neutral-200 rounded-lg bg-white overflow-hidden">
              <div className="flex items-baseline justify-between gap-2 px-4 pt-3">
                <div className="text-xs font-medium text-neutral-400">PAINEL EXECUTIVO</div>
                <div className="text-[11px] text-neutral-400">{resumo.nFaturasAnalisadas} de {resumo.nFaturas} fatura(s) analisada(s) · {resumo.contas.length} conta(s) identificada(s)</div>
              </div>
              {analisadoEm && (
                <div className="text-[11px] text-neutral-400 px-4">
                  Análise gravada em {new Date(analisadoEm).toLocaleDateString("pt-PT")} às {new Date(analisadoEm).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" })}
                  {analiseDesatualizada && <span className="text-amber-600"> · ⚠ a lista de faturas mudou desde então ({faturas.length} agora vs. {resumo.nFaturas} nesta análise) — considera analisar de novo</span>}
                </div>
              )}
              {/* Mesma função geradora do ficheiro exportado (gerarHtmlAnaliseFaturas) — nunca
                  duas versões da lógica de apresentação. O srcDoc é recriado sempre que o
                  resumo muda; a altura ajusta-se ao conteúdo real via onLoad. */}
              <iframe ref={iframeRef} srcDoc={htmlPainel} title="Painel executivo"
                className="w-full border-0"
                style={{ height: `${alturaIframe}px` }}
                onLoad={(e) => {
                  try {
                    const doc = e.target.contentWindow.document;
                    setAlturaIframe(Math.max(600, doc.documentElement.scrollHeight));
                  } catch {}
                }} />

              <div className="px-4 pb-4 space-y-3">
                <button onClick={() => setDetalhesTecnicos((v) => !v)}
                  className="text-xs text-neutral-400 hover:text-neutral-700">
                  {detalhesTecnicos ? "▾" : "▸"} Ver detalhes técnicos (reconciliação por conta/mês)
                </button>
                {detalhesTecnicos && (
                  <div className="space-y-3 border-t border-neutral-100 pt-3">
                    {resumo.contas.map((c) => (
                      <div key={c.conta} className="border border-neutral-100 rounded-lg p-3 space-y-2">
                        <div className="text-xs font-medium text-neutral-600">Conta {c.conta} · {c.periodos.length} período(s)</div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-xs">
                            <thead>
                              <tr className="text-[10px] text-neutral-400 text-left">
                                <th className="pr-2 py-1">Período</th>
                                <th className="text-right px-2">Mensalidade</th>
                                <th className="text-right px-2">Suplementares</th>
                                <th className="text-right px-2">Comunicações</th>
                                <th className="text-right px-2">Descontos</th>
                                <th className="text-right px-2">Total</th>
                                <th className="pl-2"></th>
                              </tr>
                            </thead>
                            <tbody>
                              {c.periodos.map((p) => {
                                const t = p.rubricas.totais;
                                return (
                                  <tr key={p.nomeFicheiro} className="border-t border-neutral-100">
                                    <td className="py-1 pr-2">
                                      {p.label}
                                      {p.rubricas.totaisCalculado && <span className="text-neutral-400" title="Sem tabela agregada nesta fatura — somado a partir dos números individuais">*</span>}
                                    </td>
                                    <td className="text-right px-2">{t && t.mensalidade !== null ? formatEuro(t.mensalidade) : "—"}</td>
                                    <td className="text-right px-2">{t && t.suplementares !== null ? formatEuro(t.suplementares) : "—"}</td>
                                    <td className="text-right px-2">{t && t.comunicacoes !== null ? formatEuro(t.comunicacoes) : "—"}</td>
                                    <td className="text-right px-2">{t && t.descontos !== null ? formatEuro(t.descontos) : "—"}</td>
                                    <td className="text-right px-2 font-medium">{t && t.total !== null ? formatEuro(t.total) : "—"}</td>
                                    <td className="pl-2">{p.reconciliacao.confirmado ? <span className="text-emerald-600" title="Reconciliado">✓</span> : <span className="text-amber-600" title="Não confirmado — ver avisos abaixo">⚠</span>}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    ))}
                    {resumo.avisos.length > 0 && (
                      <div className="space-y-1 pt-1 border-t border-neutral-100">
                        {resumo.avisos.map((a, i) => <div key={i} className="text-[11px] text-amber-700 bg-amber-50 rounded-md px-2 py-1">⚠ {a}</div>)}
                      </div>
                    )}
                  </div>
                )}

                <div className="flex items-center gap-2 flex-wrap pt-1">
                  <button onClick={imprimirClick} disabled={aImprimir}
                    className="text-sm px-3.5 py-2 rounded-md bg-red-600 text-white font-medium hover:bg-red-700 disabled:opacity-40 whitespace-nowrap"><Icone nome="impressora" className="w-4 h-4 shrink-0" />
                    {aImprimir ? "A gravar…" : "Imprimir/PDF e HTML"}
                  </button>
                  <button onClick={argumentosClick}
                    className="text-sm px-3.5 py-2 rounded-md bg-neutral-900 text-white font-medium hover:bg-neutral-800 whitespace-nowrap"><Icone nome="conversa" className="w-4 h-4 shrink-0" />
                    Argumentos
                  </button>
                  <div className="text-[11px] text-neutral-400">
                    Gravados em 03_Analise Faturas/{clienteAtual ? clienteAtual.e : ""}/Analise/ — só ao clicar num destes botões, que também finalizam esta análise (limpam as faturas anexadas e o resumo gravado, prontos para o próximo ciclo).
                  </div>
                </div>
              </div>
            </div>
          )}

          {mostrarArgumentos && (
            <div className="border border-neutral-200 rounded-lg bg-neutral-50 p-3 space-y-2">
              <div className="flex items-center justify-between">
                <div className="text-xs font-medium text-neutral-500">ARGUMENTOS DE REUNIÃO</div>
                <button onClick={() => setMostrarArgumentos(false)} className="text-neutral-400 hover:text-red-600">✕</button>
              </div>
              <pre className="text-xs whitespace-pre-wrap font-sans text-neutral-700">{textoArgumentos}</pre>
            </div>
          )}

        </>
      )}
    </div>
  );
}

/* ================= PONTO: PROPOSTAS ================= */

// Caixa genérica de arrastar/largar um ficheiro — usada tanto para o Excel de decisão
// (Caixa 1) como para o Word da proposta (Caixa 2). Declarada a nível de módulo (nunca
// dentro de PropostasView) — mesma razão do bug de foco já corrigido noutros
// formulários deste ficheiro: um componente redeclarado a cada render do pai perde o
// estado/foco do próprio input de ficheiro a cada render.
//
// Fluxo simplificado (2026-09-21, decisão explícita e definitiva do utilizador, depois
// de 2 bugs reais causados por tentar adivinhar ficheiros por nome/convenção no disco
// e na nuvem): cada etapa (Excel → Word → PDF) usa exclusivamente o que for arrastado
// para a caixa correspondente — nunca há procura automática nenhuma, em lado nenhum.
function CaixaArrastarFicheiro({ titulo, accept, ficheiro, mensagemAnexado, placeholder, aAnexar, aviso, onFicheiro }) {
  const [aArrastar, setAArrastar] = useState(false);
  const inputRef = React.useRef(null);

  return (
    <div className="border border-neutral-200 rounded-lg bg-neutral-50 p-3 text-xs space-y-1.5">
      <div className="font-medium text-neutral-500">{titulo}</div>
      {ficheiro ? (
        <div className="text-emerald-700">✓ "{ficheiro.nome}" {mensagemAnexado}</div>
      ) : (
        <div className="text-neutral-400">{placeholder}</div>
      )}
      <div
        onClick={() => inputRef.current && inputRef.current.click()}
        onDragOver={(e) => { e.preventDefault(); setAArrastar(true); }}
        onDragLeave={() => setAArrastar(false)}
        onDrop={(e) => { e.preventDefault(); setAArrastar(false); const f = e.dataTransfer.files[0]; if (f) onFicheiro(f); }}

      </div>
      {aviso && <div className="text-neutral-500">{aviso}</div>}
    </div>
  );
}

            <div key={m.label} className="flex flex-col items-center justify-end gap-1.5 h-full w-11 shrink-0" title={`${m.label}: ${formatEuro(m.total)}`}>

}

  // Bug real corrigido (2026-09-21): quando a nuvem estava ativa (login feito),
  // guardarExcelAnaliseNuvem era a ÚNICA tentativa — se falhasse (ex.: Firebase
  // Storage ainda por ativar/configurar no Console, ver storage.rules), o erro ficava
  // só num console.warn e o Excel não aparecia em lado nenhum (nem nuvem, nem disco,
  // nem download) — exatamente o sintoma reportado por Augusto ("análise corre bem,
  // Excel nunca aparece"). Agora cai sempre para guardarExcelAnalise como rede de
  // segurança, que faz XLSX.writeFile (download real do browser) quando não há pasta
  // do projeto ligada — nunca deixa Augusto sem ficheiro nenhum no disco.
  const gerarEGuardarExcel = async (analiseParaExcel, nomeCliente, decisoesOverride) => {
    const wb = gerarExcelAnaliseTarifarios(nomeCliente, analiseParaExcel.linhas || [], decisoesOverride || analiseParaExcel.decisoes || {}, dadosAutonomias, dadosProdutosCatalogo, analiseParaExcel.observacaoManual);
    if (nuvemAtivaExcel && nifAtivo) {
      const resultadoNuvem = await guardarExcelAnaliseNuvem(nifAtivo, nomeCliente, wb);
      if (resultadoNuvem.gravadoNaNuvem) return resultadoNuvem;
      const resultadoLocal = await guardarExcelAnalise(ligacaoPasta.pronto ? ligacaoPasta.handle : null, nomeCliente, wb);
      return { ...resultadoLocal, gravadoNaNuvem: false, erroNuvem: resultadoNuvem.erro || "erro desconhecido" };
    }
    return guardarExcelAnalise(ligacaoPasta.pronto ? ligacaoPasta.handle : null, nomeCliente, wb);
  };

  // Fonte do Excel de decisão para "Gerar Word" (2026-09-21, simplificação definitiva
  // pedida pelo utilizador): SÓ excelAnexadoLocal — o ficheiro que Augusto arrastou
  // para "Caixa 1". Nunca procura na nuvem nem no disco por nome/convenção — essa
  // procura automática foi exatamente a causa dos 2 bugs reais de hoje (Excel "gerado"
  // que nunca aparecia). Sem adivinhação: só o que foi arrastado à mão.
  const lerExcelDeDecisao = () => excelAnexadoLocal;

  // "⬇️ Descarregar Excel agora" — atalho manual que nunca depende da nuvem (nem para
  // gravar, nem para reler): regenera o workbook a partir da "analise" já em memória
  // (mesmos dados que "Analisar faturas anexadas" já calculou) e descarrega logo pelo
  // browser. Rede de segurança pedida por Augusto (2026-09-21) depois de a leitura da
  // nuvem ter falhado em silêncio mesmo com a escrita a dizer "sucesso" — garante
  // sempre um ficheiro real no disco, independente do estado da nuvem.
  const [aDescarregarAgora, setADescarregarAgora] = useState(false);
  const descarregarExcelAgoraClick = () => {
    if (!analise) return;
    setADescarregarAgora(true);
    const nomeCliente = ehNovo ? novoBase.e : clienteAtual.e;
    const wb = gerarExcelAnaliseTarifarios(nomeCliente, analise.linhas || [], analise.decisoes || {}, dadosAutonomias, dadosProdutosCatalogo, analise.observacaoManual);
    const nomeFicheiro = `${sanitizarNomePasta(nomeCliente)}_Analise_Tarifarios_${new Date().toISOString().slice(0, 10)}.xlsx`;
    XLSX.writeFile(wb, nomeFicheiro);
    setADescarregarAgora(false);
  };

  // Formata a mensagem de sucesso do Excel de análise — partilhada entre
  // analisarFaturasAnexadas (fluxo automático) e gerarExcelClick (botão manual).
  const formatarMensagemExcel = (resultado, nomeCliente, automatico) => {
    const local = resultado.gravadoNaNuvem
      ? "na nuvem"
      : resultado.gravadoNaPasta
        ? `em 03_Analise Faturas/${nomeCliente}/Analise/${resultado.nomeFicheiro}`
        : `descarregado: ${resultado.nomeFicheiro}`;
    const avisoNuvem = resultado.erroNuvem
      ? ` ⚠ A gravação na nuvem falhou (${resultado.erroNuvem}) — grava-se ${resultado.gravadoNaPasta ? "na pasta do projeto" : "por download"} em alternativa. Confirma com o Claude Code se o Firebase Storage já foi ativado/configurado (ver storage.rules).`
      : "";
    if (automatico) {
      return `Excel gerado e gravado automaticamente ${resultado.gravadoNaNuvem || resultado.gravadoNaPasta ? local : `(${local})`}.${avisoNuvem}`;
    }
    return (resultado.gravadoNaNuvem || resultado.gravadoNaPasta ? `Excel gravado ${local}` : `Excel ${local}`) + avisoNuvem;
  };

  // Extrai texto de cada PDF anexado com PDF.js e tenta identificar serviço/consumo/
  // data de fidelização por linha. Nunca inventa um valor — o que não for encontrado
  // com confiança fica em branco, marcado "não identificado", para confirmares à mão.
  const analisarFaturasAnexadas = async () => {
    setAAnalisar(true);
    const novasLinhas = [];
    // Documentos de apoio (não-fatura) nunca entram na análise automática — decisão
    // explícita do utilizador (2026-09-11). Ficheiros antigos sem "categoriaAnexo"
    // (anexados antes desta mudança) tratam-se como fatura, para não quebrar o
    // comportamento já testado.
    for (const f of faturas.filter((f) => (f.categoriaAnexo || "fatura") === "fatura")) {
      try {
        const texto = await extrairTextoPDF(f.blob);
        novasLinhas.push(...analisarLinhasFinanceiras(texto, f.nome));
      } catch (e) {
        console.warn(`Não foi possível analisar ${f.nome}:`, e.message);
      }
    }
    // Pré-preenche a Análise Rápida com o que já foi calculado — só nos campos ainda
    // vazios (nunca substitui o que o utilizador já escreveu à mão); "Serviços atuais"
    // soma-se ao que já estava selecionado, sem substituir o que o utilizador escreveu.
    const base = analise || { operadoraAtual: "", valorMensal: "", servicosAtuais: [], dataFimFidelizacao: "", linhas: [], decisoes: {} };
    const linhasCombinadas = [...(base.linhas || []), ...novasLinhas];
    const sugestao = sugerirAnaliseRapida(linhasCombinadas);
    const novaAnalise = {
      ...base,
      linhas: linhasCombinadas,
      operadoraAtual: base.operadoraAtual || sugestao.operadoraAtual || "",
      valorMensal: base.valorMensal || (sugestao.valorMensal !== null ? String(sugestao.valorMensal) : ""),
      dataFimFidelizacao: base.dataFimFidelizacao || sugestao.dataFimFidelizacao || "",
      servicosAtuais: [...new Set([...(base.servicosAtuais || []), ...sugestao.servicosAtuais])],
    };
    setAnalise(novaAnalise);
    // Já não gera/grava o Excel automaticamente aqui (2026-09-21, simplificação
    // definitiva pedida pelo utilizador) — o Excel obtém-se sempre por ação explícita
    // ("⬇️ Descarregar Excel agora"), nunca como efeito colateral silencioso da análise.
    setAAnalisar(false);
  };

  const [aGerarExcel, setAGerarExcel] = useState(false);
  const gerarExcelClick = async (decisoesOverride) => {
    // Sem faturas (Caminho A2), "linhas" fica sempre vazio — o Excel ainda faz
    // sentido gerar-se, mais vazio, com a observação do consultor incluída (ver
    // gerarExcelAnaliseTarifarios). Só bloqueia quando não há análise nenhuma.
    if (!analise) return;
    setAGerarExcel(true);
    const nomeCliente = ehNovo ? novoBase.e : clienteAtual.e;
    const resultado = await gerarEGuardarExcel(analise, nomeCliente, decisoesOverride);
    setAvisoSucesso(formatarMensagemExcel(resultado, nomeCliente, false));
    setAGerarExcel(false);
    setTimeout(() => setAvisoSucesso(""), 6000);
  };

  // Caminho B — Cliente Novo sem faturas: gera o Excel-questionário em branco em vez do
  // Excel de análise (que precisa de linhas extraídas de faturas, aqui inexistentes).
  const gerarQuestionarioClick = async () => {
    if (!novoBase.e.trim() || !novoBase.n.trim()) { setErroNif("Preenche o Nome e o NIF antes de gerar o questionário."); return; }
    setErroNif("");
    setAGerarQuestionario(true);
    const wb = gerarExcelQuestionarioClienteNovo(novoBase.e, novoBase.n);
    const resultado = await guardarExcelAnalise(ligacaoPasta.pronto ? ligacaoPasta.handle : null, novoBase.e, wb, "Questionario_Cliente_Novo");
    setAvisoSucesso(resultado.gravadoNaPasta
      ? `Questionário gravado em 03_Analise Faturas/${novoBase.e}/Analise/${resultado.nomeFicheiro}`
      : `Questionário descarregado: ${resultado.nomeFicheiro}`);
    setAGerarQuestionario(false);
    setTimeout(() => setAvisoSucesso(""), 6000);
  };

  const removerFatura = async (id) => {
    await removerFaturaAnexada(id);
    const restantes = await listarFaturasDoCliente(nifAtivo);
    setFaturas(restantes);
    // Sem faturas anexadas, a análise calculada a partir delas deixa de fazer sentido
    // no ecrã — as duas devem limpar-se sempre juntas, nunca uma sem a outra.
    if (restantes.length === 0) setAnalise(null);
  };

  const verFatura = (fatura) => {
    const url = URL.createObjectURL(fatura.blob);
    window.open(url, "_blank");
  };

  const mudarAnalise = (campo, valor) => setAnalise((prev) => ({ ...(prev || {}), [campo]: valor }));
  const toggleServicoAtual = (servico) => setAnalise((prev) => {
    const atual = (prev && prev.servicosAtuais) || [];
    const novos = atual.includes(servico) ? atual.filter((s) => s !== servico) : [...atual, servico];
    return { ...(prev || {}), servicosAtuais: novos };
  });

  const nomeParaProposta = ehNovo ? novoBase.e : (clienteAtual ? clienteAtual.e : "");

  // Caixa 2 "Arrasta o Word aqui" (2026-09-21, simplificação definitiva pedida pelo
  // utilizador) — substitui por completo a antiga procura automática na pasta do
  // projeto por convenção de nome (encontrarPropostaMaisRecente). Augusto abre e revê
  // o Word em Finder/Word; só arrasta de volta para aqui se tiver feito ajustes que
  // "Gerar PDF" precise de usar como fonte explícita — sem arrastar, "Gerar PDF"
  // continua a funcionar (wordJaGerado), só assume "o Word que acabaste de gerar".
  const [wordAnexado, setWordAnexado] = useState(null); // { nome, file } | null
  const [wordJaGerado, setWordJaGerado] = useState(false);

  // "Gerar PDF" — pede ao Claude Code (via Terminal) para converter o Word para PDF.
  // Nunca procura no disco: usa o nome exato do Word arrastado (wordAnexado) quando
  // existir, ou refere-se ao "Word que acabaste de gerar" (mesma conversa/Terminal,
  // sem precisar do nome exato) quando Augusto avançou direto sem arrastar nada.
  const linkGerarPdf = () => {
    const pastaAbsoluta = caminhoPastaCliente(caminhoProjeto, nomeParaProposta);
    const texto = wordAnexado
      ? `Converte a proposta Word "${wordAnexado.nome}" (pasta "03_Analise Faturas/${nomeParaProposta}/Analise/") para PDF, mantendo a mesma formatação, e guarda o PDF na mesma pasta.`
      : `Converte para PDF o Word da proposta que acabaste de gerar no passo anterior desta conversa, mantendo a mesma formatação, e guarda o PDF na pasta "03_Analise Faturas/${nomeParaProposta}/Analise/".`;
    return construirLinkClaudeCode(texto, pastaAbsoluta).url;
  };

  // Resume esta seleção num texto pronto a colar numa conversa com o Claude Code, para
  // seguir o pipeline da skill "proposta-vodafone-business" (Excel → Word → PDF branded).
  // "linhasSeguimento" (opcional) — vem de "Dar seguimento" (ver darSeguimentoClick),
  // já relido e validado (nenhuma linha "Upgrade" sem Mensalidade nova). Sem isto, o
  // o botão "Gerar Word" usa este resumo como entrada para a skill.
  const gerarResumoParaSkill = async (linhasSeguimento) => {
    const nome = ehNovo ? novoBase.e : clienteAtual.e;
    const nif = ehNovo ? novoBase.n : clienteAtual.n;
    const textoLinhas = [`PEDIDO DE PROPOSTA — ${nome} (NIF ${nif})`, "", "Os produtos e valores foram definidos manualmente no Excel final."];
    if (linhasSeguimento && linhasSeguimento.length) {
      const alteradas = linhasSeguimento.filter((l) => l.acao !== "Manter");
      const mantidas = linhasSeguimento.length - alteradas.length;
      textoLinhas.push("", `DECISÕES POR SERVIÇO (Excel "Novos Tarifários" relido via "Dar seguimento" — ${linhasSeguimento.length} serviço(s), ${mantidas} sem alteração):`);
      if (!alteradas.length) {
        textoLinhas.push("(todas as linhas ficaram como \"Manter\" — nenhuma alteração proposta)");
      }
      alteradas.forEach((l) => {
        if (l.acao === "Upgrade") {
          textoLinhas.push(`- ${l.numero} (${l.tarifarioAtual}, ${formatEuro(l.custoAtual)}/mês) → Upgrade para ${l.tarifarioProposto || "(tarifário por preencher)"}, ${formatEuro(l.mensalidadeNova)}/mês${l.poupanca !== null ? ` (poupança ${formatEuro(l.poupanca)}/mês)` : ""}.`);
        } else {
          textoLinhas.push(`- ${l.numero} (${l.tarifarioAtual}, ${formatEuro(l.custoAtual)}/mês): ${l.acao}.`);
        }
        if (l.observacao) textoLinhas.push(`  Obs: ${l.observacao}`);
      });
    }
    if (analise) {
      textoLinhas.push("", "ANÁLISE DA FATURA ATUAL:");
      if (analise.operadoraAtual) textoLinhas.push(`- Operadora atual: ${analise.operadoraAtual}`);
      if (analise.valorMensal) textoLinhas.push(`- Valor mensal atual: ${analise.valorMensal}€`);
      if (analise.dataFimFidelizacao) textoLinhas.push(`- Data fim de fidelização: ${analise.dataFimFidelizacao}`);
      if (analise.servicosAtuais && analise.servicosAtuais.length) textoLinhas.push(`- Serviços atuais: ${analise.servicosAtuais.join(", ")}`);
      if (faturas.length) textoLinhas.push(`- ${faturas.length} documento(s) anexado(s) (guardados no dashboard${ligacaoPasta.pronto ? " e em 03_Analise Faturas/" + nome + "/Faturas/" : ""})`);
      if (resumoPorCategoria.length) {
        textoLinhas.push("", "RESUMO POR CATEGORIA (ver Excel gerado para o detalhe completo por tarifário):");
        resumoPorCategoria.forEach((c) => {
          textoLinhas.push(`- ${c.categoria}: ${c.nServicos} serviço(s), ${formatEuro(c.custoTotalMedio)}/mês médio (variável/extra ${formatEuro(c.variavelMedio)}/mês)`);
          c.porTarifario.forEach((t) => {
            textoLinhas.push(`  · ${t.tarifario}${t.tipoServico ? ` (${t.tipoServico})` : ""} — ${t.nServicos}× — ${formatEuro(t.mediaPorServico)}/mês médio`);
          });
          c.notas.forEach((n) => textoLinhas.push(`  ⚠ ${n}`));
        });
      }
    }
    textoLinhas.push("", 'Segue o pipeline da skill "proposta-vodafone-business" (Modo A se houver faturas/dados reais — audita as faturas reais anexadas no dashboard; Modo B se não) para construir a proposta completa. O texto de email de envio já faz parte do output dessa skill (passo 4b) — não é preciso gerá-lo aqui.');
    const texto = textoLinhas.join("\n");
    // A cópia para a área de transferência mantém-se sempre como reserva (pedido
    // explícito do utilizador, 2026-09-12) — o link claude-cli:// é o caminho
    // principal, mas não substitui isto (falha em silêncio se o Claude Code CLI nunca
    // tiver sido corrido interativamente nesta máquina, por exemplo — o handler só fica
    // registado depois do 1º prompt de uma sessão interativa, ver docs).
    let avisoClipboard;
    try {
      await navigator.clipboard.writeText(texto);
      avisoClipboard = "Resumo copiado (reserva)";
    } catch {
      avisoClipboard = "Não consegui copiar automaticamente — usa o botão abaixo, ou copia da consola (F12)";
      console.log(texto);
    }
    const pastaAbsoluta = caminhoPastaCliente(caminhoProjeto, nome);
    const { url, truncado } = construirLinkClaudeCode(texto, pastaAbsoluta);
    setLinkClaudeCode(url);
    setWordJaGerado(true); // liberta "Gerar PDF" — ver linkGerarPdf
    // Navega logo para o link — "1 clique → Word pronto" (decisão explícita do
    // utilizador, 2026-09-14): antes exigia um 2º clique manual em "Abrir no Terminal".
    // Ainda dentro do mesmo gesto de clique (só passaram awaits rápidos — leitura do
    // Excel, escrita no clipboard), por isso o browser deixa navegar para o esquema
    // claude-cli:// sem bloquear. O botão "Abrir no Terminal" fica sempre visível a
    // seguir, como reserva, caso isto falhe em silêncio nalgum browser.
    try { window.location.href = url; } catch {}
    setAvisoSucesso(
      `${avisoClipboard} — a abrir o Terminal…` +
      (pastaAbsoluta ? "" : " ⚠ Sem o caminho da pasta do projeto (campo abaixo), o link não propõe a pasta certa.") +
      (truncado ? " ⚠ O resumo passava de 5.000 caracteres — foi cortado no link (a cópia no clipboard tem o texto completo)." : "") +
      ` Se não abrir sozinho, usa o botão "Abrir no Terminal" abaixo.`
    );
    irParaTopo();
    setTimeout(() => setAvisoSucesso(""), 9000);
  };

  // "Gerar Word": lê o Excel arrastado para a Caixa 1 (excelAnexadoLocal), relê
  // "Novos Tarifários" (lerNovosTarifariosDoExcel) e valida. Decisão explícita do
  // utilizador (2026-09-11):
  // uma linha "Upgrade" sem "Mensalidade nova" preenchida BLOQUEIA o avanço — mostra
  // quais faltam, sem mostrar o botão de gerar o resumo, até estarem corrigidas no
  // Excel (ou a Ação mudada para Manter/Anular) e "Dar seguimento" ser clicado de novo.
  const darSeguimentoClick = async () => {
    setSeguimentoErro(""); setSeguimentoResultado(null);
    // Fonte única a partir de agora: excelAnexadoLocal (2026-09-21, simplificação
    // definitiva pedida pelo utilizador) — nunca tenta nuvem nem disco.
    const encontrado = lerExcelDeDecisao();
    if (!encontrado) {
      setSeguimentoErro(`Ainda não anexaste nenhum Excel — clica "⬇️ Descarregar Excel agora" acima, edita "Novos Tarifários" no teu computador, guarda, e arrasta-o para "📤 Anexar Excel editado" abaixo.`);
      return;
    }
    setADarSeguimento(true);
    try {
      const buffer = await encontrado.file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: "array" });
      const linhas = lerNovosTarifariosDoExcel(wb);
      if (!linhas) {
        setSeguimentoErro(`O ficheiro "${encontrado.nome}" não tem a folha "Novos Tarifários" esperada — não foi alterada a estrutura do Excel, certo?`);
        setADarSeguimento(false);
        return;
      }
      const incompletas = linhas.filter((l) => l.incompleta);
      setSeguimentoResultado({ ficheiro: encontrado.nome, linhas, incompletas });
      if (incompletas.length) {
        setSeguimentoErro(`O Excel ainda tem ${incompletas.length} linha(s) Upgrade sem Mensalidade nova. Preenche-as, guarda o Excel e tenta novamente.`);
      } else {
        await gerarResumoParaSkill(linhas);
      }
    } catch (e) {
      setSeguimentoErro(`Não foi possível ler "${encontrado.nome}": ${e.message}`);
    }
    setADarSeguimento(false);
  };

  return (
    <div className="space-y-3">
      {avisoSucesso && <div className="flex items-center gap-1.5 text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-md px-3 py-2">✓ {avisoSucesso}</div>}
      <ClientePicker todosClientes={todosClientesEProspetos} nifSelecionado={nifSelecionado} ehNovo={ehNovo}
        onSelecionar={selecionarCliente} onNovo={abrirNovo} labelNovo="+ Novo Cliente" labelPicker="cliente ou prospect" />

      {!mostraConteudo && (
        <div className="border border-dashed border-neutral-300 rounded-lg p-8 text-center text-sm text-neutral-400">
          Seleciona um cliente ou prospect para quem construir a proposta, ou cria uma oportunidade nova.
        </div>
      )}

      {mostraConteudo && (
        <>
          <button onClick={limpar} className="text-xs text-neutral-500 hover:text-neutral-800">✕ Limpar seleção</button>

          <div className="border border-neutral-200 rounded-lg bg-white p-4">
            {ehNovo ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-neutral-500 mb-1 block">Nome / Entidade</label>
                  <input value={novoBase.e} onChange={(e) => setNovoBase({ ...novoBase, e: e.target.value })}
                    className="w-full px-3 py-2 rounded-md border border-neutral-200 text-sm" />
                </div>
                <div>
                  <label className="text-xs text-neutral-500 mb-1 block">NIF *</label>
                  <input value={novoBase.n} onChange={(e) => setNovoBase({ ...novoBase, n: e.target.value })}
                    className={`w-full px-3 py-2 rounded-md border text-sm ${erroNif ? "border-red-400" : "border-neutral-200"}`} />
                  {erroNif && <div className="text-xs text-red-600 mt-1">{erroNif}</div>}
                </div>
                <div className="sm:col-span-2 border-t border-neutral-100 pt-3">
                  <div className="text-xs text-neutral-500 mb-2">
                    Cliente novo, sem faturas/histórico — gera um Excel-questionário em branco para preencheres fora do dashboard (Tipo de serviço, Quantidade, Produto, Valor) e depois voltares a anexar aqui em baixo.
                  </div>
                  <button onClick={gerarQuestionarioClick} disabled={aGerarQuestionario}
                    className="text-xs px-3 py-1.5 rounded-md border border-neutral-300 text-neutral-700 hover:border-neutral-400 disabled:opacity-60"><Icone nome="documento" className="w-4 h-4 shrink-0" />
                    {aGerarQuestionario ? "A gerar…" : "Gerar Excel-questionário em branco"}
                  </button>
                </div>
              </div>
            ) : (
              <>
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-base font-medium">{clienteAtual.e}</div>
                    <div className="text-sm text-neutral-500 mt-0.5">NIF {clienteAtual.n} · {clienteAtual.t}</div>
                  </div>
                  {clienteAtual.origem === "prospect" && (
                    <span className="text-xs text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full">Prospect</span>
                  )}
                </div>
                {clienteAtual.origem === "prospect" ? (
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3">
                    <div className="text-center p-2 rounded-md bg-neutral-50"><div className="text-sm font-medium">{clienteAtual.colab ?? "—"}</div><div className="text-[10px] text-neutral-400">Colaboradores</div></div>
                    <div className="text-center p-2 rounded-md bg-neutral-50"><div className="text-sm font-medium">{clienteAtual.cidade || "—"}</div><div className="text-[10px] text-neutral-400">Cidade</div></div>
                    <div className="text-center p-2 rounded-md bg-neutral-50"><div className="text-sm font-medium">{clienteAtual.estado || "—"}</div><div className="text-[10px] text-neutral-400">Estado</div></div>
                    <div className="text-center p-2 rounded-md bg-neutral-50"><div className="text-sm font-medium">{clienteAtual.contacto || "—"}</div><div className="text-[10px] text-neutral-400">Contacto</div></div>
                  </div>
                ) : (
                  <StatsCliente c={clienteAtual} />
                )}

// Fase 1 (2026-09-18) — mesmo padrão cloud-aware de useClientesNovos, ver comentário lá.
function useProspetosNovos(ligacaoPasta) {
  const firebaseUser = useFirebaseAuthUser();
  const { feita: nuvemMigrada, marcar: marcarMigrado } = useMigracaoNuvem("prospetos", firebaseUser);
  const nuvemAtiva = !!firebaseUser && nuvemMigrada;
  const nuvem = useColecaoFirestore("prospetos", nuvemAtiva);

  const { dados: prospetosExcel, fonte, aCarregar, precisaPermissao, continuar, ligar, recarregar } = useDadosLigados("prospetos", mapearLinhaProspect, PROSPETOS_BASE, ligacaoPasta, "prospetos.json");
  const [prospetosNovos, setProspetosNovos] = useState(() => {
    try { return JSON.parse(localStorage.getItem("prospetos-novos") || "[]"); } catch { return []; }
  });
  const adicionarLocal = (novo) => {
    const novos = [...prospetosNovos, novo];
    setProspetosNovos(novos);
    localStorage.setItem("prospetos-novos", JSON.stringify(novos));
  };

  // Import "Preencher dados de contacto a partir da Carteira" (2026-09-20, mesma
  // funcionalidade de useClientesNovos) — diferente de Clientes: tel/email de Prospetos
  // já vêm de Prospectos.xlsx (ver mapearLinhaProspect), por isso em modo LOCAL não há
  // "extras" onde escrever um override sem conflito — criado aqui um bag próprio
  // ("prospetos-contacto-overrides", só usado quando o Excel não tiver o valor). Em
  // modo nuvem, o documento do prospect já é a fonte de verdade — escreve-se lá
  // diretamente. `telDaCarteira`/`emailDaCarteira` marcam a origem (mostrado na ficha)
  // só quando o import é que preencheu o campo — nunca para valores vindos do Excel.
  const [contactoOverrides, setContactoOverrides] = useState(() => {
    try { return JSON.parse(localStorage.getItem("prospetos-contacto-overrides") || "{}"); } catch { return {}; }
  });
  const definirContactoOverride = async (nif, campos) => {
    if (nuvemAtiva) {
      const flags = {};
      if (campos.tel) flags.telDaCarteira = true;
      if (campos.email) flags.emailDaCarteira = true;
      await firebaseDb.collection("prospetos").doc(String(nif)).set({ ...campos, ...flags }, { merge: true });
      return;
    }
    setContactoOverrides((prev) => {
      const novo = { ...prev, [nif]: { ...(prev[nif] || {}), ...campos } };
      try { localStorage.setItem("prospetos-contacto-overrides", JSON.stringify(novo)); } catch {}
      return novo;
    });
  };

  const todosProspetosLocal = useMemo(() => {
    return [...prospetosExcel.filter((p) => p.n), ...prospetosNovos].map((p) => {
      const o = contactoOverrides[p.n];
      if (!o) return p;
      return {
        ...p,
        tel: p.tel || o.tel || "",
        email: p.email || o.email || "",
        telDaCarteira: !p.tel && !!o.tel,
        emailDaCarteira: !p.email && !!o.email,
      };
    }).sort((a, b) => a.e.localeCompare(b.e));
  }, [prospetosExcel, prospetosNovos, contactoOverrides]);
  const todosProspetosNuvem = useMemo(() => [...nuvem.itens].sort((a, b) => a.e.localeCompare(b.e)), [nuvem.itens]);
  const todosProspetos = nuvemAtiva ? todosProspetosNuvem : todosProspetosLocal;
  const prospetosSemNifLocal = useMemo(() => prospetosExcel.filter((p) => !p.n), [prospetosExcel]);
  const prospetosSemNif = nuvemAtiva ? [] : prospetosSemNifLocal;

  const adicionar = nuvemAtiva ? nuvem.definir : adicionarLocal;

  const [aMigrar, setAMigrar] = useState(false);
  const migrarParaNuvem = async () => {
    if (!firebaseUser || nuvemAtiva) return { ok: false };
    setAMigrar(true);
    const atuais = todosProspetosLocal;
    for (const p of atuais) await nuvem.definir(p);
    await marcarMigrado();
    setAMigrar(false);
    return { ok: true, n: atuais.length };
  };

  return {
    todosProspetos, prospetosSemNif, adicionar, definirContactoOverride,
    fonteExcel: fonte, aCarregarExcel: aCarregar, precisaPermissaoExcel: precisaPermissao,
    continuarExcel: continuar, ligarExcel: ligar, recarregarExcel: recarregar,
    firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar: todosProspetosLocal.length,
  };
}

function marcarProspectFechado(nif) {
  let fechados = [];
  try { fechados = JSON.parse(localStorage.getItem("prospetos-fechados") || "[]"); } catch { fechados = []; }
  if (!fechados.includes(nif)) {
    fechados.push(nif);
    localStorage.setItem("prospetos-fechados", JSON.stringify(fechados));
  }
}

function adicionarClienteLocal(nif, nome) {
  let clientesNovos = [];
  try { clientesNovos = JSON.parse(localStorage.getItem("clientes-novos") || "[]"); } catch { clientesNovos = []; }
  const jaExiste = clientesNovos.some((c) => c.n === nif) || CLIENTES_BASE.some((c) => c.n === nif);
  if (!jaExiste) {
    clientesNovos.push({ n: nif, e: nome, t: "Novo Cliente", v: [0, 0], d: [0, 0], i: 0, f: [0, 0], manual: true });
    localStorage.setItem("clientes-novos", JSON.stringify(clientesNovos));
  }
}

function ProspetosView({ ligacaoPasta }) {
  const { todosProspetos, prospetosSemNif, adicionar, definirContactoOverride, fonteExcel, aCarregarExcel, precisaPermissaoExcel, continuarExcel, ligarExcel, recarregarExcel,
    firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar } = useProspetosNovos(ligacaoPasta);
  const { todosClientes, adicionar: adicionarClienteNuvem, fonteExcel: fonteExcelClientes, aCarregarExcel: aCarregarExcelClientes, precisaPermissaoExcel: precisaPermissaoClientes, continuarExcel: continuarClientes, ligarExcel: ligarClientes, recarregarExcel: recarregarExcelClientes, nuvemAtiva: nuvemAtivaClientes } = useClientesNovos(ligacaoPasta);
  const { todos: todaCarteira } = useCarteiraFidelizar(ligacaoPasta);
  const [filtroDistrito, setFiltroDistrito] = useState("");
  const [filtroSegmento, setFiltroSegmento] = useState("");
  const [filtroContacto, setFiltroContacto] = useState("");
  const [nifSelecionado, setNifSelecionado] = useState("");
  const [ehNovo, setEhNovo] = useState(false);
  const [novoBase, setNovoBase] = useState({ e: "", n: "" });
  const [extras, setExtras] = useState({});
  const [avisoSucesso, setAvisoSucesso] = useState("");
  const [erroNif, setErroNif] = useState("");
  const [aGuardar, setAGuardar] = useState(false);
  const [versaoFechados, setVersaoFechados] = useState(0);

  // Campanhas de Email (2026-09-26) — reaproveita os filtros de distrito/segmento já
  // existentes acima (prospetosFiltrados), ao contrário de Clientes onde o setor/email
  // vive em "extras" assíncronos: em Prospetos já vêm no próprio registo, sem custo
  // extra a carregar.
  const [pesquisa, setPesquisa] = useState("");

  const fechados = useMemo(() => {
    try { return new Set(JSON.parse(localStorage.getItem("prospetos-fechados") || "[]")); } catch { return new Set(); }
  }, [versaoFechados]);

  const prospetosAbertos = useMemo(() => todosProspetos.filter((p) => !fechados.has(p.n)), [todosProspetos, fechados]);
  const distritosDisponiveis = useMemo(() => [...new Set(todosProspetos.map((p) => p.distrito).filter(Boolean))].sort(), [todosProspetos]);
  const segmentosDisponiveis = useMemo(() => [...new Set(todosProspetos.map((p) => p.seg).filter(Boolean))].sort(), [todosProspetos]);

  const prospetosFiltrados = useMemo(() => {
    return prospetosAbertos.filter((p) =>
      (!pesquisa.trim() || p.e.toLowerCase().includes(pesquisa.trim().toLowerCase()) || p.n.includes(pesquisa.trim())) &&
      (!filtroDistrito || p.distrito === filtroDistrito) &&
      (!filtroSegmento || p.seg === filtroSegmento) &&
      (!filtroContacto || p.contacto === filtroContacto)
    );
  }, [prospetosAbertos, filtroDistrito, filtroSegmento, filtroContacto, pesquisa]);

  const prospetoAtual = useMemo(() => todosProspetos.find((p) => p.n === nifSelecionado) || null, [nifSelecionado, todosProspetos]);
  const mostraFicha = ehNovo || prospetoAtual;

  const carregarExtras = (nif) => {
    try { setExtras(JSON.parse(localStorage.getItem(`prospect-extra:${nif}`) || "{}")); } catch { setExtras({}); }
  };

  const selecionarProspeto = (nif) => { setEhNovo(false); setAvisoSucesso(""); setNifSelecionado(nif); if (nif) carregarExtras(nif); else setExtras({}); irParaTopo(); };
  const abrirNovo = () => { setEhNovo(true); setNifSelecionado(""); setAvisoSucesso(""); setErroNif(""); setNovoBase({ e: "", n: "" }); setExtras({}); irParaTopo(); };
  const limpar = () => { setEhNovo(false); setNifSelecionado(""); setExtras({}); };
  const mudarExtra = (key, value) => setExtras((prev) => ({ ...prev, [key]: value }));

  // Import único de Telefone/Email a partir de "Carteira a Fidelizar", cruzado por NIF
  // (2026-09-20, mesma funcionalidade já testada e validada em Clientes). Nunca
  // sobrescreve um valor já preenchido (Excel ou "da Carteira" anterior) — só entra em
  // campos vazios. Ver definirContactoOverride (useProspetosNovos) para a diferença de
  // onde o valor fica gravado (local vs nuvem).
  const [aImportarContactos, setAImportarContactos] = useState(false);
  const [resultadoImportContactos, setResultadoImportContactos] = useState(null);
  const importarContactosDaCarteira = async () => {
    if (!window.confirm(`Vai preencher Telefone/Email em "Prospetos" a partir de "Carteira a Fidelizar" (${todaCarteira.length} registos), só nos campos ainda vazios — nunca substitui o que já preencheste à mão. Continuar?`)) return;
    setAImportarContactos(true);
    setResultadoImportContactos(null);
    const carteiraPorNif = new Map(todaCarteira.map((c) => [c.n, c]));
    let atualizados = 0, camposPreenchidos = 0, semCorrespondencia = 0, semDadosNaCarteira = 0, jaPreenchidos = 0;
    for (const prospeto of todosProspetos) {
      const origem = carteiraPorNif.get(prospeto.n);
      if (!origem) { semCorrespondencia++; continue; }
      if (!origem.telefone && !origem.email) { semDadosNaCarteira++; continue; }
      const novosCampos = {};
      if (!prospeto.tel && origem.telefone) novosCampos.tel = origem.telefone;
      if (!prospeto.email && origem.email) novosCampos.email = origem.email;
      if (Object.keys(novosCampos).length === 0) { jaPreenchidos++; continue; }
      await definirContactoOverride(prospeto.n, novosCampos);
      atualizados++;
      camposPreenchidos += Object.keys(novosCampos).length;
    }
    setResultadoImportContactos({ total: todosProspetos.length, atualizados, camposPreenchidos, semCorrespondencia, semDadosNaCarteira, jaPreenchidos });
    setAImportarContactos(false);
  };

  const guardarNifExistente = async (registo, nif) => {
    const erro = validarNifNovoRegisto(nif, todosClientes, todosProspetos);
    if (erro) { alert(erro); return; }
    const ok = await escreverNifNaLinha("prospetos", registo.linhaExcel, nif, "NIF");
    if (ok) { await recarregarExcel(); setAvisoSucesso(`NIF de "${registo.e}" guardado`); setTimeout(() => setAvisoSucesso(""), 3000); }
    else alert("Não foi possível escrever no Excel — confirma que está ligado.");
  };

  const guardar = async () => {
    if (ehNovo) {
      const erro = validarNifNovoRegisto(novoBase.n, todosClientes, todosProspetos);
      if (erro) { setErroNif(erro); return; }
    }
    setErroNif("");
    const nif = ehNovo ? novoBase.n.trim() : prospetoAtual?.n;

// Parser de número "à portuguesa" para campos de texto livre (2026-09-19) —
// aceita "2500", "2.500" (ponto = milhares), "2500,00"/"2.500,00" (vírgula =
// decimal), sem depender do parsing nativo (bloqueado) do <input type="number">.
// Regra: vírgula presente = é sempre o separador decimal; só ponto presente e a
// terminar em exatamente 3 dígitos = separador de milhares (ex. "2.500" → 2500);
// só ponto e não termina em 3 dígitos = decimal (ex. "2.5" → 2,5). Devolve null
// se não conseguir interpretar nada (nunca 0 silencioso).
function parseNumeroPT(str) {
  if (str === null || str === undefined) return null;
  let s = String(str).trim().replace(/\s/g, "").replace(/€/g, "");
  if (s === "") return null;
  const temVirgula = s.includes(",");
  const temPonto = s.includes(".");
  if (temVirgula) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (temPonto) {
    const partes = s.split(".");
    const ultima = partes[partes.length - 1];
    if (partes.length > 1 && ultima.length === 3) s = partes.join("");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
