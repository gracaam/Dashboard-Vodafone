// Fase 1 (2026-09-18) — cloud-aware: quando a migração para o Firestore já foi
// confirmada (nuvemAtiva), `todosClientes` passa a vir inteiramente da coleção
// "clientes" do Firestore, ignorando Excel/localStorage; até lá, comportamento
// IDÊNTICO ao de sempre (decisão explícita do utilizador — nunca troca de fonte
// sozinho). `migrarParaNuvem()` copia o que estiver ativo NESTE MOMENTO (Excel+local)
// para o Firestore, uma vez, e só a partir daí a app passa a ler da nuvem.
// "extras" (email/setor/...) dos clientes lidos do Firestore, guardados em memória
// durante a sessão (até recarregar a página) — ver obterTodosExtras/definirExtras.
// Um NIF com leitura falhada fica fora, para ser tentado outra vez na próxima abertura.
const CACHE_EXTRAS_NUVEM = new Map();

function useClientesNovos(ligacaoPasta) {
  const firebaseUser = useFirebaseAuthUser();
  const { feita: nuvemMigrada, marcar: marcarMigrado } = useMigracaoNuvem("clientes", firebaseUser);
  const nuvemAtiva = !!firebaseUser && nuvemMigrada;
  const nuvem = useColecaoFirestore("clientes", nuvemAtiva);

  const { dados: clientesExcel, fonte, aCarregar, precisaPermissao, continuar, ligar, recarregar } = useDadosLigados("clientes", mapearLinhaCliente, CLIENTES_BASE, ligacaoPasta, "clientes.json");
  const [clientesNovos, setClientesNovos] = useState(() => {
    try { return JSON.parse(localStorage.getItem("clientes-novos") || "[]"); } catch { return []; }
  });
  const adicionarLocal = (novo) => {
    const novos = [...clientesNovos, novo];
    setClientesNovos(novos);
    localStorage.setItem("clientes-novos", JSON.stringify(novos));
  };
  // Remove um Cliente local (nunca toca no Excel — `adicionar` também nunca escreveu
  // lá) que tenha nascido automaticamente do negócio identificado por `linhaExcel` (ver
  // `autoOrigemLinhaExcel` em sincronizarComClientes). Só remove se a marca bater
  // certo — nunca remove um cliente real do Excel nem um criado à mão. Devolve
  // true se removeu algo.
  const removerAutoCriadoLocal = (nif, linhaExcel) => {
    const alvo = clientesNovos.find((c) => c.n === nif && c.autoOrigemLinhaExcel === linhaExcel);
    if (!alvo) return false;
    const novos = clientesNovos.filter((c) => c !== alvo);
    setClientesNovos(novos);
    localStorage.setItem("clientes-novos", JSON.stringify(novos));
    return true;
  };
  // Linhas do Excel sem NIF ficam de fora da lista principal (nunca aparecem no
  // seletor) — vivem à parte em `clientesSemNif`, mostradas na secção "Sem NIF".
  const todosClientesLocal = useMemo(
    () => [...clientesExcel.filter((c) => c.n), ...clientesNovos].sort((a, b) => a.e.localeCompare(b.e)),
    [clientesExcel, clientesNovos]
  );
  const todosClientesNuvem = useMemo(() => [...nuvem.itens].sort((a, b) => a.e.localeCompare(b.e)), [nuvem.itens]);
  const todosClientes = nuvemAtiva ? todosClientesNuvem : todosClientesLocal;
  // A migração já copiou todos os registos COM NIF (é a chave do documento no
  // Firestore) — "sem NIF" deixa de fazer sentido depois de migrado.
  const clientesSemNifLocal = useMemo(() => clientesExcel.filter((c) => !c.n), [clientesExcel]);
  const clientesSemNif = nuvemAtiva ? [] : clientesSemNifLocal;

  const adicionar = nuvemAtiva ? nuvem.definir : adicionarLocal;
  const removerAutoCriado = nuvemAtiva
    ? (nif, linhaExcel) => {
        const alvo = nuvem.itens.find((c) => c.n === nif && c.autoOrigemLinhaExcel === linhaExcel);
        if (!alvo) return false;
        nuvem.remover(nif);
        return true;
      }
    : removerAutoCriadoLocal;

  // Migração única (nunca automática) — copia o snapshot local ATUAL (Excel+"à mão")
  // para o Firestore, um documento por NIF; nunca apaga nada localmente. Idempotente:
  // `.doc(nif).set()` sobrescreve sem duplicar, por isso correr 2 vezes é seguro.
  const [aMigrar, setAMigrar] = useState(false);
  const migrarParaNuvem = async () => {
    if (!firebaseUser || nuvemAtiva) return { ok: false };
    setAMigrar(true);
    const atuais = todosClientesLocal;
    for (const c of atuais) await nuvem.definir(c);
    await marcarMigrado();
    setAMigrar(false);
    return { ok: true, n: atuais.length };
  };

  // Passo 3 do refactor (2026-09-19) — "negociosFechados" (histórico de negócios
  // implementados associados a este cliente, usado por NegociosView) movido para aqui,
  // junto do resto dos dados de Clientes, e tornado cloud-aware. Antes vivia SÓ em
  // localStorage["cliente-extra:{nif}"], mesmo com Clientes já migrado para a nuvem —
  // achado do Passo 2, corrigido agora: o histórico tem de acompanhar o cliente para
  // onde quer que ele esteja.
  // Em modo nuvem, lê sempre por `.get()` direto (nunca do cache `nuvem.itens`, que só
  // atualiza quando o onSnapshot seguinte chegar) — evita ler um valor desatualizado
  // logo a seguir a escrever (ex. sincronizarComClientes acabou de criar o cliente e
  // precisa logo a seguir do array atual dele). Devolve `null` (não `[]`) quando não
  // foi possível confirmar — nunca tratado como "sem negócios" pelo chamador.
  const obterNegociosFechados = async (nif) => {
    if (nuvemAtiva) {
      try {
        const doc = await firebaseDb.collection("clientes").doc(String(nif)).get();
        return (doc.exists && Array.isArray(doc.data().negociosFechados)) ? doc.data().negociosFechados : [];
      } catch {
        return null;
      }
    }
    try { return JSON.parse(localStorage.getItem(`cliente-extra:${nif}`) || "{}").negociosFechados || []; } catch { return []; }
  };
  // `set(..., {merge:true})` em vez de `nuvem.definir` (que faz `.set()` sem merge,
  // substituindo o documento inteiro) — evita apagar outros campos do cliente
  // (v/d/i/f, manual, autoOrigemLinhaExcel, ...) se o cache local ainda não tiver o
  // documento completo mais recente. Funciona também se o documento ainda não existir.
  const definirNegociosFechados = async (nif, lista) => {
    if (nuvemAtiva) {
      await firebaseDb.collection("clientes").doc(String(nif)).set({ negociosFechados: lista }, { merge: true });
      return;
    }
    let extra = {};
    try { extra = JSON.parse(localStorage.getItem(`cliente-extra:${nif}`) || "{}"); } catch { extra = {}; }
    localStorage.setItem(`cliente-extra:${nif}`, JSON.stringify({ ...extra, negociosFechados: lista }));
  };

  // "notasFidelizacao" (2026-09-25) — mesmo padrão de negociosFechados acima, campo
  // próprio no documento (nunca dentro de "extras"). Achado real de Augusto: marcar um
  // registo de "Carteira a Fidelizar" como Fechado quando o cliente JÁ existe (o caso
  // mais comum) não deixava nenhum rasto na ficha — só o caso "cliente novo" tinha
  // confirmação + criação. Nota automática, sem confirmação (o cliente já existe, não
  // há ambiguidade a resolver — ver registarFechoFidelizacao, useFidelizacaoTrimestre).
  const obterNotasFidelizacao = async (nif) => {
    if (nuvemAtiva) {
      try {
        const doc = await firebaseDb.collection("clientes").doc(String(nif)).get();
        return (doc.exists && Array.isArray(doc.data().notasFidelizacao)) ? doc.data().notasFidelizacao : [];
      } catch {
        return null;
      }
    }
    try { return JSON.parse(localStorage.getItem(`cliente-extra:${nif}`) || "{}").notasFidelizacao || []; } catch { return []; }
  };
  const guardarNotasFidelizacao = async (nif, lista) => {
    if (nuvemAtiva) {
      await firebaseDb.collection("clientes").doc(String(nif)).set({ notasFidelizacao: lista }, { merge: true });
      return;
    }
    let extra = {};
    try { extra = JSON.parse(localStorage.getItem(`cliente-extra:${nif}`) || "{}"); } catch { extra = {}; }
    localStorage.setItem(`cliente-extra:${nif}`, JSON.stringify({ ...extra, notasFidelizacao: lista }));
  };
  const adicionarNotaFidelizacao = async (nif, nota) => {
    const atuais = await obterNotasFidelizacao(nif);
    await guardarNotasFidelizacao(nif, [...(Array.isArray(atuais) ? atuais : []), nota]);
  };
  // Reverter o estado de "Fechado" para outro valor (2026-09-25, achado real de
  // Augusto): a nota deixava a ficha com informação desatualizada/enganosa — remove só
  // a última nota com tipo "fidelizacao-fechada" (nunca todo o histórico, nunca notas
  // de outra origem que possam vir a existir), nunca silencioso sobre não encontrar
  // nenhuma para remover.
  const removerUltimaNotaFidelizacao = async (nif) => {
    const atuais = await obterNotasFidelizacao(nif);
    if (!Array.isArray(atuais) || !atuais.length) return false;
    const idxInverso = [...atuais].reverse().findIndex((n) => n.tipo === "fidelizacao-fechada");
    if (idxInverso === -1) return false;
    const idx = atuais.length - 1 - idxInverso;
    await guardarNotasFidelizacao(nif, atuais.filter((_, i) => i !== idx));
    return true;
  };
  // Remoção manual de UMA nota específica, por posição (2026-09-26, pedido explícito
  // do utilizador) — para limpar notas órfãs que ficaram presas antes de
  // removerUltimaNotaFidelizacao existir (ex. Cliente G,
  // 2026-09-25). Nunca corrido automaticamente — botão explícito na ficha.
  const removerNotaFidelizacaoNoIndice = async (nif, indice) => {
    const atuais = await obterNotasFidelizacao(nif);
    if (!Array.isArray(atuais)) return;
    await guardarNotasFidelizacao(nif, atuais.filter((_, i) => i !== indice));
  };

  // "extras" (2026-09-20) — mesmo padrão de negociosFechados acima, agora aplicado ao
  // resto da ficha de Clientes (EXTRA_FIELDS: setor, morada, telefone, email,
  // contactoNome, contactoCargo, ...). Achado do import "Carteira a Fidelizar → Clientes"
  // (ver ClientesView): estes campos só viviam em localStorage["cliente-extra:{nif}"],
  // nunca no Firestore mesmo com Clientes já migrado — corrigido agora, tornado
  // cloud-aware, para o import (e qualquer edição manual) acompanhar o cliente para
  // onde quer que ele esteja. Guardado num campo próprio "extras" no documento do
  // Firestore (nunca a raiz do documento) para nunca colidir com negociosFechados nem
  // com os campos base do cliente (v/d/i/f, manual, autoOrigemLinhaExcel, ...).
  const obterExtras = async (nif) => {
    if (nuvemAtiva) {
      try {
        const doc = await firebaseDb.collection("clientes").doc(String(nif)).get();
        return (doc.exists && doc.data().extras && typeof doc.data().extras === "object") ? doc.data().extras : {};
      } catch {
        return null;
      }
    }
    try { return JSON.parse(localStorage.getItem(`cliente-extra:${nif}`) || "{}"); } catch { return {}; }
  };
  const definirExtras = async (nif, extras) => {
    if (nuvemAtiva) {
      await firebaseDb.collection("clientes").doc(String(nif)).set({ extras }, { merge: true });
      const k = String(nif);
      if (CACHE_EXTRAS_NUVEM.has(k)) CACHE_EXTRAS_NUVEM.set(k, { ...CACHE_EXTRAS_NUVEM.get(k), ...extras });
      return;
    }
    let extra = {};
    try { extra = JSON.parse(localStorage.getItem(`cliente-extra:${nif}`) || "{}"); } catch { extra = {}; }
    localStorage.setItem(`cliente-extra:${nif}`, JSON.stringify({ ...extra, ...extras }));
  };

  // Remove este negócio da lista "negociosFechados" de QUALQUER cliente onde esteja
  // (independentemente do NIF atual) — usado quando o negócio deixa de estar
  // Implementado. Movido de NegociosView (Passo 3, 2026-09-19) — mexe em dados de
  // Clientes, não de Negócios.
  const removerNegocioDeTodosOsClientes = async (linhaExcel) => {
    if (nuvemAtiva) {
      // Usa a lista já carregada (nuvem.itens) só para SABER QUAIS clientes mexer —
      // aceitável estar ligeiramente desatualizada aqui (pior caso: não limpa um
      // cliente que ganhou este negócio há instantes); a escrita em si nunca depende
      // deste cache (ver definirNegociosFechados, sempre merge).
      const afetados = nuvem.itens.filter((c) => Array.isArray(c.negociosFechados) && c.negociosFechados.some((x) => x.linhaExcel === linhaExcel));
      for (const c of afetados) {
        await definirNegociosFechados(c.n, c.negociosFechados.filter((x) => x.linhaExcel !== linhaExcel));
      }
      return;
    }
    const chaves = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("cliente-extra:")) chaves.push(k);
    }
    chaves.forEach((chave) => {
      try {
        const extra = JSON.parse(localStorage.getItem(chave) || "{}");
        if (!Array.isArray(extra.negociosFechados)) return;
        const nova = extra.negociosFechados.filter((x) => x.linhaExcel !== linhaExcel);
        if (nova.length !== extra.negociosFechados.length) {
          localStorage.setItem(chave, JSON.stringify({ ...extra, negociosFechados: nova }));
        }
      } catch {}
    });
  };

  // Mesmo padrão de removerNegocioDeTodosOsClientes acima, mas para notasFidelizacao
  // (2026-09-26, pedido explícito do utilizador: unificar o histórico "Negócio de
  // fidelização fechado" entre Negócios do Trimestre e Carteira a Fidelizar, mesma
  // secção FIDELIZAÇÃO na ficha). Dedup por `linhaExcel` (nunca por data — mais preciso
  // e já é o mecanismo comprovado usado por negociosFechados, não inventado de novo):
  // remove sempre a nota deste negócio antes de sincronizarComClientes decidir se a
  // recria, por isso nunca duplica e nunca fica presa ao reverter.
  const removerNotaNegocioDeTodosOsClientes = async (linhaExcel) => {
    if (nuvemAtiva) {
      const afetados = nuvem.itens.filter((c) => Array.isArray(c.notasFidelizacao) && c.notasFidelizacao.some((x) => x.linhaExcel === linhaExcel));
      for (const c of afetados) {
        await guardarNotasFidelizacao(c.n, c.notasFidelizacao.filter((x) => x.linhaExcel !== linhaExcel));
      }
      return;
    }
    const chaves = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("cliente-extra:")) chaves.push(k);
    }
    chaves.forEach((chave) => {
      try {
        const extra = JSON.parse(localStorage.getItem(chave) || "{}");
        if (!Array.isArray(extra.notasFidelizacao)) return;
        const nova = extra.notasFidelizacao.filter((x) => x.linhaExcel !== linhaExcel);
        if (nova.length !== extra.notasFidelizacao.length) {
          localStorage.setItem(chave, JSON.stringify({ ...extra, notasFidelizacao: nova }));
        }
      } catch {}
    });
  };

  // Se a empresa já é cliente, acrescenta este negócio à lista dela em vez de duplicar;
  // se não é, cria um cliente novo (novo cliente OU adição de serviços a um já existente).
  // Se o negócio deixou de estar Implementado, tira-o de onde estivesse. Movido de
  // NegociosView (Passo 3, 2026-09-19).
  const sincronizarComClientes = async (negocio) => {
    await removerNegocioDeTodosOsClientes(negocio.linhaExcel);
    await removerNotaNegocioDeTodosOsClientes(negocio.linhaExcel);
    if (negocio.estado !== "IMPLEMENTADO" || !negocio.nif) return;
    const jaCliente = todosClientes.some((c) => c.n === negocio.nif);
    if (!jaCliente) {
      // autoOrigemLinhaExcel identifica que este Cliente nasceu automaticamente DESTE
      // negócio — é o que permite, ao reverter, saber com segurança que é seguro
      // remover (nunca um cliente real do Excel, que nunca tem esta marca; ver
      // reverterClienteAutoCriadoSeVazio).
      await adicionar({ n: negocio.nif, e: negocio.empresa, t: "Novo Cliente", v: [0, 0], d: [0, 0], i: 0, f: [0, 0], manual: true, autoOrigemLinhaExcel: negocio.linhaExcel });
    }
    const listaAtual = await obterNegociosFechados(negocio.nif);
    const lista = Array.isArray(listaAtual) ? listaAtual : [];
    const alerta = calcularAlertaFidelizacao(negocio.dataInicio, negocio.meses);
    lista.push({
      linhaExcel: negocio.linhaExcel,
      data: new Date().toISOString(),
      categoria: labelCategoria(negocio.categoria),
      tarifario: negocio.tarifario,
      periodo: negocio.periodoTexto,
      comissaoUpfront: negocio.comissaoUpfront,
      dataRefidelizacao: alerta ? alerta.toISOString() : null,
    });
    await definirNegociosFechados(negocio.nif, lista);
    // Nota unificada "FIDELIZAÇÃO" (2026-09-26) — mesmo texto/mecanismo de Carteira a
    // Fidelizar, para construir ao longo do tempo um único histórico de negócios
    // fechados na ficha, venha de onde vier (Negócios do Trimestre ou Carteira).
    await adicionarNotaFidelizacao(negocio.nif, {
      data: new Date().toISOString(),
      texto: `Negócio de fidelização fechado em ${new Date().toLocaleDateString("pt-PT")}.`,
      tipo: "negocio-implementado",
      linhaExcel: negocio.linhaExcel,
    });
  };

  // Ao reverter um negócio de IMPLEMENTADO para outro Estado, o Cliente que essa
  // sincronização tenha criado automaticamente (ver autoOrigemLinhaExcel acima) só é
  // removido se não tiver ganho NENHUM dado adicional entretanto — decisão explícita
  // do utilizador (2026-09-12), conservadora por ser uma remoção. Na dúvida, não
  // remove — só avisa. Chamar sempre DEPOIS de sincronizarComClientes (que já limpou
  // este negócio de negociosFechados) e sempre com o `negocio` já atualizado. Movido
  // de NegociosView (Passo 3, 2026-09-19).
  const reverterClienteAutoCriadoSeVazio = async (negocio) => {
    if (!negocio.nif || !removerAutoCriado) return null;
    // Sem a marca autoOrigemLinhaExcel para este NIF+linha, ou o cliente não é local
    // (é um cliente real do Excel, ex. Cliente A) — nunca se mexe.
    const candidato = todosClientes.find((c) => c.n === negocio.nif && c.autoOrigemLinhaExcel === negocio.linhaExcel);
    if (!candidato) return null;
    const negociosFechados = await obterNegociosFechados(negocio.nif);
    // "Outras chaves" (setor, telefone, morada, ...) — desde que "extras" ficou
    // cloud-aware (obterExtras acima), lê sempre da fonte certa (nuvem ou localStorage,
    // nunca presume localStorage sozinho como antes).
    const extras = await obterExtras(negocio.nif);
    const outrasChaves = extras ? Object.keys(extras).filter((k) => extras[k]) : [];
    const faturas = await listarFaturasDoCliente(negocio.nif).catch(() => null);
    const motivos = [];
    if (negociosFechados === null) motivos.push("não foi possível confirmar o histórico de negócios deste cliente");
    else if (negociosFechados.length > 0) motivos.push(`${negociosFechados.length} outro(s) negócio(s) associado(s)`);
    if (extras === null) motivos.push("não foi possível confirmar os dados adicionais deste cliente");
    else if (outrasChaves.length) motivos.push(`dados adicionais gravados (${outrasChaves.join(", ")})`);
    if (faturas === null) motivos.push("não foi possível confirmar se há faturas/documentos anexados");
    else if (faturas.length) motivos.push(`${faturas.length} fatura(s)/documento(s) anexado(s)`);
    if (motivos.length) return { removido: false, nome: candidato.e, motivos };
    removerAutoCriado(negocio.nif, negocio.linhaExcel);
    if (!nuvemAtiva && (!negociosFechados || !negociosFechados.length) && !outrasChaves.length) localStorage.removeItem(`cliente-extra:${negocio.nif}`);
    return { removido: true, nome: candidato.e };
  };

  // Leitura em bloco de "extras" (setor/email/...) de TODOS os clientes de uma vez —
  // usado só pelo painel de Campanhas de Email (2026-09-26), que precisa do email/setor
  // de cada cliente para filtrar/selecionar em massa, sem obrigar a abrir a ficha um a
  // um. Corre ao abrir o separador Clientes; em modo nuvem, cada cliente só é lido do
  // Firestore 1 vez por sessão (CACHE_EXTRAS_NUVEM). Promise.all em vez de sequencial.
  const obterTodosExtras = async () => {
    if (nuvemAtiva) {
      // Cache da sessão (CACHE_EXTRAS_NUVEM): só lê do Firestore os NIFs que ainda não
      // leu desde que a página abriu — reabrir o separador não volta a gastar leituras.
      const emFalta = todosClientesNuvem.filter((c) => !CACHE_EXTRAS_NUVEM.has(String(c.n)));
      await Promise.all(emFalta.map(async (c) => {
        try {
          const doc = await firebaseDb.collection("clientes").doc(String(c.n)).get();
          CACHE_EXTRAS_NUVEM.set(String(c.n), (doc.exists && doc.data().extras && typeof doc.data().extras === "object") ? doc.data().extras : {});
        } catch {}
      }));
      return Object.fromEntries(todosClientesNuvem.map((c) => [c.n, CACHE_EXTRAS_NUVEM.get(String(c.n)) || {}]));
    }
    const mapa = {};
    todosClientesLocal.forEach((c) => {
      try { mapa[c.n] = JSON.parse(localStorage.getItem(`cliente-extra:${c.n}`) || "{}"); } catch { mapa[c.n] = {}; }
    });
    return mapa;
  };

  return {
    todosClientes, clientesSemNif, adicionar, removerAutoCriado,
    fonteExcel: fonte, aCarregarExcel: aCarregar, precisaPermissaoExcel: precisaPermissao,
    continuarExcel: continuar, ligarExcel: ligar, recarregarExcel: recarregar,
    firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar: todosClientesLocal.length,
    sincronizarComClientes, removerNegocioDeTodosOsClientes, reverterClienteAutoCriadoSeVazio,
    obterExtras, definirExtras, obterNotasFidelizacao, adicionarNotaFidelizacao, removerUltimaNotaFidelizacao, removerNotaFidelizacaoNoIndice,
    obterTodosExtras,
  };
}

// "Carteira a Fidelizar" (2026-09-20) — mesmo padrão de useClientesNovos/
// useProspetosNovos (2 Excel ligados independentemente via useDadosLigados, juntados
// por NIF, com migração única e explícita para o Firestore). Ao contrário de Clientes/
// Prospetos, nunca teve fase "só local" — é um separador novo, decisão explícita do
// utilizador de já nascer preparado para a nuvem, "acessível de qualquer computador".
function useCarteiraFidelizar(ligacaoPasta) {
  const firebaseUser = useFirebaseAuthUser();
  const { feita: nuvemMigrada, marcar: marcarMigrado } = useMigracaoNuvem("carteira_fidelizar", firebaseUser);
  const nuvemAtiva = !!firebaseUser && nuvemMigrada;
  const nuvem = useColecaoFirestore("carteira_fidelizar", nuvemAtiva);

  const servicos = useDadosLigados("carteira-servicos", mapearLinhaCarteiraServicos, [], ligacaoPasta, "carteira-servicos.json");
  const livres = useDadosLigados("carteira-livres", mapearLinhaCarteiraLivres, [], ligacaoPasta, "carteira-livres.json");

  // "Serviços ativos na carteira.xlsx" é a base (todos os 728) — "Dados Clientes
  // desprotegido.xlsx" (109, sempre subconjunto do primeiro) só sobrepõe as 4 colunas
  // "Serv. Livres" quando o NIF coincide. Nunca inventa valores para quem não está no
  // segundo ficheiro — fica simplesmente sem esses 4 campos (undefined).
  const todosLocal = useMemo(() => {
    const livresPorNif = new Map(livres.dados.map((l) => [l.n, l]));
    return servicos.dados
      .map((c) => ({ ...c, ...(livresPorNif.get(c.n) || {}) }))
      .sort((a, b) => a.e.localeCompare(b.e));
  }, [servicos.dados, livres.dados]);
  const todosNuvem = useMemo(() => [...nuvem.itens].sort((a, b) => a.e.localeCompare(b.e)), [nuvem.itens]);
  const todos = nuvemAtiva ? todosNuvem : todosLocal;

  const [aMigrar, setAMigrar] = useState(false);
  const migrarParaNuvem = async () => {
    if (!firebaseUser || nuvemAtiva) return { ok: false };
    setAMigrar(true);
    for (const c of todosLocal) await nuvem.definir(c);
    await marcarMigrado();
    setAMigrar(false);
    return { ok: true, n: todosLocal.length };
  };

  return {
    todos, firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar: todosLocal.length,
    servicosExcel: { fonte: servicos.fonte, aCarregar: servicos.aCarregar, precisaPermissao: servicos.precisaPermissao, continuar: servicos.continuar, ligar: servicos.ligar, recarregar: servicos.recarregar },
    livresExcel: { fonte: livres.fonte, aCarregar: livres.aCarregar, precisaPermissao: livres.precisaPermissao, continuar: livres.continuar, ligar: livres.ligar, recarregar: livres.recarregar },
  };
}

const FIDELIZACAO_TRIMESTRE_FICHEIRO = "carteira-fidelizacao.json";

// "Fidelização por trimestre" (2026-09-21) — fonte independente de useCarteiraFidelizar
// (acima): upload trimestral manual (não uma ligação Excel persistente), com fusão
// contra o que já estava guardado (ver mesclarCarteiraFidelizacao). Decisão explícita
// do utilizador: só local por agora (dados-privados/, sincroniza via iCloud entre Macs
// como o resto) — nunca pedida migração para o Firestore aqui, ao contrário de
// useCarteiraFidelizar/useClientesNovos/useNegocios (podem ganhar isso mais tarde, se
// pedido; não presumir).
function useFidelizacaoTrimestre(ligacaoPasta) {
  const { negocios } = useNegocios(ligacaoPasta);
  // Só para saber se um NIF já é Cliente e para criar a ficha quando o estado passa a
  // "Fechado" (ver definirEstado abaixo) — mesmo padrão de sincronizarComClientes em
  // useClientesNovos (Negócios → Clientes), reaproveitado aqui.
  const { todosClientes, adicionar: adicionarCliente, adicionarNotaFidelizacao, removerUltimaNotaFidelizacao, obterNotasFidelizacao } = useClientesNovos(ligacaoPasta);
  const [lista, setLista] = useState([]);
  const [atualizadoEm, setAtualizadoEm] = useState(null);
  const [aProcessar, setAProcessar] = useState(false);
  const [carregado, setCarregado] = useState(false);

  useEffect(() => {
    if (carregado) return;
    (async () => {
      if (ligacaoPasta.pronto) {
        const guardado = await lerJsonDadosPrivados(ligacaoPasta.handle, FIDELIZACAO_TRIMESTRE_FICHEIRO);
        if (guardado) {
          setLista(Array.isArray(guardado.lista) ? guardado.lista : []);
          setAtualizadoEm(guardado.atualizadoEm || null);
        }
      }
      setCarregado(true);
    })();
  }, [ligacaoPasta.pronto, carregado]);

  // Nunca substitui a lista às cegas — funde sempre contra o que já estava guardado,
  // usando "Negócios do Trimestre" (Implementado = negócio fechado) para decidir o que
  // pode sair da lista quando um NIF desaparece do ficheiro novo (ver
  // mesclarCarteiraFidelizacao). Devolve sempre um resumo (nunca silencioso sobre
  // quantos foram atualizados/mantidos/removidos, e QUEM foi removido).
  const processarUpload = async (file) => {
    setAProcessar(true);
    const novaLista = await lerLinhasDeFicheiroExcel(file, mapearLinhaCarteiraFidelizacao);
    if (!novaLista) { setAProcessar(false); return { ok: false }; }
    const nifsComNegocioImplementado = new Set(
      negocios.filter((n) => n.estado === "IMPLEMENTADO" && n.nif).map((n) => n.nif)
    );
    const { resultado, removidos, nAtualizados, nMantidos } = mesclarCarteiraFidelizacao(lista, novaLista, nifsComNegocioImplementado);
    const agora = new Date().toISOString();
    setLista(resultado);
    setAtualizadoEm(agora);
    if (ligacaoPasta.pronto) {
      await guardarJsonDadosPrivados(ligacaoPasta.handle, FIDELIZACAO_TRIMESTRE_FICHEIRO, { atualizadoEm: agora, lista: resultado });
    }
    setAProcessar(false);
    return { ok: true, nAtualizados, nMantidos, removidos };
  };

  // Muda o estado manual de 1 registo (nunca mexe no resto dos campos, todos vindos do
  // Excel). Persiste logo a seguir — nunca só em memória, para não se perder ao mudar
  // de separador. Devolve o cliente ATUALIZADO, para o chamador decidir se precisa de
  // propor a criação da ficha em Clientes (só quando o novo estado é "Fechado").
  const definirEstado = async (nif, estado) => {
    // dataFechado (2026-09-26): mostrada no cartão ("fechado em DD/MM/AAAA"); limpa
    // quando o estado sai de "Fechado", tal como a nota na ficha do cliente.
    const nova = lista.map((c) => (c.n === nif
      ? { ...c, estado, dataFechado: estado === "Fechado" ? new Date().toISOString() : null }
      : c));
    setLista(nova);
    if (ligacaoPasta.pronto) {
      await guardarJsonDadosPrivados(ligacaoPasta.handle, FIDELIZACAO_TRIMESTRE_FICHEIRO, { atualizadoEm, lista: nova });
    }
    return nova.find((c) => c.n === nif);
  };

  // Cria a ficha de Cliente para este NIF, se ainda não existir — chamado só depois de
  // confirmação explícita do utilizador (ver ConfirmacaoFecharFidelizacao em
  // SecaoFidelizacaoTrimestre), nunca automático. Mesmo desenho de
  // sincronizarComClientes (Negócios → Clientes): nunca sobrescreve um cliente já
  // existente, só cria quando falta.
  const criarClienteSeNaoExistir = async (registo) => {
    if (todosClientes.some((c) => c.n === registo.n)) return { criado: false };
    await adicionarCliente({ n: registo.n, e: registo.e, t: "Novo Cliente", v: [0, 0], d: [0, 0], i: 0, f: [0, 0], manual: true, origem: "fidelizacao" });
    return { criado: true };
  };

  // Caso mais comum na Carteira a Fidelizar (2026-09-25, achado real de Augusto): o
  // cliente já existe em Clientes — não há nada a criar, mas o fecho do negócio de
  // fidelização ficava sem nenhum rasto na ficha. Nota automática, sem confirmação (ver
  // adicionarNotaFidelizacao acima, useClientesNovos) — o cliente já existe, não há
  // ambiguidade nenhuma a resolver, ao contrário de criarClienteSeNaoExistir.
  const registarFechoFidelizacao = async (registo) => {
    await adicionarNotaFidelizacao(registo.n, {
      data: new Date().toISOString(),
      texto: `Negócio de fidelização fechado em ${new Date().toLocaleDateString("pt-PT")}.`,
      tipo: "fidelizacao-fechada",
    });
  };

  // Reverter de "Fechado" para outro estado (2026-09-25, bug real reportado por
  // Augusto): a nota "Negócio de fidelização fechado" ficava na ficha mesmo depois de
  // o estado voltar atrás — informação desatualizada/enganosa. Remove a nota
  // correspondente (ver removerUltimaNotaFidelizacao, useClientesNovos).
  const anularFechoFidelizacao = async (nif) => removerUltimaNotaFidelizacao(nif);

  return { lista, atualizadoEm, aProcessar, processarUpload, definirEstado, criarClienteSeNaoExistir, registarFechoFidelizacao, anularFechoFidelizacao, todosClientes, obterNotasFidelizacao };
}

// Secção destacada para registos que já existiam no Excel mas não têm NIF preenchido —
// decisão explícita do utilizador (2026-09-08): nunca escondidos silenciosamente do
// seletor principal (ver mapearLinhaCliente/mapearLinhaProspect), mostrados aqui em
// vez disso, com um campo para completar o NIF na hora. Some sozinha se não houver
// nenhum (nunca mostra uma secção vazia).
function SemNifAlerta({ registos, onGuardarNif }) {
  const [valores, setValores] = useState({});
  const [aGuardar, setAGuardar] = useState(null);
  if (!registos.length) return null;

  const guardar = async (registo) => {
    const nif = (valores[registo.linhaExcel] || "").trim();
    setAGuardar(registo.linhaExcel);
    await onGuardarNif(registo, nif);
    setAGuardar(null);
  };

  return (
    <div className="border border-amber-300 bg-amber-50 rounded-lg p-3 space-y-2">
      <div className="text-xs font-medium text-amber-900">⚠️ Sem NIF ({registos.length})</div>
      {registos.map((r) => (
        <div key={r.linhaExcel} className="flex items-center gap-2 bg-white rounded-md px-2.5 py-1.5">
          <span className="flex-1 text-sm truncate">{r.e}</span>
          <input value={valores[r.linhaExcel] || ""}
            onChange={(e) => setValores((v) => ({ ...v, [r.linhaExcel]: e.target.value }))}
            placeholder="NIF" className="w-32 px-2 py-1 rounded-md border border-neutral-200 text-sm" />
          <button onClick={() => guardar(r)} disabled={aGuardar === r.linhaExcel}
            className="text-xs px-2.5 py-1.5 rounded-md bg-amber-600 text-white hover:bg-amber-700 disabled:opacity-50 whitespace-nowrap">
            {aGuardar === r.linhaExcel ? "A guardar…" : "Guardar"}
          </button>
        </div>
      ))}
    </div>
  );
}

// Combobox pesquisável para o campo "Empresa" de um Novo Negócio — decisão explícita
// do utilizador (2026-09-09): liga a escolha da empresa às listas já existentes de
// Clientes/Prospetos, para eliminar o erro mais comum (nomes escritos de forma
// ligeiramente diferente em cada separador), sem impedir escrever uma empresa nova
// que ainda não exista em nenhum dos dois ficheiros.
// Não usa <datalist> nativo: o Chrome/Edge (únicos browsers suportados neste projeto)
// não mostram o atributo `label` nas sugestões, só o `value` — testado diretamente
// antes de escolher esta abordagem. Por isso é um combobox construído à mão, com
// controlo total sobre o que aparece (nome + etiqueta Cliente/Prospect).
function ComboEmpresa({ value, opcoes, onEscolher, onEscreverLivre }) {
  const [foco, setFoco] = useState(false);
  const sugestoes = useMemo(() => {
    const termo = value.trim().toLowerCase();
    if (!termo) return [];
    return opcoes.filter((o) => o.nome.toLowerCase().includes(termo)).slice(0, 8);
  }, [value, opcoes]);

  return (
    <div className="relative">
      <input value={value}
        onChange={(e) => onEscreverLivre(e.target.value)}
        onFocus={() => setFoco(true)}
        onBlur={() => setTimeout(() => setFoco(false), 150)}
        className="w-full px-3 py-2 rounded-md border border-neutral-200 text-sm" />
      {foco && sugestoes.length > 0 && (
        <div className="absolute z-10 mt-1 w-full bg-white border border-neutral-200 rounded-md shadow-lg max-h-48 overflow-auto">
          {sugestoes.map((o) => (
            <button key={o.nif} type="button" onMouseDown={() => onEscolher(o)}
              className="w-full text-left px-3 py-2 text-sm hover:bg-neutral-50 flex items-center justify-between gap-2">
              <span className="truncate">{o.nome}</span>
              <span className={`text-[10px] px-1.5 py-0.5 rounded-full whitespace-nowrap ${o.tipo === "Cliente" ? "bg-emerald-50 text-emerald-700" : "bg-blue-50 text-blue-700"}`}>{o.tipo}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Caixa de anexar ficheiros: clicar abre o seletor normal, ou arrastar o ficheiro para cima.
function DropzoneFaturas({ onFicheiros, titulo, subtitulo, accept = ".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.docx,.doc,.txt,.csv" }) {
  const [aArrastar, setAArrastar] = useState(false);
  const inputRef = React.useRef(null);

  const processar = (fileList) => {
    const ficheiros = Array.from(fileList || []);
    if (ficheiros.length > 0) onFicheiros(ficheiros);
  };

  return (
    <div
      onClick={() => inputRef.current && inputRef.current.click()}
      onDragOver={(e) => { e.preventDefault(); setAArrastar(true); }}
      onDragLeave={() => setAArrastar(false)}
      onDrop={(e) => { e.preventDefault(); setAArrastar(false); processar(e.dataTransfer.files); }}
      className={`border-2 border-dashed rounded-lg p-5 text-center text-sm cursor-pointer transition-colors ${
        aArrastar ? "border-red-500 bg-red-50 text-red-700" : "border-neutral-300 text-neutral-400 hover:border-neutral-400"}`}
    >
      {titulo || "📎 Arrasta faturas ou outros documentos de apoio para aqui, ou clica para escolher"}
      <div className="text-[11px] text-neutral-400 mt-1">{subtitulo || "Faturas (PDF, JPG, PNG) são analisadas automaticamente; outros ficheiros (Excel, Word, texto) ficam só como anexo, sem processamento."}</div>
      <input ref={inputRef} type="file" multiple accept={accept}
        onChange={(e) => { processar(e.target.files); e.target.value = ""; }}
        className="hidden" />
    </div>
  );
}

// Campanha de email (Clientes/Prospetos) — lista com seleção múltipla à esquerda e
// painel de composição sempre visível à direita. Solução final decidida com o
// Augusto (2026-09-26): copiar/colar para o Outlook — o envio direto via Microsoft
// Graph foi abandonado (IT não autoriza registo de app no Azure).
// `registos` já vem filtrado (pesquisa/setor/distrito…); a seleção é guardada à parte
// e sobrevive a mudanças de filtro — `todos` serve para montar os destinatários.
function BlocoCampanha({ registos, todos, aCarregar }) {
  const [selecionados, setSelecionados] = useState(() => new Set());
  const todosMarcados = registos.length > 0 && registos.every((r) => selecionados.has(r.n));
  const alternar = (nif) => setSelecionados((prev) => {
    const novo = new Set(prev);
    novo.has(nif) ? novo.delete(nif) : novo.add(nif);
    return novo;
  });
  const alternarTodos = () => setSelecionados((prev) => {
    const novo = new Set(prev);
    registos.forEach((r) => (todosMarcados ? novo.delete(r.n) : novo.add(r.n)));
    return novo;
  });
  const destinatarios = todos.filter((r) => selecionados.has(r.n));
  const comEmail = destinatarios.filter((d) => d.email).length;

  return (
    <div className="flex gap-6 items-start">
      <div className="flex-1 min-w-0">
        <CartoesKpi itens={[
          { rotulo: "Selecionados", valor: destinatarios.length, tom: "vermelho" },
          { rotulo: "Com email", valor: comEmail },
          { rotulo: "Sem email", valor: destinatarios.length - comEmail, detalhe: "não entram na lista CCO", tom: "amarelo" },
        ]} />
        <div className="bg-white border rounded-[20px] overflow-hidden" style={{ borderColor: "var(--vf-border)" }}>
          <div onClick={alternarTodos} className="flex items-center gap-3 px-5 min-h-[48px] border-b cursor-pointer select-none text-sm font-semibold"
            style={{ borderColor: "var(--vf-border)", color: "var(--vf-muted)" }}>
            <CaixaSelecao marcada={todosMarcados} />
            Selecionar todos os filtrados ({registos.length})
          </div>
          <div className="max-h-[560px] overflow-auto">
            {aCarregar && <div className="px-5 py-6 text-center text-sm" style={{ color: "var(--vf-muted)" }}>A carregar contactos…</div>}
            {!aCarregar && registos.map((r) => {
              const marcado = selecionados.has(r.n);
              return (
                <div key={r.n} onClick={() => alternar(r.n)}
                  className="flex items-center gap-3 px-5 min-h-[52px] border-b last:border-b-0 cursor-pointer select-none transition-colors"
                  style={{ borderColor: "#F1ECE8", background: marcado ? "#FFF3F1" : undefined }}>
                  <CaixaSelecao marcada={marcado} />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold truncate">{r.e}</div>
                    <div className="text-xs truncate" style={{ color: "var(--vf-muted)" }}>
                      {[r.email, r.setor, r.seg, r.distrito].filter(Boolean).join(" · ") || "—"}
                    </div>
                  </div>
                  {!r.email && (
                    <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full whitespace-nowrap" style={{ background: "#FEF3C7", color: "#92400E" }}>sem email</span>
                  )}
                </div>
              );
            })}
            {!aCarregar && registos.length === 0 && (
              <div className="px-5 py-6 text-center text-sm" style={{ color: "var(--vf-muted)" }}>Nenhum registo com os filtros atuais.</div>
            )}
          </div>
        </div>
      </div>
      <PainelCampanhaEmail destinatarios={destinatarios} />
    </div>
  );
}

// Copia texto para a área de transferência. A API moderna pode ser recusada (sem
// foco na página, permissão negada) — nesse caso tenta o método antigo
// (execCommand) antes de desistir. Devolve true/false para o botão poder avisar.
async function copiarParaAreaTransferencia(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    return true;
  } catch {
    const campo = document.createElement("textarea");
    campo.value = texto;
    campo.style.position = "fixed";
    campo.style.opacity = "0";
    document.body.appendChild(campo);
    campo.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    campo.remove();
    return ok;
  }
}

function PainelCampanhaEmail({ destinatarios }) {
  const [anexo, setAnexo] = useState(null);
  const [link, setLink] = useState("");
  const [texto, setTexto] = useState("");
  // Estado de cada botão: null | "ok" | "erro" — nunca falha em silêncio.
  const [copiado, setCopiado] = useState({ emails: null, texto: null });
  const comEmail = destinatarios.filter((d) => d.email);
  const chaveEmails = comEmail.map((d) => d.n).join(",");
  useEffect(() => { setCopiado((c) => ({ ...c, emails: null })); }, [chaveEmails]);
  useEffect(() => { setCopiado((c) => ({ ...c, texto: null })); }, [texto, link]);

  const copiarEmails = async () => {
    const ok = await copiarParaAreaTransferencia(comEmail.map((d) => d.email).join("; "));
    setCopiado((c) => ({ ...c, emails: ok ? "ok" : "erro" }));
  };
  const copiarTexto = async () => {
    const ok = await copiarParaAreaTransferencia(link ? `${texto}\n\n${link}` : texto);
    setCopiado((c) => ({ ...c, texto: ok ? "ok" : "erro" }));
  };
  const MAX_ETIQUETAS = 40;

  return (
    <aside className="w-[380px] shrink-0 sticky top-6 bg-white border rounded-[20px] p-5 space-y-4" style={{ borderColor: "var(--vf-border)" }}>
      <div>
        <div className="font-display font-bold text-xl">Campanha de email</div>
        <div className="text-xs mt-0.5" style={{ color: "var(--vf-muted)" }}>Compõe aqui e cola no Outlook.</div>
      </div>

      <div>
        <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--vf-muted)" }}>CCO</div>
        <div className="min-h-[48px] max-h-40 overflow-auto border rounded-xl p-2 flex flex-wrap gap-1.5" style={{ borderColor: "var(--vf-border)" }}>
          {comEmail.length === 0 && <span className="text-sm px-1 py-1" style={{ color: "#A8999C" }}>Seleciona registos na lista</span>}
          {comEmail.slice(0, MAX_ETIQUETAS).map((d) => (
            <span key={d.n} title={d.email} className="text-xs font-medium px-2.5 py-1 rounded-full max-w-full truncate" style={{ background: "#F3EEEA" }}>{d.e}</span>
          ))}
          {comEmail.length > MAX_ETIQUETAS && (
            <span className="text-xs font-semibold px-2.5 py-1 rounded-full" style={{ background: "#1B1416", color: "#fff" }}>+{comEmail.length - MAX_ETIQUETAS}</span>
          )}
        </div>
      </div>

      {anexo ? (
        <div className="flex items-center gap-2 border rounded-xl px-3 min-h-[48px] text-sm" style={{ borderColor: "var(--vf-border)" }}>
          <Icone nome="documento" className="w-4 h-4 shrink-0" />

      </div>

      <div>
        <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--vf-muted)" }}>Texto</div>
        <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={6}
          placeholder="Caro cliente, partilho esta novidade que pode ser relevante para a vossa atividade…"
          className="w-full px-3 py-2.5 border text-sm resize-none" />
      </div>

      <div className="space-y-2 pt-1">
        <button onClick={copiarEmails} disabled={comEmail.length === 0} className="w-full bg-red-600 disabled:opacity-40">
          <Icone nome={copiado.emails === "ok" ? "check" : "copiar"} className="w-4 h-4" />
          {copiado.emails === "ok" ? "Emails copiados" : copiado.emails === "erro" ? "Não foi possível copiar — tenta outra vez" : `Copiar emails (CCO)${comEmail.length ? ` · ${comEmail.length}` : ""}`}
        </button>
        <button onClick={copiarTexto} disabled={!texto && !link} className="w-full vf-sec disabled:opacity-40">
          <Icone nome={copiado.texto === "ok" ? "check" : "copiar"} className="w-4 h-4" />
          {copiado.texto === "ok" ? "Texto copiado" : copiado.texto === "erro" ? "Não foi possível copiar — tenta outra vez" : "Copiar texto"}
        </button>
      </div>
    </aside>
  );
}

/* ================= PONTO: CLIENTES ================= */

function ClientesView({ ligacaoPasta }) {
  const { todosClientes, clientesSemNif, adicionar, fonteExcel, aCarregarExcel, precisaPermissaoExcel, continuarExcel, ligarExcel, recarregarExcel,
    firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar, obterExtras, definirExtras, obterNotasFidelizacao, removerNotaFidelizacaoNoIndice, obterTodosExtras } = useClientesNovos(ligacaoPasta);
  const { todosProspetos } = useProspetosNovos(ligacaoPasta);
  const { todos: todaCarteira } = useCarteiraFidelizar(ligacaoPasta);
  const [nifSelecionado, setNifSelecionado] = useState("");
  const [ehNovo, setEhNovo] = useState(false);
  const [novoBase, setNovoBase] = useState({ e: "", n: "", t: "Convergente Móvel + Fixo" });
  const [extras, setExtras] = useState({});
  const [avisoSucesso, setAvisoSucesso] = useState("");
  const [erroNif, setErroNif] = useState("");

  const clienteAtual = useMemo(() => todosClientes.find((c) => c.n === nifSelecionado) || null, [nifSelecionado, todosClientes]);
  const mostraFicha = ehNovo || clienteAtual;

  const carregarExtras = async (nif) => {
    let guardadas = (await obterExtras(nif)) || {};
    const c = todosClientes.find((c) => c.n === nif);
    const setorConhecido = c && c.setor;
    if (!guardadas.setor && setorConhecido) guardadas = { ...guardadas, setor: setorConhecido };
    // notasFidelizacao vive num campo próprio do documento (não dentro de "extras", ver
    // adicionarNotaFidelizacao) — lido à parte, mesmo padrão que negociosFechados.
    const notas = await obterNotasFidelizacao(nif);
    guardadas = { ...guardadas, notasFidelizacao: notas || [] };
    setExtras(guardadas);
  };

  // Remoção manual de 1 nota de fidelização (2026-09-26) — para limpar notas órfãs
  // (ex. de antes de removerUltimaNotaFidelizacao existir). Confirmação simples, dado
  // ser uma remoção permanente.
  const removerNotaFidelizacao = async (indice) => {
    if (!nifSelecionado) return;
    if (!window.confirm("Apagar esta nota de fidelização? Não há como desfazer.")) return;
    await removerNotaFidelizacaoNoIndice(nifSelecionado, indice);
    await carregarExtras(nifSelecionado);
  };

  const selecionarCliente = (nif) => { setEhNovo(false); setAvisoSucesso(""); setNifSelecionado(nif); if (nif) carregarExtras(nif); else setExtras({}); irParaTopo(); };
  const abrirNovo = () => { setEhNovo(true); setNifSelecionado(""); setAvisoSucesso(""); setErroNif(""); setNovoBase({ e: "", n: "", t: "Convergente Móvel + Fixo" }); setExtras({}); irParaTopo(); };
  const limpar = () => { setEhNovo(false); setNifSelecionado(""); setExtras({}); };
  const mudarExtra = (key, value) => setExtras((prev) => ({ ...prev, [key]: value }));

  const guardar = async () => {

  // Import único de Telefone/Email a partir de "Carteira a Fidelizar", cruzado por NIF

    setResultadoImportContactos(null);
    const carteiraPorNif = new Map(todaCarteira.map((c) => [c.n, c]));
    let atualizados = 0, camposPreenchidos = 0, semCorrespondencia = 0, semDadosNaCarteira = 0, jaPreenchidos = 0;

      const origem = carteiraPorNif.get(cliente.n);
      if (!origem) { semCorrespondencia++; continue; }

      const extrasAtuais = (await obterExtras(cliente.n)) || {};
      const novosCampos = {};
      if (!extrasAtuais.telefone && origem.telefone) novosCampos.telefone = origem.telefone;
      if (!extrasAtuais.email && origem.email) novosCampos.email = origem.email;
      if (Object.keys(novosCampos).length === 0) { jaPreenchidos++; continue; }
      await definirExtras(cliente.n, novosCampos);
      atualizados++;
      camposPreenchidos += Object.keys(novosCampos).length;
    }
    setResultadoImportContactos({ total: todosClientes.length, atualizados, camposPreenchidos, semCorrespondencia, semDadosNaCarteira, jaPreenchidos });

              {resultadoImportContactos.jaPreenchidos} já tinham Telefone/Email preenchidos · {resultadoImportContactos.semCorrespondencia} sem NIF correspondente na Carteira · {resultadoImportContactos.semDadosNaCarteira} sem Telefone/Email na Carteira.

          {Array.isArray(extras.negociosFechados) && extras.negociosFechados.length > 0 && (

// Limiar para considerar uma linha "com variação notável" entre meses — usado tanto
// para o destaque de cor no nível por tarifário como para as notas pontuais de
// consumo extra. Critério: diferença mín/máx > €10 E > 15% da média (evita marcar
// pequenas oscilações normais como se fossem um problema).
function temVariacaoNotavel(servico) {
  return servico.meses >= 2 && servico.minTotal !== null && servico.maxTotal !== null
    && (servico.maxTotal - servico.minTotal) > 10
    && (servico.maxTotal - servico.minTotal) > 0.15 * (servico.mediaTotal || 1);
}

// Agrega as linhas já extraídas (uma por Nº/Serviço/mês) em: totais por categoria
// (Fixo/Móvel/IoT-ICT), nível intermédio por tarifário (nome, quantidade, valor
// médio, destaque de variação) e notas pontuais de consumo extra (só quando há algo
// a assinalar, nunca uma tabela permanente linha-a-linha). Função pura, sem React —
// reutilizada tanto pela vista (resumoPorCategoria) como pelo Excel
// (gerarExcelAnaliseTarifarios), para nunca haver duas lógicas de agregação a
// divergir uma da outra.
function calcularResumoPorCategoria(linhas) {
  if (!linhas || !linhas.length) return [];

  // Descarta linhas sem qualquer informação aproveitável (nem nome de tarifário, nem
  // valor) — ruído de extração (ex. um cabeçalho apanhado sem bloco de dados a seguir),
  // não um serviço real. Sem isto criavam uma categoria fantasma "Não identificado"
  // com 1 serviço e €0,00, sem nenhuma linha real por trás para o utilizador corrigir.
  // Uma linha com tarifário mas sem valor (ou vice-versa) continua a aparecer — aí há
  // informação real a confirmar à mão.
  const linhasUteis = linhas.filter((l) => l.tarifario || l.total !== "");
  if (!linhasUteis.length) return [];

  const porNumero = new Map();
  linhasUteis.forEach((l) => {
    const chave = l.numero || l.id;
    if (!porNumero.has(chave)) porNumero.set(chave, { tarifario: l.tarifario, entradas: [] });
    const grupo = porNumero.get(chave);
    if (!grupo.tarifario && l.tarifario) grupo.tarifario = l.tarifario;
    grupo.entradas.push(l);
  });

  const porCategoria = new Map();
  for (const { tarifario, entradas } of porNumero.values()) {
    const categoria = categorizarServico(tarifario);
    const totaisValidos = entradas.map((e) => (e.total !== "" ? Number(e.total) : NaN)).filter((v) => !isNaN(v));
    const suplementaresValidos = entradas.map((e) => (e.suplementares !== "" ? Number(e.suplementares) : NaN)).filter((v) => !isNaN(v));
    const mediaTotal = totaisValidos.length ? totaisValidos.reduce((a, b) => a + b, 0) / totaisValidos.length : null;
    const mediaSuplementares = suplementaresValidos.length ? suplementaresValidos.reduce((a, b) => a + b, 0) / suplementaresValidos.length : 0;
    const minTotal = totaisValidos.length ? Math.min(...totaisValidos) : null;
    const maxTotal = totaisValidos.length ? Math.max(...totaisValidos) : null;

    if (!porCategoria.has(categoria)) porCategoria.set(categoria, { categoria, servicos: [], porMes: new Map() });
    const c = porCategoria.get(categoria);
    const numeroDoGrupo = entradas[0].numero;
    c.servicos.push({ numero: numeroDoGrupo, tarifario, mediaTotal, mediaSuplementares, minTotal, maxTotal, meses: totaisValidos.length, entradas });

    entradas.forEach((e) => {
      if (!e.periodo || e.total === "") return;
      const chaveMes = e.periodo.label;
      if (!c.porMes.has(chaveMes)) c.porMes.set(chaveMes, { label: chaveMes, ordem: e.periodo.ordem, total: 0 });
      c.porMes.get(chaveMes).total += Number(e.total) || 0;
    });
  }

  return [...porCategoria.values()].map((c) => {
    const custoTotalMedio = c.servicos.reduce((s, x) => s + (x.mediaTotal || 0), 0);
    const variavelMedio = c.servicos.reduce((s, x) => s + (x.mediaSuplementares || 0), 0);
    const evolucaoMensal = [...c.porMes.values()].sort((a, b) => a.ordem - b.ordem);

    // Notas pontuais: só para linhas com variação notável, só nos meses em que o
    // total dessa linha se destaca claramente da sua própria média (>30% acima) —
    // nunca uma linha por mês para todas as linhas, só quando há algo a assinalar.
    const notas = [];
    c.servicos.filter(temVariacaoNotavel).forEach((s) => {
      s.entradas.forEach((e) => {
        if (!e.periodo || e.total === "" || s.mediaTotal === null) return;
        const total = Number(e.total);
        if (total < s.mediaTotal * 1.3) return;
        const tipos = e.custoExtraTipo ? e.custoExtraTipo.split(", ").filter(Boolean) : [];
        const detalheTipo = tipos.length ? `, ${tipos.join(" e ")}` : "";
        notas.push(`${s.tarifario || "sem nome"} (${s.numero || "sem nº"}) — ${e.periodo.label}: consumo extra${detalheTipo}.`);
      });
    });

    // Nível intermédio: dentro da categoria, agrupar por nome de tarifário — dá
    // "Biz Standard — 3 serviços — €24,98/mês médio" em vez de só um total da
    // categoria inteira ou dezenas de linhas soltas por número de telefone.
    const porTarifarioMap = new Map();
    c.servicos.forEach((s) => {
      const nome = s.tarifario || "não identificado";
      if (!porTarifarioMap.has(nome)) porTarifarioMap.set(nome, []);
      porTarifarioMap.get(nome).push(s);
    });
    const porTarifario = [...porTarifarioMap.entries()].map(([tarifario, servicosDoTarifario]) => {
      const mediasValidas = servicosDoTarifario.map((s) => s.mediaTotal).filter((v) => v !== null);
      const mediaPorServico = mediasValidas.length ? mediasValidas.reduce((a, b) => a + b, 0) / mediasValidas.length : null;
      const tipoServico = c.categoria === "Fixo" ? tipoServicoFixo(tarifario) : null;
      const destaque = servicosDoTarifario.some(temVariacaoNotavel);
      // Decomposição por serviço (Nº/telefone), para o cartão poder mostrar que o valor
      // exibido pode ser o TOTAL de um bloco com vários produtos, não o preço de um só —
      // pedido explícito do utilizador (2026-09-12), mesma fonte que as linhas de item
      // da folha "Análise por Linha" do Excel (nunca duas lógicas a divergir). Só entra
      // na lista quando há itens reais por trás (nunca inventa uma decomposição vazia).
      const decomposicao = servicosDoTarifario.map((s) => {
        const comItens = [...s.entradas].reverse().find((e) => e.itens && e.itens.length);
        return { numero: s.numero, itens: comItens ? comItens.itens : [] };
      }).filter((d) => d.itens.length);
      return { tarifario, tipoServico, nServicos: servicosDoTarifario.length, mediaPorServico, destaque, decomposicao };
    }).sort((a, b) => (b.mediaPorServico || 0) * b.nServicos - (a.mediaPorServico || 0) * a.nServicos);

    return { categoria: c.categoria, nServicos: c.servicos.length, custoTotalMedio, variavelMedio, evolucaoMensal, notas, porTarifario };
  }).sort((a, b) => b.custoTotalMedio - a.custoTotalMedio);
}

// Evolução do valor TOTAL da fatura mês a mês, somando todas as categorias — dá uma
// perceção visual imediata de tendência/estabilidade sem ler números um a um.
function calcularEvolucaoTotalMensal(linhas) {
  if (!linhas || !linhas.length) return [];
  const porMes = new Map();
  linhas.forEach((l) => {
    if (!l.periodo || l.total === "") return;
    const chave = l.periodo.label;
    if (!porMes.has(chave)) porMes.set(chave, { label: chave, ordem: l.periodo.ordem, total: 0 });
    porMes.get(chave).total += Number(l.total) || 0;
  });
  return [...porMes.values()].sort((a, b) => a.ordem - b.ordem);
}

// Gráfico de barras simples da evolução do valor por mês (redesign 2026-09-26) —
// HTML/CSS, sem biblioteca. O mês mais recente fica a vermelho.
function BarrasEvolucao({ pontos }) {
  if (!pontos || !pontos.length) return <div className="text-sm" style={{ color: "var(--vf-muted)" }}>Sem meses analisados.</div>;
  const max = Math.max(...pontos.map((p) => p.valor), 1);
  return (
    <div className="flex items-end gap-3 h-[240px] pt-6">
      {pontos.map((p, i) => {
        const ultimo = i === pontos.length - 1;
        return (
          <div key={p.label} className="flex-1 min-w-0 h-full flex flex-col justify-end items-center gap-2">
            <div className="text-xs font-semibold whitespace-nowrap" style={{ color: ultimo ? "var(--vf-red)" : "var(--vf-muted)" }}>{formatEuroArredondado(p.valor)}</div>
            <div className="w-full max-w-[72px] rounded-t-lg" title={`${p.label}: ${formatEuro(p.valor)}`}
              style={{ height: `${Math.max(4, (p.valor / max) * 170)}px`, background: ultimo ? "var(--vf-red)" : "#D9CFC9" }} />
            <div className="text-xs whitespace-nowrap truncate max-w-full" style={{ color: "var(--vf-muted)" }}>{p.label}</div>
          </div>
        );
      })}
    </div>
  );
}

function AnaliseFaturasView({ ligacaoPasta }) {
