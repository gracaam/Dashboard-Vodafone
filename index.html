// Encontra a coluna (índice 0-based) de um cabeçalho pelo nome exato, na linha de cabeçalho indicada.
function encontrarColunaPorCabecalho(sheet, range, nomeColuna, linhaCabecalho) {
  for (let c = range.s.c; c <= range.e.c; c++) {
    const cell = sheet[XLSX.utils.encode_cell({ r: linhaCabecalho, c })];
    if (cell && String(cell.v).trim() === nomeColuna) return c;
  }
  return -1;
}

// Remove a linha do prospect (por NIF) do Prospectos.xlsx ligado. Em vez de reconstruir a
// folha inteira (que reordena colunas e perde formatação/validações), só apaga as células
// dessa linha — o resto do ficheiro fica byte a byte igual.
async function removerProspectDoExcel(nif, handleProjeto) {
  const handle = await obterHandlePermitido("prospetos");
  if (!handle) return false;
  try {
    const file = await handle.getFile();
    const buffer = await file.arrayBuffer();
    await criarBackupExcel(handleProjeto, buffer, "Prospectos");
    const wb = XLSX.read(buffer, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const range = XLSX.utils.decode_range(sheet["!ref"]);
    const colNif = encontrarColunaPorCabecalho(sheet, range, "NIF", range.s.r);
    if (colNif === -1) return false;
    for (let r = range.s.r + 1; r <= range.e.r; r++) {
      const cell = sheet[XLSX.utils.encode_cell({ r, c: colNif })];
      if (cell && String(cell.v) === String(nif)) {
        for (let c = range.s.c; c <= range.e.c; c++) delete sheet[XLSX.utils.encode_cell({ r, c })];
        break;
      }
    }
    const writable = await handle.createWritable();
    await writable.write(XLSX.write(wb, { bookType: "xlsx", type: "array" }));
    await writable.close();
    return true;
  } catch (e) {
    alert("Não foi possível escrever no Excel: " + e.message);
    return false;
  }
}

// a célula nas colunas certas (encontradas pelo nome do cabeçalho) — não reconstrói a folha,
// por isso mantém a ordem das colunas, formatação e validações das linhas já existentes.
async function adicionarClienteAoExcel(prospeto, simulador, handleProjeto) {
  const handle = await obterHandlePermitido("clientes");

  try {

    const wb = XLSX.read(buffer, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const range = XLSX.utils.decode_range(sheet["!ref"]);
    const linhaCabecalho = range.s.r;
    const novaLinha = range.e.r + 1;
    const valores = {
      "NIF (Grupo)": prospeto.n,
      "Grupo": prospeto.e,
      "NIF (Entidade)": prospeto.n,
      "Entidade": prospeto.e,
      "Tipo Cliente (Atual)": "Novo Cliente",

      "Telefone": prospeto.tel || "",
      "Email": prospeto.email || "",

      let c = encontrarColunaPorCabecalho(sheet, range, nomeColuna, linhaCabecalho);
      if (c === -1) {
        c = range.e.c + 1;
        range.e.c = c;

      const endereco = XLSX.utils.encode_cell({ r: novaLinha, c });
      sheet[endereco] = typeof valor === "number" ? { t: "n", v: valor } : { t: "s", v: String(valor) };
    });
    range.e.r = novaLinha;
    sheet["!ref"] = XLSX.utils.encode_range(range);

    await writable.write(XLSX.write(wb, { bookType: "xlsx", type: "array" }));
    await writable.close();
    return true;
  } catch (e) {
    alert("Não foi possível escrever no Excel: " + e.message);

  }
}

// Guarda uma cópia do Excel, tal como estava ANTES de qualquer escrita, em
// dados-privados/backups-excel/ — decisão explícita do utilizador (2026-09-XX):
// nenhuma escrita no Excel (Negócios, Prospetos ou Clientes) deve acontecer sem uma
// cópia de segurança da versão anterior. Nunca bloqueia a escrita em si — se a pasta do
// projeto não estiver ligada, simplesmente não há cópia desta vez (best-effort, tal
// como o resto da sincronização com dados-privados/).
async function criarBackupExcel(handleProjeto, bufferOriginal, nomeBase) {
  if (!handleProjeto) return false;
  try {
    const pasta = await handleProjeto.getDirectoryHandle("dados-privados", { create: true });
    const pastaBackups = await pasta.getDirectoryHandle("backups-excel", { create: true });
    const carimbo = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    const fileHandle = await pastaBackups.getFileHandle(`${nomeBase}_${carimbo}.xlsx`, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(bufferOriginal);
    await writable.close();
    return true;
  } catch (e) {
    console.warn("Não foi possível criar backup do Excel:", e.message);
    return false;
  }
}

// Valida o NIF de um registo novo (Cliente ou Prospect): obrigatório, e nunca duplicado
// de outro registo já existente em Clientes OU Prospetos (o NIF é a chave única entre
// os dois ficheiros — decisão explícita do utilizador, 2026-09-08). Devolve uma
// mensagem de erro (string) ou null se estiver tudo bem.
function validarNifNovoRegisto(nif, todosClientes, todosProspetos) {
  const n = String(nif || "").trim();
  if (!n) return "O NIF é obrigatório.";
  if (todosClientes.some((c) => c.n === n)) return `Já existe um cliente com o NIF ${n}.`;
  if (todosProspetos.some((p) => p.n === n)) return `Já existe um prospect com o NIF ${n}.`;
  return null;
}

// Lê o Excel ligado (se houver) e devolve as linhas já mapeadas para o formato interno.
// Devolve null se não estiver ligado ou não conseguir ler — nesse caso mantém-se o que já estava.
// Passa também o índice real da linha na folha (0-based, o mesmo sistema usado por
// XLSX.utils.encode_cell) a quem mapeia — necessário para conseguir escrever de volta
// numa linha específica (ex. completar um NIF em falta) sem ter de voltar a procurar
// a linha por outro critério.
async function lerDadosDoHandle(handle, mapear) {
  try {
    const file = await handle.getFile();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const range = XLSX.utils.decode_range(sheet["!ref"]);
    // "blankrows: true" é crítico — sem ele, o SheetJS omite por completo do array
    // qualquer linha sem NENHUMA célula, o que desalinha "índice do array + linha
    // inicial" da linha real do Excel sempre que houver uma linha totalmente vazia no
    // meio da folha. Bug real confirmado em Negócios do Trimestre (2026-09-10) com
    // exatamente este padrão em `lerNegociosDoWorkbook` — corrigido aqui também de
    // forma preventiva, mesmo sem dano visível ainda em Clientes/Prospetos.
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: null, blankrows: true });
    return rows.map((r, i) => mapear(r, range.s.r + 1 + i)).filter(Boolean);
  } catch (e) {
    alert("Não foi possível ler o Excel ligado: " + e.message);
    return null;
  }
}

function limparValorExcel(v) {
  if (v === null || v === undefined) return "";
  const s = String(v).trim();
  return s === "-" || s.toLowerCase() === "n/a" ? "" : s;
}

// Palavras "significativas" (>=4 letras) de um nome de empresa, sem acentos/pontuação —
// usado para cruzar nomes escritos de forma diferente entre Negócios e Clientes
// (ex: "Cliente E" nos Negócios vs "Cliente E" em Clientes).
function palavrasSignificativas(nome) {
  return String(nome || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .trim().split(/\s+/).filter((p) => p.length >= 4);
}

// Tenta encontrar o NIF de um cliente já conhecido cujo nome bate com o do negócio
// (a primeira palavra significativa do nome do cliente aparece no nome do negócio).
function encontrarNifPorNome(nomeNegocio, todosClientes) {
  const palavrasNeg = palavrasSignificativas(nomeNegocio);
  if (palavrasNeg.length === 0) return null;
  for (const c of todosClientes) {
    const primeiraCli = palavrasSignificativas(c.e)[0];
    if (primeiraCli && palavrasNeg.includes(primeiraCli)) return { nif: c.n, nomeCliente: c.e };
  }
  return null;
}

// Mapeia uma linha de Prospectos.xlsx para o formato interno { n, e, seg, cae, ... }
// Não descarta linhas sem NIF (só sem Entidade, essas sim são lixo/vazias) — decisão

// devem ficar visíveis (secção "Sem NIF"), nunca escondidos silenciosamente. `linhaExcel`
// guarda o índice real da linha na folha, para se conseguir escrever o NIF de volta
// sem ambiguidade (o NIF, quando existe, é a chave — quando não existe, não há outra).

// esse sinal explícito). Função pura, testável sem Excel nenhum.
// `estado` (Em aberto/Em negociação/Fechado, ver ESTADO_FIDELIZACAO_OPCOES) é editado
// à mão por Augusto (2026-09-25) e NUNCA vem do Excel — tem de ser transportado para a
// frente sempre que um NIF é atualizado por um ficheiro trimestral novo, senão um
// upload apagava silenciosamente o estado que Augusto tinha acabado de pôr. Novo NIF
// (nunca visto antes) começa sempre em "Em aberto".
function mesclarCarteiraFidelizacao(anteriorLista, novaLista, nifsComNegocioImplementado) {
  const anteriorPorNif = new Map(anteriorLista.map((c) => [c.n, c]));
  const novosNifs = new Set(novaLista.map((c) => c.n));
  const novaListaComEstado = novaLista.map((c) => {
    const antigo = anteriorPorNif.get(c.n);
    return { ...c, estado: (antigo && antigo.estado) || "Em aberto", dataFechado: (antigo && antigo.dataFechado) || null };
  });
  const removidos = [];
  const mantidos = [];
  anteriorLista.forEach((antigo) => {
    if (novosNifs.has(antigo.n)) return; // substituído pela versão nova, acima
    if (nifsComNegocioImplementado.has(antigo.n)) removidos.push(antigo);
    else mantidos.push(antigo);
  });
  const resultado = [...novaListaComEstado, ...mantidos].sort((a, b) => a.e.localeCompare(b.e));
  return { resultado, removidos, nAtualizados: novaListaComEstado.length, nMantidos: mantidos.length };
}

// Hook genérico: usa os dados fixos de referência até haver um Excel ligado; a partir
// daí, se o browser já se lembra da permissão, lê sozinho ao abrir a página — caso
// contrário fica à espera de 1 clique em "Continuar" (não abre o seletor de ficheiro,
// só pede autorização de novo para o mesmo ficheiro já escolhido).
// Fonte: "padrao" (baseEstatica, hoje sempre []) | "excel" (acabado de ler) | "arquivo"
// (snapshot já extraído, lido de dados-privados/{nomeFicheiroArquivo} — pode ter
// chegado via iCloud de outro Mac). Decisão explícita do utilizador (2026-09-08):
// mesma lógica já usada em Negócios do Trimestre — tenta sempre o arquivo primeiro
// (evita pedir o Excel outra vez), só recorre ao Excel se ainda não houver arquivo.
// `ligacaoPasta` vem de fora (App, ligação única partilhada por todo o dashboard —
// ver "LIGAÇÃO ÚNICA" nas notas de arquitetura).
function useDadosLigados(tipo, mapear, baseEstatica, ligacaoPasta, nomeFicheiroArquivo) {
  const ligacao = useLigacaoExcel(tipo);
  const [dados, setDados] = useState(baseEstatica);
  const [fonte, setFonte] = useState("padrao");
  const [aCarregar, setACarregar] = useState(false);
  const [tentouCarregarInicial, setTentouCarregarInicial] = useState(false);

  const persistirSnapshot = (lista) => {
    if (ligacaoPasta.pronto) guardarJsonDadosPrivados(ligacaoPasta.handle, nomeFicheiroArquivo, lista);
  };

  const carregar = async () => {
    if (!ligacao.handle) return false;
    setACarregar(true);
    const lidos = await lerDadosDoHandle(ligacao.handle, mapear);
    if (lidos) { setDados(lidos); setFonte("excel"); persistirSnapshot(lidos); }
    setACarregar(false);
    return !!lidos;
  };

  // Um único efeito para as duas fontes possíveis (arquivo vs Excel), para nunca
  // haver corrida entre "já tenho arquivo" e "o Excel já estava ligado de antes".
  useEffect(() => {
    if (tentouCarregarInicial) return;
    (async () => {
      if (ligacaoPasta.pronto) {
        const doArquivo = await lerJsonDadosPrivados(ligacaoPasta.handle, nomeFicheiroArquivo);
        if (doArquivo) { setDados(doArquivo); setFonte("arquivo"); setTentouCarregarInicial(true); return; }
      }
      if (ligacao.pronto) { await carregar(); setTentouCarregarInicial(true); }
    })();
  }, [ligacaoPasta.pronto, ligacao.pronto, tentouCarregarInicial]);

  const continuar = async () => { const ok = await ligacao.continuar(); if (ok) await carregar(); return ok; };
  const ligar = async () => { const ok = await ligacao.ligar(); if (ok) await carregar(); return ok; };

  return { dados, fonte, aCarregar, precisaPermissao: ligacao.precisaPermissao, continuar, ligar, recarregar: carregar };
}

              {item.aCarregar ? "A atualizar…" : `✓ ${item.nome} — Atualizar`}
            </button>

      {itens.some((it) => it.fonte === "excel") ? (

      ) : itens.some((it) => it.precisaPermissao) ? (

/* ================= NEGÓCIOS DO TRIMESTRE (Mapa Trimestral) =================
   Ficheiro sensível (dados de comissão pessoal) — propositadamente NÃO fica
   nenhum dado embutido neste ficheiro .html. Só aparece depois de ligares o
   Excel, e só neste browser (nunca sai daqui). */

async function lerWorkbookLigado(tipo) {
  const handle = await obterHandlePermitido(tipo);
  if (!handle) return null;
  return lerWorkbookDoHandle(handle);
}

async function lerWorkbookDoHandle(handle) {
  try {
    const file = await handle.getFile();
    return XLSX.read(await file.arrayBuffer(), { type: "array" });
  } catch (e) {
    alert("Não foi possível ler o Excel ligado: " + e.message);
    return null;
  }
}

// A folha "Pipe" do Mapa Trimestral vem com um intervalo (!ref) corrompido
// (milhares de colunas vazias) — recalcula o intervalo real a partir das
// células que têm mesmo conteúdo, para a leitura não ficar lentíssima.
function corrigirIntervaloSheet(sheet) {
  let maxR = 0, maxC = 0;
  Object.keys(sheet).forEach((k) => {
    if (k[0] === "!") return;
    const m = k.match(/^([A-Z]+)([0-9]+)$/);
    if (!m) return;
    const c = XLSX.utils.decode_col(m[1]);
    const r = parseInt(m[2], 10);
    if (r > maxR) maxR = r;
    if (c > maxC) maxC = c;
  });
  sheet["!ref"] = `A1:${XLSX.utils.encode_col(maxC)}${maxR}`;
}

// parecidos (ex: "JULHO-SET" vs "JULHO/SETEMBRO") podem ser de PERÍODOS
// DIFERENTES (ex: trimestres de anos diferentes) — por isso não juntamos rótulos
// diferentes num "trimestre" adivinhado; só normalizamos maiúsculas/espaços para
// agrupar o que é claramente a mesma escrita (ex: "Abril"/"ABRIL"/"abril").
function normalizarRotuloPeriodo(raw) {
  if (!raw) return null;
  return String(raw).trim().toLowerCase().replace(/\s+/g, " ");
}

// à mão — decisão explícita do utilizador (2026-09-10), validada contra os 483
// negócios reais do Plano Comissional anterior (91,2% de acerto, incluindo o caso
// obrigatório "Cliente F": RLMC 210€, Nova Receita, Silver, 36 meses, Qt=1 →
// 473,445€, exato). Constantes fixas do Plano Comissional FY26/27 — nunca editáveis
// pelo utilizador. Nunca substitui o valor manual sozinha (ver "Usar valor calculado").
const PONDERADOR_UPFRONT_NATUREZA = { NRECEITA: 3, "REFIDELIZAÇÃO": 1 };
const MULTIPLICADOR_UPFRONT_OFERTA = { GOLD: 1, BRONZE: 0.70, SILVER: 0.60, ESTANHO: 0.36 };
function ajusteDuracaoUpfront(meses) {
  const m = Number(meses);
  if (m >= 12 && m <= 17) return 0.40;
  if (m >= 18 && m <= 23) return 0.6488;
  if (m >= 24 && m <= 29) return 1.00;
  if (m >= 30 && m <= 35) return 1.125;
  if (m >= 36 && m <= 47) return 1.2525;
  if (m >= 48) return 1.50;
  return null;
}
// 🐛 Achado real e corrigido (2026-09-21, reportado por Augusto) — esta função nunca
// aplicava os ajustes de "Tipo Cliente" (Particular) nem "Atividade Não Incentivada"
// (secção 5 do manual), apesar de "Usar valor calculado" (o botão que a usa) mostrar
// sempre o mesmo valor ao mudar Tipo Cliente entre Empresa/Particular. Confirmado por
// evidência real: os 25 negócios reais (de 483, arquivo pré-outubro/2026) com Particular
// e/ou Móvel+Atividade Não Incentivada têm o valor gravado (vindo do Excel real, nunca
// desta função) a bater EXATO a 6 casas decimais com ×0,5 por fator aplicável (×0,25
// quando os 2 se aplicam) — não ×0,6 como o texto solto do manual ("-40%") sugeria à
// primeira vista. Decisão explícita do utilizador (2026-09-21): usar 0,5, confirmado
// pelos dados reais, mais fiável do que o texto do manual (mesmo padrão já visto com a
// Oferta, cujas percentagens em texto também não eram uma subtração direta). Mesmo
// âmbito já confirmado no manual e já usado em calcularRlmcAjustadaAtingimento: Particular
// aplica-se a qualquer categoria, Atividade Não Incentivada só a Móvel.
function calcularComissaoUpfront(negocio) {
  const ponderador = PONDERADOR_UPFRONT_NATUREZA[negocio.natureza];
  const multiplicador = MULTIPLICADOR_UPFRONT_OFERTA[negocio.tipoOferta];
  const ajuste = ajusteDuracaoUpfront(negocio.meses);
  if (ponderador === undefined || multiplicador === undefined || ajuste === null) return null;
  let valor = negocio.rlmc * (Number(negocio.qt) || 1) * ponderador * multiplicador * ajuste;
  if (negocio.tipoCliente === "PARTICULAR") valor *= 0.5;
  if (negocio.categoriaObjetivo === "MÓVEL" && negocio.atividade === "NÃO INCENTIVADA") valor *= 0.5;
  return valor;
}

// RLMC ajustada para efeitos de ATINGIMENTO de objetivos — decisão explícita do
// utilizador (2026-09-18), distinta e nova em relação a comissaoUpfront/premioJS (RLMC
// em euros de comissão) — esta é a RLMC em si, ajustada, usada para comparar contra os
// objetivos trimestrais (OBJETIVO_TRIMESTRAL_POR_CATEGORIA). Nunca substitui os
// cartões "RLMC — Mês" (RLMC em bruto, inalterados).
//
// Ajustes confirmados por Augusto (2026-09-18), depois de reler o Manual de Comissões
// (secção 5) e reportar a ambiguidade encontrada — os 3 ajustes seguintes contam TODOS
// para atingimento, não só para o cálculo do prémio em euros:
//   1. Duração contratual (Figura 2, ajusteDuracaoUpfront) — sem ambiguidade no
//      manual ("aplica-se à comissão upfront, prémio, e atingimentos").
//   2. Oferta Gold/Bronze/Silver/Estanho — reaproveita MULTIPLICADOR_UPFRONT_OFERTA
//      (os mesmos valores 1/0,70/0,60/0,36 já usados em calcularComissaoUpfront —
//      confirmado que -30%/-40%/-64% da secção 5 do manual batem exatamente com
//      esses valores, nunca uma tabela nova/duplicada).
//   3. Clientes Particulares (-40% no texto do manual, RLMC×0,5 nos dados reais) —
//      aplica-se a qualquer categoria (Móvel/Fixo/SS), o manual não limita.
//   4. Atividade não incentivada (idem, RLMC×0,5) — **só para RLMC Móvel**: o manual
//      só menciona este ajuste explicitamente no parágrafo da RLMC Móvel, nunca no
//      parágrafo de RLMC Fixo/Smart Solutions — confirmado por Augusto (2026-09-18)
//      que a leitura está certa, nunca se aplica a Fixo/Smart Solutions.
// Os ajustes 3 e 4 combinam-se multiplicativamente quando ambos se aplicam (confirmado
// com 2 negócios reais simultâneos, 2026-09-21 — ver nota abaixo).
//
// 🐛 Corrigido ×0,6 → ×0,5 (2026-09-21, decisão explícita do utilizador) — o texto do
// manual ("-40%") sugeria ×0,6, mas os 25 negócios reais afetados (de 483, arquivo
// pré-outubro/2026) batem EXATO a 6 casas decimais com ×0,5 por fator (×0,25 quando os
// 2 se aplicam em simultâneo) — nunca ×0,6. Esta função usou ×0,6 em produção desde
// 2026-09-18 até agora — qualquer "RLMC ajustada para atingimento" mostrada nesse
// intervalo, para um negócio Particular e/ou Móvel+Atividade Não Incentivada, esteve
// sobrestimada (0,6 > 0,5). Nunca recalculado retroativamente sozinho — só a fórmula
// daqui para a frente muda; os valores já mostrados/decisões já tomadas com base neles
// ficam para Augusto avaliar o impacto.
function calcularRlmcAjustadaAtingimento(negocio) {
  const ajusteDuracao = ajusteDuracaoUpfront(negocio.meses);
  const multiplicadorOferta = MULTIPLICADOR_UPFRONT_OFERTA[negocio.tipoOferta];
  if (ajusteDuracao === null || multiplicadorOferta === undefined) return null;
  let rlmcAjustada = (Number(negocio.rlmc) || 0) * ajusteDuracao * multiplicadorOferta;
  if (negocio.tipoCliente === "PARTICULAR") rlmcAjustada *= 0.5;
  if (negocio.categoriaObjetivo === "MÓVEL" && negocio.atividade === "NÃO INCENTIVADA") rlmcAjustada *= 0.5;
  return Number(rlmcAjustada.toFixed(2));
}

// ("+ Novo Negócio") caem sempre FORA do intervalo de linhas com fórmula real da folha
// Pipe (3-549 neste ficheiro — gravarNegocioNoExcel acrescenta sempre na 1ª linha livre
// a seguir ao intervalo já usado, nunca estica as fórmulas para a nova linha). Nessas
// linhas, "Comissão Upfront"/"BÓNUS PROX TRI" são valores LITERAIS que o próprio
// dashboard escreveu (best-effort, na altura da criação) — nunca um resultado genuíno
// da fórmula real do Excel. Comparar o motor JS contra esse valor não é "bater com o
// Excel", é comparar contra outro cálculo já feito pelo dashboard — por isso
// PainelValidacaoPipe nunca trata essas linhas como comparáveis (ver semFormulaExcel).
// Deteta isto olhando para a célula U{linha} (parte do bloco de fórmulas U:AI) — se não
// tiver `.f` (fórmula), a linha nasceu fora do intervalo original.
function temFormulaNaLinhaPipe(wb, linhaExcel) {
  if (!wb || !wb.Sheets["Pipe"] || !linhaExcel) return false;
  const cel = wb.Sheets["Pipe"][`U${linhaExcel}`];
  return !!(cel && cel.f);
}

// Lê as tabelas de apoio da folha "XP" (endereços fixos, decodificados por inspeção direta
// das fórmulas — nunca "adivinhados"). `v(endereco)` lê o VALOR já calculado da célula
// (`.v`), nunca a fórmula (`.f`) — as células de apoio (B2, C2, H13, I13, ...) são texto/
// número literal, não fórmulas, por isso isto funciona mesmo com um workbook só lido
// (nunca recalculado) pelo SheetJS.
function lerTabelaXP(wb) {
  if (!wb || !wb.Sheets["XP"]) return null;
  const sheet = wb.Sheets["XP"];
  const v = (endereco) => { const cel = sheet[endereco]; return cel ? cel.v : undefined; };
  return {
    tipoCliente: { [v("B2")]: v("C2"), [v("B3")]: v("C3") },
    atividade: { [v("K13")]: v("L13"), [v("K14")]: v("L14") },
    contrato: { [v("M13")]: v("N13"), [v("M14")]: v("N14") },
    desconto: { [v("G2")]: v("H2"), [v("G3")]: v("H3") },
    // Correspondência EXATA (a fórmula real usa VLOOKUP com último argumento 0 — exato,
    // nunca aproximado) — um valor de "Meses" fora desta lista fica sem correspondência,
    // tal como aconteceria na própria fórmula do Excel.
    meses: { [v("I2")]: v("J2"), [v("I3")]: v("J3"), [v("I4")]: v("J4"), [v("I6")]: v("J6"), [v("I7")]: v("J7"), [v("I8")]: v("J8"), [v("I9")]: v("J9") },
    oferta: { [v("H13")]: v("I13"), [v("H14")]: v("I14"), BRONZE: MULTIPLICADOR_UPFRONT_OFERTA.BRONZE, ESTANHO: MULTIPLICADOR_UPFRONT_OFERTA.ESTANHO },
    // Acelerador Upfront — tabela 2×2 Natureza×Oferta (XP!L2/L3/L4/L6, chaves lidas da
    // própria folha, nunca escritas à mão — só os 4 pares que a fórmula real usa existem;
    // qualquer outra combinação fica legitimamente sem acelerador, ver calcularLinhaPipeJS).
    aceleradorUpfront: {
      [`${v("E2")}|${v("H13")}`]: v("L2"),
      [`${v("E2")}|${v("H14")}`]: v("L3"),
      [`${v("E3")}|${v("H13")}`]: v("L4"),
      [`${v("E3")}|${v("H14")}`]: v("L6"),
    },
  };
}

// Negócios) — decisão explícita do utilizador: sem o Excel como fonte, esta tabela

// sítio para viver, com uma forma de a editar no próprio dashboard (a Vodafone envia

//
// ⚠️ Importante para Augusto: esta tabela só é usada pelo PainelValidacaoPipe (a
// comparação JS vs Excel, nunca fonte primária) — o motor de comissões que já usas a
// sério (calcularComissaoUpfront, calcularRlmcAjustadaAtingimento,
// calcularPremioTrimestralProposta, tudo o que alimenta "Comissões"/RLMC/Campanha)
// NUNCA leu esta tabela; usa sempre as constantes já embutidas no código
// (MULTIPLICADOR_UPFRONT_OFERTA, ajusteDuracaoUpfront, PONDERADOR_UPFRONT_NATUREZA),
// confirmadas e testadas à parte. Migrar/editar esta tabela nunca muda nenhum valor
// de comissão real — só a comparação de validação.
//
// Documento único (nunca uma coleção com 1 doc por linha — é 1 tabela só, pequena,
// não uma lista de registos) em tabela_referencia_xp/atual, mesmo formato aninhado
// devolvido por lerTabelaXP. Mesmo padrão de migração de useClientesNovos/
// useNegocios: só troca de fonte depois do próprio utilizador confirmar.
function useTabelaXP(wbAtual) {
  const firebaseUser = useFirebaseAuthUser();
  const { feita: nuvemMigrada, marcar: marcarMigrado } = useMigracaoNuvem("tabela_xp", firebaseUser);
  const nuvemAtiva = !!firebaseUser && nuvemMigrada;
  const [tabelaNuvem, setTabelaNuvem] = useState(null);
  const [aCarregar, setACarregar] = useState(false);

  useEffect(() => {
    if (!nuvemAtiva) { setTabelaNuvem(null); return; }
    setACarregar(true);
    const unsub = firebaseDb.collection("tabela_referencia_xp").doc("atual").onSnapshot(
      (doc) => { setTabelaNuvem(doc.exists ? doc.data() : null); setACarregar(false); },
      (e) => { console.warn("Não foi possível ler tabela_referencia_xp:", e.message); setACarregar(false); }
    );
    return unsub;
  }, [nuvemAtiva]);

  // Só existe se houver um Excel ligado nesta sessão (mesma fonte de sempre) — usada
  // como origem da migração única E como fallback enquanto não migrado.
  const tabelaExcel = useMemo(() => (wbAtual ? lerTabelaXP(wbAtual) : null), [wbAtual]);
  const tabela = nuvemAtiva ? tabelaNuvem : tabelaExcel;

  const [aMigrar, setAMigrar] = useState(false);
  const migrarParaNuvem = async () => {
    if (!firebaseUser || nuvemAtiva || !tabelaExcel) return { ok: false };
    setAMigrar(true);
    await firebaseDb.collection("tabela_referencia_xp").doc("atual").set(tabelaExcel);
    await marcarMigrado();
    setAMigrar(false);
    return { ok: true };
  };

  // Edição direta no dashboard (pedido explícito de Augusto) — substitui a tabela
  // inteira de uma vez (é pequena, nunca vale a pena granularizar por campo).
  const definir = (novaTabela) => firebaseDb.collection("tabela_referencia_xp").doc("atual").set(novaTabela);

  return { tabela, aCarregar, firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, definir, temFonteExcel: !!tabelaExcel };
}

// Recalcula um negócio com o motor decodificado das fórmulas reais — devolve null nos 3
// valores quando falta alguma correspondência na tabela XP (nunca inventa/aproxima um
// resultado), com o(s) aviso(s) a explicar exatamente o que faltou, para nunca ficar
// "silenciosamente" incompleto.
function calcularLinhaPipeJS(negocio, tabelaXP) {
  const avisos = [];
  const buscar = (tabela, chave, nome) => {
    const val = tabela[chave];
    if (val === undefined) avisos.push(`${nome} "${chave}" sem correspondência na tabela XP.`);
    return val;
  };
  const tipoCliente = buscar(tabelaXP.tipoCliente, negocio.tipoCliente, "Tipo Cliente");
  const atividade = buscar(tabelaXP.atividade, negocio.atividade, "Atividade");
  const contrato = buscar(tabelaXP.contrato, negocio.contrato, "Contrato");
  const desconto = buscar(tabelaXP.desconto, negocio.desc, "Desconto/Estado");
  const meses = buscar(tabelaXP.meses, Number(negocio.meses), "Meses");
  const oferta = buscar(tabelaXP.oferta, negocio.tipoOferta, "Tipo de Oferta");
  if ([tipoCliente, atividade, contrato, desconto, meses, oferta].some((x) => x === undefined)) {
    return { comissaoUpfrontJS: null, countBonusJS: null, countPagamentoBonusProxTriJS: null, avisos };
  }
  // Sem correspondência no acelerador = 0 é um resultado válido (nem toda combinação
  // Natureza×Oferta tem acelerador na fórmula real) — nunca um aviso.
  const acelerador = tabelaXP.aceleradorUpfront[`${negocio.natureza}|${negocio.tipoOferta}`] || 0;
  const rlmc = Number(negocio.rlmc) || 0;
  const qt = Number(negocio.qt) || 0;
  const arredondar2 = (n) => Number(n.toFixed(2));
  return {
    comissaoUpfrontJS: arredondar2(rlmc * qt * tipoCliente * atividade * meses * desconto * acelerador * contrato),
    countBonusJS: arredondar2(rlmc * qt * tipoCliente * oferta * meses * desconto * atividade * contrato),
    countPagamentoBonusProxTriJS: arredondar2(rlmc * qt * tipoCliente * oferta * desconto * atividade * contrato),
    avisos,
  };
}

// cai no fallback fixo OBJETIVO_TRIMESTRAL_POR_CATEGORIA (compatibilidade com

function calcularNivelTrimestralProposta(negociosDoTrimestre, objetivosPorCategoria) {
  const objetivos = objetivosPorCategoria || OBJETIVO_TRIMESTRAL_POR_CATEGORIA;
  const porCategoria = Object.entries(objetivos).map(([categoria, objetivo]) => {
    // RLMC AJUSTADA (nunca a bruta) — decisão explícita do utilizador (2026-09-18),
    // ver calcularRlmcAjustadaAtingimento. Negócio sem duração/oferta válida (null)
    // conta como 0 para esta soma — mesmo padrão dos outros somatórios deste ficheiro.
    const real = negociosDoTrimestre.filter((n) => n.categoria === categoria).reduce((s, n) => s + (calcularRlmcAjustadaAtingimento(n) || 0), 0);
    const atingimentoFracao = objetivo ? real / objetivo : 0;
    return {
      categoria, objetivo, real: Number(real.toFixed(2)),
      atingimentoPercent: Number((atingimentoFracao * 100).toFixed(1)),
      atingido: atingimentoFracao >= 0.9,
    };
  });
  return { nivel: porCategoria.filter((c) => c.atingido).length, porCategoria }; // nivel: 0-5
}

const OBJETIVOS_TRIMESTRAIS_FICHEIRO = "objetivos-trimestrais.json";
function useObjetivosTrimestrais(ligacaoPasta) {
  const [objetivos, setObjetivos] = useState(() => {
    try { return JSON.parse(localStorage.getItem("objetivos-trimestrais") || "{}"); } catch { return {}; }

  const [carregadoDoFicheiro, setCarregadoDoFicheiro] = useState(false);

  useEffect(() => {

    (async () => {

      if (doFicheiro) setObjetivos(doFicheiro);
      else if (Object.keys(objetivos).length > 0) await guardarJsonDadosPrivados(ligacaoPasta.handle, OBJETIVOS_TRIMESTRAIS_FICHEIRO, objetivos);
      setCarregadoDoFicheiro(true);

  }, [objetivos]);

  const definirCampo = (trimestre, campo, valor) => setObjetivos((prev) => ({
    ...prev, [trimestre]: { ...(prev[trimestre] || {}), [campo]: valor },
  }));

  // Objetivos das 5 categorias efetivos de um trimestre — usa o valor editado se
  // existir, senão cai no fallback fixo confirmado por Augusto (2026-09-18) — nunca
  // deixa uma categoria sem nenhum objetivo por definir.
  const objetivosCategoriaDoTrimestre = (trimestre) => {
    const editado = objetivos[trimestre] || {};

    Object.keys(OBJETIVO_TRIMESTRAL_POR_CATEGORIA).forEach((cat) => {
      const parsed = parseNumeroPT(editado[cat]);
      resultado[cat] = parsed !== null ? parsed : OBJETIVO_TRIMESTRAL_POR_CATEGORIA[cat];
    });
    return resultado;
  };
  // Objetivo da Campanha — SEM fallback (é um conceito novo, sem nenhum valor
  // "conhecido" de antes) — null enquanto Augusto não o preencher para esse trimestre.
  const objetivoCampanhaDoTrimestre = (trimestre) => parseNumeroPT((objetivos[trimestre] || {}).campanha);

  return { objetivos, definirCampo, objetivosCategoriaDoTrimestre, objetivoCampanhaDoTrimestre };

// correção de 2026-09-18, substitui a suposição linear anterior). Abaixo de 70% = 0%;
// a partir de 100% exato, usa-se a Figura 4 (ajuste cruzado), não esta tabela.
const AJUSTE_DIRETO_ESCALOES = [
  { min: 70, max: 75, percent: 40 },
  { min: 75, max: 80, percent: 50 },
  { min: 80, max: 85, percent: 60 },
  { min: 85, max: 90, percent: 70 },

// consoante quantas das OUTRAS categorias (das 5) ficaram abaixo de 100% no mesmo
// trimestre. 5 = "n.a." no próprio manual (sem valor definido nesse caso).
const AJUSTE_CRUZADO_TABELA = { 0: 100, 1: 90, 2: 87.5, 3: 85, 4: 82.5, 5: null };

// % (0-100) a aplicar sobre o "valor apurado" desta categoria — null só no caso "n.a."
// da Figura 4 (as 5 categorias abaixo de 100%, incluindo esta a exatamente 100% —
// situação contraditória que o próprio manual não cobre).
function calcularAjustePercentualProposta(atingimentoCategoria, porCategoria) {
  if (atingimentoCategoria.atingimentoPercent < 100) {
    const escalao = AJUSTE_DIRETO_ESCALOES.find((e) => atingimentoCategoria.atingimentoPercent >= e.min && atingimentoCategoria.atingimentoPercent < e.max);
    return escalao ? escalao.percent : 0; // < 70% — nenhum escalão bate, 0%
  }
  const nAbaixoDe100 = porCategoria.filter((c) => c.atingimentoPercent < 100).length;
  const v = AJUSTE_CRUZADO_TABELA[nAbaixoDe100];
  return v === undefined ? null : v;
}

// Figura 4 (nunca 0 nesse caso, para não confundir "sem prémio" com "sem valor
// definido pelo próprio manual").
function calcularPremioTrimestralProposta(negocio, nivel, porCategoria) {
  const tabela = PREMIO_TRIMESTRAL_TABELA_PROPOSTA[negocio.natureza];
  const linhaNivel = nivel > 0 ? tabela?.[nivel] : undefined;
  const multiplicador = linhaNivel?.[negocio.tipoOferta];
  const ajusteDuracao = ajusteDuracaoUpfront(negocio.meses);
  const atingimentoCategoria = porCategoria.find((c) => c.categoria === negocio.categoria);
  if (!atingimentoCategoria || multiplicador === undefined || ajusteDuracao === null) return 0;
  const ajustePercent = calcularAjustePercentualProposta(atingimentoCategoria, porCategoria);
  if (ajustePercent === null) return null; // Figura 4 "n.a." — sem valor definido
  if (ajustePercent === 0) return 0;
  const valorApurado = negocio.rlmc * multiplicador * ajusteDuracao;
  return Number((valorApurado * (ajustePercent / 100)).toFixed(2));
}

// Mês/Trimestre derivados sempre da "Data de início" (nunca texto livre) — decisão
// explícita do utilizador (2026-09-10). Trimestres alinhados com o calendário
// (Jan-Mar, Abr-Jun, Jul-Set, Out-Dez), confirmado pelos rótulos reais já usados à
// mão no Excel antigo (ex: "JULHO-SET", "OUT-DEZ", "JAN-MAR").
const MESES_PT_LABEL = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
function mesChaveDeData(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function mesDeDataInicio(dataInicio) {
  if (!dataInicio) return null;
  const d = new Date(dataInicio + "T00:00:00");
  return isNaN(d) ? null : mesChaveDeData(d);
}
function labelMes(mesChave) {
  const [ano, mes] = mesChave.split("-").map(Number);
  return `${MESES_PT_LABEL[mes - 1]} ${ano}`;
}
function trimestreChaveDeData(d) { return `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`; }
function trimestreChaveDeDataInicio(dataInicio) {
  if (!dataInicio) return null;
  const d = new Date(dataInicio + "T00:00:00");
  return isNaN(d) ? null : trimestreChaveDeData(d);
}
function labelTrimestre(trimestreChave) {
  const [ano, qStr] = trimestreChave.split("-Q");
  const q = Number(qStr);
  return `${MESES_PT_LABEL[(q - 1) * 3]}-${MESES_PT_LABEL[(q - 1) * 3 + 2]} ${ano}`;
}

// Posição (coluna, 0 = A) de cada campo editável na folha "Pipe". As restantes
// colunas são fórmulas de cálculo de bónus/acelerador — nunca lhes tocamos.
const COL_NEGOCIO = {
  nif: 1, empresa: 2, tipoCliente: 3, natureza: 4, atividade: 5, contrato: 6, meses: 7,
  periodoTexto: 8, estado: 9, tarifario: 12, qt: 13, tipoOferta: 14, desc: 15,
  categoriaObjetivo: 16, rlmc: 17, comissaoUpfront: 18, bonusProxTri: 30,
};

// Mapeia uma linha da folha "Pipe" (cabeçalho na 2ª linha da folha) para o formato interno.
// linhaExcel é a linha real (1-indexed) na folha, para permitir editar sem perturbar as outras.
function mapearLinhaNegocio(r, linhaExcel) {
  const empresa = limparValorExcel(r["__EMPTY_2"]);
  if (!empresa) return null;
  const natureza = limparValorExcel(r["NATUREZA"]);
  const categoriaObjetivo = limparValorExcel(r["OBJECTIVO"]);
  return {
    linhaExcel,
    nif: limparValorExcel(r["__EMPTY_1"]),
    empresa,
    tipoCliente: limparValorExcel(r["TIPO CLIENTE"]),
    natureza,
    atividade: limparValorExcel(r["ACTIVIDADE"]),
    contrato: limparValorExcel(r["CONTRATO"]),
    meses: r["MESES"] || "",
    periodoTexto: limparValorExcel(r["   DATA    "]),
    periodo: normalizarRotuloPeriodo(r["   DATA    "]),
    estado: limparValorExcel(r["ESTADO"]) || "Sem estado",
    tarifario: limparValorExcel(r["TARIFÁRIO"]),
    qt: Number(r["QT"]) || 0,
    tipoOferta: limparValorExcel(r["TIPO DE OFERTA"]),
    // "DESC" (estado do tarifário: Em Vigor/Descontinuada) — usado só pelo motor de
    // validação em paralelo da Fase 2 (calcularLinhaPipeJS), nunca escrito de volta ao
    // Excel (não está em COL_NEGOCIO/gravarNegocioNoExcel, decisão deliberada — este
    // campo é só para leitura/comparação, não editável no dashboard).
    desc: limparValorExcel(r["DESC"]),
    categoriaObjetivo,
    // "Produto SS" (2026-09-20) — coluna nova, mesma lógica de "Observações"/"OPTY"
    // abaixo (criada no fim da folha só quando tem valor). Sem valor gravado ainda
    // (negócio antigo, nunca reclassificado), fica "" — calcularCategoriaNegocio trata
    // "" como "FIXO" (comportamento antigo preservado até Augusto editar à mão).
    produtoSS: limparValorExcel(r["Produto SS"]),
    categoria: calcularCategoriaNegocio(natureza, categoriaObjetivo, limparValorExcel(r["Produto SS"])),
    rlmc: Number(r["RLMC"]) || 0,
    comissaoUpfront: Number(r["COMISSÃO UPFRONT"]) || 0,
    bonusProxTri: Number(r["BÓNUS PROX TRI"]) || 0,
    // Coluna real "Data de início" na folha Pipe (acrescentada no fim da folha,
    // decisão explícita do utilizador 2026-09-10) — antes vinha do localStorage, que
    // não sincronizava entre os dois Macs via iCloud (mesmo problema já resolvido
    // para "Assuntos em Progresso"). Ver gravarNegocioNoExcel para a escrita.
    dataInicio: limparValorExcel(r["Data de início"]),
    observacoes: limparValorExcel(r["Observações"]),
    // "OPTY" e "Simulador" (campos novos, opcionais) — mesma lógica de "Observações":
    // colunas reais no fim da folha, criadas só quando têm valor pela 1ª vez (ver
    // gravarNegocioNoExcel). Decisão explícita do utilizador (2026-09-12) — distinto
    // do "Simulador" já existente noutro sítio (fecho de Prospetos → Clientes).
    opty: limparValorExcel(r["OPTY"]),
    simulador: limparValorExcel(r["Simulador"]),
  };
}

function lerNegociosDoWorkbook(wb) {
  if (!wb || !wb.Sheets["Pipe"]) return [];
  const sheet = wb.Sheets["Pipe"];
  corrigirIntervaloSheet(sheet);
  // "blankrows: true" é crítico aqui — sem ele, o SheetJS omite por completo do array
  // qualquer linha sem NENHUMA célula, o que desalinha "índice do array + 3" da linha
  // real do Excel sempre que houver linhas totalmente vazias no meio (como as que
  // ficaram depois do arquivamento de 2026-09-10 — linhas sem dados literais mas
  // também sem fórmulas). Bug real detetado nesse dia: "Apagar negócio" (e qualquer
  // edição de um negócio já existente) escrevia na linha errada por causa disto.
  const rows = XLSX.utils.sheet_to_json(sheet, { range: 1, defval: null, blankrows: true });
  return rows.map((r, i) => mapearLinhaNegocio(r, i + 3)).filter(Boolean);
}

// Grava um negócio na folha "Pipe" do Excel ligado: se linhaExistente for dado,
// só altera as células dos campos editáveis dessa linha (tudo o resto fica intacto,
// incluindo fórmulas de bónus/acelerador); caso contrário acrescenta na primeira
// linha livre a seguir aos dados existentes. Devolve a linha usada, ou false se falhar.
async function gravarNegocioNoExcel(negocio, linhaExistente, handleProjeto) {
  const handle = await obterHandlePermitido("negocios");
  if (!handle) return false;
  try {
    const file = await handle.getFile();
    const buffer = await file.arrayBuffer();
    await criarBackupExcel(handleProjeto, buffer, "Mapa_Trimestral");
    const wb = XLSX.read(buffer, { type: "array" });
    const sheet = wb.Sheets["Pipe"];
    if (!sheet) return false;
    corrigirIntervaloSheet(sheet);
    let linha = linhaExistente;
    if (!linha) {
      const ref = XLSX.utils.decode_range(sheet["!ref"]);
      linha = ref.e.r + 2;
    }
    const valores = {
      [COL_NEGOCIO.nif]: negocio.nif,
      [COL_NEGOCIO.empresa]: negocio.empresa,
      [COL_NEGOCIO.tipoCliente]: negocio.tipoCliente,
      [COL_NEGOCIO.natureza]: negocio.natureza,
      [COL_NEGOCIO.atividade]: negocio.atividade,
      [COL_NEGOCIO.contrato]: negocio.contrato,
      [COL_NEGOCIO.meses]: negocio.meses,
      [COL_NEGOCIO.periodoTexto]: negocio.periodoTexto,
      [COL_NEGOCIO.estado]: negocio.estado,
      [COL_NEGOCIO.tarifario]: negocio.tarifario,
      [COL_NEGOCIO.qt]: negocio.qt,
      [COL_NEGOCIO.tipoOferta]: negocio.tipoOferta,
      [COL_NEGOCIO.desc]: negocio.desc,
      [COL_NEGOCIO.categoriaObjetivo]: negocio.categoriaObjetivo,
      [COL_NEGOCIO.rlmc]: negocio.rlmc,
      [COL_NEGOCIO.comissaoUpfront]: negocio.comissaoUpfront,
      [COL_NEGOCIO.bonusProxTri]: negocio.bonusProxTri,
    };
    Object.entries(valores).forEach(([indice, valor]) => {
      const endereco = XLSX.utils.encode_cell({ r: linha - 1, c: Number(indice) });
      if (valor === "" || valor === null || valor === undefined) delete sheet[endereco];
      else if (typeof valor === "number") sheet[endereco] = { t: "n", v: valor };
      else sheet[endereco] = { t: "s", v: String(valor) };
    });

    // "Observações" (motivo de um negócio Perdido) não existe na folha original — é
    // encontrada pelo cabeçalho, ou criada no fim da folha se ainda não existir, tal
    // como as colunas novas em adicionarClienteAoExcel/adicionarProspectAoExcel. Nunca
    // reordena nem toca nas colunas de fórmula já existentes.
    const rangeObs = XLSX.utils.decode_range(sheet["!ref"]);
    let colObs = encontrarColunaPorCabecalho(sheet, rangeObs, "Observações", 1);
    if (colObs === -1 && negocio.observacoes) {
      colObs = rangeObs.e.c + 1;
      sheet[XLSX.utils.encode_cell({ r: 1, c: colObs })] = { t: "s", v: "Observações" };
      rangeObs.e.c = colObs;
      sheet["!ref"] = XLSX.utils.encode_range(rangeObs);
    }
    if (colObs !== -1) {
      const enderecoObs = XLSX.utils.encode_cell({ r: linha - 1, c: colObs });
      if (negocio.observacoes) sheet[enderecoObs] = { t: "s", v: String(negocio.observacoes) };
      else delete sheet[enderecoObs];
    }

    // "Data de início" — mesma lógica: encontrada pelo cabeçalho, ou criada no fim da
    // folha (nunca inserida no meio, para nunca deslocar as fórmulas de bónus/
    // acelerador que dependem de posições fixas de coluna). Testado numa cópia do
    // Mapa Trimestral real em 2026-09-10: as 9290 fórmulas da folha continuam intactas.
    let colData = encontrarColunaPorCabecalho(sheet, rangeObs, "Data de início", 1);
    if (colData === -1) {
      colData = rangeObs.e.c + 1;
      sheet[XLSX.utils.encode_cell({ r: 1, c: colData })] = { t: "s", v: "Data de início" };
      rangeObs.e.c = colData;
      sheet["!ref"] = XLSX.utils.encode_range(rangeObs);
    }
    const enderecoData = XLSX.utils.encode_cell({ r: linha - 1, c: colData });
    if (negocio.dataInicio) sheet[enderecoData] = { t: "s", v: String(negocio.dataInicio) };
    else delete sheet[enderecoData];

    // "OPTY" e "Simulador" — 2 campos novos, opcionais, texto livre (decisão explícita
    // do utilizador, 2026-09-12). Mesmo padrão de "Observações": encontrados pelo
    // cabeçalho, ou criados no fim da folha só quando há valor a gravar pela 1ª vez —
    // nunca inseridos no meio, para nunca deslocar as fórmulas de bónus/acelerador que
    // dependem de posições fixas de coluna.
    let colOpty = encontrarColunaPorCabecalho(sheet, rangeObs, "OPTY", 1);
    if (colOpty === -1 && negocio.opty) {
      colOpty = rangeObs.e.c + 1;
      sheet[XLSX.utils.encode_cell({ r: 1, c: colOpty })] = { t: "s", v: "OPTY" };
      rangeObs.e.c = colOpty;
      sheet["!ref"] = XLSX.utils.encode_range(rangeObs);
    }
    if (colOpty !== -1) {
      const enderecoOpty = XLSX.utils.encode_cell({ r: linha - 1, c: colOpty });
      if (negocio.opty) sheet[enderecoOpty] = { t: "s", v: String(negocio.opty) };
      else delete sheet[enderecoOpty];
    }

    let colSimulador = encontrarColunaPorCabecalho(sheet, rangeObs, "Simulador", 1);
    if (colSimulador === -1 && negocio.simulador) {
      colSimulador = rangeObs.e.c + 1;
      sheet[XLSX.utils.encode_cell({ r: 1, c: colSimulador })] = { t: "s", v: "Simulador" };
      rangeObs.e.c = colSimulador;
      sheet["!ref"] = XLSX.utils.encode_range(rangeObs);
    }
    if (colSimulador !== -1) {
      const enderecoSimulador = XLSX.utils.encode_cell({ r: linha - 1, c: colSimulador });
      if (negocio.simulador) sheet[enderecoSimulador] = { t: "s", v: String(negocio.simulador) };
      else delete sheet[enderecoSimulador];
    }

    // "Produto SS" (2026-09-20) — mesmo padrão de "OPTY"/"Simulador" acima: coluna nova
    // no fim da folha, criada só quando há valor a gravar pela 1ª vez. Só relevante
    // quando categoriaObjetivo === "SS" (ver calcularCategoriaNegocio), mas gravada
    // sempre que o negócio a tiver, para não perder o valor se o utilizador mudar de
    // categoriaObjetivo e voltar atrás.
    let colProdutoSS = encontrarColunaPorCabecalho(sheet, rangeObs, "Produto SS", 1);
    if (colProdutoSS === -1 && negocio.produtoSS) {
      colProdutoSS = rangeObs.e.c + 1;
      sheet[XLSX.utils.encode_cell({ r: 1, c: colProdutoSS })] = { t: "s", v: "Produto SS" };
      rangeObs.e.c = colProdutoSS;
      sheet["!ref"] = XLSX.utils.encode_range(rangeObs);
    }
    if (colProdutoSS !== -1) {
      const enderecoProdutoSS = XLSX.utils.encode_cell({ r: linha - 1, c: colProdutoSS });
      if (negocio.produtoSS) sheet[enderecoProdutoSS] = { t: "s", v: String(negocio.produtoSS) };
      else delete sheet[enderecoProdutoSS];
    }

    corrigirIntervaloSheet(sheet);
    const writable = await handle.createWritable();
    await writable.write(XLSX.write(wb, { bookType: "xlsx", type: "array" }));
    await writable.close();
    return linha;
  } catch (e) {
    alert("Não foi possível escrever no Excel: " + e.message);
    return false;
  }
}

// Remove a linha de um negócio (por linhaExcel, já conhecido — nunca por nome/NIF, que
// podem ser ambíguos) da folha "Pipe". Só apaga as células dessa linha, nunca
// reconstrói a folha. Chamada sempre depois de confirmação explícita do utilizador
// (botão "Apagar negócio", com "Tens a certeza?" antes) — nunca sem confirmar.
async function removerNegocioDoExcel(linhaExcel, handleProjeto) {
  const handle = await obterHandlePermitido("negocios");
  if (!handle) return false;
  try {
    const file = await handle.getFile();
    const buffer = await file.arrayBuffer();
    await criarBackupExcel(handleProjeto, buffer, "Mapa_Trimestral");
    const wb = XLSX.read(buffer, { type: "array" });
    const sheet = wb.Sheets["Pipe"];
    if (!sheet) return false;
    corrigirIntervaloSheet(sheet);
    const range = XLSX.utils.decode_range(sheet["!ref"]);
    const r0 = linhaExcel - 1;
    for (let c = range.s.c; c <= range.e.c; c++) delete sheet[XLSX.utils.encode_cell({ r: r0, c })];
    const writable = await handle.createWritable();
    await writable.write(XLSX.write(wb, { bookType: "xlsx", type: "array" }));
    await writable.close();
    return true;
  } catch (e) {
    alert("Não foi possível escrever no Excel: " + e.message);
    return false;
  }
}

// A partir de quando a data de início + duração do contrato entram na "zona de
// fidelização" (últimos 6 meses do contrato).
function calcularAlertaFidelizacao(dataInicio, meses) {
  if (!dataInicio || !meses) return null;
  const mesesAviso = Math.max(Number(meses) - 6, 0);
  const d = new Date(dataInicio);
  if (isNaN(d)) return null;
  d.setMonth(d.getMonth() + mesesAviso);
  return d;
}

const NEGOCIOS_FICHEIRO = "negocios-trimestre.json";

// Fonte de dados: "excel" (acabado de ler do Mapa Trimestral ligado) ou "arquivo"
// (snapshot já extraído, lido de dados-privados/negocios-trimestre.json — pode ter
// chegado via iCloud Drive de outro Mac, sem precisar de voltar a ligar o Excel).
// Decisão explícita do utilizador (2026-09-08): continua a pedir para ligar o Excel
// manualmente como sempre — não guardamos o Excel em si, só os dados já extraídos
// dele. Ao carregar, se já existir um snapshot em dados-privados/ mostra-o
// diretamente; só volta a pedir o Excel quando o utilizador clicar em "Ligar"/
// "Atualizar" (que também substitui o snapshot pelos dados frescos).
// Coleção "negocios" na nuvem (Passo 2, 2026-09-19, decisão explícita do utilizador:
// Excel deixa de ser a fonte principal). Ao contrário de Clientes/Prospetos (1
// documento por NIF, useColecaoFirestore) um NIF pode ter VÁRIOS negócios — por isso
// cada documento é indexado por `linhaExcel`, reaproveitado como identificador
// estável (nunca renomeado no resto do código, que já lhe chama `linhaExcel` em todo
// o lado — useNegociosCampanha, PainelValidacaoPipe, formulário de edição). Negócios
// criados DEPOIS da migração recebem um `linhaExcel` sintético (Date.now()) em vez de
// um nº de linha real do Excel — só precisa de ser único, nunca mais interpretado
// como posição numa folha.
function useNegociosFirestore(ativo) {
  const [itens, setItens] = useState([]);
  const [aCarregar, setACarregar] = useState(false);
  useEffect(() => {
    if (!ativo) { setItens([]); return; }
    setACarregar(true);
    const unsub = firebaseDb.collection("negocios").onSnapshot(
      (snap) => { setItens(snap.docs.map((d) => d.data())); setACarregar(false); },
      (e) => { console.warn("Não foi possível ler negocios do Firestore:", e.message); setACarregar(false); }
    );
    return unsub;
  }, [ativo]);
  const definir = (negocio) => firebaseDb.collection("negocios").doc(String(negocio.linhaExcel)).set(negocio);
  const remover = (linhaExcel) => firebaseDb.collection("negocios").doc(String(linhaExcel)).delete();
  return { itens, aCarregar, definir, remover };
}

function useNegocios(ligacaoPasta) {
  const ligacao = useLigacaoExcel("negocios");
  const [negocios, setNegocios] = useState([]);
  const [fonte, setFonte] = useState("vazio"); // "vazio" | "excel" | "arquivo"
  const [aCarregar, setACarregar] = useState(false);
  const [tentouCarregarInicial, setTentouCarregarInicial] = useState(false);
  // Workbook em memória da última leitura do Excel — só usado pela validação em
  // paralelo da Fase 2 (lerTabelaXP precisa da folha "XP" completa, não só das linhas
  // já mapeadas de "negocios"). Fica null quando a lista vem do snapshot em cache
  // (dados-privados/negocios.json) em vez de uma leitura fresca do Excel — a
  // comparação só fica disponível depois de ligar/atualizar o Excel nesta sessão.
  const [wbAtual, setWbAtual] = useState(null);

  const persistirSnapshot = (lista) => {
    if (ligacaoPasta.pronto) guardarJsonDadosPrivados(ligacaoPasta.handle, NEGOCIOS_FICHEIRO, lista);
  };

  const carregar = async () => {
    if (!ligacao.handle) return false;
    setACarregar(true);
    const wb = await lerWorkbookDoHandle(ligacao.handle);
    if (wb) {
      const lidos = lerNegociosDoWorkbook(wb);
      setNegocios(lidos);
      setFonte("excel");
      setWbAtual(wb);
      persistirSnapshot(lidos);
    }
    setACarregar(false);
    return !!wb;
  };

  // Um único efeito para as duas fontes possíveis, para nunca haver corrida entre
  // "já tenho snapshot" e "o Excel já estava ligado de uma vez anterior" — tenta
  // sempre o snapshot primeiro (evita pedir o Excel outra vez), só recorre ao Excel
  // se ainda não houver snapshot nenhum.
  useEffect(() => {
    if (tentouCarregarInicial) return;
    (async () => {
      if (ligacaoPasta.pronto) {
        const doArquivo = await lerJsonDadosPrivados(ligacaoPasta.handle, NEGOCIOS_FICHEIRO);
        if (doArquivo) { setNegocios(doArquivo); setFonte("arquivo"); setTentouCarregarInicial(true); return; }
      }
      if (ligacao.pronto) { await carregar(); setTentouCarregarInicial(true); }
    })();
  }, [ligacaoPasta.pronto, ligacao.pronto, tentouCarregarInicial]);

  const continuar = async () => { const ok = await ligacao.continuar(); if (ok) await carregar(); return ok; };
  const ligar = async () => { const ok = await ligacao.ligar(); if (ok) await carregar(); return ok; };
  const recarregar = carregar;

  // Passo 2 (2026-09-19) — cloud-aware, mesmo padrão de useClientesNovos/
  // useProspetosNovos: só troca de fonte depois do próprio utilizador confirmar a
  // migração (nunca sozinho, nunca automático). Até lá, tudo continua exatamente
  // como antes (Excel ligado ou snapshot local em dados-privados/).
  const firebaseUser = useFirebaseAuthUser();
  const { feita: nuvemMigrada, marcar: marcarMigrado } = useMigracaoNuvem("negocios", firebaseUser);
  const nuvemAtiva = !!firebaseUser && nuvemMigrada;
  const nuvem = useNegociosFirestore(nuvemAtiva);
  // `categoria` (RLMC 1-5) NUNCA é confiada tal como vem gravada — é sempre recalculada
  // aqui, no único sítio de saída de useNegocios, a partir de natureza+categoriaObjetivo
  // (decisão explícita do utilizador, 2026-09-20, depois de um caso real — "Cliente B
  // Metalurgica Francos Lda", Refidelização+SS — ter ficado sem categoria RLMC nenhuma
  // porque o Firestore devolve o campo tal como foi gravado, nunca recalculado, e este
  // negócio tinha sido gravado ANTES da correção de calcularCategoriaNegocio existir).
  // Auto-curativo: corrige negócios antigos já gravados com um valor errado/em falta
  // sem precisar de nenhuma migração manual, e protege contra o mesmo problema
  // acontecer outra vez no futuro se a fórmula voltar a mudar. O campo `categoria`
  // continua também a ser gravado no documento (Firestore/Excel) por legibilidade,
  // mas nunca é essa cópia gravada que conta — só esta, recalculada na leitura.
  const negociosFinal = useMemo(
    () => (nuvemAtiva ? nuvem.itens : negocios).map((n) => ({ ...n, categoria: calcularCategoriaNegocio(n.natureza, n.categoriaObjetivo, n.produtoSS) })),
    [nuvemAtiva, nuvem.itens, negocios]
  );

  // Migração única (nunca automática) — copia o snapshot local ATUAL (Excel/
  // arquivo) para o Firestore, um documento por negócio; nunca apaga nada
  // localmente/no Excel. `enriquecer` opcional (usado por NegociosView para juntar a
  // flag "Campanha", que até à migração vive à parte em useNegociosCampanha — depois
  // da migração passa a viver diretamente no documento, ver campanhaDoNegocio).
  const [aMigrar, setAMigrar] = useState(false);
  const migrarParaNuvem = async (enriquecer) => {
    if (!firebaseUser || nuvemAtiva) return { ok: false };
    setAMigrar(true);
    const atuais = negocios;
    for (const n of atuais) await nuvem.definir(enriquecer ? enriquecer(n) : n);
    await marcarMigrado();
    setAMigrar(false);
    return { ok: true, n: atuais.length };
  };

  // Passo 2 do refactor (2026-09-19) — escrita (Excel OU nuvem) fica só aqui, nunca em
  // NegociosView. A view só chama estas 2 funções e recebe o mesmo tipo de resultado
  // nos dois casos (nº de linha/id truthy em sucesso, `false` em falha) — nunca sabe
  // nem se importa se o destino foi o Excel ou o Firestore. Antes deste passo, esta
  // decisão (if(nuvemAtiva){...}else{...}) estava duplicada em 3 sítios dentro da
  // view (guardar, apagar, aplicar sugestão de NIF) — um erro ao mudar um deles sem
  // mudar os outros já tinha acontecido uma vez (ver histórico de "Campanha").
  const handleProjeto = ligacaoPasta.pronto ? ligacaoPasta.handle : null;
  const escreverNegocio = async (negocio) => {
    if (nuvemAtiva) {
      // Sem Excel a atribuir um nº de linha — negócio novo recebe um id sintético
      // (só precisa de ser único, nunca mais interpretado como posição numa folha).
      const linhaUsada = negocio.linhaExcel || Date.now();
      try {
        await nuvem.definir({ ...negocio, linhaExcel: linhaUsada });
        return linhaUsada;
      } catch (e) {
        // Bug real reportado por Augusto (2026-09-20): um catch vazio aqui escondia
        // qualquer falha de escrita real (permissões, rede) sem deixar rasto nenhum
        // na consola — mesmo pedido explícito de investigar "erro na consola mesmo
        // que a UI não mostre nada" ficava impossível de cumprir. Nunca mais engolir
        // o erro em silêncio.
        console.error("Não foi possível escrever o negócio no Firestore:", e);
        return false;
      }
    }
    const linhaUsada = await gravarNegocioNoExcel(negocio, negocio.linhaExcel, handleProjeto);
    // Relê o Excel inteiro em vez de só corrigir o registo em memória (decisão
    // explícita do utilizador, 2026-09-XX) — a tabela ficava só atualizada depois de
    // clicar manualmente em "Atualizar". Na nuvem isto é desnecessário — o onSnapshot
    // de useNegociosFirestore já atualiza a lista sozinho assim que o Firestore
    // confirma a escrita.
    if (linhaUsada) await recarregar();
    return linhaUsada;
  };
  const apagarNegocioDaFonte = async (linhaExcel) => {
    const ok = nuvemAtiva
      ? await nuvem.remover(linhaExcel).then(() => true).catch((e) => { console.error("Não foi possível apagar o negócio no Firestore:", e); return false; })
      : await removerNegocioDoExcel(linhaExcel, handleProjeto);
    if (ok && !nuvemAtiva) await recarregar();
    return ok;
  };

  return {
    negocios: negociosFinal, fonte, aCarregar: nuvemAtiva ? nuvem.aCarregar : aCarregar,
    precisaPermissao: ligacao.precisaPermissao, continuar, ligar, recarregar, ligacaoPasta, wbAtual,
    firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar: negocios.length,
    escreverNegocio, apagarNegocioDaFonte,
  };
}

// Sugestão simples (regras, não IA): cruza o que o cliente disse ter noutra operadora
// (ou os serviços Vodafone que já tem ativos) com as categorias do catálogo, para
// pré-marcar categorias plausíveis a propor. É só um ponto de partida — o Augusto ajusta.
function sugerirCategorias(analise, clienteAtual) {
  const sugestoes = new Set();
  const servicos = (analise && analise.servicosAtuais) || [];
  if (servicos.includes("Móvel")) sugestoes.add("voz");
  if (servicos.includes("Fixo") || servicos.includes("Internet")) { sugestoes.add("pacotes"); sugestoes.add("internet"); }
  if (servicos.includes("TV")) sugestoes.add("digital");
  if (servicos.includes("IoT")) sugestoes.add("iot");
  if (servicos.includes("Segurança")) sugestoes.add("seguranca");
  if (servicos.includes("Cloud")) sugestoes.add("cloud");
  // Se já é cliente Vodafone, sugere reforçar/refidelizar as áreas onde já tem serviço ativo
  if (clienteAtual && clienteAtual.origem !== "prospect" && clienteAtual.v) {
    if (clienteAtual.v[0] > 0) sugestoes.add("voz");
    if (clienteAtual.f && clienteAtual.f[0] > 0) sugestoes.add("pacotes");
    if (clienteAtual.i > 0) sugestoes.add("iot");
  }
  // Áreas que o cliente não mencionou ter em lado nenhum — oportunidade de upsell
  if (!servicos.includes("Segurança")) sugestoes.add("seguranca");
  if (!servicos.includes("Cloud")) sugestoes.add("cloud");
  return [...sugestoes];
}
