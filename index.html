  .p-ok{background:var(--ok-soft);color:var(--ok)} .p-alto{background:var(--warn-soft);color:var(--warn)}
  .p-out{background:var(--bad);color:#fff} .p-na{background:#eef0f3;color:var(--muted)}
  .bar{height:6px;background:#edeff2;border-radius:99px;overflow:hidden;width:100px;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .bar i.alto{background:var(--warn)} .bar i.out{background:var(--bad)}
  .pct{font-size:11px;color:var(--muted);margin-left:7px}
  .alerta{background:linear-gradient(135deg,#1d2128,#23272f);color:#e8eaee;border-radius:16px;padding:20px 22px;margin-top:14px;font-size:13.4px;line-height:1.7;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .alerta::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vf)}
  .alerta b{color:#ff7a7a}
  .alerta .tt{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9aa1ab;margin-bottom:6px}
  .foot{margin-top:30px;color:var(--muted);font-size:11.6px;line-height:1.8;border-top:1px solid var(--line);padding-top:16px}
  .btnprint{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(16,24,40,.3);transition:.15s}
  .btnprint:hover{background:var(--vf)}
  .hidden{display:none}
  @media print{.btnprint,.tabs{display:none}.hidden{display:block!important}.scroll{max-height:none}}`;

  const tabsHtml = [`<button data-v="geral" class="on">Visão geral</button>`]
    .concat(contasInfo.map((c) => `<button data-v="c${c.idDom}">${escaparHtml(c.rotulo)} · ${escaparHtml(c.conta)}</button>`))
    .join("\n    ");

  const kpiDeltaComunicacoes = kpis.comunicacoesRecente !== null && kpis.comunicacoesAnterior
    ? Number((((kpis.comunicacoesRecente - kpis.comunicacoesAnterior) / kpis.comunicacoesAnterior) * 100).toFixed(0))
    : null;

  const insightsHtml = kpis.insights.map((i) => `
      <div class="ins ${i.tipo}"><div class="n">${escaparHtml(i.rotulo)}</div><div class="v">${escaparHtml(i.valor)}</div><div class="t">${escaparHtml(i.texto)}</div></div>`).join("");

  const contratosCardsHtml = contasInfo.map((c) => {
    const fids = c.linhasRecentes.map((l) => l.fidelizacao).filter(Boolean).flatMap((f) => f.split("; "));
    const contagem = new Map();
    fids.forEach((f) => { const d = (f.match(/\d{2}-\d{2}-\d{4}/) || [])[0]; if (d) contagem.set(d, (contagem.get(d) || 0) + 1); });
    const linhasTexto = [...contagem.entries()].sort((a, b) => b[1] - a[1])
      .map(([data, n]) => `<b>${escaparHtml(data)}</b> — ${n} acesso${n === 1 ? "" : "s"}`).join("<br>\n          ");
    return `
      <div class="card">
        <h3>Contratos · ${escaparHtml(c.rotulo)}</h3>
        <div class="sub">Janela de fidelização — ${c.linhasRecentes.length} acesso(s)</div>
        <div style="font-size:13px;line-height:1.9">
          ${linhasTexto || '<span style="color:var(--muted)">Sem datas de fidelização identificadas na fatura.</span>'}
        </div>
      </div>`;
  }).join("");

  const seccaoContaHtml = contasInfo.map((c) => {
    const evolucao = c.periodos.map((p) => ({ label: p.label, total: p.rubricas.totais ? p.rubricas.totais.total : null }));
    const temTrafego = c.dist.some((d) => d.escalao !== "Sem registo na fatura" && d.n > 0);
    return `
  <div id="v-c${c.idDom}" class="hidden">
    <div class="kpis">
      <div class="card kpi accent"><div class="lbl">Fatura mais recente</div><div class="val">${c.periodoRecente && c.periodoRecente.rubricas.totais ? formatEuro(c.periodoRecente.rubricas.totais.total) : "—"}</div><div class="delta">${escaparHtml(c.periodoRecente ? c.periodoRecente.label : "")}</div></div>
      <div class="card kpi"><div class="lbl">Mensalidades</div><div class="val">${c.periodoRecente && c.periodoRecente.rubricas.totais ? formatEuro(c.periodoRecente.rubricas.totais.mensalidade) : "—"}</div><div class="delta">${c.linhasRecentes.length} acesso(s)</div></div>
      <div class="card kpi"><div class="lbl">Custo médio / acesso</div><div class="val">${c.linhasRecentes.length ? formatEuro((c.periodoRecente.rubricas.totais.total / c.linhasRecentes.length)) : "—"}</div><div class="delta">no mês mais recente</div></div>
    </div>
    ${temTrafego ? `
    <div class="grid g2">
      <div class="card">
        <h3>Top consumidores</h3>
        <div class="sub">Consumo de dados no mês mais recente</div>
        <div class="chartbox t"><canvas id="gTop${c.idDom}"></canvas></div>
      </div>
      <div class="card">
        <h3>Distribuição do tráfego</h3>
        <div class="sub">Por escalão de utilização de dados</div>
        <div class="chartbox"><canvas id="gDist${c.idDom}"></canvas></div>
      </div>
    </div>` : ""}
    <div class="card" style="margin-top:14px">
      <h3>Evolução mensal — Conta ${escaparHtml(c.conta)}</h3>
      <div class="sub">Sem IVA</div>
      <div class="chartbox"><canvas id="gEvo${c.idDom}"></canvas></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>Detalhe por acesso</h3>
      <div class="sub">"—" quando a fatura não detalha consumo no bloco · ordenar clicando no cabeçalho</div>
      <div class="toolbar">
        <input id="fNum${c.idDom}" placeholder="Pesquisar número…">
        <select id="fEst${c.idDom}"><option value="">Todos os estados</option><option>OK</option><option>Alto</option><option>Esgotado</option><option value="—">—</option></select>
      </div>
      <div class="scroll">
      <table id="tNums${c.idDom}">
        <thead><tr>
          <th data-k="numero">Número</th><th data-k="tarifario">Tarifário</th><th data-k="plafond">Plafond</th>
          <th data-k="utilizado">Utilizado</th><th data-k="pct">Uso</th><th data-k="estado">Estado</th><th data-k="mensalidade" style="text-align:right">€/mês</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>
  </div>`;
  }).join("\n");

  const dadosParaScript = {
    totalPorMes: kpis.totalPorMes,
    contas: contasInfo.map((c) => ({
      idDom: c.idDom, conta: c.conta,
      evolucao: c.periodos.map((p) => ({ label: p.label, total: p.rubricas.totais ? p.rubricas.totais.total : null })),
      top10: c.top10, dist: c.dist, detalhe: c.detalhe,
    })),
  };

  return `<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${nomeUpper} · Painel de Comunicações</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"><\/script>
<style>${CSS}</style>
</head>
<body>
<header>
  <div class="h-in">
    <div>
      <div class="h-badge"><i></i>Vodafone Business · Análise de Cliente</div>
      <h1><em>${nomeUpper}</em></h1>
      <div class="h-sub">Painel de Comunicações · ${contasInfo.map((c) => `Conta <b>${escaparHtml(c.conta)}</b> (${escaparHtml(c.rotulo)})`).join(" e ")} · ${escaparHtml(periodoTexto)} · valores <b>sem IVA</b></div>
    </div>
    <div class="h-meta">
      <div class="big">${totalLinhasAtivas} <small>acessos ativos</small></div>
      Elaborado por Augusto Graça · ${dataAnalise.toLocaleDateString("pt-PT", { month: "short", year: "numeric" })}
    </div>
  </div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs">
    ${tabsHtml}
  </div>

  <div id="v-geral">
    ${avisosLista.length ? `<div class="alerta"><div class="tt">A confirmar</div>${avisosLista.map((a) => `⚠ ${escaparHtml(a)}`).join("<br>\n      ")}</div>` : ""}
    <div class="kpis">
      <div class="card kpi accent"><div class="lbl">Gasto mensal · ${escaparHtml(kpis.mesRecenteLabel || "")}</div><div class="val">${kpis.gastoMesRecente !== null ? formatEuro(kpis.gastoMesRecente) : "—"}</div><div class="delta">${contasInfo.map((c) => `${escaparHtml(c.rotulo)} <b>${c.periodoRecente && c.periodoRecente.rubricas.totais ? formatEuro(c.periodoRecente.rubricas.totais.total) : "—"}</b>`).join(" + ")}</div></div>
      <div class="card kpi"><div class="lbl">Média mensal · ${kpis.totalPorMes.length} mês(es)</div><div class="val">${kpis.mediaMensal !== null ? formatEuro(kpis.mediaMensal) : "—"}</div></div>
      <div class="card kpi"><div class="lbl">Custo médio / acesso</div><div class="val">${kpis.custoPorLinha !== null ? formatEuro(kpis.custoPorLinha) : "—"}</div><div class="delta">${kpis.nLinhasRecente} acessos ativos</div></div>
      <div class="card kpi"><div class="lbl">Custo fixo mensal</div><div class="val">${kpis.custoFixoPercent !== null ? kpis.custoFixoPercent + "%" : "—"}</div><div class="delta">mensalidades + suplementares, antes de descontos</div></div>
      ${kpis.comunicacoesRecente !== null ? `<div class="card kpi"><div class="lbl">Dados nacionais · ${escaparHtml(kpis.mesRecenteLabel || "")}</div><div class="val" style="color:var(--bad)">${formatEuro(kpis.comunicacoesRecente)}</div>${kpiDeltaComunicacoes !== null ? `<div class="delta ${kpiDeltaComunicacoes >= 0 ? "d-bad" : "d-ok"}"><b>${kpiDeltaComunicacoes >= 0 ? "▲" : "▼"} ${Math.abs(kpiDeltaComunicacoes)}%</b> vs mês anterior</div>` : ""}</div>` : ""}
    </div>

    ${kpis.insights.length ? `<div class="insights">${insightsHtml}
    </div>` : ""}

    <div class="card" style="margin-top:14px">
      <h3>Evolução mensal do gasto</h3>
      <div class="sub">Sem IVA · total entre todas as contas</div>
      <div class="chartbox t"><canvas id="gEvo"></canvas></div>
    </div>

    <div class="grid g2e" style="margin-top:14px">
      ${contratosCardsHtml}
    </div>
  </div>
${seccaoContaHtml}
  <div class="foot">
    <b>Fonte:</b> faturas Vodafone ${contasInfo.map((c) => `da conta ${escaparHtml(c.conta)}`).join(" e ")}, extraídas e verificadas pelo motor de análise do dashboard (reconciliação automática de totais) ·
    <b>valores sem IVA</b> salvo indicação · "—" = sem detalhe na fatura · elaborado por <b>Augusto Graça</b>, Vodafone Business · ${dataAnalise.toLocaleDateString("pt-PT")}.
  </div>
</div>
<button class="btnprint" onclick="window.print()">Imprimir / PDF</button>
<script>
// Este botão fica escondido quando o painel é mostrado dentro do dashboard (iframe da
// vista "Análise de Faturas", que já tem o seu próprio "🖨️ Imprimir/PDF e HTML" na barra
// de ações, também responsável por gravar o ficheiro — 2 botões a fazer o mesmo seria
// confuso). Continua visível quando este ficheiro .html exportado é aberto sozinho, fora
// do dashboard, sem nenhuma barra de ações disponível — decisão explícita do utilizador,
// 2026-09-17. window.self !== window.top é o sinal técnico "estou dentro de um iframe",
// nunca uma flag passada à parte — evita 2 versões da mesma função geradora.
if (window.self !== window.top) { const bp = document.querySelector(".btnprint"); if (bp) bp.style.display = "none"; }
const DADOS = ${JSON.stringify(dadosParaScript)};
const el = (id) => document.getElementById(id);
const eur = (v) => (v === null || v === undefined) ? "—" : v.toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
Chart.defaults.font.family = '-apple-system,"Segoe UI",Roboto,sans-serif';
Chart.defaults.color = '#69707a';
Chart.defaults.plugins.tooltip.backgroundColor = '#101317';
Chart.defaults.plugins.tooltip.padding = 10;
Chart.defaults.plugins.tooltip.cornerRadius = 8;
const base = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false } };
const money = { callback: (v) => v.toLocaleString("pt-PT") + " €" };
const CORES = ["#e60000", "#0057b8", "#0d8a4f", "#b97700", "#98a0aa"];

new Chart(el("gEvo"), { type: "line", data: { labels: DADOS.totalPorMes.map(m => m.label), datasets: [
  { label: "Total (todas as contas)", data: DADOS.totalPorMes.map(m => m.valor), borderColor: "#101317", backgroundColor: "rgba(16,19,23,.06)", fill: true, tension: .35, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5 }] },
  options: { ...base, plugins: { tooltip: { callbacks: { label: c => eur(c.parsed.y) } } },
  scales: { y: { ticks: money, grid: { color: "#eef0f3" }, border: { display: false } }, x: { grid: { display: false }, border: { display: false } } } } });

function donut(id, labels, vals, cores) {
  if (!vals.some(v => v > 0)) return;
  new Chart(el(id), { type: "doughnut", data: { labels, datasets: [{ data: vals, backgroundColor: cores, borderWidth: 3, borderColor: "#fff", hoverOffset: 8 }] },
    options: { ...base, cutout: "64%", plugins: { legend: { position: "bottom", labels: { usePointStyle: true, padding: 14, pointStyleWidth: 10 } }, tooltip: { callbacks: { label: c => c.label + ": " + c.parsed } } } } });
}

DADOS.contas.forEach((c, i) => {
  if (el("gEvo" + c.idDom)) {
    new Chart(el("gEvo" + c.idDom), { type: "line", data: { labels: c.evolucao.map(m => m.label), datasets: [
      { label: "Fatura (s/IVA)", data: c.evolucao.map(m => m.total), borderColor: CORES[i % CORES.length], backgroundColor: CORES[i % CORES.length] + "12", fill: true, tension: .35, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5 }] },
      options: { ...base, plugins: { tooltip: { callbacks: { label: c2 => eur(c2.parsed.y) } } },
      scales: { y: { ticks: money, grid: { color: "#eef0f3" }, border: { display: false } }, x: { grid: { display: false }, border: { display: false } } } } });
  }
  if (el("gTop" + c.idDom) && c.top10.length) {
    new Chart(el("gTop" + c.idDom), { type: "bar", data: { labels: c.top10.map(t => t.numero),
      datasets: [{ label: "GB usados", data: c.top10.map(t => t.gb), backgroundColor: c.top10.map(t => t.esgotado ? "#e60000" : "#c9dcf1"), borderRadius: 6, maxBarThickness: 26 }] },
      options: { ...base, indexAxis: "y", plugins: { legend: { display: false }, tooltip: { callbacks: { label: c2 => c2.parsed.x + " GB" } } },
      scales: { x: { ticks: { callback: v => v + " GB" }, grid: { color: "#eef0f3" }, border: { display: false } }, y: { grid: { display: false }, border: { display: false } } } } });
  }
  if (el("gDist" + c.idDom)) {
    donut("gDist" + c.idDom, c.dist.map(d => d.escalao), c.dist.map(d => d.n), ["#e60000", "#f0a3a3", "#c9dcf1", "#e3e6ea"]);
  }

  const tb = el("tNums" + c.idDom) ? document.querySelector("#tNums" + c.idDom + " tbody") : null;
  if (tb) {
    const fNum = el("fNum" + c.idDom), fEst = el("fEst" + c.idDom);
    let ord = { k: "numero", asc: true };
    const pill = (e) => e === "Esgotado" ? '<span class="pill p-out">Esgotado</span>' : e === "Alto" ? '<span class="pill p-alto">Alto</span>' : e === "OK" ? '<span class="pill p-ok">OK</span>' : '<span class="pill p-na">—</span>';
    const barra = (p) => p == null ? "" : \`<span class="bar"><i class="\${p >= 100 ? "out" : (p >= 80 ? "alto" : "")}" style="width:\${Math.min(100, p)}%"></i></span><span class="pct">\${p}%</span>\`;
    function render() {
      const q = (fNum.value || "").replace(/\\D/g, "");
      const linhas = c.detalhe.filter((r) => (!q || r.numero.includes(q)) && (!fEst.value || r.estado === fEst.value));
      const F = { numero: r => r.numero, tarifario: r => r.tarifario, plafond: r => r.plafond, utilizado: r => r.utilizado, pct: r => r.pct == null ? -1 : r.pct, estado: r => ({ Esgotado: 3, Alto: 2, OK: 1, "—": 0 }[r.estado]), mensalidade: r => r.mensalidade };
      linhas.sort((a, b) => { const va = F[ord.k](a), vb = F[ord.k](b); return (va > vb ? 1 : va < vb ? -1 : 0) * (ord.asc ? 1 : -1); });
      tb.innerHTML = linhas.map(r => \`<tr><td class="num">\${r.numero}</td><td>\${r.tarifario}</td><td>\${r.plafond}</td><td>\${r.utilizado}</td><td>\${barra(r.pct)}</td><td>\${pill(r.estado)}</td><td style="text-align:right">\${eur(r.mensalidade)}</td></tr>\`).join("")
        || '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Sem resultados</td></tr>';
    }
    [fNum, fEst].forEach((x) => x.addEventListener("input", render));
    document.querySelectorAll("#tNums" + c.idDom + " th").forEach((th) => th.addEventListener("click", () => {
      const k = th.dataset.k; ord = { k, asc: ord.k === k ? !ord.asc : true }; render();
    }));
    render();
  }
});

const vistas = { geral: "v-geral" };
DADOS.contas.forEach((c) => { vistas["c" + c.idDom] = "v-c" + c.idDom; });
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  Object.values(vistas).forEach((id) => el(id).classList.add("hidden"));
  el(vistas[b.dataset.v]).classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}));
<\/script>
</body>
</html>
`;
}

// Descreve a evolução do valor da fatura entre o mês mais recente e o anterior, em
// prosa interpretada (nunca só o número) — usado por gerarEmailAnaliseFaturas.
// Limiar de 3% para "estável" (evita dizer "subiu" por uma flutuação irrelevante de
// poucos cêntimos percentuais).
function descreverEvolucaoValor(totalPorMes) {
  const atual = totalPorMes[totalPorMes.length - 1].valor;
  const anterior = totalPorMes[totalPorMes.length - 2].valor;
  const diffPercent = anterior ? Math.round(((atual - anterior) / anterior) * 100) : null;
  if (diffPercent === null || Math.abs(diffPercent) < 3) return "mantendo-se estável face ao mês anterior";
  return diffPercent > 0
    ? `um aumento de cerca de ${diffPercent}% face ao mês anterior (${formatEuro(anterior)})`
    : `uma redução de cerca de ${Math.abs(diffPercent)}% face ao mês anterior (${formatEuro(anterior)})`;
}

// Email de análise mensal para o cliente (2026-09-25, pedido explícito do utilizador,
// Item 4; reescrito 2026-09-26 — a 1ª versão só enumerava números com tom robotizado,
// sem interpretar nem comparar meses quando havia mais do que um analisado). CLIENT-
// FACING, ao contrário de gerarArgumentosReuniao (notas internas para Augusto, nunca
// enviadas ao cliente). Tom de referência: exemplo real de email de Augusto — saudação
// pelo primeiro nome, frase de abertura breve, foco no que interessa ao cliente
// (interpretação, não enumeração de dados brutos). `nomeContacto` é opcional (ver
// EXTRA_FIELDS "Contacto principal" em Clientes) — sem ele, cai para uma saudação
// genérica em vez de inventar um nome. Mesmas regras de tom já estabelecidas para texto
// client-facing na skill "proposta-vodafone-business" (passo 4b): PT-PT, direto,
// profissional, nunca jargão técnico/interno ("reconciliado", "esgotado plafond", etc.)
// — tudo derivado dos dados já calculados por calcularKpisEInsights, nunca inventado.
// Devolve {assunto, corpo} — nunca envia sozinho, só prepara texto para Augusto rever e
// copiar (decisão explícita: nunca integração automática de envio nesta 1ª versão).
function gerarEmailAnaliseFaturas(nomeCliente, contas, dataAnalise, nomeContacto) {
  const kpis = calcularKpisEInsights(contas);
  const mesLabel = kpis.mesRecenteLabel || dataAnalise.toLocaleDateString("pt-PT", { month: "long", year: "numeric" });
  const assunto = `Análise Vodafone Business — ${nomeCliente} (${mesLabel})`;
  const primeiroNome = nomeContacto ? nomeContacto.trim().split(/\s+/)[0] : "";

  const linhas = [];
  linhas.push(primeiroNome ? `Bom dia ${primeiroNome},` : "Bom dia,", "");
  linhas.push(`Espero que se encontre bem. Segue a análise às comunicações Vodafone Business de ${nomeCliente}, referente a ${mesLabel}.`, "");

  if (kpis.gastoMesRecente !== null) {
    let frase = `A fatura mais recente ficou em ${formatEuro(kpis.gastoMesRecente)} (sem IVA)`;
    if (kpis.totalPorMes.length > 1) frase += `, ${descreverEvolucaoValor(kpis.totalPorMes)}`;
    linhas.push(frase + ".");
  }
  if (kpis.totalPorMes.length > 2 && kpis.mediaMensal !== null) {
    linhas.push(`Ao longo dos últimos ${kpis.totalPorMes.length} meses analisados, o valor médio mensal tem sido ${formatEuro(kpis.mediaMensal)}.`);
  }
  if (kpis.custoVariavelPercent === 0) {
    linhas.push("A totalidade do valor corresponde a mensalidades e serviços fixos, sem consumos extra.");
  } else if (kpis.custoVariavelPercent !== null) {
    linhas.push(`Cerca de ${kpis.custoVariavelPercent}% corresponde a consumo variável/extra, fora da mensalidade base — o restante (${kpis.custoFixoPercent}%) é fixo.`);
  }
  linhas.push("");

  const acessosEsgotados = kpis.insights.find((i) => i.rotulo === "Atenção");
  if (acessosEsgotados) {
    linhas.push(`Identificámos ${acessosEsgotados.valor} que atingiram o limite de dados incluído no último mês — se fizer sentido, posso rever convosco se o plano atual continua adequado à utilização real.`, "");
  }
  linhas.push("Fico disponível para esclarecer qualquer dúvida sobre esta análise, ou para agendar uma chamada.", "");
  linhas.push("Com os melhores cumprimentos,", "Augusto Graça", "Vodafone Business");

  return { assunto, corpo: linhas.join("\n") };
}

// Argumentos de reunião — ficheiro Markdown SEPARADO do HTML (decisão explícita do
// utilizador, tal como no exemplo Cliente C), com os pontos mais acionáveis para a
// conversa com o cliente. Só afirma o que os dados já confirmam — nunca uma
// recomendação de produto/tarifário (isso é trabalho da skill de propostas, não desta
// análise).
function gerarArgumentosReuniao(nomeCliente, contas, dataAnalise) {
  const kpis = calcularKpisEInsights(contas);
  const linhas = [];
  linhas.push(`# Argumentos de reunião — ${nomeCliente}`, "");
  linhas.push(`**Data da análise:** ${dataAnalise.toLocaleDateString("pt-PT")} · **Elaborado por:** Augusto Graça, Vodafone Business`, "");
  linhas.push("## Números-chave", "");
  if (kpis.gastoMesRecente !== null) linhas.push(`- Gasto do mês mais recente (${kpis.mesRecenteLabel}): **${formatEuro(kpis.gastoMesRecente)}** sem IVA.`);
  if (kpis.mediaMensal !== null) linhas.push(`- Média mensal (${kpis.totalPorMes.length} mês(es) analisados): **${formatEuro(kpis.mediaMensal)}**.`);
  if (kpis.custoFixoPercent !== null) linhas.push(`- **${kpis.custoFixoPercent}%** do custo é fixo (mensalidades + suplementares) — o resto varia com o consumo.`);
  linhas.push(`- **${kpis.nLinhasRecente}** acessos ativos no mês mais recente.`, "");

  if (kpis.insights.length) {
    linhas.push("## Pontos de atenção", "");
    kpis.insights.forEach((i) => linhas.push(`- **${i.rotulo}** (${i.valor}) — ${i.texto}.`));
    linhas.push("");
  }

  contas.forEach((c) => {
    const periodoRecente = c.periodos[c.periodos.length - 1];
    const linhasRecentes = (periodoRecente && periodoRecente.linhas) || [];
    const detalhe = calcularDetalhePorAcesso(linhasRecentes);
    const esgotados = detalhe.filter((d) => d.estado === "Esgotado");
    linhas.push(`## Conta ${c.conta}`, "");
    if (periodoRecente && periodoRecente.rubricas.totais) {
      linhas.push(`- Fatura mais recente (${periodoRecente.label}): **${formatEuro(periodoRecente.rubricas.totais.total)}** sem IVA, ${linhasRecentes.length} acesso(s).`);
    }
    if (esgotados.length) {
      linhas.push(`- **${esgotados.length} acesso(s) esgotaram o plafond de dados** no mês mais recente: ${esgotados.map((d) => d.numero).join(", ")}.`);
    }
    if (!periodoRecente || !periodoRecente.reconciliacao || periodoRecente.reconciliacao.confirmado) {
      linhas.push(`- Valores reconciliados matematicamente, sem divergências.`);
    } else {
      linhas.push(`- ⚠ Há valores desta conta que não reconciliaram automaticamente — confirmar manualmente antes da reunião (ver o painel HTML, coluna de estado).`);
    }
    linhas.push("");
  });

  linhas.push("## Notas de rigor", "");
  linhas.push('- "—" nas tabelas do painel significa que a fatura não detalha esse valor — nunca foi suposto ou estimado.');
  linhas.push("- Todos os totais apresentados foram cruzados automaticamente contra a tabela agregada da própria fatura antes de entrarem neste documento.");
  return linhas.join("\n");
}

// Categoriza um serviço pelo nome do tarifário — heurística simples por palavras-
// chave, não IA. Usada só para agrupar o resumo visual do dashboard; os dados
// completos por linha (Excel) não dependem desta categorização.
function categorizarServico(tarifario) {
  if (!tarifario) return "Não identificado";
  const t = tarifario.toLowerCase();
  if (/iot|m2m|ict|cloud|datacenter|servidor/.test(t)) return "IoT / ICT";
  if (/net|fixo|e-fax|onenet/.test(t)) return "Fixo";
  return "Móvel";
}

// Dentro da categoria Fixo, distingue Voz de Internet/Dados pelo nome do tarifário
// — só faz sentido dentro de Fixo (pedido explícito do utilizador); Móvel/IoT não
// têm esta distinção aplicada, para não inventar uma categorização sem sinal claro.
function tipoServicoFixo(tarifario) {
  const t = (tarifario || "").toLowerCase();
  if (/mbps|internet|fibra|adsl/.test(t)) return "Internet";
  if (/voz|fixo|onenet|telefone|e-fax/.test(t)) return "Voz";
  return null;
}

// Ponto de entrada único chamado pelo dashboard: tenta primeiro a secção "Detalhes
// dos serviços" (uma linha por Nº/Serviço real); se a fatura não tiver essa secção,
// recorre à tabela "Detalhes da fatura" (uma linha por categoria/quantidade).
function analisarLinhasFinanceiras(texto, nomeFicheiro) {
  const periodo = extrairPeriodoFatura(texto);
  const porServico = analisarLinhasFinanceirasPorServico(texto, nomeFicheiro);
  const linhas = porServico || analisarLinhasFinanceirasPorCategoria(texto, nomeFicheiro);
  return linhas.map((l) => ({ ...l, periodo }));
}

function sanitizarNomePasta(nome) {
  return String(nome).replace(/[\\/:*?"<>|]/g, "").trim();
}

// Grava uma cópia do documento em 03_Analise Faturas/{cliente}/Faturas/, dentro da própria pasta
// do projeto Dashboard Vodafone Business. Decisão explícita (2026-09-05): já não se
// grava em Vodafone Clientes/Clientes/ — essa pasta externa é de um projeto anterior
// e vai ser eliminada; o objetivo é o dashboard tornar-se autossuficiente.
// Decisão explícita (2026-09-11): os anexos ficam em Faturas e os ficheiros gerados
// pela análise ficam separados em Analise, ambos dentro da pasta do cliente.
// Best-effort: se a pasta não estiver ligada, simplesmente não faz nada — a cópia
// em IndexedDB (guardarFaturaAnexada) continua a ser a fonte fiável dentro do dashboard.
async function guardarPdfNaPastaCliente(handleProjeto, nomeCliente, file) {
  try {
    const pastaPropostas = await handleProjeto.getDirectoryHandle("03_Analise Faturas", { create: true });
    const pastaCliente = await pastaPropostas.getDirectoryHandle(sanitizarNomePasta(nomeCliente), { create: true });
    const pastaFaturas = await pastaCliente.getDirectoryHandle("Faturas", { create: true });
    const fileHandle = await pastaFaturas.getFileHandle(file.name, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    return true;
  } catch (e) {
    console.warn("Não foi possível gravar o documento na pasta do projeto:", e.message);
    return false;
  }
}

function euro(v) {
  const n = Number(v);
  return isNaN(n) ? "" : `€ ${n.toFixed(2)}`;
}

// Lê um ficheiro JSON de dados-privados/, dentro da pasta do projeto. Devolve null se
// a pasta não estiver ligada, se o ficheiro ainda não existir, ou se não for JSON
// válido — nunca lança, para nunca bloquear a app. dados-privados/ está no .gitignore
// (decisão explícita 2026-09-08): sincroniza só via iCloud Drive entre Macs, nunca
// vai para o git/GitHub — é onde vivem "Assuntos em Progresso" e o snapshot de
// "Negócios do Trimestre" (dados sensíveis, pessoais ou de comissões).
async function lerJsonDadosPrivados(handleProjeto, nomeFicheiro) {
  if (!handleProjeto) return null;
  try {
    const pasta = await handleProjeto.getDirectoryHandle("dados-privados", { create: true });
    const fileHandle = await pasta.getFileHandle(nomeFicheiro);
    const file = await fileHandle.getFile();
    return JSON.parse(await file.text());
  } catch (e) {
    return null;
  }
}

// Grava um ficheiro JSON em dados-privados/. Best-effort — se a pasta não estiver
// ligada ou a escrita falhar por algum motivo, não bloqueia o resto da app (devolve
// false em vez de lançar).
async function guardarJsonDadosPrivados(handleProjeto, nomeFicheiro, dados) {
  if (!handleProjeto) return false;
  try {
    const pasta = await handleProjeto.getDirectoryHandle("dados-privados", { create: true });
    const fileHandle = await pasta.getFileHandle(nomeFicheiro, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(dados, null, 2));
    await writable.close();
    return true;
  } catch (e) {
    console.warn(`Não foi possível gravar ${nomeFicheiro} em dados-privados/:`, e.message);
    return false;
  }
}

// Remove um ficheiro JSON de dados-privados/ — usado para invalidar uma análise gravada
// (Fase E) quando as faturas de origem deixam de estar anexadas (ver "limpar faturas
// após exportar" em AnaliseFaturasView). Best-effort, tal como guardarJsonDadosPrivados:
// sem pasta ligada, ou ficheiro já inexistente (getDirectoryHandle/removeEntry lançam
// NotFoundError), não é um erro — já está no estado desejado.
async function removerJsonDadosPrivados(handleProjeto, nomeFicheiro) {
  if (!handleProjeto) return;
  try {
    const pasta = await handleProjeto.getDirectoryHandle("dados-privados", { create: false });
    await pasta.removeEntry(nomeFicheiro);
  } catch (e) {}
}

// Fase E — persistência do resumo da "Análise de Faturas" (REQUISITOS_ANALISE_FATURAS.md,
// ponto F: "guardar o resultado ... para não recalcular"). Um ficheiro por cliente, nome
// sanitizado como já se faz para pastas (sanitizarNomePasta) — nunca pelo NIF, para o
// ficheiro ficar legível a olho dentro de dados-privados/.
function nomeFicheiroAnaliseFaturas(nomeCliente) {
  return `${sanitizarNomePasta(nomeCliente)}-analise-faturas.json`;
}

// Controlo de versão da cache de análise — decisão explícita do utilizador (2026-09-17),
// depois de o caso real Cliente A mostrar uma análise gravada ANTES da correção da
// tolerância de IVA em reconciliarRubricas continuar a aparecer como válida ao reabrir o
// separador (a cache nunca se autoinvalida sozinha ao mudar o código). "2" porque a
// versão implícita anterior a este controlo conta como "1" — qualquer ficheiro gravado
// antes de existir este campo (ou sem o campo) é tratado como desatualizado.
// IMPORTANTE para quem mexer no motor de análise no futuro: incrementar este número
// sempre que reconciliarRubricas/extrairRubricasAgregadas/agruparPorContaEMes mudarem de
// forma que afete o resultado (não é preciso para mudanças só de apresentação, ex.
// gerarHtmlAnaliseFaturas) — sem isso, análises antigas ficam mostradas como válidas
// mesmo depois de a lógica que as gerou já não existir.
const VERSAO_LOGICA_ANALISE_FATURAS = 2;

// Agrega as linhas extraídas por Nº/Serviço INDIVIDUAL (uma linha por serviço real,
// não por tarifário agrupado) — usado só pelo Excel "Análise por Linha", que precisa
// do detalhe por linha, ao contrário do resumo por categoria da vista principal
// (`calcularResumoPorCategoria`), que agrupa por tarifário para uma leitura rápida no
// ecrã. Para cada linha, usa os valores (Mensalidade/Suplementares/Desconto/Total) da
// entrada mais recente com dados válidos, mas o histórico completo (todas as faturas
// anexadas) para gerar a Observação.
// Cruza um tarifário identificado na análise com o catálogo de produtos (dados-privados/
// autonomias-comerciais.json) para enriquecer a Observação com o que esse produto
// realmente inclui — decisão explícita do utilizador (2026-09-11). Correspondência por
// nome exato (sem distinguir maiúsculas/espaços) — nunca aproximada, para nunca associar
// um produto errado. Só acrescenta texto quando o produto é encontrado E tem o campo
// "caracteristicas" preenchido; produtos só com preço (como os 13 de Voz Móvel, por
// agora) ou tarifários não encontrados no catálogo ficam com a observação original,
// sem alteração — nunca inventa características que não estão nos dados.
function encontrarProdutoNoCatalogo(dadosAutonomias, tarifario) {
  if (!dadosAutonomias || !dadosAutonomias.produtos || !tarifario) return null;
  const alvo = String(tarifario).trim().toLowerCase();
  return dadosAutonomias.produtos.find((p) => p.nome.trim().toLowerCase() === alvo) || null;
}
function enriquecerObservacaoComCatalogo(observacao, tarifario, dadosAutonomias) {
  const produto = encontrarProdutoNoCatalogo(dadosAutonomias, tarifario);
  if (!produto || !produto.caracteristicas) return observacao;
  const nota = `Tarifário atual (${produto.nome}) já inclui: ${produto.caracteristicas}.`;
  return observacao ? `${observacao} ${nota}` : nota;
}

function calcularLinhasIndividuais(linhas, dadosAutonomias) {
  if (!linhas || !linhas.length) return [];
  const linhasUteis = linhas.filter((l) => l.tarifario || l.total !== "");
  if (!linhasUteis.length) return [];

  const porNumero = new Map();
  linhasUteis.forEach((l) => {
    const chave = l.numero || l.id;
    if (!porNumero.has(chave)) porNumero.set(chave, { numero: l.numero, tarifario: l.tarifario, entradas: [] });
    const grupo = porNumero.get(chave);
    if (!grupo.tarifario && l.tarifario) grupo.tarifario = l.tarifario;
    grupo.entradas.push(l);
  });

  return [...porNumero.values()].map(({ numero, tarifario, entradas }) => {
    // Sem período conhecido fica no fim (-Infinity) — nunca é tratada como "mais recente".
    const ordenadas = [...entradas].sort((a, b) => (a.periodo ? a.periodo.ordem : -Infinity) - (b.periodo ? b.periodo.ordem : -Infinity));
    const comDados = [...ordenadas].reverse().find((e) => e.total !== "");
    const maisRecente = comDados || ordenadas[ordenadas.length - 1];
    const categoria = categorizarServico(tarifario);
    return {
      numero: numero || "—",
      tarifario: tarifario || "—",
      categoria,
      mensalidade: maisRecente.mensalidade !== "" ? Number(maisRecente.mensalidade) : null,
      suplementares: maisRecente.suplementares !== "" ? Number(maisRecente.suplementares) : null,
      desconto: maisRecente.desconto !== "" ? Number(maisRecente.desconto) : null,
      total: maisRecente.total !== "" ? Number(maisRecente.total) : null,
      // O custo atual para comparar com uma proposta inclui variáveis e descontos.
      // Usa o Total da fatura quando existe; caso contrário, reconcilia os campos.
      custoAtual: maisRecente.total !== "" ? Number(maisRecente.total)
        : (maisRecente.mensalidade !== "" ? Number(maisRecente.mensalidade)
          + (maisRecente.suplementares !== "" ? Number(maisRecente.suplementares) : 0)
          + (maisRecente.desconto !== "" ? Number(maisRecente.desconto) : 0) : null),
      periodoMaisRecente: maisRecente.periodo || null,
      tipoUtilizacao: derivarTipoUtilizacao(categoria, tarifario, ordenadas),
      // Média das % de utilização já calculadas por mês (extraídas de "Consumos
      // mensais incluídos" em cada fatura) — null quando nenhuma fatura desta linha
      // tinha essa secção (ex. Fixo/Voz sem pacote de dados/minutos a medir).
      utilizacaoMedia: (() => {
        const ratios = ordenadas.map((e) => e.utilizacaoRatio).filter((r) => typeof r === "number");
        return ratios.length ? ratios.reduce((a, b) => a + b, 0) / ratios.length : null;
      })(),
      // Itens em bruto do bloco na fatura mais recente (linhas próprias em "Análise por
      // Linha", não texto) — pedido explícito do utilizador (2026-09-12), para nunca
      // dar a entender que um total agregado é o preço de um único produto.
      itens: maisRecente.itens || [],
      observacao: [
        enriquecerObservacaoComCatalogo(gerarObservacaoLinha(ordenadas), tarifario, dadosAutonomias),
        maisRecente.consumosTexto || "",
      ].filter(Boolean).join(" "),
    };
  }).sort((a, b) => (b.total || 0) - (a.total || 0));
}

// Sugere o preenchimento da "Análise Rápida" a partir dos dados já calculados pela
// análise das faturas — nunca inventa: só sugere o que os números/textos já extraídos
// sustentam (mesmo princípio de "calcularLinhasIndividuais"/"calcularResumoPorCategoria").
// Quem chama esta função decide o que fazer com o resultado — aqui não se mexe em
// estado nenhum, para poder ser testada isoladamente.
function sugerirAnaliseRapida(linhas) {
  const individuais = calcularLinhasIndividuais(linhas);

  // Operadora atual = sempre "Vodafone" quando há faturas analisadas — este dashboard
  // só processa faturas Vodafone Business, nunca de outra operadora.
  const operadoraAtual = individuais.length ? "Vodafone" : null;

  // Valor mensal atual = soma do Total (fatura mais recente) de cada linha individual
  // — a mesma base usada na folha "Análise por Linha" do Excel.
  const valorMensal = individuais.length
    ? Number(individuais.reduce((s, l) => s + (l.total || 0), 0).toFixed(2))
    : null;

  // Data fim de fidelização = a mais PRÓXIMA entre todas as linhas — decisão de
  // negócio confirmada pelo utilizador (2026-09-07): é a primeira janela de
  // renegociação, não quando a conta toda fica livre (outras linhas podem continuar
  // presas depois disso). Lida do texto "...até DD-MM-AAAA" já extraído por
  // analisarSegmentoDetalheServico.
  let maisProxima = null;
  linhas.forEach((l) => {
    const re = /até (\d{2})-(\d{2})-(\d{4})/g;
    let m;
    while ((m = re.exec(l.fidelizacao || "")) !== null) {
      const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      if (!maisProxima || d < maisProxima) maisProxima = d;
    }
  });
  const dataFimFidelizacao = maisProxima
    ? `${maisProxima.getFullYear()}-${String(maisProxima.getMonth() + 1).padStart(2, "0")}-${String(maisProxima.getDate()).padStart(2, "0")}`
    : null;

  // Serviços atuais — só as tags com sinal claro na categorização já feita; nunca
  // marca TV/Segurança/Cloud, que a extração de faturas atual não deteta.
  const servicosAtuais = new Set();
  individuais.forEach((l) => {
    if (l.categoria === "Móvel") servicosAtuais.add("Móvel");
    else if (l.categoria === "IoT / ICT") servicosAtuais.add("IoT");
    else if (l.categoria === "Fixo") {
      servicosAtuais.add("Fixo");
      if (tipoServicoFixo(l.tarifario) === "Internet") servicosAtuais.add("Internet");
    }
  });

  return { operadoraAtual, valorMensal, dataFimFidelizacao, servicosAtuais: [...servicosAtuais] };
}

// Heurística simples por categoria + tipo de custo extra já detetado no texto da
// fatura (roaming/internacional/dados extra) — não é uma leitura real de plafond/GB,
// só uma categorização aproximada para orientar a leitura da folha.
function derivarTipoUtilizacao(categoria, tarifario, entradas) {
  if (categoria === "Fixo") {
    const tipo = tipoServicoFixo(tarifario);
    if (tipo === "Internet") return "Internet fixa";
    if (tipo === "Voz") return "Voz fixa";
    return "Fixo (tipo não identificado)";
  }
  if (categoria === "IoT / ICT") return "IoT / M2M";
  const tipos = new Set();
  entradas.forEach((e) => (e.custoExtraTipo || "").split(", ").filter(Boolean).forEach((t) => tipos.add(t)));
  if (tipos.has("roaming") || tipos.has("chamadas internacionais")) return "Internacional / roaming";
  if (tipos.has("dados extra")) return "Dados nacionais (com aditivo)";
  return "Dados nacionais";
}

// Observação por REGRAS (sem IA) a partir dos valores já calculados — nunca inventa um
// diagnóstico que os números não sustentem. Combina as notas que se apliquem; se
// nenhuma regra disparar, assume-se estabilidade ("sem alteração").
function gerarObservacaoLinha(entradasOrdenadas) {
  const validas = entradasOrdenadas.filter((e) => e.total !== "");
  if (!validas.length) return "⚠ Sem dados suficientes nas faturas anexadas para gerar observação — confirma à mão.";

  const notas = [];

  // Desconto mudou de valor entre duas faturas consecutivas?
  for (let i = 1; i < validas.length; i++) {
    const anterior = validas[i - 1].desconto !== "" ? Number(validas[i - 1].desconto) : null;
    const atual = validas[i].desconto !== "" ? Number(validas[i].desconto) : null;
    if (anterior !== null && atual !== null && Math.abs(anterior - atual) > 0.01) {
      const mes = validas[i].periodo ? validas[i].periodo.label : "mês seguinte";
      notas.push(`Desconto mudou de ${euro(anterior)} para ${euro(atual)} em ${mes}.`);
    }
  }

  // Consumo variável (suplementares) — mesmo limiar de "variação notável" do dashboard.
  const suplValidos = validas.map((e) => (e.suplementares !== "" ? Number(e.suplementares) : NaN)).filter((v) => !isNaN(v));
  if (suplValidos.length) {
    const min = Math.min(...suplValidos), max = Math.max(...suplValidos);
    if (max > 0 && max - min > 5) {
      notas.push(`Consumo variável entre ${euro(min)} e ${euro(max)}/mês.`);
    } else if (max === 0) {
      notas.push(`Sem consumo variável em nenhum dos ${validas.length} mês(es) analisado(s).`);
    }
  }

  // Plafond (dados/minutos) esgotado ou quase (≥95%) nalgum mês — sinal direto de
  // dimensionamento a rever, lido de "Consumos mensais incluídos".
  const esgotados = validas.filter((e) => typeof e.utilizacaoRatio === "number" && e.utilizacaoRatio >= 0.95);
  if (esgotados.length) {
    const meses = esgotados.map((e) => (e.periodo ? e.periodo.label : "mês desconhecido")).join(", ");
    const nomePacote = esgotados[0].utilizacaoNomePacote || "Plafond";
    notas.push(`${nomePacote} esgotado (ou quase) em ${esgotados.length} dos ${validas.length} mês(es) analisado(s) (${meses}).`);
  }

  // Roaming / internacional / dados extra, já detetado no texto da fatura.
  const tiposVistos = new Set();
  validas.forEach((e) => (e.custoExtraTipo || "").split(", ").filter(Boolean).forEach((t) => tiposVistos.add(t)));
  if (tiposVistos.size) notas.push(`Consumo de ${[...tiposVistos].join(" e ")} identificado.`);

  // Fidelização em curso.
  const fidelizacoes = new Set();
  validas.forEach((e) => (e.fidelizacao || "").split("; ").filter(Boolean).forEach((f) => fidelizacoes.add(f)));
  if (fidelizacoes.size) notas.push(`Fidelização: ${[...fidelizacoes].join("; ")}.`);

  if (!notas.length) {
    notas.push(validas.length > 1
      ? `Sem alteração nos ${validas.length} meses analisados.`
      : "Apenas 1 mês analisado — sem histórico suficiente para identificar variação.");
  }

  return notas.join(" ");
}

// Excel-questionário em branco para um Cliente Novo sem faturas/histórico (Caminho B,
// decisão explícita do utilizador, 2026-09-11) — Augusto preenche fora do dashboard e
// volta a anexá-lo (como "documento de apoio", ver classificarAnexo); substitui o
// Excel de análise de faturas nesse caminho, não é gerado a partir de nenhuma extração.
function gerarExcelQuestionarioClienteNovo(nome, nif) {
  const TIPOS_SERVICO = ["Voz Móvel", "Voz Fixa", "Internet", "IoT", "Presença Digital", "Segurança", "Cloud e Datacenter", "Smart Solutions", "Outro"];
  const wb = XLSX.utils.book_new();
  const aoa = [
    [`QUESTIONÁRIO — ${(nome || "CLIENTE NOVO").toUpperCase()}`],
    [`NIF: ${nif || "—"}    Data: ${new Date().toLocaleDateString("pt-PT")}`],
    [`Tipo de serviço: usa sempre um destes valores — ${TIPOS_SERVICO.join(", ")}.`],
    [],
    ["Tipo de serviço", "Quantidade", "Produto", "Valor (€)"],
  ];
  const NUM_LINHAS_VAZIAS = 25;
  for (let i = 0; i < NUM_LINHAS_VAZIAS; i++) aoa.push([null, null, null, null]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{ wch: 22 }, { wch: 12 }, { wch: 32 }, { wch: 14 }];
  ws["!merges"] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 3 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 3 } },
    { s: { r: 2, c: 0 }, e: { r: 2, c: 3 } },
  ];
  XLSX.utils.book_append_sheet(wb, ws, "Questionário");
  return wb;
}

// Gera o Excel de 3 folhas no mesmo formato do modelo de referência do utilizador
// (Análise por Linha / Novos Tarifários / Comparativo) — só quando pedido
// explicitamente (botão "Gerar Excel"), nunca automaticamente.
// Decisão explícita (2026-09-07, revertendo a decisão anterior de agregar por
// tarifário): "Análise por Linha" volta a ser uma linha por Nº/Serviço INDIVIDUAL —
// o nível de detalhe exigido para o exemplo de referência (Cliente D). As colunas
// de decisão (Ação recomendada, Mensalidade nova) ficam sempre em branco/editáveis,
// pré-preenchidas com "Manter"/mensalidade atual — a decisão real é do utilizador.
// LIMITAÇÃO CONHECIDA: a extração atual não lê plafond/GB do PDF, por isso "Utilização
// média" fica sempre "—" (nunca inventa uma percentagem sem dados reais por trás).
// Dobra cada linha de "Desconto" no item imediatamente anterior (fica com o valor
// líquido) — só usado na folha "Novos Tarifários" (decisão item a item). Confirmado
// com o utilizador (2026-09-12): a linha de desconto aparece sempre logo a seguir ao
// produto a que se aplica na fatura, por isso é aí que se dobra. A folha "Análise por
// Linha" continua a mostrar o desconto como a sua própria linha (ordem literal da
// fatura) — só aqui, onde se decide Manter/Anular/Upgrade por item, é que faz sentido
// já vir líquido (não se decide nada sobre um desconto isolado).
function dobrarDescontosNosItens(itens) {
  const resultado = [];
  itens.forEach((it) => {
    if (/desconto/i.test(it.descricao) && resultado.length) {
      const alvo = resultado[resultado.length - 1];
      alvo.valor = Number((alvo.valor + it.valor).toFixed(2));
    } else {
      resultado.push({ ...it });
    }
  });
  return resultado;
}

// ===== Sugestão de Catálogo (coluna informativa em "Novos Tarifários") =====
// Decisão explícita do utilizador (2026-09-15): ligar o catálogo de produtos
// (dados-privados/produtos-caracteristicas.json) à geração de propostas, mas de forma
// simples e determinística — nunca "inteligência elaborada", e sempre "sem sugestão"
// em vez de uma sugestão pouco fundamentada. Coluna é só informativa, nunca alimenta
// fórmulas.
function produtoDescontinuado(produto) {
  return Boolean(produto && produto.nota && produto.nota.includes("⚠"));
}

// Mapeia o texto do tarifário atual para o(s) categoriaId do catálogo mais prováveis —
// regras por palavra-chave, ordenadas da mais específica para a mais genérica (a
// primeira que corresponder ganha, para manter a escolha determinística e única).
function categoriaCatalogoParaTarifario(tarifario) {
  const t = (tarifario || "").toLowerCase();
  if (/onenet|one net/.test(t)) return "fixo";
  // Móvel/tablet primeiro — nomes como "Internet no Tablet-PC" ou "Instant Connect"
  // não são internet fixa, apesar de poderem soar a "dados"/"net".
  if (/tablet|instant connect|internet no telemóvel|internet no telemovel|dados móvel|dados movel/.test(t)) return "banda-larga-movel";
  if (/mbps|net\s*\d|backup 4g|fibra|adsl|voz fixa|e-fax/.test(t)) return "fixo";
  if (/pacote|bundle/.test(t)) return "bundles";
  if (/iot|m2m|frota|tracker|analytics|smart cit/.test(t)) return "smart-solutions-iot";
  if (/cloud|datacenter|segurança|seguranca|firewall|vpn|sd-wan|ciberseguranca|cibersegurança/.test(t)) return "smart-solutions-ict";
  if (/aditivo/.test(t)) return "aditivos-voz-movel";
  if (/voz móvel|voz movel|móvel|movel/.test(t)) return "movel-voz";
  return null;
}

// Extrai um débito Mbps "down/up" do nome de um tarifário/produto (ex.: "Net 200/100
// Mbps" -> {down: 200, up: 100}) — null quando o nome não tem esse padrão.
function extrairMbps(nome) {
  const m = /(\d+)\s*\/\s*(\d+)\s*mbps/i.exec(nome || "");
  return m ? { down: Number(m[1]), up: Number(m[2]) } : null;
}

function normalizarTextoProduto(nome) {
  return (nome || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "");
}

// Palavras que aparecem em quase todos os nomes de produto (marca, genéricas de
// negócio) e por isso não servem para distinguir um produto de outro — sem esta lista,
// "Vodafone" isolado (24 dos 98 produtos do catálogo) bastava para "combinar" com
// quase tudo. Ficam de fora da comparação por palavras-chave (Tentativa 2).
const PALAVRAS_IRRELEVANTES_CATALOGO = new Set([
  "vodafone", "business", "empresa", "empresas", "empresarial", "para", "com", "sem", "das", "dos",
  // Qualificadores de categoria, não do produto em si — "fixa"/"movel" aparecem em
  // vários produtos de naturezas diferentes dentro da mesma categoria (ex. "Voz Fixa
  // Biz" vs "Internet Fixa Biz"), por isso sozinhos não chegam para uma correspondência
  // com confiança razoável.
  "fixa", "fixo", "movel",
]);
function palavrasRelevantes(texto) {
  return new Set(
    normalizarTextoProduto(texto).split(/\W+/)
      .filter((w) => w.length >= 4 && !PALAVRAS_IRRELEVANTES_CATALOGO.has(w))
  );
}

// Sugere um produto do catálogo para substituir o tarifário atual — devolve o nome do
// produto ou null quando não há confiança razoável (nunca força uma sugestão fraca).
function sugerirProdutoCatalogo(tarifario, dadosProdutosCatalogo) {
  if (!tarifario || !dadosProdutosCatalogo || !dadosProdutosCatalogo.produtos) return null;
  const categoriaId = categoriaCatalogoParaTarifario(tarifario);
  if (!categoriaId) return null;
  const candidatos = dadosProdutosCatalogo.produtos.filter(
    (p) => p.categoriaId === categoriaId && !produtoDescontinuado(p) && normalizarTextoProduto(p.nome) !== normalizarTextoProduto(tarifario)
  );
  if (!candidatos.length) return null;

  // Tentativa 1 — correspondência por débito (Mbps): só entra em jogo quando o próprio
  // tarifário atual E pelo menos um candidato têm um débito identificável no nome
  // (ex. "Net 200/100 Mbps"); sugere o próximo escalão acima do atual, nunca um igual
  // ou inferior. Quando o catálogo não tem nenhum produto com débito no nome (caso do
  // catálogo atual, que descreve as ofertas por texto, não por escalão), cai para a
  // Tentativa 2 em vez de desistir.
  const specAtual = extrairMbps(tarifario);
  const comSpec = candidatos.map((p) => ({ produto: p, spec: extrairMbps(p.nome) })).filter((x) => x.spec);
  if (specAtual && comSpec.length) {
    const superiores = comSpec.filter((x) => x.spec.down > specAtual.down).sort((a, b) => a.spec.down - b.spec.down);
    return superiores.length ? superiores[0].produto.nome : null;
  }

  // Tentativa 2 — mesma categoria + palavra(s) relevante(s) em comum (>=4 letras,
  // excluindo palavras genéricas) com o nome do tarifário atual. Exige pelo menos 1
  // palavra em comum; escolhe o candidato com mais palavras em comum (desempate:
  // primeiro do catálogo, ordem estável).
  const palavrasAtual = palavrasRelevantes(tarifario);
  if (!palavrasAtual.size) return null;
  let melhor = null;
  let melhorScore = 0;
  candidatos.forEach((p) => {
    const palavrasP = palavrasRelevantes(p.nome);
    const comuns = [...palavrasAtual].filter((w) => palavrasP.has(w));
    if (comuns.length > melhorScore) { melhorScore = comuns.length; melhor = p; }
  });
  return melhor ? melhor.nome : null;
}

function gerarExcelAnaliseTarifarios(nomeCliente, linhas, decisoes, dadosAutonomias, dadosProdutosCatalogo, observacaoManual) {
  decisoes = decisoes || {};
  const wb = XLSX.utils.book_new();
  const individuais = calcularLinhasIndividuais(linhas, dadosAutonomias);

  const periodosGlobais = linhas.map((l) => l.periodo).filter(Boolean);
  const periodoMaisRecente = periodosGlobais.length ? periodosGlobais.reduce((a, b) => (b.ordem > a.ordem ? b : a)) : null;
  const nomeUpper = nomeCliente.toUpperCase();

  /* ===== FOLHA 1 — Análise por Linha ===== */
  const temObservacaoManual = observacaoManual && observacaoManual.trim();
  const aoa1 = [
    [`${nomeUpper} — ANÁLISE DE FATURAÇÃO E UTILIZAÇÃO POR SERVIÇO`],
    [`Vodafone Business · Valores sem IVA, com base na fatura mais recente${periodoMaisRecente ? ` (${periodoMaisRecente.label})` : ""}. "Utilização média" = % do plafond principal (dados, ou minutos/SMS quando não há dados) consumido em média nas faturas analisadas — "—" quando a fatura não tem essa secção para esta linha (ex. Voz fixa sem pacote a medir).`],
  ];
  // Observação escrita à mão pelo consultor (Caminho "Sem Faturas") — tem de ficar bem
  // visível, nunca escondida: linha própria, logo a seguir ao título, antes até dos
  // cabeçalhos das colunas. Decisão explícita do utilizador (2026-09-11).
  if (temObservacaoManual) aoa1.push([`📝 OBSERVAÇÕES DO CONSULTOR: ${observacaoManual.trim()}`]);
  aoa1.push(
    [],
    ["Nº / Serviço", "Tarifário (bloco)", "Item", "Valor sem IVA", "Utilização média", "Tipo de utilização", "Observação"],
  );
  // Cada item do bloco (mensalidade, produto suplementar, desconto, comunicação não
  // incluída, ...) é a sua própria linha — pedido explícito do utilizador (2026-09-12,
  // caso real Cliente A): a coluna "Detalhe" em texto obrigava a ler com atenção, uma
  // linha por item não. Termina sempre numa linha SUBTOTAL (soma por fórmula das linhas
  // de item desse bloco) — é aí, e só aí, que ficam Utilização média/Tipo/Observação,
  // para não repetir a mesma observação em todas as linhas do bloco. Reconcilia sempre
  // contra o Total da fatura mais recente para esse bloco; se não bater certo (>0,02€,
  // arredondamentos), o aviso fica na própria Observação do subtotal — nunca escondido.
  const celsFmtEuro = []; // referências "D5" a formatar como € — item + subtotal
  individuais.forEach((l) => {
    const primeiraLinhaItem = aoa1.length + 1;
    const itens = l.itens && l.itens.length ? l.itens : [{ qtd: null, descricao: "(sem decomposição disponível)", valor: l.total }];
    itens.forEach((it) => {
      aoa1.push([l.numero, l.tarifario, `${it.descricao}${it.qtd && it.qtd > 1 ? ` (x${it.qtd})` : ""}`, it.valor, null, null, null]);
      celsFmtEuro.push(`D${aoa1.length}`);
    });
    const ultimaLinhaItem = aoa1.length;
    const soma = Number(itens.reduce((s, it) => s + (it.valor || 0), 0).toFixed(2));
    let observacao = l.observacao || "";
    if (l.total !== null && Math.abs(soma - l.total) > 0.02) {
      observacao = `${observacao} ⚠ Subtotal (${euro(soma)}) não bate com o Total da fatura (${euro(l.total)}) — confirmar.`.trim();
    }
    const utilizacao = l.utilizacaoMedia !== null ? { t: "n", v: l.utilizacaoMedia, z: "0.0%" } : "—";
    aoa1.push([l.numero, l.tarifario, "SUBTOTAL", { t: "n", f: `SUM(D${primeiraLinhaItem}:D${ultimaLinhaItem})` }, utilizacao, l.tipoUtilizacao, observacao]);
    celsFmtEuro.push(`D${aoa1.length}`);
  });
  if (individuais.length) {
    const totalGeral = Number(individuais.reduce((s, l) => s + (l.total || 0), 0).toFixed(2));
    aoa1.push(["TOTAL", "", "", totalGeral, "", "", ""]);
    celsFmtEuro.push(`D${aoa1.length}`);
    aoa1.push([]);
    aoa1.push([`Nota: o total acima soma o SUBTOTAL de cada bloco (${individuais.length} bloco(s), valor da fatura mais recente de cada um). Confirma contra o total impresso na fatura antes de avançar — esta extração é por regras, não substitui a validação humana.`]);
  } else {
    aoa1.push([temObservacaoManual
      ? "Sem faturas anexadas — ver a observação do consultor acima. Nenhuma linha extraída automaticamente."
      : "Nenhuma linha identificada — anexa e analisa as faturas no dashboard antes de gerar este Excel."]);
  }
  const ws1 = XLSX.utils.aoa_to_sheet(aoa1);
  ws1["!cols"] = [{ wch: 22 }, { wch: 20 }, { wch: 40 }, { wch: 14 }, { wch: 14 }, { wch: 24 }, { wch: 60 }];
  ws1["!merges"] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 6 } },
    ...(temObservacaoManual ? [{ s: { r: 2, c: 0 }, e: { r: 2, c: 6 } }] : []),
    { s: { r: aoa1.length - 1, c: 0 }, e: { r: aoa1.length - 1, c: 6 } },
  ];
  celsFmtEuro.forEach((ref) => { if (ws1[ref]) ws1[ref].z = '"€ "#,##0.00'; });
  XLSX.utils.book_append_sheet(wb, ws1, "Análise por Linha");

  /* ===== FOLHA 2 — Novos Tarifários (decisão item a item, dentro de cada bloco) =====
     Reescrita 2026-09-12: decisão deixa de ser uma linha por bloco e passa a ser uma
     linha por ITEM (mensalidade, produto suplementar, ...) dentro de cada bloco
     "▶ Nº/Serviço", com uma linha "— SUBTOTAL —" a fechar o bloco (soma por fórmula).
     Descontos nunca aparecem como item próprio aqui — ver dobrarDescontosNosItens.
     Sem estilo de célula real: a biblioteca gratuita (xlsx.js, sem licença Pro) ignora
     "!dataValidations" e fill/bold ao gravar (testado e confirmado) — os blocos
     distinguem-se por texto ("▶ ", "— SUBTOTAL —") e linhas em branco a separar.
     "Mensalidade nova" fica sempre em branco por defeito, mesmo em "Manter". */
  const blocosNovosTarifarios = [
    ...individuais.map((l) => ({
      numero: l.numero,
      tarifarioAtual: l.tarifario,
      itens: dobrarDescontosNosItens(l.itens && l.itens.length ? l.itens : [{ qtd: null, descricao: "(sem decomposição disponível)", valor: l.total }]),
      observacaoBase: l.observacao || "",
    })),
    // Blocos em branco já preparados para produtos NOVOS (que o cliente ainda não
    // tem) — pedido explícito do utilizador (2026-09-12). Mesma estrutura dos blocos
    // reais para o leitor (lerNovosTarifariosDoExcel) não precisar de caso especial.
    ...Array.from({ length: 5 }, (_, i) => ({
      numero: `NOVO-${i + 1}`,
      tarifarioAtual: "",
      itens: [{ qtd: null, descricao: "(produto novo — preencher)", valor: null }],
      observacaoBase: "",
    })),
  ];
  const aoa2 = [
    [`${nomeUpper} — NOVOS TARIFÁRIOS (PREENCHER)`],
    ["Ação: usa Manter, Anular, Upgrade ou Novo produto (blocos \"▶ NOVO-1\" a \"▶ NOVO-5\" já preparados em baixo). Cada bloco mostra os itens individuais da fatura — decide item a item; a linha \"— SUBTOTAL —\" soma automaticamente o bloco. \"Mensalidade nova\" fica sempre em branco por defeito, mesmo em \"Manter\". Nas linhas Novo produto, \"Valor atual\" fica em branco de propósito, por isso a Poupança sai negativa (é um custo acrescido) — normal e esperado. \"Sugestão de Catálogo\" é só informativa (nunca alimenta fórmulas) — vem do catálogo de produtos quando há correspondência razoável; em branco quando não há."],
    [],
    ["Ref.", "Item", "Ação", "Sugestão de Catálogo", "Tarifário proposto", "Valor atual\n(sem IVA)", "Mensalidade nova\n(sem IVA)", "Poupança mensal", "Observação / Justificação (bloco)"],
  ];
  const mergesBloco2 = [];
  const linhasSubtotal2 = [];
  const rangesItensObrigatorias = []; // só blocos de faturas reais contam para "por preencher"
  let refCounter = 0;
  blocosNovosTarifarios.forEach((bloco, idxBloco) => {
    mergesBloco2.push(aoa2.length);
    aoa2.push([`▶ ${bloco.numero}${bloco.tarifarioAtual ? ` — ${bloco.tarifarioAtual}` : ""}`]);
    const primeiraLinhaItem = aoa2.length + 1;
    const sugestaoBloco = sugerirProdutoCatalogo(bloco.tarifarioAtual, dadosProdutosCatalogo);
    bloco.itens.forEach((it) => {
      refCounter++;
      const linhaExcel = aoa2.length + 1;
      // Tarifário proposto/Mensalidade nova ficam a null (não ""): uma string vazia
      // cria célula com conteúdo e ISBLANK() devolve FALSO (bug apanhado ao testar).
      aoa2.push([refCounter, `${it.descricao}${it.qtd && it.qtd > 1 ? ` (x${it.qtd})` : ""}`, "Manter", sugestaoBloco || null, null, it.valor, null,
        { t: "n", f: `IF(ISBLANK(G${linhaExcel}),"—",F${linhaExcel}-G${linhaExcel})` },
        null]);
    });
    const ultimaLinhaItem = aoa2.length;
    const linhaSubtotalExcel = aoa2.length + 1;
    aoa2.push([null, "— SUBTOTAL —", null, null, null,
      { t: "n", f: `SUM(F${primeiraLinhaItem}:F${ultimaLinhaItem})` },
      { t: "n", f: `SUM(G${primeiraLinhaItem}:G${ultimaLinhaItem})` },
      { t: "n", f: `SUM(H${primeiraLinhaItem}:H${ultimaLinhaItem})` },
      bloco.observacaoBase || null]);
    linhasSubtotal2.push(linhaSubtotalExcel);
    if (idxBloco < individuais.length) rangesItensObrigatorias.push({ primeira: primeiraLinhaItem, ultima: ultimaLinhaItem });
    aoa2.push([]); // separador antes do próximo bloco
  });
  const linhaTotal2 = aoa2.length + 1;
  // "Por preencher" só olha para os blocos de faturas reais — os "▶ NOVO-*" nunca
  // bloqueiam o total sozinhos, mas entram no TOTAL assim que preenchidos.
  const contBlankFormula2 = rangesItensObrigatorias.length
    ? rangesItensObrigatorias.map((r) => `COUNTBLANK(G${r.primeira}:G${r.ultima})`).join("+")
    : "0";
  const somaSubtotais2 = (col) => linhasSubtotal2.map((r) => `${col}${r}`).join(",");
  aoa2.push([null, "TOTAL", null, null, null,
    { t: "n", f: `SUM(${somaSubtotais2("F")})` },
    { t: "str", f: `IF(${contBlankFormula2}>0,"— (por preencher)",SUM(${somaSubtotais2("G")}))` },
    { t: "str", f: `IF(${contBlankFormula2}>0,"— (por preencher)",SUM(${somaSubtotais2("F")})-SUM(${somaSubtotais2("G")}))` },
    null]);
  if (!individuais.length) {
    aoa2.push([]);
    aoa2.push(["Nenhuma linha extraída de faturas — usa os blocos \"▶ NOVO-*\" acima para propor produtos, ou anexa e analisa faturas no dashboard."]);
  }
  const ws2 = XLSX.utils.aoa_to_sheet(aoa2);
  ws2["!cols"] = [{ wch: 6 }, { wch: 40 }, { wch: 14 }, { wch: 22 }, { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 13 }, { wch: 50 }];
  ws2["!merges"] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 8 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 8 } },
    ...mergesBloco2.map((r) => ({ s: { r, c: 0 }, e: { r, c: 8 } })),
  ];
  for (let r = 5; r <= linhaTotal2; r++) {
    ["F", "G", "H"].forEach((col) => { const ref = `${col}${r}`; if (ws2[ref]) ws2[ref].z = '"€ "#,##0.00'; });
  }
  XLSX.utils.book_append_sheet(wb, ws2, "Novos Tarifários");

  /* ===== FOLHA 3 — Comparativo (totais automáticos) ===== */
  const refTarif = "'Novos Tarifários'";
  const contBlankFormula3 = rangesItensObrigatorias.length
    ? rangesItensObrigatorias.map((r) => `COUNTBLANK(${refTarif}!G${r.primeira}:G${r.ultima})`).join("+")
    : "0";
  const aoa3 = individuais.length ? [
    [`${nomeUpper} — COMPARATIVO FATURA ATUAL vs PROPOSTA`],
    [`Atualiza-se automaticamente à medida que preenche/confirma a folha "Novos Tarifários".`],
    [],
    ["Valores por preencher (folha \"Novos Tarifários\")", { t: "n", f: contBlankFormula3 }],
    [{ t: "str", f: `IF(B4>0,"⚠ Os totais abaixo são PROVISÓRIOS — ainda há "&B4&" valor(es) por preencher.","✓ Todos os valores foram confirmados — totais finais.")` }],
    [],
    ["Total mensalidades atuais (sem IVA)", { t: "n", f: `${refTarif}!F${linhaTotal2}` }],
    ["Total mensalidades propostas (sem IVA)", { t: "str", f: `IF(B4>0,"—",${refTarif}!G${linhaTotal2})` }],
    ["Poupança mensal (sem IVA)", { t: "str", f: `IF(B4>0,"—",B7-${refTarif}!G${linhaTotal2})` }],
    ["Poupança mensal (com IVA, 23%)", { t: "str", f: `IF(B4>0,"—",(B7-${refTarif}!G${linhaTotal2})*1.23)` }],
    ["Poupança anual (sem IVA)", { t: "str", f: `IF(B4>0,"—",(B7-${refTarif}!G${linhaTotal2})*12)` }],
    ["Poupança anual (com IVA, 23%)", { t: "str", f: `IF(B4>0,"—",(B7-${refTarif}!G${linhaTotal2})*1.23*12)` }],
    [],
    [`Nota: os valores "atuais" incluem Mensalidade + Suplementares/variáveis + Desconto (já líquido, dobrado no item anterior) da fatura mais recente. Ver a Observação/Justificação do bloco em causa na folha "Novos Tarifários".`],
  ] : [
    [`${nomeUpper} — COMPARATIVO FATURA ATUAL vs PROPOSTA`],
    ["Nenhuma linha identificada — anexa e analisa as faturas no dashboard antes de gerar este Excel."],
  ];
  const ws3 = XLSX.utils.aoa_to_sheet(aoa3);
  ws3["!cols"] = [{ wch: 42 }, { wch: 16 }, { wch: 4 }, { wch: 60 }];
  if (individuais.length) {
    ws3["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 3 } },
      { s: { r: 4, c: 0 }, e: { r: 4, c: 3 } }, { s: { r: 12, c: 0 }, e: { r: 12, c: 3 } },
    ];
    // Formato de moeda mesmo nas fórmulas "str" (podem devolver "—" em vez de um número)
    // — o formato só é aplicado quando o resultado é numérico, não afeta o texto "—".
    ["B7", "B8", "B9", "B10", "B11", "B12"].forEach((ref) => { if (ws3[ref]) ws3[ref].z = '"€ "#,##0.00'; });
  }
  XLSX.utils.book_append_sheet(wb, ws3, "Comparativo");

  /* ===== FOLHA 4 — Referência Autonomia (área de consulta, opcional) =====
     Recupera a cascata Categoria RLMC → Produto → Nível de Autonomia que existia como
     formulário dentro de "Novos Tarifários (decisão por linha)" no dashboard — removida
     sem querer junto com essa lista quando o fluxo passou a ser "preencher tudo
     manualmente no Excel" (ver "Dar seguimento"). Decisão explícita do utilizador
     (2026-09-12): recuperar dentro do próprio Excel, por fórmula, não como formulário
     no dashboard — nunca a recriar lá. Só uma ÁREA DE CONSULTA (Augusto lê o valor e
     copia à mão para "Mensalidade nova" em "Novos Tarifários"); não atualiza nada
     sozinho, e não depende de nada fora deste ficheiro (tabela de apoio embutida).
     Sempre para 1 SIM da conta, tal como o formulário antigo (cada linha de "Novos
     Tarifários" já é 1 serviço concreto do cliente, não se pergunta o Nº de SIMs aqui).
     Só gerada quando há dados de autonomias ligados — sem isso, não há nada para
     consultar e a folha nem apareceria útil. */
  if (dadosAutonomias && dadosAutonomias.produtos && dadosAutonomias.produtos.length) {
    const produtosAutonomia = dadosAutonomias.produtos;
    const aoa4 = [];
    aoa4.push([`${nomeUpper} — REFERÊNCIA DE AUTONOMIA COMERCIAL (consulta)`]);
    aoa4.push([`Preenche as 3 células "Categoria RLMC", "Produto" e "Nível de Autonomia" (linha abaixo) tal como estão escritas na tabela de apoio — o preço aparece ao lado, calculado por fórmula. É só uma ÁREA DE CONSULTA: copia o valor manualmente para "Mensalidade nova" na linha certa da folha "Novos Tarifários" — não atualiza nada sozinho.`]);
    aoa4.push([]);
    aoa4.push(["Categoria RLMC", "Produto", "Nível de Autonomia", "Preço calculado (€/mês, 1 SIM)"]);
    const rowInput = aoa4.length; // 0-indexed — linha onde Augusto escreve os 3 valores
    aoa4.push([null, null, null, null]);
    aoa4.push([]);
    aoa4.push([`Categorias com dados disponíveis: NRECEITAMÓVEL, REFIDELIZAÇÃOMÓVEL. Fixo e Smart Solutions ainda não têm produtos transcritos em dados-privados/autonomias-comerciais.json — a área de consulta acima assinala isso em vez de dar erro de fórmula.`]);
    aoa4.push([]);
    aoa4.push([`Tabela de apoio (não editar) — valores para 1 SIM da conta. Fonte: ${dadosAutonomias.fonte || "dados-privados/autonomias-comerciais.json"}${dadosAutonomias.atualizadoEm ? ` (atualizado em ${dadosAutonomias.atualizadoEm})` : ""}.`]);
    const rowHeaderTabela = aoa4.length;
    aoa4.push(["Produto", "Categoria", "Plafond", "Consultor", "Coordenador de Parceiro", "Gestor Canal"]);
    const rowPrimeiroProduto = aoa4.length;
    produtosAutonomia.forEach((p) => {
      const a1 = (p.autonomias && p.autonomias["1"]) || {};
      aoa4.push([p.nome, p.categoria || "", p.plafond || "",
        typeof a1.consultor === "number" ? a1.consultor : null,
        typeof a1.coordenadorParceiro === "number" ? a1.coordenadorParceiro : null,
        typeof a1.gestorCanal === "number" ? a1.gestorCanal : null]);
    });
    const rowUltimoProduto = aoa4.length - 1;

    // Referências 1-indexed (Excel) — linha 0-indexed + 1.
    const lInput = rowInput + 1;
    const lHeaderTabela = rowHeaderTabela + 1;
    const lPrimeiroProduto = rowPrimeiroProduto + 1;
    const lUltimoProduto = rowUltimoProduto + 1;
    const refProdutos = `A${lPrimeiroProduto}:A${lUltimoProduto}`;
    const refNiveisHeader = `D${lHeaderTabela}:F${lHeaderTabela}`;
    const refPrecos = `D${lPrimeiroProduto}:F${lUltimoProduto}`;
    // Categoria sem dados (Fixo/Smart Solutions) → mensagem clara, nunca erro de
    // fórmula. Produto/Nível não encontrado na tabela → mensagem clara também, nunca
    // um valor inventado (IFERROR só entra quando MATCH/INDEX falha mesmo).
    aoa4[rowInput] = [null, null, null, {
      t: "str",
      f: `IF(OR(A${lInput}="NRECEITAMÓVEL",A${lInput}="REFIDELIZAÇÃOMÓVEL"),IFERROR(INDEX(${refPrecos},MATCH(B${lInput},${refProdutos},0),MATCH(C${lInput},${refNiveisHeader},0)),"Produto/Nível não encontrado — confirma os valores"),"Sem dados de autonomia para esta categoria")`,
    }];

    const ws4 = XLSX.utils.aoa_to_sheet(aoa4);
    ws4["!cols"] = [{ wch: 22 }, { wch: 26 }, { wch: 22 }, { wch: 14 }, { wch: 22 }, { wch: 14 }];
    ws4["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 5 } },
      { s: { r: rowInput + 2, c: 0 }, e: { r: rowInput + 2, c: 5 } },
      { s: { r: rowHeaderTabela - 1, c: 0 }, e: { r: rowHeaderTabela - 1, c: 5 } },
    ];
    for (let r = rowPrimeiroProduto; r <= rowUltimoProduto; r++) {
      ["D", "E", "F"].forEach((col) => { const ref = `${col}${r + 1}`; if (ws4[ref]) ws4[ref].z = '"€ "#,##0.00'; });
    }
    XLSX.utils.book_append_sheet(wb, ws4, "Referência Autonomia");
  }

  return wb;
}

// Grava o Excel gerado em 03_Analise Faturas/{cliente}/Analise/ (pasta do projeto — ver nota
// em guardarPdfNaPastaCliente) e, sempre, dispara o download normal do browser como
// garantia de que o utilizador fica com o ficheiro de qualquer forma.
async function guardarExcelAnalise(handleProjeto, nomeCliente, wb, sufixo) {
  const nomeFicheiro = `${sanitizarNomePasta(nomeCliente)}_${sufixo || "Analise_Tarifarios"}_${new Date().toISOString().slice(0, 10)}.xlsx`;
  if (handleProjeto) {
    try {
      const pastaPropostas = await handleProjeto.getDirectoryHandle("03_Analise Faturas", { create: true });
      const pastaCliente = await pastaPropostas.getDirectoryHandle(sanitizarNomePasta(nomeCliente), { create: true });
      const pastaAnalise = await pastaCliente.getDirectoryHandle("Analise", { create: true });
      const fileHandle = await pastaAnalise.getFileHandle(nomeFicheiro, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(XLSX.write(wb, { bookType: "xlsx", type: "array" }));
      await writable.close();
      return { gravadoNaPasta: true, nomeFicheiro };
    } catch (e) {
      console.warn("Não foi possível gravar o Excel na pasta do cliente:", e.message);
    }
  }
  XLSX.writeFile(wb, nomeFicheiro);
  return { gravadoNaPasta: false, nomeFicheiro };
}

// Grava um ficheiro de texto (HTML/Markdown) em 03_Analise Faturas/{cliente}/Analise/
// — mesma convenção do Excel (guardarExcelAnalise): grava na pasta se ligada e SEMPRE
// dispara o download do browser como garantia (create:true nunca sobrescreve aqui
// porque o nome do ficheiro já vem com data — repetir no mesmo dia sobrescreve de
// propósito, gerar no dia seguinte cria um ficheiro novo, nunca perde a análise
// anterior).
async function guardarFicheiroTexto(handleProjeto, nomeCliente, nomeFicheiro, conteudo, mimeType) {
  if (handleProjeto) {
    try {
      const pastaPropostas = await handleProjeto.getDirectoryHandle("03_Analise Faturas", { create: true });
      const pastaCliente = await pastaPropostas.getDirectoryHandle(sanitizarNomePasta(nomeCliente), { create: true });
      const pastaAnalise = await pastaCliente.getDirectoryHandle("Analise", { create: true });
      const fileHandle = await pastaAnalise.getFileHandle(nomeFicheiro, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(conteudo);
      await writable.close();
      return { gravadoNaPasta: true, nomeFicheiro };
    } catch (e) {
      console.warn(`Não foi possível gravar ${nomeFicheiro} na pasta do cliente:`, e.message);
    }
  }
  const blob = new Blob([conteudo], { type: mimeType || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeFicheiro;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return { gravadoNaPasta: false, nomeFicheiro };
}

// Link claude-cli://open (Terminal — ver code.claude.com/docs/en/deep-links): abre um
// Terminal a correr o Claude Code CLI já com o texto na caixa de composição ("q" só
// preenche, nunca envia sozinho — Augusto ainda confirma com Enter) e a pasta de
// trabalho ("cwd") já selecionada. Trocado de claude://code/new (Claude Desktop) para
// claude-cli://open (Terminal) por decisão explícita do utilizador (2026-09-14).
// "q" tem limite de 5.000 caracteres, documentado (era ~14.000 no esquema antigo,
// sem documentação oficial) — truncamos e avisamos em vez de deixar o link falhar em
// silêncio; a cópia completa continua sempre disponível na área de transferência,
// como reserva.
const LIMITE_Q_CLAUDE_CODE = 5000;
function construirLinkClaudeCode(texto, pastaAbsoluta) {
  const truncado = texto.length > LIMITE_Q_CLAUDE_CODE;
  const params = new URLSearchParams({ q: truncado ? texto.slice(0, LIMITE_Q_CLAUDE_CODE) : texto });
  if (pastaAbsoluta) params.set("cwd", pastaAbsoluta);
  return { url: `claude-cli://open?${params.toString()}`, truncado };
}

// O File System Access API nunca expõe o caminho absoluto real de um handle (por

// parâmetro "cwd" do link claude-cli://) tem de vir escrito à mão pelo Augusto, 1 vez
// só (guardado em localStorage, não por cliente) — ver o campo em PropostasView.

// Caminho absoluto de uma subpasta de "09_Produtos Vodafone/" — usado pelo botão

// Pasta real de um produto — deriva-se do "ficheiroFonte" (ex.
// "04 - Central de Comunicações/One Net/onenet-paracliente.pdf" -> "04 - Central de
// Comunicações/One Net"), nunca da 1ª pasta da categoria. BUG CORRIGIDO (2026-09-15,
// reportado por Augusto no produto "One Net"): categorias com várias pastas de origem
// (Fixo, Smart Solutions — ICT/IoT) têm produtos cuja pasta real não é a 1ª listada em
// PASTA_POR_CATEGORIA_PRODUTOS — "One Net" pertence a "fixo", cuja 1ª pasta é
// "01 - Voz/Voz Fixa", nada a ver com a pasta real do One Net. Usar sempre
// "ficheiroFonte" (todo produto tem este campo) resolve isto para qualquer produto,
// sem depender da ordem das pastas na categoria.
function pastaOrigemProduto(produto, categoriaSubpastas) {
  if (produto.ficheiroFonte) {
    const partes = produto.ficheiroFonte.split("/");
    partes.pop(); // remove o nome do ficheiro, fica só a pasta
    if (partes.length) return partes.join("/");
  }
  // Sem ficheiroFonte (não deveria acontecer, mas por segurança): cai para a 1ª pasta
  // mapeada da categoria, como acontecia antes.
  return categoriaSubpastas && categoriaSubpastas.length ? categoriaSubpastas[0].pasta : null;
}

// A gravação em si (verificar existência prévia + escrever) vive em
// AdicionarPdfProduto, porque precisa de pedir confirmação ao utilizador ANTES de
// substituir um ficheiro — ver esse componente.

// Lê a folha "Novos Tarifários" tal como `gerarExcelAnaliseTarifarios` a escreveu —
// reescrito 2026-09-12 para a estrutura por bloco (item a item + "— SUBTOTAL —"), nunca
// por nome de cabeçalho (propositadamente não pensados para re-leitura automática).
// Devolve UMA linha por bloco (Nº/Serviço) — o consumidor (Dar seguimento / resumo para
// a skill) continua a apresentar por bloco, nunca item a item, usando o SUBTOTAL como
// "Mensalidade nova" do bloco. "Ação"/"Tarifário proposto" são agregados dos itens: se
// todos os itens tiverem a mesma Ação, usa-se essa; senão junta-se com " + " (caso raro
// de bloco com decisões mistas — a validação de "incompleta" cobre-o à mesma).
function lerNovosTarifariosDoExcel(wb) {
  const ws = wb.Sheets["Novos Tarifários"];
  if (!ws) return null;
  const valor = (r, c) => { const cel = ws[XLSX.utils.encode_cell({ r, c })]; return cel ? cel.v : undefined; };
  const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
  const blocos = [];
  let bloco = null;
  for (let r = 4; r <= range.e.r; r++) { // linha Excel 5 (0-indexed 4) = 1º cabeçalho de bloco
    const colA = valor(r, 0); // cabeçalho de bloco é uma linha de 1 só célula — cai na coluna A, não B
    const colB = valor(r, 1);
    if (typeof colA === "string" && colA.startsWith("▶ ")) {
      const texto = colA.slice(2);
      const separador = texto.indexOf(" — ");
      bloco = {
        numero: separador === -1 ? texto : texto.slice(0, separador),
        tarifarioAtual: separador === -1 ? "" : texto.slice(separador + 3),
        itens: [],
      };
      continue;
    }
    if (bloco && colB === "— SUBTOTAL —") {
      const acoesItens = [...new Set(bloco.itens.map((it) => it.acao))];
      const propostosItens = [...new Set(bloco.itens.map((it) => it.tarifarioProposto).filter(Boolean))];
      const numFn = (c) => { const v = valor(r, c); return typeof v === "number" ? v : null; };
      blocos.push({
        numero: bloco.numero,
        tarifarioAtual: bloco.tarifarioAtual,
        custoAtual: numFn(5),
        acao: acoesItens.length === 1 ? acoesItens[0] : acoesItens.join(" + "),
        tarifarioProposto: propostosItens.join("; "),
        mensalidadeNova: numFn(6),
        poupanca: numFn(7),
        observacao: valor(r, 8) || "",
        // Um item com Ação "por decidir" (nem Manter nem Anular) sem Mensalidade nova
        // própria — o SUBTOTAL sozinho não chega para detetar isto (soma ignora blanks).
        incompleta: bloco.itens.some((it) => it.acao !== "Manter" && it.acao !== "Anular" && it.mensalidadeNova === null),
      });
      bloco = null;
      continue;
    }
    if (bloco && colB) {
      const v = valor(r, 6);
      bloco.itens.push({ acao: valor(r, 2) || "Manter", tarifarioProposto: valor(r, 4) || "", mensalidadeNova: typeof v === "number" ? v : null });
    }
  }
  return blocos;
}

// IMPORTANTE: handle.requestPermission() só funciona quando chamado a partir de um
// clique real do utilizador ("user activation"). Chamá-lo sozinho ao abrir a página
// (sem clique nenhum) falha sempre, em silêncio — foi o que estava a acontecer antes.
// Por isso separamos: verificar em silêncio (pode correr ao abrir a página) de pedir
// permissão (só a partir de um onClick).

// Só verifica — nunca pede. Seguro para correr sozinho ao abrir a página.
async function temPermissaoConcedida(handle) {
  try {
    return (await handle.queryPermission({ mode: "readwrite" })) === "granted";
  } catch {
    return false;
  }
}

// Pede a permissão — só deve ser chamado diretamente a partir de um onClick.
async function pedirPermissao(handle) {
  try {
    return (await handle.requestPermission({ mode: "readwrite" })) === "granted";
  } catch {
    return false;
  }
}

// Usado dentro de ações despoletadas por clique (Guardar, Atualizar, etc.) — aqui é
// seguro pedir permissão porque vem sempre na sequência direta de um clique.
async function obterHandlePermitido(tipo) {
  if (!window.showOpenFilePicker) return null;
  const handle = await idbGet(tipo);
  if (!handle) return null;
  if (await temPermissaoConcedida(handle)) return handle;
  if (await pedirPermissao(handle)) return handle;
  return null;
}

// Gere a ligação a UM ficheiro (handle guardado no IndexedDB + estado da permissão).
// "pronto" só fica true quando já podemos ler/escrever sem mais nenhum clique.
// "precisaPermissao" indica que há um handle guardado mas o browser esqueceu a
// permissão (normal depois de fechar o browser) — mostra um botão "Continuar" que,
// ao ser clicado, pede a permissão outra vez SEM abrir o seletor de ficheiro.
function useLigacaoExcel(tipo, ehPasta) {
  const [handle, setHandle] = useState(null);
  const [pronto, setPronto] = useState(false);
  const [precisaPermissao, setPrecisaPermissao] = useState(false);

  useEffect(() => {
    (async () => {
      const h = await idbGet(tipo);
      if (!h) return;
      setHandle(h);
      if (await temPermissaoConcedida(h)) setPronto(true);
      else setPrecisaPermissao(true);
    })();
  }, []);

  const continuar = async () => {
    if (!handle) return false;
    const ok = await pedirPermissao(handle);
    if (ok) { setPronto(true); setPrecisaPermissao(false); }
    return ok;
  };

  const ligar = async () => {
    const ok = ehPasta ? await ligarPastaLocal(tipo) : await ligarFicheiroExcel(tipo);
    if (ok) {
      const h = await idbGet(tipo);
      setHandle(h);
      setPronto(true);
      setPrecisaPermissao(false);
    }
    return ok;
  };

  return { handle, pronto, precisaPermissao, continuar, ligar };
}
