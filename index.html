// conceito NOVO do dashboard, sem correspondência a nenhuma coluna real da folha Pipe
// — por isso NUNCA gravado no Excel (evita o risco de escolher um índice de coluna
// que colida com alguma coluna interna da Vodafone mais à frente na folha, fora do
// que já foi mapeado). Guardado à parte, indexado por `linhaExcel` (estável, nunca
// muda ao editar um negócio já existente) — mesmo padrão já usado para
// "prospetos-fechados"/"cliente-extra:" (persistência dupla localStorage + dados-
// privados/, quando a pasta estiver ligada).
const NEGOCIOS_CAMPANHA_FICHEIRO = "negocios-campanha.json";
function useNegociosCampanha(ligacaoPasta) {
  const [campanha, setCampanha] = useState(() => {
    try { return JSON.parse(localStorage.getItem("negocios-campanha") || "{}"); } catch { return {}; }
  });
  const [carregadoDoFicheiro, setCarregadoDoFicheiro] = useState(false);

  useEffect(() => {
    if (!ligacaoPasta.pronto || carregadoDoFicheiro) return;
    (async () => {
      const doFicheiro = await lerJsonDadosPrivados(ligacaoPasta.handle, NEGOCIOS_CAMPANHA_FICHEIRO);
      if (doFicheiro) setCampanha(doFicheiro);
      else if (Object.keys(campanha).length > 0) await guardarJsonDadosPrivados(ligacaoPasta.handle, NEGOCIOS_CAMPANHA_FICHEIRO, campanha);
      setCarregadoDoFicheiro(true);
    })();
  }, [ligacaoPasta.pronto]);

  useEffect(() => {
    try { localStorage.setItem("negocios-campanha", JSON.stringify(campanha)); } catch {}
    if (ligacaoPasta.pronto && carregadoDoFicheiro) guardarJsonDadosPrivados(ligacaoPasta.handle, NEGOCIOS_CAMPANHA_FICHEIRO, campanha);
  }, [campanha]);

  const definir = (linhaExcel, valor) => setCampanha((prev) => ({ ...prev, [linhaExcel]: valor }));
  const ehCampanha = (linhaExcel) => !!campanha[linhaExcel];

  return { campanha, definir, ehCampanha };
}

// Extraído de NegociosView — Passo 2 do plano de refactor seguro (2026-09-12, base:
// análise Graphify de NegociosView como god node). Pipeline de filtros/agregação
// PURO, sem efeitos secundários — mesma lógica, mesmas dependências de useMemo dos
// useMemos originais, só deslocada de sítio (nenhuma otimização/correção aproveitada
// nesta passagem, por decisão explícita do utilizador). NegociosView continua dona do
// estado dos filtros (useState) e do próprio "negocios" (via useNegocios) — este hook
// só recebe os valores atuais e devolve os derivados.
function useNegociosFiltrados(negocios, { modoVista, dataRef, filtroEstado, filtroNatureza, filtroCategoria, pesquisa }) {
  const mesChaveAtual = useMemo(() => mesChaveDeData(dataRef), [dataRef]);
  const trimestreChaveAtual = useMemo(() => trimestreChaveDeData(dataRef), [dataRef]);

  // Negócios do período selecionado, sempre a partir da "Data de início" (nunca do
  // texto livre antigo) — decisão explícita do utilizador (2026-09-10).
  const negociosDoPeriodo = useMemo(() => {
    if (modoVista === "mes") return negocios.filter((n) => mesDeDataInicio(n.dataInicio) === mesChaveAtual);
    return negocios.filter((n) => trimestreChaveDeDataInicio(n.dataInicio) === trimestreChaveAtual);
  }, [negocios, modoVista, mesChaveAtual, trimestreChaveAtual]);

  // Contagens dos chips de estado: aplicam os filtros de Natureza/Categoria/pesquisa
  // (para os números baterem certo com o resto do ecrã), mas nunca o próprio filtro de
  // Estado — assim cada chip mostra quantos negócios teria SE fosse selecionado.
  const negociosSemFiltroEstado = useMemo(() => {
    const termo = pesquisa.trim().toLowerCase();
    return negociosDoPeriodo.filter((n) =>
      (!filtroNatureza || n.natureza === filtroNatureza) &&
      (!filtroCategoria || n.categoria === filtroCategoria) &&
      (!termo || n.empresa.toLowerCase().includes(termo) || n.nif.includes(termo))
    );
  }, [negociosDoPeriodo, filtroNatureza, filtroCategoria, pesquisa]);

  const contagensPorEstado = useMemo(() => {
    const mapa = {};
    negociosSemFiltroEstado.forEach((n) => { mapa[n.estado] = (mapa[n.estado] || 0) + 1; });
    return mapa;
  }, [negociosSemFiltroEstado]);

  // Ordenado por linhaExcel decrescente — é a posição em que cada negócio foi
  // acrescentado à folha Pipe pela primeira vez (nunca muda ao editar, só ao criar),
  // por isso funciona como "data de criação" sem depender de nenhum campo extra do
  // Excel. Decisão explícita do utilizador (2026-09-09): editar um negócio não deve
  // fazê-lo saltar de posição na lista.
  const negociosFiltrados = useMemo(() => {
    return negociosSemFiltroEstado
      .filter((n) => !filtroEstado || n.estado === filtroEstado)
      .slice()
      .sort((a, b) => (b.linhaExcel || 0) - (a.linhaExcel || 0));
  }, [negociosSemFiltroEstado, filtroEstado]);

  const totais = useMemo(() => ({
    count: negociosFiltrados.length,
    comissaoUpfront: negociosFiltrados.reduce((s, n) => s + n.comissaoUpfront, 0),
    rlmc: negociosFiltrados.reduce((s, n) => s + n.rlmc, 0),
    bonusProxTri: negociosFiltrados.reduce((s, n) => s + n.bonusProxTri, 0),
  }), [negociosFiltrados]);

  // Bug crítico corrigido (2026-09-12, caso real "Cliente A"): esta soma nunca filtrava
  // por Estado — contava o RLMC de QUALQUER negócio da categoria/período (Em
  // Negociação, PIPE, Data Futura, até Perdido), não só Implementado. Por isso reverter
  // um negócio de "Implementado" para outro estado nunca o tirava destes cartões — eles
  // nunca tinham isolado "Implementado" para começar. Estes cartões alimentam a fórmula
  // da Comissão Upfront (RLMC × ...), que só faz sentido para negócio já fechado — por
  // isso, ao contrário de "negociosFiltrados"/"totais" (que já respeitavam o chip de
  // estado ativo), os 5 cartões RLMC ficam sempre fixos a "IMPLEMENTADO",
  // independentemente do chip selecionado.
  //
  // Somam RLMC AJUSTADA, nunca a bruta (decisão explícita do utilizador, 2026-09-20):
  // estes 5 cartões são literalmente os 5 objetivos trimestrais do Manual de Comissões
  // (Nova/Refidelização RLMC por Móvel/Fixo/SS), por isso têm de refletir o mesmo valor
  // usado no atingimento/Prémio Trimestral (calcularRlmcAjustadaAtingimento, já usado
  // em ComissoesView/calcularNivelTrimestralProposta — reaproveitado aqui, nunca
  // duplicado). A RLMC bruta continua disponível na coluna "RLMC" da tabela de
  // negócios e no cartão "RLMC" do resumo — só estes 5 cartões mudam.
  const totaisRLMC = useMemo(() => {
    const implementados = negociosDoPeriodo.filter((n) => n.estado === "IMPLEMENTADO");
    return RLMC_CARTOES.map((c) => ({
      ...c,
      valor: implementados.filter((n) => n.categoria === c.categoria).reduce((s, n) => s + (calcularRlmcAjustadaAtingimento(n) || 0), 0),
    }));
  }, [negociosDoPeriodo]);

  return { mesChaveAtual, trimestreChaveAtual, negociosSemFiltroEstado, negociosFiltrados, totais, contagensPorEstado, totaisRLMC };
}

// Grava a comparação (Excel vs JS) no Firestore — decisão explícita do utilizador
// (2026-09-18): coleção "negocios_calculo_paralelo", NUNCA fonte primária, só um
// registo informativo para consulta/histórico da validação. Best-effort: sem login,
// simplesmente não grava (o botão fica desativado antes disso).
async function guardarComparacaoPipe(linhas) {
  const lote = firebaseDb.batch();
  const agora = firebase.firestore.FieldValue.serverTimestamp();
  linhas.forEach((l) => {
    const ref = firebaseDb.collection("negocios_calculo_paralelo").doc(String(l.linhaExcel));
    lote.set(ref, { ...l, comparadoEm: agora });
  });
  await lote.commit();
}

// Painel de validação em paralelo (Fase 2, 2026-09-18) — NUNCA fonte primária de
// Negócios, só uma vista lado a lado (Excel vs motor JS reconstruído em
// calcularLinhaPipeJS) para Augusto confirmar, ao longo de um ciclo real de negócios,
// que os valores batem certo antes de sequer considerar migrar Negócios para a nuvem.
// Colapsado por defeito — é uma ferramenta de validação técnica, não algo para ver todos
// os dias.
function negocio_comissaoExcel(n) {
  // Excel só grava um valor "estático" na célula quando o próprio Excel recalculou —
  // se comissaoUpfront vier 0 mas RLMC existir, é mais provável a fórmula nunca ter
  // sido recalculada nesta linha (ficheiro só lido, não reaberto no Excel) do que um
  // 0 genuíno — nesse caso não faz sentido comparar, fica null (sem dado a comparar).
  return n.rlmc && !n.comissaoUpfront ? null : n.comissaoUpfront;
}

// Mesma lógica de negocio_comissaoExcel, aplicada a "BÓNUS PROX TRI" — a coluna que na
// fórmula real do Excel está partida (#REF!, ver lerTabelaXP) para qualquer linha cujo
// SheetJS não tenha conseguido ler um valor em cache: 0 com RLMC presente é mais
// provável "nunca recalculado/partido" do que um 0 genuíno.
function negocio_bonusExcel(n) {
  return n.rlmc && !n.bonusProxTri ? null : n.bonusProxTri;
}

// Passo 3 (2026-09-19, migração de Negócios para a nuvem): depois de Negócios
// migrar, a comparação JS vs Excel deixa de fazer sentido — os negócios já não vêm
// (só) do Excel, e negócios novos/editados na nuvem nunca têm linha/fórmula Excel
// nenhuma a comparar. Degrada graciosamente em vez de tentar continuar a comparar
// contra um Excel desatualizado ou crashar por falta de wbAtual — mantido no código
// (nunca apagado às cegas) até Augusto confirmar se quer o painel disponível só para
// consulta histórica do período de validação já feito, ou se pode ser removido.
function PainelValidacaoPipeIndisponivel() {
  return (
    <div className="border border-neutral-200 rounded-lg bg-white p-3 text-xs text-neutral-400">
      🧪 Validação Pipe (JS vs Excel) — já não aplicável: Negócios migrou para a nuvem, o Excel deixou de ser a fonte principal. Mantido no código só para eventual consulta histórica.
    </div>
  );
}

function PainelValidacaoPipe({ negocios, wbAtual, nuvemAtiva }) {
  // Guarda ANTES de qualquer hook — nunca depois (nº de hooks tem de ser sempre igual
  // entre renders; nuvemAtiva pode mudar de false→true na mesma sessão ao migrar).
  if (nuvemAtiva) return <PainelValidacaoPipeIndisponivel />;

  const [aberto, setAberto] = useState(false);
  const firebaseUser = useFirebaseAuthUser();
  const [aGuardar, setAGuardar] = useState(false);
  const [avisoGuardar, setAvisoGuardar] = useState("");

  const tabelaXP = useMemo(() => (wbAtual ? lerTabelaXP(wbAtual) : null), [wbAtual]);

  // Prémio Trimestral (PROPOSTA, ligada aqui só para comparação — decisão explícita do
  // utilizador, 2026-09-18, nunca fonte primária): "nível" calculado 1x por trimestre a
  // partir dos negócios IMPLEMENTADO desse trimestre (mesmo critério já usado em
  // totaisRLMC/RLMC_CARTOES), depois aplicado a cada negócio individualmente.
  const niveisPorTrimestre = useMemo(() => {
    const porTrimestre = {};
    negocios.forEach((n) => {
      if (n.estado !== "IMPLEMENTADO") return;
      const tri = trimestreChaveDeDataInicio(n.dataInicio);
      if (!tri) return;
      (porTrimestre[tri] = porTrimestre[tri] || []).push(n);
    });
    const resultado = {};
    Object.entries(porTrimestre).forEach(([tri, lista]) => { resultado[tri] = calcularNivelTrimestralProposta(lista); });
    return resultado;
  }, [negocios]);

  const comparacao = useMemo(() => {
    if (!tabelaXP) return [];
    return negocios.map((n) => {
      const semFormulaExcel = !temFormulaNaLinhaPipe(wbAtual, n.linhaExcel);
      const { comissaoUpfrontJS, avisos } = calcularLinhaPipeJS(n, tabelaXP);
      // Sem fórmula real nesta linha: o valor "Excel" não é genuíno (ver
      // temFormulaNaLinhaPipe) — nunca comparar, força null independentemente do que a
      // célula contiver.
      const comissaoExcel = semFormulaExcel ? null : negocio_comissaoExcel(n);
      const diferenca = comissaoUpfrontJS !== null && comissaoExcel !== null ? Number((comissaoUpfrontJS - comissaoExcel).toFixed(2)) : null;

      const tri = trimestreChaveDeDataInicio(n.dataInicio);
      const nivelInfo = tri ? niveisPorTrimestre[tri] : null;
      // null (nunca 0) sempre que o motor genuinamente não consegue calcular — falta de
      // trimestre/nível, ou o caso "n.a." da Figura 4 — para nunca confundir "sem prémio"
      // (0€, categoria <70%) com "não calculado".
      const premioJS = nivelInfo ? calcularPremioTrimestralProposta(n, nivelInfo.nivel, nivelInfo.porCategoria) : null;
      const premioExcel = semFormulaExcel ? null : negocio_bonusExcel(n);
      const diferencaPremio = premioJS !== null && premioExcel !== null ? Number((premioJS - premioExcel).toFixed(2)) : null;

      return {
        linhaExcel: n.linhaExcel, empresa: n.empresa, nif: n.nif, semFormulaExcel,
        comissaoExcel, comissaoUpfrontJS, diferenca, avisos,
        premioExcel, premioJS, diferencaPremio,
      };
    });
  }, [negocios, tabelaXP, niveisPorTrimestre, wbAtual]);

  const comComparacaoValida = comparacao.filter((l) => l.comissaoExcel !== null && l.comissaoUpfrontJS !== null);
  const comDiferenca = comComparacaoValida.filter((l) => Math.abs(l.diferenca) > 0.01);
  const comPremioValido = comparacao.filter((l) => l.premioExcel !== null && l.premioJS !== null);
  const comPremioDiferenca = comPremioValido.filter((l) => Math.abs(l.diferencaPremio) > 0.01);
  const comPremioNaoCalculado = comparacao.filter((l) => l.premioJS === null);
  const comAvisos = comparacao.filter((l) => l.avisos.length > 0);
  // Linhas a mostrar na tabela de diferenças: qualquer negócio COM fórmula real e com
  // diferença relevante num dos 2 valores — nunca uma linha "sem fórmula" aqui (essas
  // vivem à parte, em comSemFormulaExcel, nunca apresentadas como "bate/não bate com o
  // Excel").
  const linhasComDiferenca = comparacao.filter((l) =>
    !l.semFormulaExcel && ((l.diferenca !== null && Math.abs(l.diferenca) > 0.01) || (l.diferencaPremio !== null && Math.abs(l.diferencaPremio) > 0.01))
  );
  // Negócios cuja linha no Excel nunca teve fórmula real (ex. criados pelo próprio
  // dashboard) — mostra só o valor calculado pelo motor JS ("valor esperado"), nunca
  // como comparação/confirmação contra o Excel.
  // 🐛 Corrigido ao testar (2026-09-18, caso real Cliente A): não exigir
  // comissaoUpfrontJS!==null aqui — um negócio pode legitimamente não ter fórmula real
  // E não ter correspondência na tabela XP ao mesmo tempo (foi exatamente o caso real
  // que motivou esta secção). Mostrar sempre que semFormulaExcel for true, mesmo sem
  // valor JS nenhum ainda (a tabela mostra "—" nesse caso).
  const comSemFormulaExcel = comparacao.filter((l) => l.semFormulaExcel);

  const guardar = async () => {
    setAGuardar(true);
    try {
      await guardarComparacaoPipe(comparacao);
      setAvisoGuardar(`✓ ${comparacao.length} registo(s) gravado(s) em negocios_calculo_paralelo.`);
    } catch (e) {
      setAvisoGuardar("Não foi possível gravar — confirma o login e a ligação à internet.");
    }
    setAGuardar(false);
    setTimeout(() => setAvisoGuardar(""), 6000);
  };

  return (
    <div className="border border-neutral-200 rounded-lg bg-white">
      <button onClick={() => setAberto((v) => !v)} className="w-full flex items-center justify-between px-3 py-2 text-xs text-neutral-500 hover:text-neutral-800">
        <span>{aberto ? "▾" : "▸"} 🧪 Validação Pipe (JS vs Excel) — Fase 2, em paralelo, nunca fonte primária</span>
        {comparacao.length > 0 && <span className="text-neutral-400">{comComparacaoValida.length + comPremioValido.length} comparável(eis) · {linhasComDiferenca.length} com diferença</span>}
      </button>
      {aberto && (
        <div className="px-3 pb-3 space-y-2 border-t border-neutral-100 pt-2">
          {!wbAtual && (
            <div className="text-xs text-neutral-400">Liga ou atualiza o Excel "Mapa Trimestral" nesta sessão para calcular a validação — a comparação precisa da folha "XP" completa, não só do snapshot em cache.</div>
          )}
          {wbAtual && !tabelaXP && (
            <div className="text-xs text-red-600">Não encontrei a folha "XP" no Excel ligado — a validação não pode correr sem ela.</div>
          )}
          {wbAtual && tabelaXP && negocios.length === 0 && (
            <div className="text-xs text-neutral-400">Sem negócios na folha Pipe para comparar neste momento.</div>
          )}
          {wbAtual && tabelaXP && negocios.length > 0 && (
            <>
              <div className="text-[11px] text-neutral-400">
                {comparacao.length} negócio(s) · Upfront: {comComparacaoValida.length} comparável(eis), {comDiferenca.length} com diferença · Prémio Trimestral: {comPremioValido.length} comparável(eis), {comPremioDiferenca.length} com diferença, {comPremioNaoCalculado.length} não calculado(s) (cluster "BÓNUS PROX TRI" — fórmula original perdida, ver nota abaixo) · {comSemFormulaExcel.length} sem fórmula Excel na linha (nunca comparado, ver secção própria) · {comAvisos.length} com aviso.
              </div>
              {linhasComDiferenca.length === 0 && (comComparacaoValida.length > 0 || comPremioValido.length > 0) && (
                <div className="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-md px-2 py-1.5">✓ Todos os negócios comparáveis batem certo (diferença ≤ 0,01€), tanto no Upfront como no Prémio Trimestral.</div>
              )}
              {linhasComDiferenca.length > 0 && (
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="text-[10px] text-neutral-400 text-left">
                        <th className="pr-2 py-1">Empresa</th><th className="pr-2">NIF</th>
                        <th className="text-right px-2">Upfront Excel</th><th className="text-right px-2">Upfront JS</th>
                        <th className="text-right px-2">Dif. Upfront</th>
                        <th className="text-right px-2">Prémio Excel</th><th className="text-right px-2">Prémio JS</th>
                        <th className="text-right px-2">Dif. Prémio</th>
                      </tr>
                    </thead>
                    <tbody>
                      {linhasComDiferenca.map((l) => {
                        const upfrontDif = l.diferenca !== null && Math.abs(l.diferenca) > 0.01;
                        const premioDif = l.diferencaPremio !== null && Math.abs(l.diferencaPremio) > 0.01;
                        return (
                          <tr key={l.linhaExcel} className="border-t border-neutral-100">
                            <td className="py-1 pr-2">{l.empresa}</td><td className="pr-2 text-neutral-400">{l.nif}</td>
                            <td className="text-right px-2">{l.comissaoExcel !== null ? formatEuro(l.comissaoExcel) : "—"}</td>
                            <td className="text-right px-2">{l.comissaoUpfrontJS !== null ? formatEuro(l.comissaoUpfrontJS) : "—"}</td>
                            <td className={`text-right px-2 font-medium ${upfrontDif ? "text-amber-700" : "text-neutral-300"}`}>{l.diferenca !== null ? formatEuro(l.diferenca) : "—"}</td>
                            <td className="text-right px-2">
                              {l.premioJS === null ? <span className="text-neutral-400" title='Cluster "BÓNUS PROX TRI" — fórmula original do Excel perdida, sem trimestre/nível calculável para este negócio'>não calculado</span> : (l.premioExcel !== null ? formatEuro(l.premioExcel) : "—")}
                            </td>
                            <td className="text-right px-2">{l.premioJS !== null ? formatEuro(l.premioJS) : "—"}</td>
                            <td className={`text-right px-2 font-medium ${premioDif ? "text-amber-700" : "text-neutral-300"}`}>{l.diferencaPremio !== null ? formatEuro(l.diferencaPremio) : "—"}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
              {comSemFormulaExcel.length > 0 && (
                <div className="border border-blue-200 bg-blue-50 rounded-lg p-2 space-y-1.5">
                  <div className="text-[11px] text-blue-900 font-medium">
                    ℹ️ {comSemFormulaExcel.length} negócio(s) sem fórmula real do Excel nesta linha (ex. criado(s) pelo próprio "+ Novo Negócio" — a linha ficou fora do intervalo de fórmulas da folha Pipe). O valor "Excel" aí não é genuíno, por isso NUNCA comparado — só o valor esperado, calculado pelo motor JS. Duas razões DIFERENTES e independentes para um valor não aparecer aqui: (1) "sem fórmula na linha" — porque o Excel nunca calculou nada nesta linha, o que estás a ler agora; (2) "—" na coluna Upfront — porque o motor JS, por si só, também não conseguiu calcular (falta um campo de entrada, ex. "Estado do Tarifário" — ver aviso ⚠ abaixo). Uma linha pode ter só a 1ª razão, só a 2ª, ou as duas ao mesmo tempo (como o caso real Cliente A).
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="text-[10px] text-blue-700 text-left">
                          <th className="pr-2 py-1">Empresa</th><th className="pr-2">NIF</th>
                          <th className="text-right px-2">Upfront (valor esperado, JS)</th>
                          <th className="text-right px-2">Prémio Trimestral (valor esperado, JS)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {comSemFormulaExcel.map((l) => (
                          <tr key={l.linhaExcel} className="border-t border-blue-100">
                            <td className="py-1 pr-2">{l.empresa}</td><td className="pr-2 text-neutral-400">{l.nif}</td>
                            <td className="text-right px-2">
                              {l.comissaoUpfrontJS !== null ? formatEuro(l.comissaoUpfrontJS) : (
                                <span className="text-neutral-400" title={l.avisos.length ? `O motor JS também não conseguiu calcular: ${l.avisos.join(" ")}` : "Falta algum campo de entrada (ex. Tipo de Oferta, Meses) — ver avisos abaixo."}>—</span>
                              )}
                            </td>
                            <td className="text-right px-2">{l.premioJS !== null ? formatEuro(l.premioJS) : "não calculado"}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
              {comPremioNaoCalculado.length > 0 && (
                <div className="text-[11px] text-neutral-400 bg-neutral-50 rounded-md px-2 py-1.5">
                  ℹ️ {comPremioNaoCalculado.length} negócio(s) sem Prémio Trimestral calculado — cluster "BÓNUS PROX TRI" (célula original do Excel perdida, ver documentação) ou sem trimestre/nível determinável (data de início em falta, ou negócio ainda não Implementado).
                </div>
              )}
              {comAvisos.length > 0 && (
                <div className="space-y-1">
                  {comAvisos.slice(0, 10).map((l) => (
                    <div key={l.linhaExcel} className="text-[11px] text-amber-700 bg-amber-50 rounded-md px-2 py-1">⚠ {l.empresa}: {l.avisos.join(" ")}</div>
                  ))}
                  {comAvisos.length > 10 && <div className="text-[11px] text-neutral-400">+ {comAvisos.length - 10} aviso(s) adicional(is).</div>}
                </div>
              )}
              <button onClick={guardar} disabled={aGuardar || !firebaseUser}
                className="text-xs px-2.5 py-1.5 rounded-md bg-neutral-900 text-white hover:bg-neutral-800 disabled:opacity-40"><Icone nome="guardar" className="w-4 h-4 shrink-0" />
                {aGuardar ? "A gravar…" : "Guardar comparação no Firestore"}
              </button>
              {!firebaseUser && <span className="text-[11px] text-neutral-400 ml-2">Precisa de login (ver Assuntos/Clientes) para gravar.</span>}
              {avisoGuardar && <div className="text-[11px] text-neutral-600">{avisoGuardar}</div>}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function NegociosView({ ligacaoPasta }) {

    negocios, fonte, aCarregar, precisaPermissao, continuar, ligar, recarregar, wbAtual,

  } = useNegocios(ligacaoPasta);
  // sincronizarComClientes/removerNegocioDeTodosOsClientes/reverterClienteAutoCriadoSeVazio

  // de Clientes (incl. na nuvem, se migrado), nunca em Negócios.
  const { todosClientes, sincronizarComClientes, removerNegocioDeTodosOsClientes, reverterClienteAutoCriadoSeVazio } = useClientesNovos(ligacaoPasta);
  const { todosProspetos } = useProspetosNovos(ligacaoPasta);
  const { ehCampanha, definir: definirCampanha } = useNegociosCampanha(ligacaoPasta);
  // "Campanha" depois de Negócios migrar para a nuvem (Passo 2, 2026-09-19): passa a
  // viver diretamente no próprio documento (negocio.campanha) — deixa de precisar do
  // armazenamento à parte (só usado enquanto a fonte é o Excel/local, ver
  // useNegociosCampanha). Nunca lê os dois em simultâneo para o mesmo negócio.
  const campanhaDoNegocio = (n) => (nuvemAtiva ? !!n.campanha : ehCampanha(n.linhaExcel));
  const migrarNegociosParaNuvem = () => migrarParaNuvem((n) => ({ ...n, campanha: ehCampanha(n.linhaExcel) }));
  // Vista Mensal (decisão explícita do utilizador, 2026-09-10): passa a ser a vista
  // por defeito, a começar em Outubro de 2026 (início do Plano Comissional FY26/27).
  // "dataRef" é só um ponteiro de navegação (não representa nenhum negócio) — o mês

  const [avisoNegocio, setAvisoNegocio] = useState("");
  // Confirmação pendente de mover um prospect para Clientes (ver guardarNegocio) —
  // { nif, nome, prospect } quando há algo à espera de confirmação, null caso contrário.
  const [transicaoPendente, setTransicaoPendente] = useState(null);
  const [aTransicionar, setATransicionar] = useState(false);
  const [confirmarApagar, setConfirmarApagar] = useState(false);

  // Lista combinada de Clientes + Prospetos para o combobox "Empresa" — decisão

    return [...porNif.values()].sort((a, b) => a.nome.localeCompare(b.nome));
  }, [todosClientes, todosProspetos]);
  // Só bloqueia o NIF quando o texto atual do campo Empresa bate exatamente com um
  // nome conhecido — escrever uma empresa nova (ou editar o nome depois de escolher
  // uma) liberta o NIF outra vez para edição manual, sem precisar de mais nenhum estado.
  const empresaConhecida = useMemo(
    () => form && empresasCombinadas.find((o) => o.nome === form.empresa),
    [form && form.empresa, empresasCombinadas]
  );

  const categoriasDisponiveis = useMemo(() => [...new Set(negocios.map((n) => n.categoria).filter(Boolean))].sort(), [negocios]);

  // Passo 2 do plano de refactor seguro (2026-09-12) — pipeline de filtros/agregação
  // extraído para useNegociosFiltrados (ver definição acima, junto de CartaoRLMC).
  // Mesmos valores, mesma memoização de antes, só deslocados de sítio.
  const { mesChaveAtual, trimestreChaveAtual, negociosSemFiltroEstado, negociosFiltrados, totais, contagensPorEstado, totaisRLMC } =
    useNegociosFiltrados(negocios, { modoVista, dataRef, filtroEstado, filtroNatureza, filtroCategoria, pesquisa });

  const semDataInicioCount = useMemo(() => negocios.filter((n) => !n.dataInicio).length, [negocios]);

  const alertasFidelizacao = useMemo(() => {
    const emBreve = new Date();
    emBreve.setDate(emBreve.getDate() + 60);
    return negocios
      .map((n) => ({ n, alerta: calcularAlertaFidelizacao(n.dataInicio, n.meses) }))
      .filter((x) => x.alerta && x.alerta <= emBreve)
      .sort((a, b) => a.alerta - b.alerta);
  }, [negocios]);

  const abrirEdicao = (negocio) => { setAvisoNegocio(""); setConfirmarApagar(false); setForm({ ...negocio, campanha: campanhaDoNegocio(negocio) }); irParaTopo(); };
  const abrirNovo = () => { setAvisoNegocio(""); setConfirmarApagar(false); setForm({ ...NEGOCIO_VAZIO }); irParaTopo(); };
  const fecharEdicao = () => setForm(null);
  const mudarCampo = (key, value) => setForm((prev) => ({ ...prev, [key]: value }));

  const handleProjeto = ligacaoPasta.pronto ? ligacaoPasta.handle : null;

  const guardarNegocio = async () => {
    if (!form.empresa || !form.dataInicio) return;
    setAGuardarNegocio(true);
    const estadoAnterior = negocios.find((n) => n.linhaExcel === form.linhaExcel)?.estado;
    // "Período" deixa de ser texto livre — deriva sempre da Data de início (decisão
    // explícita do utilizador, 2026-09-10), só para leitura humana rápida no Excel;
    // o agrupamento por mês/trimestre no dashboard usa sempre a Data de início.
    const periodoTexto = labelMes(mesDeDataInicio(form.dataInicio));
    // "Campanha" só é gravada dentro do próprio negócio quando o destino é a nuvem —
    // no Excel continua à parte (ver useNegociosCampanha), gravada abaixo depois de
    // saber a linha atribuída. `escreverNegocio` (useNegocios) decide sozinho Excel vs
    // nuvem — ver Passo 2 do refactor (2026-09-19), nunca mais aqui.
    const negocio = { ...form, periodoTexto, categoria: calcularCategoriaNegocio(form.natureza, form.categoriaObjetivo, form.produtoSS) };
    if (nuvemAtiva) negocio.campanha = !!form.campanha;

    const linhaUsada = await escreverNegocio(negocio);

    if (linhaUsada) {
      negocio.linhaExcel = linhaUsada;
      // "Campanha" nunca vai para o Excel (ver useNegociosCampanha) — gravado à parte,
      // indexado pela linha atribuída (nova ou já existente). Na nuvem já ficou
      // gravada dentro do próprio documento por escreverNegocio, acima.
      if (!nuvemAtiva) definirCampanha(linhaUsada, !!form.campanha);
      await sincronizarComClientes(negocio);
      let avisoExtra = "";
      // Só verifica ao reverter DE Implementado — nunca ao criar/guardar um negócio
      // já implementado (não há nada a reverter) nem noutras mudanças de estado.
      if (estadoAnterior === "IMPLEMENTADO" && negocio.estado !== "IMPLEMENTADO") {
        const resultado = await reverterClienteAutoCriadoSeVazio(negocio);
        if (resultado && resultado.removido) {
          avisoExtra = ` Cliente "${resultado.nome}" (auto-criado, sem dados adicionais) removido.`;
        } else if (resultado && !resultado.removido) {
          avisoExtra = ` ⚠️ Cliente "${resultado.nome}" (auto-criado) NÃO foi removido — ${resultado.motivos.join("; ")}. Confirma manualmente se deve ser removido.`;
        }
      }
      // Bug real reportado por Augusto (2026-09-20): "negócio novo não aparece na
      // lista depois de gravar" — não era falha de escrita, era a Data de início cair
      // fora do mês/trimestre atualmente em exibição (a vista abre sempre em Outubro
      // 2026 por omissão, nunca no mês real de hoje) — o negócio gravava
      // corretamente, só ficava invisível sem nenhum aviso disso. Avisar sempre que
      // isto acontecer, com o período certo para onde navegar.
      const periodoDoNegocio = modoVista === "mes" ? mesDeDataInicio(negocio.dataInicio) : trimestreChaveDeDataInicio(negocio.dataInicio);
      const periodoAtual = modoVista === "mes" ? mesChaveAtual : trimestreChaveAtual;
      const avisoPeriodo = periodoDoNegocio !== periodoAtual
        ? ` ⚠️ Fora do período em exibição (${modoVista === "mes" ? labelMes(periodoAtual) : labelTrimestre(periodoAtual)}) — navega até ${modoVista === "mes" ? labelMes(periodoDoNegocio) : labelTrimestre(periodoDoNegocio)} para o ver na lista.`
        : "";
      setAvisoNegocio(`"${negocio.empresa}" guardado${negocio.estado === "IMPLEMENTADO" ? " e sincronizado com Clientes" : ""}.${avisoExtra}${avisoPeriodo}`);
      setForm(null);
      irParaTopo();

      // Transição Prospect → Cliente, com confirmação (decisão explícita do utilizador,
      // 2026-09-08): só quando o negócio ACABOU de passar a Implementado (não em cada
      // vez que se grava um já implementado) e o NIF corresponde a um prospect real já
      // existente. O NIF garante a correspondência; a ação de mover nunca é automática.
      if (negocio.estado === "IMPLEMENTADO" && estadoAnterior !== "IMPLEMENTADO" && negocio.nif) {
        const prospect = todosProspetos.find((p) => p.n === negocio.nif);
        if (prospect) setTransicaoPendente({ nif: negocio.nif, nome: negocio.empresa, prospect });
      }
    } else {
      setAvisoNegocio(nuvemAtiva ? "Não foi possível gravar na nuvem — confirma a ligação à internet." : 'Não foi possível escrever no Excel — confirma que o "Mapa Trimestral" está ligado acima.');
    }
    setAGuardarNegocio(false);
    setTimeout(() => setAvisoNegocio(""), 5000);
  };

  // Apagar exige sempre confirmação explícita antes (ver botão "Apagar negócio" na
  // ficha) — nunca chamada diretamente ao clicar, só depois do utilizador confirmar.
  const apagarNegocio = async (linhaExcel, nomeEmpresa) => {
    setAGuardarNegocio(true);
    const ok = await apagarNegocioDaFonte(linhaExcel);
    if (ok) {
      await removerNegocioDeTodosOsClientes(linhaExcel);
      setAvisoNegocio(`Negócio de "${nomeEmpresa}" apagado.`);
      setForm(null);
      irParaTopo();
    } else {
      setAvisoNegocio(nuvemAtiva ? "Não foi possível apagar na nuvem — confirma a ligação à internet." : 'Não foi possível apagar no Excel — confirma que o "Mapa Trimestral" está ligado acima.');
    }
    setAGuardarNegocio(false);
    setTimeout(() => setAvisoNegocio(""), 5000);
  };

  const confirmarTransicaoProspect = async () => {
    if (!transicaoPendente) return;
    setATransicionar(true);
    const { nif, nome, prospect } = transicaoPendente;

    const excelP = await removerProspectDoExcel(nif, handleProjeto).catch(() => false);
    const excelC = await adicionarClienteAoExcel(prospect, "", handleProjeto).catch(() => false);
    setAvisoNegocio(
      `"${nome}" movido de Prospetos para Clientes` +
      (excelP && excelC ? " — Excel atualizados ✓" : " — liga os ficheiros Excel de Prospetos/Clientes acima para atualização automática")

    setTransicaoPendente(null);
    setATransicionar(false);

  const ignorarTransicaoProspect = () => setTransicaoPendente(null);

  // Negócios sem NIF cujo nome bate com um cliente já conhecido — sugestão de preenchimento.
  const sugestoesNif = useMemo(() => {
    return negocios

        <MigracaoNuvemBanner nome="Negócios" firebaseUser={firebaseUser} nuvemAtiva={nuvemAtiva}

        <LigacaoExcel itens={[

        <div className="border border-dashed border-neutral-300 rounded-lg p-8 text-center text-sm text-neutral-400">

          <br />Se já tiveres ligado a pasta do projeto (aviso no topo do dashboard) e os dados já lá tiverem chegado via iCloud, os dados aparecem aqui diretamente, sem precisar de ligar o Excel outra vez.
        </div>
      </div>

        { rotulo: "RLMC", valor: formatEuroArredondado(totais.rlmc) },

      <LigacaoExcel itens={[
        { tipo: "negocios", nome: "Mapa Trimestral_Abril_Maio_2026.xlsx", fonte, aCarregar, precisaPermissao, onContinuar: continuar, onLigar: ligar, onRecarregar: recarregar },
      ]} />

      {/* Migração para a nuvem (Passo 2, 2026-09-19, decisão explícita do utilizador:
          Excel deixa de ser a fonte principal) — mesmo padrão/componente já usado em
          Clientes/Prospetos. Só aparece se ainda não migrado; depois de migrado,
          negocios passa a vir inteiramente do Firestore (ver useNegocios) e o Excel
          acima passa a ser só um caminho alternativo/de leitura opcional (ex. para
          alimentar a Tabela de Referência XP em "Comissões"), nunca mais escrito
          automaticamente por "Guardar negócio"/"Apagar negócio". */}
      <MigracaoNuvemBanner nome="Negócios" firebaseUser={firebaseUser} nuvemAtiva={nuvemAtiva}

      {/* Validação Pipe (JS vs Excel) mudou-se para o separador "Comissões"

      {sugestoesNif.length > 0 && (
        <div className="border border-blue-200 bg-blue-50 rounded-lg p-3 text-xs text-blue-900">
          <div className="font-medium mb-2">💡 {sugestoesNif.length} negócio{sugestoesNif.length !== 1 ? "s" : ""} sem NIF — encontrei o NIF em Clientes pelo nome</div>
          <div className="space-y-1.5">

                </span>
                <button onClick={() => aplicarSugestaoNif(negocio, sugestao.nif)}

      <div>

        </div>

        </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">

          <button type="button" onClick={() => avancarPeriodo(-1)}
            className="w-8 h-8 flex items-center justify-center rounded-md text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900">‹</button>
          <span className="flex-1 text-center text-sm font-medium">
            {modoVista === "mes" ? labelMes(mesChaveAtual) : labelTrimestre(trimestreChaveAtual)}
          </span>
          <button type="button" onClick={() => avancarPeriodo(1)}
            className="w-8 h-8 flex items-center justify-center rounded-md text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900">›</button>
        </div>
        <button type="button" onClick={() => setModoVista((v) => (v === "mes" ? "trimestre" : "mes"))}
          className="px-3 py-2 rounded-md border border-neutral-200 bg-white text-sm font-medium hover:border-neutral-400">
          Ver por {modoVista === "mes" ? "Trimestre" : "Mês"}
        </button>
        <select value={filtroNatureza} onChange={(e) => setFiltroNatureza(e.target.value)}
          className="px-3 py-2 rounded-md border border-neutral-200 bg-white text-sm focus:outline-none focus:border-red-600">
          <option value="">Nova Receita e Refidelização</option>
          <option value="NRECEITA">Nova Receita</option>
          <option value="REFIDELIZAÇÃO">Refidelização</option>
        </select>
        <select value={filtroCategoria} onChange={(e) => setFiltroCategoria(e.target.value)}
          className="px-3 py-2 rounded-md border border-neutral-200 bg-white text-sm focus:outline-none focus:border-red-600">
          <option value="">Todas as categorias</option>
          {categoriasDisponiveis.map((c) => <option key={c} value={c}>{labelCategoria(c)}</option>)}
        </select>
      </div>

      <div className="flex flex-wrap gap-1.5">
        <button onClick={() => setFiltroEstado("")}
          className={`px-2.5 py-1.5 rounded-full border text-xs font-medium whitespace-nowrap transition-colors ${
            filtroEstado === "" ? "bg-neutral-900 text-white border-neutral-900" : "bg-white text-neutral-600 border-neutral-200 hover:border-neutral-400"}`}>
          Todos ({negociosSemFiltroEstado.length})
        </button>
        {ESTADO_CHIPS.map((c) => (
          <button key={c.valor} onClick={() => setFiltroEstado((prev) => (prev === c.valor ? "" : c.valor))}
            className={`px-2.5 py-1.5 rounded-full border text-xs font-medium whitespace-nowrap transition-colors ${
              filtroEstado === c.valor ? "bg-neutral-900 text-white border-neutral-900" : "bg-white text-neutral-600 border-neutral-200 hover:border-neutral-400"}`}>
            {c.label} ({contagensPorEstado[c.valor] || 0})
          </button>

      </div>

      <div className="flex gap-2">
        <input type="text" value={pesquisa} onChange={(e) => setPesquisa(e.target.value)}
          placeholder="Pesquisar por empresa ou NIF..."
          className="flex-1 px-3 py-2 rounded-md border border-neutral-200 bg-white text-sm focus:outline-none focus:border-red-600" />
        <button onClick={abrirNovo}

          + Novo negócio
        </button>
      </div>

      {avisoNegocio && <div className="flex items-center gap-1.5 text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-md px-3 py-2">✓ {avisoNegocio}</div>}

      {transicaoPendente && (
        <div className="border border-blue-300 bg-blue-50 rounded-lg p-3 text-sm text-blue-900 space-y-2">
          <div>
            <span className="font-medium">{transicaoPendente.nome}</span> (NIF {transicaoPendente.nif}) passou a Implementado.
            Este NIF já existe em Prospetos — mover de Prospetos para Clientes?
          </div>
          <div className="flex items-center gap-2">
            <button onClick={confirmarTransicaoProspect} disabled={aTransicionar}
              className="text-xs px-3 py-1.5 rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-50">
              {aTransicionar ? "A mover…" : "Confirmar"}
            </button>
            <button onClick={ignorarTransicaoProspect} disabled={aTransicionar}
              className="text-xs px-3 py-1.5 rounded-md border border-blue-300 text-blue-800 hover:border-blue-400 disabled:opacity-50">
              Ignorar
            </button>

      {alertasFidelizacao.length > 0 && (

          <div className="font-medium mb-1">⚠ {alertasFidelizacao.length} negócio{alertasFidelizacao.length !== 1 ? "s" : ""} a entrar na janela de fidelização (últimos 6 meses de contrato)</div>
          <div className="space-y-0.5">

      {form && (

            <button onClick={fecharEdicao} className="text-xs text-neutral-500 hover:text-neutral-800">✕ Cancelar</button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Empresa</label>
              <ComboEmpresa value={form.empresa} opcoes={empresasCombinadas}
                onEscreverLivre={(v) => mudarCampo("empresa", v)}
                onEscolher={(o) => { mudarCampo("empresa", o.nome); mudarCampo("nif", o.nif); }} />
            </div>
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">NIF{empresaConhecida ? " (preenchido automaticamente)" : ""}</label>
              <input value={form.nif} onChange={(e) => mudarCampo("nif", e.target.value)}
                disabled={!!empresaConhecida}
                className={`w-full px-3 py-2 rounded-md border border-neutral-200 text-sm ${empresaConhecida ? "bg-neutral-50 text-neutral-500" : ""}`} />
            </div>
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Estado</label>
              <select value={form.estado} onChange={(e) => mudarCampo("estado", e.target.value)}
                className="w-full px-3 py-2 rounded-md border border-neutral-200 text-sm bg-white">
                {ESTADO_OPCOES.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>

            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Tipo Cliente</label>
              <select value={form.tipoCliente} onChange={(e) => mudarCampo("tipoCliente", e.target.value)}
                className="w-full px-3 py-2 rounded-md border border-neutral-200 text-sm bg-white">
                {TIPO_CLIENTE_OPCOES.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Natureza</label>
              <select value={form.natureza} onChange={(e) => mudarCampo("natureza", e.target.value)}
                className="w-full px-3 py-2 rounded-md border border-neutral-200 text-sm bg-white">

            <div>

              <select value={form.categoriaObjetivo} onChange={(e) => mudarCampo("categoriaObjetivo", e.target.value)}

            {form.categoriaObjetivo === "SS" && (
              <div>

/* ================= COMISSÕES =================
   Separador novo (2026-09-18, decisão explícita do utilizador) — extraído de "Negócios
   do Trimestre", que mantém-se focado em gerir os negócios em si (criar/editar/estado)
   e os cartões RLMC em bruto no topo. Este separador junta tudo o que é sobre
   COMISSÕES: Comissões do mês (Upfront), Prémio Trimestral (motor já validado, RLMC
   ajustada), objetivos trimestrais editáveis, Campanha (rastreio, sem prémio anual em
   euros — ver nota própria abaixo), e o Painel de Validação Pipe (JS vs Excel), que
   também se mudou para aqui. */

// Comissões do mês (Upfront) — decisão explícita do utilizador (2026-09-18): soma da
// Comissão Upfront (lida do Excel, campo já existente `comissaoUpfront`) dos negócios
// IMPLEMENTADO com "Data de início" nesse mês. NUNCA dividido em 3 parcelas — o
// próprio Manual de Comissões (secção 3.1, p.4) diz que "o pagamento da comissão
// Upfront será efetuado... até 60 dias após o termo do mês" — um pagamento único, não
// 3 parcelas mensais. O esquema de "3 meses subsequentes" das Figuras 5/6 é
// especificamente para os PRÉMIOS trimestrais ("Os prémios são apurados
// trimestralmente e pagos mensalmente..."), nunca para o Upfront — por isso não é
// replicado aqui.
// `categoria` opcional (2026-09-20, Passo 1 da comparação com ficheiros reais da
// Vodafone) — filtra também por `categoriaObjetivo` (FIXO/MÓVEL/SS), para poder
// mostrar um total por secção (Fixo/Móvel/ICT) em vez de um único cartão global.
// Sem `categoria`, comportamento 100% igual a antes (soma tudo).
function calcularComissoesDoMes(negocios, mesChave, categoria) {
  const doMes = negocios.filter((n) => n.estado === "IMPLEMENTADO" && mesDeDataInicio(n.dataInicio) === mesChave && (!categoria || n.categoriaObjetivo === categoria));
  return { total: Number(doMes.reduce((s, n) => s + (Number(n.comissaoUpfront) || 0), 0).toFixed(2)), negocios: doMes };
}

/* ================= COMPARAÇÃO COM FICHEIROS REAIS DA VODAFONE (2026-09-20) =================
   Decisão explícita do utilizador: 3 secções em "Comissões" (Fixo/Móvel/ICT — ICT sem
   ficheiro real ainda, mas já pronta), cada uma com upload do ficheiro Excel real da
   Vodafone dessa categoria, comparado por NIF contra o motor JS já existente.

   Estrutura confirmada por investigação real (2 ficheiros reais, 2026-09-19/20):
   várias folhas por ficheiro, cada uma com "Detalhe" na linha 1, linha 2 vazia,
   cabeçalho (29 colunas, sempre a começar por "Comissao") na linha seguinte, depois
   os dados. Folhas "normais" (código Comissao = CTRA_FIXO/CTRA_SS_FX no Fixo,
   CTRA/CTRA_SS no Móvel) vs folhas de CHARGEBACK — distinguidas pelo NOME da folha
   (confirmado por Augusto: contém "chargeback", ex. "Chargeback Fixo" — nunca visto
   um exemplo real ainda, os 2 ficheiros de teste não tinham nenhuma). Contribuinte =
   só NIF (o ficheiro real não tem nome de empresa nenhum). */

// ASSUMIDO (2026-09-20, confirmar com Augusto): a secção "ICT" do pedido corresponde à
// categoria "SS" (Smart Solutions) já usada em todo o motor de comissões (RLMC 5,
// OBJETIVO_TRIMESTRAL_POR_CATEGORIA, CATEGORIA_OBJETIVO_OPCOES) — não existe nenhuma
// categoria "ICT" própria no dashboard, e "ICT" é o termo externo que a Vodafone usa
// para o mesmo tipo de serviço. Se estiver errado, é só mudar `categoria: "SS"` aqui.
const SECCOES_COMISSAO_REAL = [
  { categoria: "FIXO", label: "Fixo" },
  { categoria: "MÓVEL", label: "Móvel" },
  { categoria: "SS", label: "ICT" },
];

function ehFolhaChargeback(nomeFolha) {
  return /chargeback/i.test(nomeFolha || "");
}

// Chave estável de um "negócio" no ficheiro real — ContractID é único por linha nos
// dados reais já inspecionados; fallback NIF+MSISDN só para o caso raro de faltar.
function chaveNegocioReal(linha) {
  return linha.contractId || `${linha.nif}:${linha.msisdn}`;
}

// Lê TODAS as folhas de um workbook de comissões reais — nunca assume que o cabeçalho
// está sempre na mesma linha (nos ficheiros reais varia entre linha 1 e linha 3
// consoante o tamanho da folha) — procura sempre a linha cuja 1ª célula é "Comissao".
// Folhas sem esse cabeçalho são ignoradas (nunca inventa dados de uma folha
// inesperada). "Comissão Valor" vem como texto no ficheiro real — convertido aqui.
function lerLinhasComissaoReal(wb) {
  const linhas = [];
  wb.SheetNames.forEach((nomeFolha) => {
    const sheet = wb.Sheets[nomeFolha];
    if (!sheet) return;
    const chargeback = ehFolhaChargeback(nomeFolha);
    const todasLinhas = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, blankrows: true });
    const headerIdx = todasLinhas.findIndex((r) => r && r[0] === "Comissao");
    if (headerIdx === -1) return;
    const headers = todasLinhas[headerIdx];
    const idx = (nome) => headers.indexOf(nome);
    const iNif = idx("NIF"), iContract = idx("ContractID"), iMsisdn = idx("MSISDN"),
      iValor = idx("Comissão Valor"), iOferta = idx("OfferCategory"), iReceita = idx("Tipo Receita"),
      iOpty = idx("Opportunity ID");
    for (let i = headerIdx + 1; i < todasLinhas.length; i++) {
      const r = todasLinhas[i];
      if (!r || r[0] == null || iNif === -1 || r[iNif] == null) continue;
      const valorTexto = iValor !== -1 ? r[iValor] : null;
      linhas.push({
        folha: nomeFolha, chargeback,
        nif: String(r[iNif]),
        contractId: iContract !== -1 && r[iContract] != null ? String(r[iContract]) : "",
        msisdn: iMsisdn !== -1 && r[iMsisdn] != null ? String(r[iMsisdn]) : "",
        comissaoValor: valorTexto != null ? Number(String(valorTexto).replace(",", ".")) || 0 : 0,
        offerCategory: iOferta !== -1 ? r[iOferta] : null,
        tipoReceita: iReceita !== -1 ? r[iReceita] : null,
        opportunityId: iOpty !== -1 ? r[iOpty] : null,
      });
    }
  });
  return linhas;
}

// Histórico de comissões reais já importadas (só linhas NORMAIS, nunca chargeback) —
// persistido (localStorage + dados-privados/, mesmo padrão de useNegociosCampanha),
// nunca apagado entre importações (cumulativo) — é o que permite a uma folha de
// chargeback FUTURA saber se aquele negócio já recebeu comissão antes. Indexado por
// categoria (Fixo/Móvel/ICT nunca se misturam) + chaveNegocioReal.
const COMISSOES_REAIS_HISTORICO_FICHEIRO = "comissoes-reais-historico.json";
function useHistoricoComissoesReais(ligacaoPasta) {
  const [historico, setHistorico] = useState(() => {
    try { return JSON.parse(localStorage.getItem("comissoes-reais-historico") || "{}"); } catch { return {}; }
  });
  const [carregadoDoFicheiro, setCarregadoDoFicheiro] = useState(false);

  useEffect(() => {
    if (!ligacaoPasta.pronto || carregadoDoFicheiro) return;
    (async () => {
      const doFicheiro = await lerJsonDadosPrivados(ligacaoPasta.handle, COMISSOES_REAIS_HISTORICO_FICHEIRO);
      if (doFicheiro) setHistorico(doFicheiro);
      else if (Object.keys(historico).length > 0) await guardarJsonDadosPrivados(ligacaoPasta.handle, COMISSOES_REAIS_HISTORICO_FICHEIRO, historico);
      setCarregadoDoFicheiro(true);
    })();
  }, [ligacaoPasta.pronto]);

  useEffect(() => {
    try { localStorage.setItem("comissoes-reais-historico", JSON.stringify(historico)); } catch {}
    if (ligacaoPasta.pronto && carregadoDoFicheiro) guardarJsonDadosPrivados(ligacaoPasta.handle, COMISSOES_REAIS_HISTORICO_FICHEIRO, historico);
  }, [historico]);

  const registarLinhas = (categoria, linhas) => {
    setHistorico((prev) => {
      const atual = { ...(prev[categoria] || {}) };
      linhas.filter((l) => !l.chargeback).forEach((l) => {
        atual[chaveNegocioReal(l)] = { nif: l.nif, contractId: l.contractId, msisdn: l.msisdn, comissaoValor: l.comissaoValor, importadoEm: new Date().toISOString() };
      });
      return { ...prev, [categoria]: atual };
    });
  };
  const procurarHistorico = (categoria, linha) => (historico[categoria] || {})[chaveNegocioReal(linha)] || null;

  return { historico, registarLinhas, procurarHistorico };
}

// Comparação central (Passo 3 + Passo 4) — pura, sem efeitos secundários (nunca
// escreve no histórico sozinha, ver registarLinhas acima, chamado à parte).
//
// Passo 3 (folhas normais): agrupa por NIF dos 2 lados (motor JS vs ficheiro real),
// arredonda AMBOS ao euro inteiro antes de comparar (nunca alerta por causa de
// cêntimos de arredondamento) — decisão explícita do utilizador. NIF que só existe
// num dos lados é reportado à parte (`semCorrespondencia`), nunca como "diferença".
//
// Passo 4 (folhas de chargeback): por LINHA (não agregado por NIF — um chargeback é
// sobre um contrato específico), procura o histórico pelo mesmo ContractID/NIF+MSISDN.
// Sem histórico: `historicoEncontrado: false`, nunca alarme. Com histórico: sempre
// alertado (`historicoEncontrado: true`), e `suspeito: true` especificamente quando o
// valor do chargeback não bate com o valor histórico (mesma tolerância de
// arredondamento ao euro do Passo 3, por consistência).
function compararComissoesReais(negociosDoMes, linhasReais, procurarHistorico, categoria) {
  const normais = linhasReais.filter((l) => !l.chargeback);
  const chargebacks = linhasReais.filter((l) => l.chargeback);

  const jsPorNif = {};
  negociosDoMes.forEach((n) => {
    if (!n.nif) return;
    jsPorNif[n.nif] = (jsPorNif[n.nif] || 0) + (Number(n.comissaoUpfront) || 0);
  });
  const realPorNif = {};
  normais.forEach((l) => { realPorNif[l.nif] = (realPorNif[l.nif] || 0) + l.comissaoValor; });

  const todosNifs = [...new Set([...Object.keys(jsPorNif), ...Object.keys(realPorNif)])];
  const comparacaoNormal = todosNifs.map((nif) => {
    const temJS = jsPorNif[nif] !== undefined;
    const temReal = realPorNif[nif] !== undefined;
    if (!temJS || !temReal) {
      return { nif, js: temJS ? jsPorNif[nif] : null, real: temReal ? realPorNif[nif] : null, diferenca: null, semCorrespondencia: !temJS ? "só na Vodafone" : "só no motor JS" };
    }
    const js = jsPorNif[nif], real = realPorNif[nif];
    const diferenca = Math.round(js) - Math.round(real);
    return { nif, js, real, diferenca, semCorrespondencia: null };
  });

  const comparacaoChargeback = chargebacks.map((l) => {
    const hist = procurarHistorico(categoria, l);
    if (!hist) return { ...l, historicoEncontrado: false, valorHistorico: null, suspeito: null };
    const diferenca = Math.round(l.comissaoValor) - Math.round(hist.comissaoValor);
    return { ...l, historicoEncontrado: true, valorHistorico: hist.comissaoValor, suspeito: diferenca !== 0 };
  });

  return { comparacaoNormal, comparacaoChargeback };
}

// Passo 5 — exporta sempre para um ficheiro Excel NOVO (nunca mistura com o ficheiro
// original da Vodafone, nunca só no ecrã) — 2 folhas: "Comparação" (Passo 3) e
// "Chargebacks" (Passo 4, mesmo com 0 linhas — 0 chargebacks é um resultado válido).
function exportarComparacaoComissoesReais(categoriaLabel, mesChaveAtual, comparacaoNormal, comparacaoChargeback) {
  const wb = XLSX.utils.book_new();
  const aoaNormal = [
    ["NIF", "Valor Esperado (JS, €)", "Valor Real (Vodafone, €)", "Diferença (€, arredondado)", "Observação"],
    ...comparacaoNormal.map((c) => [
      c.nif,
      c.js !== null ? Number(c.js.toFixed(2)) : "",
      c.real !== null ? Number(c.real.toFixed(2)) : "",
      c.diferenca !== null ? c.diferenca : "",
      c.semCorrespondencia || (c.diferenca === 0 ? "OK" : "Diferença"),
    ]),
  ];
  const wsNormal = XLSX.utils.aoa_to_sheet(aoaNormal);
  wsNormal["!cols"] = [{ wch: 14 }, { wch: 20 }, { wch: 22 }, { wch: 22 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, wsNormal, "Comparação");

  const aoaCharge = [
    ["NIF", "ContractID", "MSISDN", "Valor Chargeback (€)", "Histórico Encontrado", "Valor Histórico (€)", "Suspeito"],
    ...comparacaoChargeback.map((c) => [
      c.nif, c.contractId, c.msisdn, Number(c.comissaoValor.toFixed(2)),
      c.historicoEncontrado ? "Sim" : "Não",
      c.valorHistorico !== null ? Number(c.valorHistorico.toFixed(2)) : "",
      c.historicoEncontrado ? (c.suspeito ? "⚠️ SIM" : "Não") : "—",
    ]),
  ];
  const wsCharge = XLSX.utils.aoa_to_sheet(aoaCharge);
  wsCharge["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, wsCharge, "Chargebacks");

  XLSX.writeFile(wb, `Comparacao_Comissoes_${categoriaLabel}_${mesChaveAtual}.xlsx`);
}

// Secção por categoria (Fixo/Móvel/ICT) — upload + comparação + export. Declarada a
// nível de módulo (nunca dentro de ComissoesView — mesma razão do bug de foco já
// corrigido em InputObjetivo).
function SeccaoComissaoReal({ categoria, label, negocios, mesChaveAtual, procurarHistorico, registarLinhas }) {
  const inputRef = React.useRef(null);
  const [aProcessar, setAProcessar] = useState(false);
  const [erro, setErro] = useState("");
  const [resultado, setResultado] = useState(null); // { nomeFicheiro, comparacaoNormal, comparacaoChargeback }

  const comissoesDoMesCategoria = useMemo(() => calcularComissoesDoMes(negocios, mesChaveAtual, categoria), [negocios, mesChaveAtual, categoria]);
  const totalJS = comissoesDoMesCategoria.total;

  const processarFicheiro = async (file) => {
    setErro(""); setAProcessar(true);
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
      const linhas = lerLinhasComissaoReal(wb);
      if (!linhas.length) {
        setErro('Não encontrei nenhuma folha com o formato esperado (cabeçalho a começar em "Comissao") neste ficheiro.');
        setAProcessar(false);
        return;
      }
      const { comparacaoNormal, comparacaoChargeback } = compararComissoesReais(comissoesDoMesCategoria.negocios, linhas, procurarHistorico, categoria);
      registarLinhas(categoria, linhas);
      setResultado({ nomeFicheiro: file.name, comparacaoNormal, comparacaoChargeback });
    } catch (e) {
      setErro("Não foi possível ler o ficheiro: " + e.message);
    }
    setAProcessar(false);
  };

  const diferencasNormal = resultado ? resultado.comparacaoNormal.filter((c) => c.semCorrespondencia || c.diferenca !== 0) : [];
  const chargebacksComAlerta = resultado ? resultado.comparacaoChargeback.filter((c) => c.historicoEncontrado) : [];

  return (
    <div className="border border-neutral-200 rounded-lg bg-white p-4 space-y-3">
      <div className="flex items-baseline justify-between gap-2">
        <div className="text-xs font-medium text-neutral-400">{label.toUpperCase()} — {labelMes(mesChaveAtual)}</div>
      </div>
      <div className="text-2xl font-semibold text-neutral-800">{formatEuro(totalJS)}</div>
      <div className="text-[11px] text-neutral-400">Comissão Upfront ({label}) calculada pelo motor JS para este mês — mesma fonte de sempre, nunca o ficheiro real.</div>

      <div className="pt-2 border-t border-neutral-100 space-y-2">
        <div onClick={() => inputRef.current && inputRef.current.click()}
          className="border-2 border-dashed border-neutral-300 rounded-lg p-3 text-center text-xs text-neutral-400 cursor-pointer hover:border-neutral-400">
          {aProcessar ? "A processar…" : `📎 Carregar ficheiro real da Vodafone (${label}) para comparar`}
          <input ref={inputRef} type="file" accept=".xlsx,.xls" className="hidden"
            onChange={(e) => { const f = e.target.files[0]; e.target.value = ""; if (f) processarFicheiro(f); }} />
        </div>
        {erro && <div className="text-xs text-red-600">{erro}</div>}

        {resultado && (
          <div className="space-y-2 text-xs">
            <div className="text-neutral-500">Ficheiro: <span className="font-medium">{resultado.nomeFicheiro}</span></div>
            <div className={`rounded-md px-2 py-1.5 border ${diferencasNormal.length ? "bg-amber-50 border-amber-200 text-amber-800" : "bg-emerald-50 border-emerald-200 text-emerald-800"}`}>
              {diferencasNormal.length ? `⚠️ ${diferencasNormal.length} NIF(s) com diferença (ou sem correspondência) num total de ${resultado.comparacaoNormal.length}` : `✓ Todos os ${resultado.comparacaoNormal.length} NIF(s) batem certo (tolerância: euro inteiro)`}
            </div>
            <div className={`rounded-md px-2 py-1.5 border ${chargebacksComAlerta.some((c) => c.suspeito) ? "bg-red-50 border-red-200 text-red-800" : chargebacksComAlerta.length ? "bg-amber-50 border-amber-200 text-amber-800" : "bg-neutral-50 border-neutral-200 text-neutral-500"}`}>
              {resultado.comparacaoChargeback.length === 0
                ? "Sem chargebacks neste ficheiro."
                : `${resultado.comparacaoChargeback.length} chargeback(s) — ${chargebacksComAlerta.length} com histórico encontrado${chargebacksComAlerta.some((c) => c.suspeito) ? " (⚠️ pelo menos 1 valor SUSPEITO, não bate com o histórico)" : ""}`}
            </div>
            <button type="button" onClick={() => exportarComparacaoComissoesReais(label, mesChaveAtual, resultado.comparacaoNormal, resultado.comparacaoChargeback)}
              className="text-xs px-2.5 py-1.5 rounded-md bg-neutral-900 text-white hover:bg-neutral-800">
              📥 Exportar comparação (Excel)
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// Campo de texto livre (nunca type="number") — o spinner nativo e o scroll-wheel do
// Chrome sobre um <input type="number"> alteravam o valor sem o utilizador reparar
// (bug reportado por Augusto, 2026-09-19: "2500" gravava "1,99"). O valor guardado é
// sempre a string tal como o utilizador escreveu; só é convertido para número no
// momento de ler (parseNumeroPT, formatos PT aceites).
// Declarado FORA de ComissoesView, a nível de módulo — 2º bug real reportado por
// Augusto (2026-09-19): estava definido dentro do corpo de ComissoesView, o que faz o
// React recriar o tipo do componente (e o <input> por baixo) a cada render do pai,
// desmontando-o e perdendo o foco a cada tecla escrita. Nunca declarar um componente
// dentro doutro componente — mesma razão pela qual todos os outros componentes deste
// ficheiro já estão declarados a nível de módulo.
function InputObjetivo({ valor, onChange, placeholder }) {
  return (
    <input type="text" inputMode="decimal" value={valor ?? ""} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
      className="w-28 px-2 py-1 rounded-md border border-neutral-200 text-xs text-right" />
  );
}

// Editor da Tabela de Referência XP (Passo 1, 2026-09-19) — genérico/orientado a
// dados em vez de campos fixos: percorre o que a tabela realmente contiver (Object.
// entries), em vez de assumir de antemão quais são as chaves exatas (essas vêm de
// endereços de célula do Excel — GOLD/SILVER/etc. só se sabe ao ler o ficheiro real).
// Isto também torna o editor correto por construção depois de migrado — mostra
// exatamente o que está gravado no Firestore, nunca uma suposição de forma fixa.
// Declarado a nível de módulo (nunca dentro de ComissoesView) — mesma razão do bug
// de perda de foco já corrigido em InputObjetivo, ver nota em ComissoesView.
function EditorTabelaXP({ tabela, onGuardar, aGuardar }) {
  const [rascunho, setRascunho] = useState(tabela);
  useEffect(() => { setRascunho(tabela); }, [tabela]);
  if (!rascunho) {
    return <div className="text-xs text-neutral-400">Sem tabela de referência XP disponível ainda — liga o Excel "Mapa Trimestral" acima pelo menos uma vez (mesmo sem migrar Negócios) para a ler, ou migra-a para a nuvem se já tiveres uma versão lá.</div>;
  }
  const mudarValor = (seccao, chave, valorTexto) => setRascunho((prev) => ({ ...prev, [seccao]: { ...prev[seccao], [chave]: parseNumeroPT(valorTexto) } }));
  return (
    <div className="space-y-3">
      {Object.entries(rascunho).map(([seccao, subTabela]) => (
        <div key={seccao}>
          <div className="text-[11px] font-medium text-neutral-400 uppercase mb-1">{seccao}</div>
          <div className="space-y-1">
            {Object.entries(subTabela || {}).map(([chave, valor]) => (
              <div key={chave} className="flex items-center justify-between gap-2 text-xs">
                <span className="text-neutral-600 truncate">{chave}</span>
                <InputObjetivo valor={valor} placeholder="" onChange={(v) => mudarValor(seccao, chave, v)} />
              </div>
            ))}
          </div>
        </div>
      ))}
      <button type="button" onClick={() => onGuardar(rascunho)} disabled={aGuardar}
        className="text-xs px-2.5 py-1.5 rounded-md bg-neutral-900 text-white hover:bg-neutral-800 disabled:opacity-40">
        {aGuardar ? "A gravar…" : "Guardar tabela de referência"}
      </button>
    </div>
  );
}

function ComissoesView({ ligacaoPasta }) {
  const { negocios, fonte, aCarregar, precisaPermissao, continuar, ligar, recarregar, wbAtual, nuvemAtiva } = useNegocios(ligacaoPasta);
  const { ehCampanha } = useNegociosCampanha(ligacaoPasta);
  // Ver mesma nota em NegociosView — depois da migração, "Campanha" vive diretamente
  // no documento (negocio.campanha), nunca no armazenamento à parte.
  const campanhaDoNegocio = (n) => (nuvemAtiva ? !!n.campanha : ehCampanha(n.linhaExcel));
  const { definirCampo, objetivosCategoriaDoTrimestre, objetivoCampanhaDoTrimestre } = useObjetivosTrimestrais(ligacaoPasta);
  const {
    tabela: tabelaXPAtual, firebaseUser: firebaseUserXP, nuvemAtiva: nuvemAtivaXP,
    migrarParaNuvem: migrarTabelaXP, aMigrar: aMigrarXP, definir: definirTabelaXP, temFonteExcel: temExcelParaXP,
  } = useTabelaXP(wbAtual);
  const [aGuardarXP, setAGuardarXP] = useState(false);
  const [abertoXP, setAbertoXP] = useState(false);
  const guardarTabelaXP = async (novaTabela) => {
    setAGuardarXP(true);
    try { await definirTabelaXP(novaTabela); } finally { setAGuardarXP(false); }
  };

  // Um único navegador de período (mês) — o trimestre correspondente deriva-se sempre
  // do mesmo mês selecionado, para nunca ter 2 seletores de período dessincronizados.
  const [dataRef, setDataRef] = useState(() => new Date(2026, 9, 1));
  const avancarMes = (delta) => setDataRef((d) => { const nd = new Date(d); nd.setMonth(nd.getMonth() + delta); return nd; });
  const mesChaveAtual = useMemo(() => mesChaveDeData(dataRef), [dataRef]);
  const trimestreChaveAtual = useMemo(() => trimestreChaveDeData(dataRef), [dataRef]);

  // Histórico de importações de ficheiros reais da Vodafone (Passo 4, 2026-09-20) —
  // persistido, usado pelas 3 secções abaixo para os chargebacks saberem se já houve
  // comissão recebida antes para o mesmo negócio.
  const { registarLinhas: registarLinhasComissaoReal, procurarHistorico: procurarHistoricoComissaoReal } = useHistoricoComissoesReais(ligacaoPasta);

  const negociosDoTrimestre = useMemo(
    () => negocios.filter((n) => n.estado === "IMPLEMENTADO" && trimestreChaveDeDataInicio(n.dataInicio) === trimestreChaveAtual),
    [negocios, trimestreChaveAtual]
  );
  const objetivosCategoriaTrimestre = useMemo(() => objetivosCategoriaDoTrimestre(trimestreChaveAtual), [trimestreChaveAtual, objetivosCategoriaDoTrimestre]);
  const nivelTrimestre = useMemo(
    () => calcularNivelTrimestralProposta(negociosDoTrimestre, objetivosCategoriaTrimestre),
    [negociosDoTrimestre, objetivosCategoriaTrimestre]
  );
  const premioTotalTrimestre = useMemo(() => {
    return negociosDoTrimestre.reduce((s, n) => {
      const p = calcularPremioTrimestralProposta(n, nivelTrimestre.nivel, nivelTrimestre.porCategoria);
      return s + (p || 0); // null (Figura 4 "n.a.") não soma — fica de fora do total, nunca tratado como 0
    }, 0);
  }, [negociosDoTrimestre, nivelTrimestre]);

  // Campanha — total do TRIMESTRE selecionado (RLMC ajustada, nunca bruta).
  const negociosCampanhaTrimestre = useMemo(() => negociosDoTrimestre.filter((n) => campanhaDoNegocio(n)), [negociosDoTrimestre, nuvemAtiva, ehCampanha]);
  const totalCampanhaTrimestre = useMemo(
    () => Number(negociosCampanhaTrimestre.reduce((s, n) => s + (calcularRlmcAjustadaAtingimento(n) || 0), 0).toFixed(2)),
    [negociosCampanhaTrimestre]
  );
  const objetivoCampanhaTrimestre = objetivoCampanhaDoTrimestre(trimestreChaveAtual);
  const atingimentoCampanhaPercent = objetivoCampanhaTrimestre ? Number((totalCampanhaTrimestre / objetivoCampanhaTrimestre * 100).toFixed(1)) : null;
  const campanhaTrimestreAtingida = objetivoCampanhaTrimestre ? totalCampanhaTrimestre >= objetivoCampanhaTrimestre : null;

  // Meta de compensação anual (Parte C, 2026-09-18) — acumulado dos 4 trimestres do
  // ANO CIVIL do mês selecionado (mesma convenção de trimestreChaveDeData, "AAAA-QN"),
  // mesmo com o ano ainda a decorrer (mostra o progresso até agora, nunca bloqueia à
  // espera dos 4 trimestres terminarem). NUNCA calcula/mostra um valor de prémio em
  // euros — só o indicador de elegibilidade, decisão explícita do utilizador (o valor
  // desse prémio extra fica por definir, fora de âmbito).
  // Uma linha por trimestre do ano civil — objetivo é lido tal como o utilizador o
  // definiu (ou null, nunca 0, se ainda não definiu), alcançado é sempre a RLMC
  // ajustada real dos negócios "Campanha = Sim" desse trimestre (mesmo sem objetivo
  // ainda definido — mostra o progresso já feito). "Acumulado"/"objetivo acumulado"
  // só somam os trimestres com objetivo definido, para nunca comparar um acumulado
  // real contra um objetivo que assume 0€ (ou 4× o 1º valor) para trimestres futuros
  // ainda por anunciar pela Vodafone — decisão explícita do utilizador (2026-09-19).
  const anoAtual = dataRef.getFullYear();
  const trimestresDoAno = useMemo(() => [1, 2, 3, 4].map((q) => `${anoAtual}-Q${q}`), [anoAtual]);
  const linhasAnoCampanha = useMemo(() => trimestresDoAno.map((tri) => {
    const doTrimestre = negocios.filter((n) => n.estado === "IMPLEMENTADO" && trimestreChaveDeDataInicio(n.dataInicio) === tri && campanhaDoNegocio(n));
    const alcancado = Number(doTrimestre.reduce((s, n) => s + (calcularRlmcAjustadaAtingimento(n) || 0), 0).toFixed(2));
    const objetivo = objetivoCampanhaDoTrimestre(tri);
    return { trimestre: tri, objetivo, alcancado, cumprido: objetivo !== null ? alcancado >= objetivo : null };
  }), [negocios, trimestresDoAno, nuvemAtiva, ehCampanha, objetivoCampanhaDoTrimestre]);
  const trimestresComObjetivo = linhasAnoCampanha.filter((l) => l.objetivo !== null);
  const temAlgumObjetivoAnual = trimestresComObjetivo.length > 0;
  const acumuladoAnualCampanha = Number(trimestresComObjetivo.reduce((s, l) => s + l.alcancado, 0).toFixed(2));
  const objetivoAnualCampanha = Number(trimestresComObjetivo.reduce((s, l) => s + l.objetivo, 0).toFixed(2));
  const elegivelPremioAnual = temAlgumObjetivoAnual ? acumuladoAnualCampanha >= objetivoAnualCampanha : null;

  return (
    <div className="space-y-4">
      <CartoesKpi itens={[
        { rotulo: "Prémio trimestral", valor: formatEuroArredondado(premioTotalTrimestre), detalhe: labelTrimestre(trimestreChaveAtual), tom: "vermelho" },
        { rotulo: "Nível atingido", valor: `${nivelTrimestre.nivel}/5`, tom: "escuro" },
        { rotulo: "Campanha no trimestre", valor: formatEuroArredondado(totalCampanhaTrimestre),
          detalhe: atingimentoCampanhaPercent !== null ? `${atingimentoCampanhaPercent}% do objetivo` : "sem objetivo definido",
          tom: campanhaTrimestreAtingida ? "verde" : "branco" },
        { rotulo: "Prémio anual", valor: elegivelPremioAnual === null ? "—" : elegivelPremioAnual ? "Elegível" : "Ainda não",
          detalhe: temAlgumObjetivoAnual ? `${formatEuroArredondado(acumuladoAnualCampanha)} de ${formatEuroArredondado(objetivoAnualCampanha)}` : "sem objetivos definidos",
          tom: elegivelPremioAnual ? "verde" : "amarelo" },
      ]} />
      <div className="flex items-center justify-end">
        <div className="flex items-center gap-1 px-1 py-1 rounded-md border border-neutral-200 bg-white">
          <button type="button" onClick={() => avancarMes(-1)} className="w-8 h-8 flex items-center justify-center rounded-md text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900">‹</button>
          <span className="px-2 text-sm font-medium whitespace-nowrap">{labelMes(mesChaveAtual)}</span>
          <button type="button" onClick={() => avancarMes(1)} className="w-8 h-8 flex items-center justify-center rounded-md text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900">›</button>
        </div>
      </div>

      <LigacaoExcel itens={[
        { tipo: "negocios", nome: "Mapa Trimestral_Abril_Maio_2026.xlsx", fonte, aCarregar, precisaPermissao, onContinuar: continuar, onLigar: ligar, onRecarregar: recarregar },
      ]} />

      {/* Comissões do mês — 3 secções (Fixo/Móvel/ICT, 2026-09-20), cada uma com
          upload + comparação contra o ficheiro real da Vodafone (substitui o antigo
          cartão único "Comissões do mês"). */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        {SECCOES_COMISSAO_REAL.map((s) => (
          <SeccaoComissaoReal key={s.categoria} categoria={s.categoria} label={s.label}
            negocios={negocios} mesChaveAtual={mesChaveAtual}
            procurarHistorico={procurarHistoricoComissaoReal} registarLinhas={registarLinhasComissaoReal} />
        ))}
      </div>

      {/* Prémio Trimestral + objetivos editáveis */}
      <div className="border border-neutral-200 rounded-lg bg-white p-4 space-y-3">
        <div className="flex items-baseline justify-between gap-2">
          <div className="text-xs font-medium text-neutral-400">PRÉMIO TRIMESTRAL — {labelTrimestre(trimestreChaveAtual)}</div>
          <div className="text-[11px] text-neutral-400">Nível {nivelTrimestre.nivel}/5</div>
        </div>
        <div className="text-2xl font-semibold text-neutral-800">{formatEuro(premioTotalTrimestre)}</div>
        <div className="text-[11px] text-neutral-400">Motor JS reconstruído (calcularPremioTrimestralProposta) — em paralelo, nunca fonte primária. Ver Painel de Validação abaixo.</div>
        <div className="pt-2 border-t border-neutral-100">
          <div className="text-[11px] text-neutral-400 mb-2">Objetivos trimestrais (RLMC ajustada) — introduz os valores propostos pela Vodafone para {labelTrimestre(trimestreChaveAtual)}:</div>
          <div className="space-y-1.5">
            {nivelTrimestre.porCategoria.map((c) => (
              <div key={c.categoria} className="flex items-center justify-between gap-2 text-xs">
                <span className="text-neutral-600">{RLMC_CARTOES.find((r) => r.categoria === c.categoria)?.label || c.categoria}</span>
                <div className="flex items-center gap-2">
                  <span className={`text-[11px] ${c.atingido ? "text-emerald-700" : "text-neutral-400"}`}>{formatEuro(c.real)} · {c.atingimentoPercent}%{c.atingido ? " ✓" : ""}</span>
                  <InputObjetivo valor={c.objetivo} placeholder={String(OBJETIVO_TRIMESTRAL_POR_CATEGORIA[c.categoria])}
                    onChange={(v) => definirCampo(trimestreChaveAtual, c.categoria, v)} />
                </div>
              </div>
            ))}
          </div>

              <div className="text-neutral-700 py-1 border-t border-neutral-100">{labelTrimestre(l.trimestre)}</div>
              <div className={`text-right py-1 border-t border-neutral-100 ${l.objetivo === null ? "text-neutral-400 italic" : "text-neutral-700"}`}>

              <div className="text-right py-1 border-t border-neutral-100 text-neutral-700">{formatEuro(l.alcancado)}</div>

      {/* Tabela de Referência XP (Passo 1, 2026-09-19) — pré-requisito da migração de
