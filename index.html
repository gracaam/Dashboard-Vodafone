<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ================= FIREBASE (Assuntos via telemóvel) =================
   Única dependência de rede real do dashboard — usada só para importar assuntos
   criados na página mobile (assuntos-mobile.html) para dentro de "Assuntos em
   Progresso" (ver useAssuntos/AssuntosView, mais abaixo). O resto do dashboard
   continua 100% local/offline como sempre.
   O apiKey abaixo NÃO é secreto — identifica o projeto Firebase, não autoriza nada
   sozinho. É normal e seguro aparecer aqui, mesmo que este ficheiro seja aberto
   fora do dashboard — a segurança real vem das Regras de Segurança do Firestore
   (ver firestore.rules) + login obrigatório, nunca de esconder este objeto. */
const firebaseConfig = {
  apiKey: "AIzaSyChXSyRs1zwfl0vxoF-rtyEst9Dc97zc3g",
  authDomain: "dashboard-vodafone.firebaseapp.com",
  projectId: "dashboard-vodafone",
  storageBucket: "dashboard-vodafone.firebasestorage.app",
  messagingSenderId: "795561922165",
  appId: "1:795561922165:web:bb94e214b8c47c5fa1b23c",
};
firebase.initializeApp(firebaseConfig);
const firebaseAuth = firebase.auth();
const firebaseDb = firebase.firestore();
// Fase 3 (2026-09-20) — Firebase Storage, para ficheiros (PDFs de faturas, Excel de
// decisão de Propostas, brochuras de Produtos Vodafone) — Firestore/IndexedDB nunca
// foram feitos para blobs grandes. Mesma proteção de sempre: só utilizador
// autenticado lê/escreve (ver storage.rules), nunca acesso público.
const firebaseStorage = firebase.storage();

// Sessão do Firebase Auth persiste sozinha neste browser depois do 1º login — nunca
// pede login outra vez, igual à página mobile.
function useFirebaseAuthUser() {
  const [user, setUser] = useState(() => firebaseAuth.currentUser);
  useEffect(() => firebaseAuth.onAuthStateChanged(setUser), []);
  return user;
}

// Lê os assuntos de assuntos_inbox e importa-os para o repositório de Assuntos
// (local ou nuvem, através da MESMA `adicionar()` já usada pelo formulário do
// dashboard — useAssuntos) — nunca escreve diretamente no JSON/Firestore, para
// herdar a proteção contra condições de corrida que essa função já tem.
//
// Modo local (nuvemAtiva=false, comportamento original, inalterado): só lê
// processado==false, e um documento só é marcado processado:true DEPOIS de
// adicionar() correr — se isso falhar, fica pendente e é tentado de novo na próxima
// sincronização (nunca perdido).
//
// Modo nuvem (2026-09-20, achado real): processado:true deixou de significar
// "arquivado" — significa só "algum browser já importou este documento", e antes de
// Assuntos ter migração própria para o Firestore, esse "algum browser" podia ser um
// que só guardava em localStorage (ex. site público, sem pasta ligada), tornando o
// assunto invisível em qualquer outro sítio apesar de processado:true. Por isso, em
// modo nuvem, ignora `processado` por completo e usa o próprio id do documento do
// inbox como id do assunto — nunca duplica (idempotente: só grava quem ainda não
// existir na coleção "assuntos", via `idsExistentes`), recuperando também os que já
// estavam processado:true mas nunca chegaram a um sítio duradouro.
async function sincronizarAssuntosInbox(adicionar, nuvemAtiva, idsExistentes) {
  if (!firebaseAuth.currentUser) return { importados: 0 };
  try {
    const query = nuvemAtiva
      ? firebaseDb.collection("assuntos_inbox")
      : firebaseDb.collection("assuntos_inbox").where("processado", "==", false);
    const snap = await query.get();
    let importados = 0;
    for (const doc of snap.docs) {
      if (nuvemAtiva && idsExistentes.has(doc.id)) continue;
      const d = doc.data();
      const registo = {
        cliente: d.cliente || "",
        estado: "Em aberto",
        importancia: d.importancia === "Alta" ? "Alta" : "Média",
        comentario: d.comentario || "",
        dataPedido: d.dataPedido || new Date().toISOString().slice(0, 10),
        dataPrevista: "",
      };
      if (nuvemAtiva) registo.id = doc.id;
      await adicionar(registo);
      if (!d.processado) await doc.ref.update({ processado: true });
      importados++;
    }
    return { importados };
  } catch (e) {
    console.warn("Não foi possível sincronizar assuntos do telemóvel:", e.message);
    return { importados: 0 };
  }
}

// Caixa de login reaproveitável — mesma sessão Firebase Auth em qualquer tab que a
// use (Assuntos, Clientes, Prospetos, ...). Só pede login uma vez por browser (ver
// useFirebaseAuthUser); nunca duplica a lógica de autenticação.
// Estilo deliberadamente destacado (azul, não o cinzento neutro dos avisos comuns) —
// bug real reportado pelo utilizador (2026-09-19): com o mesmo cinzento/tamanho da
// caixa "EXCEL: Ligar..." por baixo, esta caixa de login ficava visualmente
// indistinguível de texto de fundo e passava despercebida, mesmo estando sempre
// presente e funcional (confirmado ao vivo em produção — o login nunca esteve em
// falta, só invisível). Nunca voltar ao estilo neutro — é precisamente o que causou
// o problema.
function LoginFirebaseInline({ mensagem }) {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [erro, setErro] = useState("");
  const [aEntrar, setAEntrar] = useState(false);

  const entrar = async () => {
    setErro("");
    if (!email.trim() || !pass) return;
    setAEntrar(true);
    try {
      await firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      await firebaseAuth.signInWithEmailAndPassword(email.trim(), pass);
      setPass("");
    } catch (e) {
      setErro("Não consegui entrar — confirma o email e password.");
    }
    setAEntrar(false);
  };

  return (
    <div className="flex items-center gap-2 flex-wrap text-sm bg-blue-50 border-2 border-blue-200 rounded-lg px-3.5 py-2.5">
      <span className="text-blue-900 font-medium">☁️ {mensagem}</span>
      <input type="email" placeholder="email" value={email} onChange={(e) => setEmail(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && entrar()}
        className="px-2.5 py-1.5 rounded border border-blue-300 text-sm bg-white" style={{ width: "170px" }} />
      <input type="password" placeholder="password" value={pass} onChange={(e) => setPass(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && entrar()}
        className="px-2.5 py-1.5 rounded border border-blue-300 text-sm bg-white" style={{ width: "130px" }} />
      <button onClick={entrar} disabled={aEntrar}
        className="text-sm px-3 py-1.5 rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-40">
        {aEntrar ? "A entrar…" : "Entrar"}
      </button>
      {erro && <span className="text-red-600 text-xs w-full">{erro}</span>}
    </div>
  );
}

// Banner de migração — reaproveitado por ClientesView e ProspetosView (mesmo padrão
// em ambos). Sem login: mostra LoginFirebaseInline (destacado a azul, ver acima).
// Com login mas ainda não migrado: botão "Migrar N para a nuvem", com confirmação
// explícita antes de correr (nunca silencioso, nunca automático) — mesmo tom azul,
// para ficar claro que é o passo seguinte do mesmo fluxo. Já migrado: linha discreta
// a confirmar a fonte atual (aqui sim, subtil é correto — é um estado resolvido, não
// uma ação pendente).
function MigracaoNuvemBanner({ nome, firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar }) {
  if (!firebaseUser) return <LoginFirebaseInline mensagem={`Liga-te para levar ${nome} para a nuvem (acessível de qualquer computador):`} />;
  if (nuvemAtiva) return <div className="text-[11px] text-neutral-400">☁️ {nome} na nuvem — {firebaseUser.email}</div>;
  const migrar = async () => {
    if (!window.confirm(`Vais copiar ${nParaMigrar} registo(s) de ${nome} para a nuvem. Isto não apaga nada localmente — o Excel continua exatamente como está. Continuar?`)) return;
    await migrarParaNuvem();
  };
  return (
    <div className="flex items-center gap-2 flex-wrap text-sm bg-blue-50 border-2 border-blue-200 rounded-lg px-3.5 py-2.5">
      <span className="text-blue-900 font-medium">☁️ {nome} ainda não estão na nuvem — {nParaMigrar} registo(s) prontos a copiar.</span>
      <button onClick={migrar} disabled={aMigrar}
        className="text-sm px-3 py-1.5 rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-40">
        {aMigrar ? "A migrar…" : `Migrar ${nome} para a nuvem`}
      </button>
    </div>
  );
}

/* ================= CLIENTES/PROSPETOS NA NUVEM (Firestore) =================
   Fase 1 (2026-09-18, decisão explícita do utilizador): Clientes e Prospetos podem
   passar a viver no Firestore em vez de dependerem de um Excel local ligado — mesmo
   projeto Firebase/login já usado para Assuntos. Continua a funcionar 100% como hoje
   (Excel local) para quem não fez a migração — nunca troca de fonte sozinho, só depois
   de o próprio utilizador confirmar a migração (ver migrarParaNuvem em
   useClientesNovos/useProspetosNovos, mais abaixo). */

// Coleção genérica indexada por NIF (doc id = NIF) — dá deduplicação automática (um
// NIF só pode ter 1 documento) e torna "adicionar"/"remover" triviais. `ativo` só fica
// true depois de confirmada a migração (ver useMigracaoNuvem) — antes disso não faz
// nenhum pedido de rede.
function useColecaoFirestore(nomeColecao, ativo) {
  const [itens, setItens] = useState([]);
  const [aCarregar, setACarregar] = useState(false);

  useEffect(() => {
    if (!ativo) { setItens([]); return; }
    setACarregar(true);
    const unsub = firebaseDb.collection(nomeColecao).onSnapshot(
      (snap) => { setItens(snap.docs.map((d) => d.data())); setACarregar(false); },
      (e) => { console.warn(`Não foi possível ler ${nomeColecao} do Firestore:`, e.message); setACarregar(false); }
    );
    return unsub;
  }, [ativo, nomeColecao]);

  const definir = (registo) => firebaseDb.collection(nomeColecao).doc(String(registo.n)).set(registo);
  const remover = (nif) => firebaseDb.collection(nomeColecao).doc(String(nif)).delete();
  return { itens, aCarregar, definir, remover };
}

// Flag de migração — um documento pequeno em meta/{chave} ({ migrado: true }), nunca
// inferido a partir de "a coleção está vazia" (uma coleção legitimamente vazia depois
// de migrar não pode voltar a parecer "por migrar"). `migradoAgora` cobre o instante
// entre migrar com sucesso e o documento meta ainda não ter sido relido.
function useMigracaoNuvem(chave, firebaseUser) {
  const [migrado, setMigrado] = useState(false);
  const [migradoAgora, setMigradoAgora] = useState(false);
  useEffect(() => {
    if (!firebaseUser) { setMigrado(false); return; }
    firebaseDb.collection("meta").doc(chave).get()
      .then((doc) => setMigrado(!!(doc.exists && doc.data().migrado)))
      .catch(() => setMigrado(false));
  }, [firebaseUser, chave]);
  const marcar = async () => {
    await firebaseDb.collection("meta").doc(chave).set({ migrado: true, em: firebase.firestore.FieldValue.serverTimestamp() });
    setMigradoAgora(true);
  };
  return { feita: migrado || migradoAgora, marcar };
}

/* ================= LIGAÇÃO A FICHEIROS EXCEL (File System Access API) ================= */
// Só funciona em Chrome/Edge. Guarda os "handles" dos ficheiros no IndexedDB para
// não ter de voltar a escolher o ficheiro sempre que fechas um negócio.

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("vodafone-dashboard", 3);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("handles")) db.createObjectStore("handles");
      if (!db.objectStoreNames.contains("faturas")) db.createObjectStore("faturas", { keyPath: "id" });
      // Repositório PRÓPRIO para o separador "Análise de Faturas" — decisão explícita
      // do utilizador (2026-09-16): NUNCA partilhado com o repositório "faturas" do
      // separador Propostas, apesar de ambos guardarem PDFs por NIF e reutilizarem o
      // mesmo motor de extração de texto. São análises com propósitos diferentes
      // (proposta comercial pontual vs. análise agregada multi-mês/multi-conta).
      if (!db.objectStoreNames.contains("faturasAnalise")) db.createObjectStore("faturasAnalise", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ================= FATURAS E DOCUMENTOS ANEXADOS (Propostas) =================
   Guardados como Blob no IndexedDB, associados ao NIF do cliente/prospect.
   Nunca saem deste browser — servem só para o Augusto rever ao lado da proposta. */

// Aceita anexar TAMBÉM outros ficheiros de apoio (análise anterior, notas, o Excel-
// questionário de um cliente novo já preenchido) além de faturas — decisão explícita do
// utilizador (2026-09-11). Só faturas (PDF/JPG/PNG) entram na análise automática; os
// restantes ficam só como contexto/anexo, nunca processados. `categoriaAnexo` é distinto
// do campo "tipo" já existente (que guarda o MIME type do browser).
function classificarAnexo(nomeFicheiro) {
  const ext = String(nomeFicheiro).toLowerCase().split(".").pop();
  return ["pdf", "jpg", "jpeg", "png"].includes(ext) ? "fatura" : "documento";
}

// Antes de gravar, remove qualquer anexo já guardado para este cliente com o mesmo
// nome+tamanho de ficheiro — evita duplicados (mesmo ficheiro anexado 2x, seja por um
// evento de drop a disparar 2x, seja por o utilizador voltar a arrastar o mesmo PDF
// sem reparar que já lá estava). Sem isto, um duplicado inflaciona a evolução mensal
// (soma por mês, ao contrário das médias/min/máx, não é imune a entradas repetidas).
async function guardarFaturaAnexada(nif, file, categoriaAnexo) {
  const db = await idbOpen();
  const existentes = await listarFaturasDoCliente(nif);
  const duplicados = existentes.filter((f) => f.nome === file.name && f.tamanho === file.size);
  if (duplicados.length) {
    await new Promise((resolve, reject) => {
      const tx = db.transaction("faturas", "readwrite");
      duplicados.forEach((f) => tx.objectStore("faturas").delete(f.id));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  const registo = {
    id: `${nif}:${Date.now()}:${Math.random().toString(36).slice(2, 7)}`,
    nif, nome: file.name, tipo: file.type, tamanho: file.size,
    categoriaAnexo: categoriaAnexo || classificarAnexo(file.name),
    dataUpload: new Date().toISOString(), blob: file,
  };
  return new Promise((resolve, reject) => {
    const tx = db.transaction("faturas", "readwrite");
    tx.objectStore("faturas").put(registo);
    tx.oncomplete = () => resolve(registo);
    tx.onerror = () => reject(tx.error);
  });
}

async function listarFaturasDoCliente(nif) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("faturas", "readonly");
    const req = tx.objectStore("faturas").getAll();
    req.onsuccess = () => resolve((req.result || []).filter((f) => f.nif === nif));
    req.onerror = () => reject(req.error);
  });
}

async function removerFaturaAnexada(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("faturas", "readwrite");
    tx.objectStore("faturas").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ================= FATURAS (Análise de Faturas) =================
   Repositório PRÓPRIO (store "faturasAnalise"), à parte do usado em Propostas — ver
   nota em idbOpen. Mesma lógica de deduplicação por nome+tamanho; aqui todo o ficheiro
   é sempre "fatura" (esta tab não tem noção de "documento de apoio"). */
async function guardarFaturaAnaliseAnexada(nif, file) {
  const db = await idbOpen();
  const existentes = await listarFaturasAnaliseDoCliente(nif);
  const duplicados = existentes.filter((f) => f.nome === file.name && f.tamanho === file.size);
  if (duplicados.length) {
    await new Promise((resolve, reject) => {
      const tx = db.transaction("faturasAnalise", "readwrite");
      duplicados.forEach((f) => tx.objectStore("faturasAnalise").delete(f.id));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  const registo = {
    id: `${nif}:${Date.now()}:${Math.random().toString(36).slice(2, 7)}`,
    nif, nome: file.name, tipo: file.type, tamanho: file.size,
    dataUpload: new Date().toISOString(), blob: file,
  };
  return new Promise((resolve, reject) => {
    const tx = db.transaction("faturasAnalise", "readwrite");
    tx.objectStore("faturasAnalise").put(registo);
    tx.oncomplete = () => resolve(registo);
    tx.onerror = () => reject(tx.error);
  });
}

async function listarFaturasAnaliseDoCliente(nif) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("faturasAnalise", "readonly");
    const req = tx.objectStore("faturasAnalise").getAll();
    req.onsuccess = () => resolve((req.result || []).filter((f) => f.nif === nif));
    req.onerror = () => reject(req.error);
  });
}

async function removerFaturaAnaliseAnexada(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("faturasAnalise", "readwrite");
    tx.objectStore("faturasAnalise").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ================= ANÁLISE DE FATURAS NA NUVEM (Fase 3, Passo 2, 2026-09-20) =================
   Decisão explícita do utilizador: migração completa. ⚠️ Dados sensíveis de clientes
   (consumos, faturação) — Storage/Firestore protegidos por login obrigatório (ver
   storage.rules/firestore.rules), nunca acesso público.
   Storage: analise_faturas/{nif}/faturas/{id} (PDFs anexados — mesmo conteúdo que
   antes vivia só em IndexedDB "faturasAnalise") e analise_faturas/{nif}/exports/
   {ficheiro} (painel HTML + argumentos MD exportados). Firestore:
   analise_faturas_cache/{nif} (mesmo papel de dados-privados/{cliente}-analise-
   faturas.json — cache da última análise, para não reprocessar PDFs sempre que o
   cliente reabre). */
async function listarFaturasAnaliseNuvem(nif) {
  let items;
  try {
    items = (await firebaseStorage.ref(`analise_faturas/${nif}/faturas`).listAll()).items;
  } catch (e) {
    console.warn("Não foi possível listar faturas da nuvem:", e.message);
    return [];
  }
  return Promise.all(items.map(async (ref) => {
    const [meta, url] = await Promise.all([ref.getMetadata(), ref.getDownloadURL()]);
    const blob = await fetch(url).then((r) => r.blob());
    return {
      id: ref.fullPath,
      nome: (meta.customMetadata && meta.customMetadata.nomeOriginal) || ref.name,
      tipo: meta.contentType, tamanho: meta.size, dataUpload: meta.timeCreated, blob,
    };
  }));
}
// Nunca deixa lançar (2026-09-26, bug real reportado por Augusto): sem try/catch
// aqui, uma falha de rede (ex. CORS mal configurado no bucket do Storage a partir de
// gracaam.github.io) propagava por anexarFicheiros acima sem ser apanhada — a promise
// nunca resolvia nem rejeitava de forma tratada, `setAAnexar(false)` nunca corria, e o
// anexo ficava preso em "A Anexar..." para sempre, sem erro visível. Devolve `null` em
// vez de lançar — mesma convenção já usada por encontrarExcelAnaliseNuvem — para quem
// chama poder cair para o caminho local (ver anexarFicheiros, AnaliseFaturasView).
async function guardarFaturaAnaliseAnexadaNuvem(nif, file) {
  try {
    // Mesma deduplicação por nome+tamanho já usada na versão local (IndexedDB).
    const existentes = await listarFaturasAnaliseNuvem(nif);
    const duplicados = existentes.filter((f) => f.nome === file.name && f.tamanho === file.size);
    for (const d of duplicados) await firebaseStorage.ref(d.id).delete().catch(() => {});
    const id = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    const ref = firebaseStorage.ref(`analise_faturas/${nif}/faturas/${id}`);
    await ref.put(file, { contentType: file.type || "application/pdf", customMetadata: { nomeOriginal: file.name } });
    return { id: ref.fullPath, nome: file.name, tipo: file.type, tamanho: file.size, dataUpload: new Date().toISOString(), blob: file };
  } catch (e) {
    console.error("Não foi possível gravar a fatura na nuvem (Storage):", e);
    return null;
  }
}
async function removerFaturaAnaliseAnexadaNuvem(caminhoCompleto) {
  await firebaseStorage.ref(caminhoCompleto).delete().catch(() => {});
}
async function guardarExportAnaliseFaturasNuvem(nif, nomeFicheiro, conteudo, mimeType) {
  try {
    const blob = new Blob([conteudo], { type: mimeType || "text/plain" });
    await firebaseStorage.ref(`analise_faturas/${nif}/exports/${nomeFicheiro}`).put(blob, { contentType: mimeType });
    return true;
  } catch (e) {
    console.warn("Não foi possível gravar o export na nuvem:", e.message);
    return false;
  }
}
async function lerAnaliseFaturasCacheNuvem(nif) {
  try {
    const doc = await firebaseDb.collection("analise_faturas_cache").doc(nif).get();
    return doc.exists ? doc.data() : null;
  } catch (e) {
    console.warn("Não foi possível ler a cache da análise (nuvem):", e.message);
    return null;
  }
}
async function guardarAnaliseFaturasCacheNuvem(nif, dados) {
  try { await firebaseDb.collection("analise_faturas_cache").doc(nif).set(dados); }
  catch (e) { console.warn("Não foi possível gravar a cache da análise (nuvem):", e.message); }
}
async function removerAnaliseFaturasCacheNuvem(nif) {
  try { await firebaseDb.collection("analise_faturas_cache").doc(nif).delete(); } catch {}
}

// Migração única (Passo 2, botão "Migrar Análise de Faturas para a nuvem") — copia
// tudo o que estiver ATUALMENTE pendente no IndexedDB "faturasAnalise" (faturas
// anexadas de qualquer cliente ainda não exportadas/limpas) para o Storage. Nunca
// apaga o IndexedDB local (decisão explícita, mesmo padrão de sempre — "isto não
// apaga nada localmente"). Devolve quantas faturas migrou.
async function migrarFaturasAnaliseParaNuvem() {
  const db = await idbOpen();
  const todas = await new Promise((resolve, reject) => {
    const tx = db.transaction("faturasAnalise", "readonly");
    const req = tx.objectStore("faturasAnalise").getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
  for (const f of todas) {
    await guardarFaturaAnaliseAnexadaNuvem(f.nif, new File([f.blob], f.nome, { type: f.tipo }));
  }
  return todas.length;
}

function formatarTamanhoFicheiro(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

/* ================= ANÁLISE DE FATURAS (PDF.js) =================
   Extração heurística por regex — NÃO é fiável para todas as operadoras/formatos.
   Regra de ouro: nunca preencher um campo não identificado com um valor falso.
   Se não encontrarmos o consumo ou a data com confiança, o campo fica vazio e
   marcado "não identificado" — o utilizador confirma/corrige sempre à mão. */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

// Faturas Vodafone Business têm 2 tipos de página: tabelas agregadas de largura
// total (a ordem natural dos itens do pdf.js já as lê bem, testado) e a secção
// "Detalhes dos serviços", onde os blocos por Nº/Serviço estão em GRELHA DE 2
// COLUNAS lado a lado — juntar por ordem natural (só concatenar strings, sem olhar à
// posição) mistura as duas colunas e cruza texto de blocos diferentes (ex. a frase de
// fidelização do fim de um bloco aparece antes do início do bloco seguinte na coluna
// errada). Corrigido usando as coordenadas X/Y de cada item (getTextContent() →
// transform[4]=x, transform[5]=y) — só nas páginas que têm mesmo esta grelha
// (deteção: 2+ ocorrências de "Qtd. Descrição", o cabeçalho de cada mini-tabela); as
// restantes páginas mantêm a ordem natural do pdf.js, já correta, para não arriscar
// regressão onde nunca houve problema. Testado (2026-09-16) com as faturas reais da
// Cliente C: um bloco antes espalhado por 2 pontos do texto (Mensalidade/Total numa
// posição, fidelização a seguir ao bloco ERRADO) passa a sair inteiro e seguido.
function reconstruirTextoPagina(conteudo, view) {
  const itens = conteudo.items.filter((it) => it.str && it.str.trim());
  const nBlocos = itens.filter((it) => it.str.includes("Qtd. Descrição")).length;
  if (nBlocos < 2) return itens.map((it) => it.str).join(" ");

  // A 1ª página da secção junta 2 coisas MUITO diferentes: a tabela agregada
  // "Detalhes da fatura" (larga, várias colunas — Mensalidade/Suplementares/
  // Comunicações/.../Total — a ordem natural do pdf.js já a lê bem) e, a seguir ao
  // marcador "Detalhes dos serviços", a grelha de blocos por Nº lado a lado (essa sim
  // precisa do split por X/Y). Aplicar o split à página inteira parte também as
  // colunas da tabela agregada ao meio (testado ao vivo, 2026-09-16: linhas como
  // "Comunicações nacionais" perdiam o valor associado). Por isso só se aplica o
  // split aos itens A PARTIR do marcador — antes dele, mantém a ordem natural.
  const marcadorIdx = itens.findIndex((it) => it.str.includes("Detalhes dos serviços"));
  const itensAntes = marcadorIdx === -1 ? [] : itens.slice(0, marcadorIdx + 1);
  const itensGrelha = marcadorIdx === -1 ? itens : itens.slice(marcadorIdx + 1);

  const pageWidth = view ? view[2] - view[0] : 595;
  const meio = pageWidth / 2;
  // Agrupa por linha visual (mesma coordenada Y, com tolerância) e ordena de cima
  // para baixo (Y decresce no sistema de coordenadas do PDF). TOLERANCIA_Y_LINHA=6
  // (testado ao vivo, 2026-09-16): uma "linha visual" de tabela pode ter texto em
  // mais que uma sub-baseline — ex. em "Consumos mensais incluídos", a célula de
  // valor é ela própria 2 sub-linhas empilhadas ("6 GB" por cima, "(6144 MB)" por
  // baixo, ~5,7pt de distância), enquanto o nome do pacote ao lado fica exatamente
  // NO MEIO das duas (Y=216.6, entre 220.7 e 215.0) — um tolerância pequena (2.5)
  // partia o nome da sua própria linha; a 6 já apanha as 3 sub-baselines juntas.
  //
  // Mas juntar por Y não chega: um simples sort por X intercalava as 2 colunas de
  // valor empilhadas uma dentro da outra (ex. "nome (6144MB) 6GB (154MB*) 155MB" em
  // vez de "nome  6GB (6144MB)  155MB (154MB*)"). Por isso, dentro de cada linha
  // visual, agrupa-se primeiro por COLUNA (gap em X > GAP_X_COLUNA = nova coluna) e
  // só depois, DENTRO de cada coluna, se ordena por Y (de cima para baixo, junta as
  // sub-baselines empilhadas pela ordem certa) — as colunas juntam-se com 2 espaços,
  // que é o separador de que extrairConsumosMensais/LINHA_CONSUMO precisam para
  // distinguir nome/atribuído/utilizado.
  const TOLERANCIA_Y_LINHA = 6;
  const GAP_X_COLUNA = 15;
  const agruparEmLinhas = (lista) => {
    const ordenada = [...lista].sort((a, b) => b.transform[5] - a.transform[5]);
    const linhas = [];
    let linhaAtual = null;
    ordenada.forEach((it) => {
      const y = it.transform[5];
      if (!linhaAtual || Math.abs(y - linhaAtual.y) > TOLERANCIA_Y_LINHA) {
        linhaAtual = { y, itens: [] };
        linhas.push(linhaAtual);
      }
      linhaAtual.itens.push(it);
    });
    return linhas.map((l) => {
      const porX = [...l.itens].sort((a, b) => a.transform[4] - b.transform[4]);
      const colunas = [];
      let colunaAtual = null;
      porX.forEach((it) => {
        if (!colunaAtual || it.transform[4] - colunaAtual.x > GAP_X_COLUNA) {
          colunaAtual = { x: it.transform[4], itens: [] };
          colunas.push(colunaAtual);
        }
        colunaAtual.itens.push(it);
        colunaAtual.x = it.transform[4];
      });
      return colunas
        .map((c) => c.itens.sort((a, b) => b.transform[5] - a.transform[5]).map((it) => it.str).join(" "))
        .join("  ");
    });
  };
  const textoAntes = itensAntes.map((it) => it.str).join(" ");
  const esquerda = agruparEmLinhas(itensGrelha.filter((it) => it.transform[4] < meio));
  const direita = agruparEmLinhas(itensGrelha.filter((it) => it.transform[4] >= meio));
  return [textoAntes, ...esquerda, ...direita].join("\n");
}

async function extrairTextoPDF(file) {
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let texto = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const conteudo = await page.getTextContent();
    texto += reconstruirTextoPagina(conteudo, page.view) + "\n";
  }
  return texto;
}

// Um "token" de valor em euros — aceita o sinal de negativo antes OU depois do
// símbolo €, porque faturas reais escrevem descontos como "-€ 8.71" ou "€ -8.71"
// consoante o gerador do documento.
const MONEY_TOKEN = "(-)?\\s*€?\\s*(-)?\\s*(\\d+[.,]\\d{2})\\s*€?";

// Cabeçalho de uma linha: um identificador — pode ser um Nº de telefone/id longo
// (6-12 dígitos, por vezes com parêntesis, ex. "218596637 (Net+e-fax)") OU uma
// quantidade curta (1-3 dígitos, ex. "3" em "3 Biz Standard" numa tabela-resumo
// por categoria) — seguido do nome do tarifário. Não sabemos à partida qual das
// duas formas a fatura usa, por isso aceitamos as duas.
// (?<![\d.,]) garante que nunca começamos a meio de outro número — sem isto, o
// "00" da parte decimal de "82,00" era apanhado como se fosse um identificador
// novo (bug real, encontrado ao testar com o formato de fatura por categoria).
const HEADER_LINHA_FINANCEIRA = new RegExp(
  `(?<![\\d.,])(\\d{1,3}|\\d{6,12}(?:\\s*\\([^)]{1,40}\\))?)\\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9 ./+\\-]{2,40}?)\\s+(?=-?\\s*€?\\s*-?\\s*\\d+[.,]\\d{2})`,
  "g"
);

function encontrarCabecalhosFinanceiros(texto) {
  const out = [];
  let m;
  const re = new RegExp(HEADER_LINHA_FINANCEIRA);
  while ((m = re.exec(texto)) !== null) {
    out.push({ pos: m.index, fimCabecalho: m.index + m[0].length, numero: m[1].trim(), tarifario: m[2].trim() });
  }
  return out;
}

// Lê valores em euros consecutivos a partir do início do segmento (sem saltar
// texto pelo meio) — pára assim que deixar de haver um valor logo a seguir ao
// anterior, para não ir "roubar" valores de outra linha mais à frente.
function extrairValoresIniciais(segmento, maxValores) {
  const valores = [];
  const re = new RegExp(MONEY_TOKEN, "y");
  let pos = 0;
  while (valores.length < maxValores) {
    pos += (segmento.slice(pos).match(/^\s*/) || [""])[0].length;
    re.lastIndex = pos;
    const m = re.exec(segmento);
    if (!m || m.index !== pos) break;
    const negativo = m[1] === "-" || m[2] === "-";
    const valor = parseFloat(m[3].replace(",", "."));
    valores.push(negativo ? -valor : valor);
    pos += m[0].length;
  }
  return valores;
}

// Fallback: devolve uma linha por cabeçalho (Nº/Serviço ou quantidade) encontrado
// na tabela "Detalhes da fatura" (totais por categoria/quantidade), nunca inventa
// uma linha que não tenha pelo menos 2 valores a seguir. Só é usado quando a fatura
// não tem a secção "Detalhes dos serviços" (ver analisarLinhasFinanceirasPorServico,
// a fonte preferida — dá o número de telefone real por linha, não uma quantidade
// agregada). Duas faturas Vodafone diferentes podem ter tabelas diferentes aqui:
//  - 4 colunas: Mensalidade, Suplementares, Desconto, Total
//  - 6 colunas: Mensalidade, Suplementares, Comunicações, Encargos adicionais,
//    Descontos, Total (Comunicações + Encargos adicionais somam-se a Suplementares,
//    com o detalhe original preservado na Observação)
// Qualquer outra contagem de valores fica sem mapeamento certo — a Observação
// mostra os valores tal como apareceram no PDF, para colocares na coluna certa à
// mão, em vez de arriscar atribuir um valor à coluna errada.
function analisarLinhasFinanceirasPorCategoria(texto, nomeFicheiro) {
  const cabecalhos = encontrarCabecalhosFinanceiros(texto);
  const linhas = [];
  cabecalhos.forEach((c, i) => {
    const fimSegmento = i + 1 < cabecalhos.length ? cabecalhos[i + 1].pos : texto.length;
    const valores = extrairValoresIniciais(texto.slice(c.fimCabecalho, fimSegmento), 8);
    if (valores.length < 2) return; // nada a aproveitar aqui — não é uma linha de valores

    const base = {
      id: `${nomeFicheiro}-${c.numero}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      origem: nomeFicheiro,
      numero: c.numero,
      tarifario: c.tarifario,
      mensalidade: "", suplementares: "", desconto: "", total: "", fidelizacao: "", custoExtraTipo: "",
      utilizacaoMedia: "", tipoUtilizacao: "", observacao: "",
      // Esta tabela ("Detalhes da fatura", fallback sem "Detalhes dos serviços") não
      // tem blocos por serviço com "Consumos mensais incluídos" — nunca há dados de
      // utilização aqui, ao contrário do caminho por-serviço.
      utilizacaoRatio: null, utilizacaoNomePacote: "",
      confianca: "nao-identificado",
      acaoProposta: "", mensalidadeNova: "", observacaoProposta: "",
    };

    if (valores.length === 4) {
      linhas.push({ ...base, mensalidade: String(valores[0]), suplementares: String(valores[1]), desconto: String(valores[2]), total: String(valores[3]), confianca: "extraido" });
    } else if (valores.length === 6) {
      linhas.push({
        ...base,
        mensalidade: String(valores[0]),
        suplementares: String(valores[1] + valores[2] + valores[3]),
        desconto: String(valores[4]),
        total: String(valores[5]),
        confianca: "extraido",
        observacao: `Colunas originais da fatura: Mensalidade ${valores[0]}, Suplementares ${valores[1]}, Comunicações ${valores[2]}, Encargos adicionais ${valores[3]}, Descontos ${valores[4]}, Total ${valores[5]}.`,
      });
    } else {
      linhas.push({ ...base, observacao: `⚠ Valores encontrados sem mapeamento certo (ordem tal como no PDF): ${valores.join(", ")}. Confirma/coloca-os nas colunas certas à mão.` });
    }
  });
  return linhas;
}

// Cabeçalho de um bloco por Nº/Serviço REAL na secção "Detalhes dos serviços":
// "<nome do tarifário> <telefone 6-12 dígitos> Qtd. Descrição Valor sem IVA".
// Esta secção (mais à frente na fatura do que "Detalhes da fatura") é a única
// fonte fiável para uma linha por número de telefone real — "Detalhes da fatura"
// só dá totais agregados por categoria/quantidade, não por linha (descoberta feita
// a partir de faturas reais em 2026-09-06: uma linha "3 Biz Standard €70,56" em
// "Detalhes da fatura" é na verdade a SOMA de 3 números de telefone diferentes,
// cada um com o seu próprio bloco em "Detalhes dos serviços").
// Sem "." na classe de carateres do nome do tarifário: nenhum tarifário real tem
// ponto no nome, mas as frases entre blocos têm ("...com data de fim 07-07-2027.")
// — sem excluir o ponto, um bloco sem a proteção acidental de "€"/"(" antes dele
// (bug encontrado ao testar em direto no browser) deixava o nome "engolir" para
// trás até à frase anterior.
// "Valor" em posição opcional antes OU depois de "Qtd. Descrição" (2026-09-16): o
// cabeçalho "Qtd. Descrição / Valor sem IVA" é visualmente uma célula de 2 linhas —
// "Valor" fica FISICAMENTE ACIMA de "Qtd. Descrição" no PDF (confirmado nas
// coordenadas X/Y reais). A extração antiga (reconstruirTextoPagina inexistente,
// só concatenava por ordem "natural" do pdf.js) lia por coincidência "Qtd.
// Descrição...Valor sem IVA"; a extração por coordenadas X/Y (mais correta,
// respeita a ordem visual real) lê "Valor" primeiro. O regex aceita as duas ordens
// para não depender de qual dos dois métodos gerou o texto.
const HEADER_DETALHE_SERVICO = /([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9 /+\-]{2,60}?)\s+(\d{6,12})\s+(?:Valor\s+)?Qtd\.\s*Descrição\s*(?:Valor\s*)?sem\s*IVA/g;

function encontrarCabecalhosDetalheServico(texto) {
  // A secção não tem separador claro antes do 1º bloco — sem isto, o cabeçalho da
  // própria secção ("Detalhes dos serviços") ficava colado ao tarifário da 1ª linha.
  const marcador = "Detalhes dos serviços";
  const inicio = texto.indexOf(marcador);
  if (inicio === -1) return [];
  const offset = inicio + marcador.length;
  const zonaUtil = texto.slice(offset);
  const out = [];
  let m;
  const re = new RegExp(HEADER_DETALHE_SERVICO);
  while ((m = re.exec(zonaUtil)) !== null) {
    out.push({ pos: offset + m.index, fimCabecalho: offset + m.index + m[0].length, tarifario: m[1].trim(), numero: m[2].trim() });
  }
  return out;
}

// Um valor de consumo (coluna "atribuído" ou "utilizado" de "Consumos mensais
// incluídos") vem em 3 formatos possíveis na fatura real (confirmado em faturas
// reais em 2026-09-07): "4000:00" (minutos:segundos), "10 GB (10240 MB)" / "271 MB
// (271 MB*)" (dados, com o valor preciso em MB entre parênteses) ou um número simples
// sem unidade ("100", "43" — pacotes de min/sms contados às unidades, não em tempo).
const VALOR_CONSUMO = "(?:\\d+:\\d{2}|[\\d.,]+\\s?(?:GB|MB)\\s?\\([\\d.,]+\\s?MB\\*?\\)|[\\d.,]+)";

// Uma linha de consumo: "<nome do pacote>  <atribuído>  <utilizado>". Descoberto em
// faturas reais (2026-09-07): o nome pode conter números com espaço simples (ex.
// "Pacote 4.000 min RM RF PT", "Nacional 4GB"), mas o PDF sempre separa nome/
// atribuído/utilizado por 2+ espaços (artefacto das colunas da tabela) — por isso
// 2+ espaços, nunca 1, é o único limite fiável entre nome e valor.
const LINHA_CONSUMO = new RegExp(`([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9 ./\\-]{1,45}?)\\s{2,}(${VALOR_CONSUMO})\\s{2,}(${VALOR_CONSUMO}|-)`, "g");

// Interpreta um valor de consumo já capturado pelo LINHA_CONSUMO, devolvendo-o numa
// unidade comparável (segundos para tempo, MB para dados, unidades para o resto).
function parseValorConsumo(str) {
  const mTempo = /^(\d+):(\d{2})$/.exec(str);
  if (mTempo) return { tipo: "tempo", comparavel: Number(mTempo[1]) * 60 + Number(mTempo[2]) };
  const mDados = /^[\d.,]+\s?(?:GB|MB)\s?\(([\d.,]+)\s?MB\*?\)$/.exec(str);
  if (mDados) return { tipo: "dados", comparavel: parseFloat(mDados[1].replace(",", ".")) };
  const mNumero = /^([\d.,]+)$/.exec(str);
  if (mNumero) return { tipo: "numero", comparavel: parseFloat(mNumero[1].replace(",", ".")) };
  return null;
}

// Extrai todas as linhas de "Consumos mensais incluídos" dentro de um segmento (bloco
// de um Nº/Serviço) — zero, uma ou várias (ex. "Biz Plus" pode ter min/sms + dados +
// roaming, cada um com o seu próprio pacote). Nunca inventa: se a secção não existir
// no segmento, devolve [].
function extrairConsumosMensais(segmento) {
  const marcador = "Consumos mensais incluídos";
  const inicio = segmento.indexOf(marcador);
  if (inicio === -1) return [];
  let zona = segmento.slice(inicio + marcador.length);
  // A zona começa sempre por "atribuído   utilizado" (cabeçalho das colunas) — salta-o
  // explicitamente. Sem isto (bug real, encontrado ao testar contra faturas reais em
  // 2026-09-08), "atribuído"/"utilizado" não batem certo com nenhum VALOR_CONSUMO, o
  // regex tenta esticar o "nome" para lá do cabeçalho, e o nome do 1º pacote sai
  // corrompido (ex. "ribuído   utilizado  Pacote 4.000 min..." em vez de "Pacote...").
  const mCabecalho = /^\s*atribuído\s*utilizado/i.exec(zona);
  if (mCabecalho) zona = zona.slice(mCabecalho[0].length);
  const fim = zona.search(/À data de emissão/);
  if (fim !== -1) zona = zona.slice(0, fim);

  const consumos = [];
  const re = new RegExp(LINHA_CONSUMO);
  let m;
  while ((m = re.exec(zona)) !== null) {
    const atribuido = parseValorConsumo(m[2]);
    if (!atribuido) continue; // valor não reconhecido — não arrisca uma linha com dados errados
    // Guarda também o texto tal como está na fatura ("8000:00", "10 GB (10240 MB)") —
    // "atribuido.comparavel" é só um número numa unidade comum para comparar/calcular
    // rácios, não é o que se mostra a Augusto (pedido explícito do utilizador,
    // 2026-09-12: "quer ver os números reais, não só a conclusão calculada").
    atribuido.texto = m[2].trim();
    const utilizado = m[3] === "-" ? null : parseValorConsumo(m[3]);
    if (utilizado) utilizado.texto = m[3].trim();
    consumos.push({ nome: m[1].trim(), atribuido, utilizado });
  }
  return consumos;
}

// Texto pronto a mostrar na Observação para UM pacote de consumo, com os números reais
// da fatura (não só a % calculada) — "<nome>: <atribuído> atribuído / <utilizado>
// utilizado (<percentagem>%)". Pedido explícito do utilizador (2026-09-12): a
// Observação só mostrava a conclusão (esgotado ou não); isto mostra sempre o detalhe,
// para qualquer tipo de pacote (minutos, dados, SMS), genérico.
function formatarConsumoTexto(c) {
  const pct = c.atribuido.comparavel ? Math.round(((c.utilizado ? c.utilizado.comparavel : 0) / c.atribuido.comparavel) * 100) : null;
  return `${c.nome}: ${c.atribuido.texto} atribuído / ${c.utilizado ? c.utilizado.texto : "—"} utilizado${pct !== null ? ` (${pct}%)` : ""}`;
}

// Extrai TODAS as linhas "(Qtd) Descrição € Valor" de um bloco de serviço — não só
// Mensalidade/Suplementares/Desconto (que já tinham regex próprias) — para se poder
// mostrar a decomposição completa de um bloco (coluna "Detalhe"). Pedido explícito do
// utilizador (2026-09-12): um bloco pode juntar vários produtos (ex. um Net + um
// OneNet de voz na mesma linha "Nº/Serviço"), e o total agregado sozinho escondia
// isso. Genérico para qualquer produto/categoria — não depende de nomes específicos.
// Descrição pode atravessar uma quebra de linha do PDF (texto embrulhado, ex. "OneNet
// User Fixo RN Desconto\npermanência 25%") — por isso o charclass exclui só "€", não
// "\n". Corta-se a zona de procura ANTES de "Total sem IVA" (é o agregado, não um item
// em si) e, quando essa linha não existe no segmento, antes de "Consumos mensais
// incluídos" / "À data de emissão" (nunca inclui frases de fidelização, que também têm
// "€", como itens).
const ITEM_DETALHE = /(?:(\d+)\s+)?([^\n€][^€]{0,90}?)\s*€\s*(-?[\d.,]+)/g;
function extrairItensDetalheSegmento(segmento) {
  const fimTotal = segmento.search(/Total sem IVA/);
  let corpo = fimTotal !== -1 ? segmento.slice(0, fimTotal) : segmento;
  if (fimTotal === -1) {
    const marcadoresFim = [corpo.search(/Consumos mensais incluídos/), corpo.search(/À data de emissão/)].filter((i) => i !== -1);
    if (marcadoresFim.length) corpo = corpo.slice(0, Math.min(...marcadoresFim));
  }
  const itens = [];
  const re = new RegExp(ITEM_DETALHE);
  let m;
  while ((m = re.exec(corpo)) !== null) {
    const valor = parseFloat(m[3].replace(",", "."));
    if (isNaN(valor)) continue;
    const descricao = m[2].trim().replace(/\s+/g, " ");
    if (!descricao) continue;
    itens.push({ qtd: m[1] ? Number(m[1]) : null, descricao, valor });
  }
  return itens;
}

// Entre os pacotes de consumo de um segmento, escolhe o que interessa para a coluna
// "Utilização média": prioriza dados (GB/MB) — é o que mais pesa numa decisão de
// dimensionamento de plafond — e dentro do mesmo tipo, o de maior plafond atribuído
// (o pacote principal, não um aditivo pequeno). Sem consumos, devolve null.
function escolherConsumoPrincipal(consumos) {
  if (!consumos.length) return null;
  const dados = consumos.filter((c) => c.atribuido.tipo === "dados");
  const candidatos = dados.length ? dados : consumos;
  return candidatos.reduce((maior, c) => (!maior || c.atribuido.comparavel > maior.atribuido.comparavel ? c : maior), null);
}

// % de utilização do pacote escolhido (0 quando "utilizado" veio "-", null quando o
// segmento não tem nenhum consumo reconhecido ou o plafond atribuído é 0).
function calcularUtilizacaoSegmento(segmento) {
  const principal = escolherConsumoPrincipal(extrairConsumosMensais(segmento));
  if (!principal || !principal.atribuido.comparavel) return null;
  const usado = principal.utilizado ? principal.utilizado.comparavel : 0;
  // "principal" fica também no retorno (não só ratio/nome) — precisa-se do plafond e do
  // utilizado em bruto (texto tal como na fatura + valor comparável em MB) para as
  // métricas por acesso da Fase D (top consumidores, detalhe por acesso) — pedido
  // explícito do utilizador, 2026-09-16. Nunca reextrai nada, só deixa de descartar o
  // que já tinha sido calculado aqui.
  return { ratio: usado / principal.atribuido.comparavel, nome: principal.nome, principal };
}

// Lê, dentro de um bloco por Nº/Serviço, a Mensalidade, o Total sem IVA, a soma de
// quaisquer linhas de "Desconto" e as frases de fidelização ("...contrato do tipo
// X, com data de fim DD-MM-AAAA..."). Suplementares nunca é procurado por nome de
// coluna (a fatura tem demasiadas variantes: "Serviços Suplementares", "Comunicações
// não incluídas", etc.) — em vez disso calcula-se por reconciliação matemática
// (Total - Mensalidade - Desconto), que bate sempre certo com o valor real da fatura.
function analisarSegmentoDetalheServico(segmento) {
  // Captura também a descrição entre "Mensalidade" e o valor — é o nome real do
  // tarifário (ex. "OneNet NrEmp Fixo"), mais fiável do que a etiqueta do cabeçalho
  // do bloco, que por vezes é só uma categoria genérica (ex. "Voz") em vez do nome
  // do serviço — descoberto ao categorizar por Fixo/Móvel e a etiqueta genérica dar
  // uma categoria errada.
  const mMensalidade = /Mensalidade\s+(.+?)\s+€\s*(-?[\d.,]+)/.exec(segmento);
  const mTotal = /Total sem IVA\s*€\s*(-?[\d.,]+)/.exec(segmento);
  let desconto = 0, achouDesconto = false;
  const reDesconto = /Desconto[^\n€]*€\s*(-?[\d.,]+)/gi;
  let md;
  while ((md = reDesconto.exec(segmento)) !== null) { desconto += parseFloat(md[1].replace(",", ".")); achouDesconto = true; }
  const fidelizacoes = [];
  const reFid = /contrato do tipo ([^,]+), com data de fim (\d{2}-\d{2}-\d{4})/g;
  let mf;
  while ((mf = reFid.exec(segmento)) !== null) fidelizacoes.push(`${mf[1].trim()} até ${mf[2]}`);
  // Deteta, a partir do texto real da secção "Comunicações não incluídas", que TIPO
  // de custo extra está presente — nunca adivinha um tipo que não esteja escrito no
  // segmento. Usado para tornar o alerta de "consumo variável" específico em vez de
  // genérico (ex. "de roaming" em vez de só "variável").
  const tiposCustoExtra = [];
  if (/roaming/i.test(segmento)) tiposCustoExtra.push("roaming");
  if (/internacion/i.test(segmento)) tiposCustoExtra.push("chamadas internacionais");
  if (/aditivo/i.test(segmento)) tiposCustoExtra.push("dados extra");
  return {
    descricaoMensalidade: mMensalidade ? mMensalidade[1].trim() : null,
    mensalidade: mMensalidade ? parseFloat(mMensalidade[2].replace(",", ".")) : null,
    total: mTotal ? parseFloat(mTotal[1].replace(",", ".")) : null,
    desconto: achouDesconto ? Number(desconto.toFixed(2)) : null,
    fidelizacoes,
    tiposCustoExtra,
    utilizacao: calcularUtilizacaoSegmento(segmento),
    // Decomposição completa do bloco (coluna "Detalhe") e detalhe legível dos consumos
    // (atribuído/utilizado reais) — pedido explícito do utilizador (2026-09-12).
    itens: extrairItensDetalheSegmento(segmento),
    consumosTexto: extrairConsumosMensais(segmento).map(formatarConsumoTexto).join("; "),
  };
}

// Fonte preferida: uma linha por Nº/Serviço real. Quando uma tabela longa atravessa
// uma quebra de página, a PDF repete o cabeçalho do bloco a meio (ex. "OneNet User
// Fixo RN 215938159 Qtd. Descrição Valor sem IVA" aparece 2x seguidas, uma vez por
// página) — por isso agrupamos os segmentos pelo mesmo número ANTES de gerar a
// linha final, para não duplicar nem perder dados de um bloco partido ao meio.
function analisarLinhasFinanceirasPorServico(texto, nomeFicheiro) {
  const cabecalhos = encontrarCabecalhosDetalheServico(texto);
  if (!cabecalhos.length) return null; // esta fatura não tem esta secção — usar o fallback por categoria

  const porNumero = new Map();
  cabecalhos.forEach((c, i) => {
    const fimSegmento = i + 1 < cabecalhos.length ? cabecalhos[i + 1].pos : texto.length;
    const dados = analisarSegmentoDetalheServico(texto.slice(c.fimCabecalho, fimSegmento));
    if (!porNumero.has(c.numero)) porNumero.set(c.numero, { tarifario: c.tarifario, segmentos: [] });
    porNumero.get(c.numero).segmentos.push(dados);
  });

  const linhas = [];
  for (const [numero, { tarifario: tarifarioCabecalho, segmentos }] of porNumero) {
    const primeiroNaoNulo = (campo) => { for (const s of segmentos) if (s[campo] !== null) return s[campo]; return null; };
    // Prefere a descrição real da linha "Mensalidade" (ex. "OneNet NrEmp Fixo") à
    // etiqueta do cabeçalho do bloco (ex. "Voz"), que por vezes é só uma categoria
    // genérica em vez do nome do serviço — mais preciso para tudo o que a lê depois
    // (categorização Fixo/Móvel incluída).
    const tarifario = primeiroNaoNulo("descricaoMensalidade") || tarifarioCabecalho;
    const mensalidade = primeiroNaoNulo("mensalidade");
    const totais = segmentos.map((s) => s.total).filter((v) => v !== null);
    const total = totais.length ? totais[totais.length - 1] : null;
    const descValores = segmentos.map((s) => s.desconto).filter((v) => v !== null);
    const desconto = descValores.length ? Number(descValores.reduce((a, b) => a + b, 0).toFixed(2)) : 0;
    const suplementares = mensalidade !== null && total !== null ? Number((total - mensalidade - desconto).toFixed(2)) : null;
    const fidelizacoes = [...new Set(segmentos.flatMap((s) => s.fidelizacoes))];
    const tiposCustoExtra = [...new Set(segmentos.flatMap((s) => s.tiposCustoExtra || []))];
    const utilizacao = primeiroNaoNulo("utilizacao");
    // Junta os itens de TODOS os segmentos deste número (ex. o caso real de um bloco
    // "Net Voz" repartido em 2 mini-tabelas com o mesmo número) — a decomposição
    // completa do bloco, não só o resumo Mensalidade/Suplementares/Desconto. Pedido
    // explícito do utilizador (2026-09-12).
    const itensCombinados = segmentos.flatMap((s) => s.itens || []);
    const consumosTexto = segmentos.map((s) => s.consumosTexto).filter(Boolean).join("; ");

    const base = {
      id: `${nomeFicheiro}-${numero}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      origem: nomeFicheiro,
      numero, tarifario,
      mensalidade: "", suplementares: "", desconto: "", total: "", fidelizacao: fidelizacoes.join("; "),
      custoExtraTipo: tiposCustoExtra.join(", "),
      utilizacaoMedia: "", tipoUtilizacao: "", observacao: "",
      utilizacaoRatio: utilizacao ? utilizacao.ratio : null, utilizacaoNomePacote: utilizacao ? utilizacao.nome : "",
      // Plafond/utilizado em bruto (texto da fatura + valor comparável em MB) — usado
      // pelas métricas por acesso da Fase D (top consumidores, detalhe por acesso).
      // null sempre que não houver pacote de consumo nesta linha — nunca inventado.
      consumoPrincipal: utilizacao && utilizacao.principal ? utilizacao.principal : null,
      itens: itensCombinados, consumosTexto,
      confianca: "nao-identificado",
      acaoProposta: "", mensalidadeNova: "", observacaoProposta: "",
    };

    if (mensalidade !== null && total !== null) {
      linhas.push({ ...base, mensalidade: String(mensalidade), suplementares: String(suplementares), desconto: String(desconto), total: String(total), confianca: "extraido" });
    } else {
      linhas.push({ ...base, observacao: `⚠ Não foi possível encontrar Mensalidade e/ou Total sem IVA para este número. Confirma/completa à mão.` });
    }
  }
  return linhas;
}

// Lê o mês/ano da fatura a partir de "Resumo das últimas faturas e pagamentos
// (à data de 31 jul 2026)" — usado para agrupar/ordenar meses no resumo por
// categoria. Nunca inventa: se não encontrar, o período fica em branco e a
// linha só não entra na evolução mensal (mas continua a contar nos totais).
const MESES_PT = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
function extrairPeriodoFatura(texto) {
  const m = /à data de\s+\d{1,2}\s+([a-zçà-ÿ]{3})[a-zçà-ÿ]*\s+(\d{4})/i.exec(texto);
  if (!m) return null;
  const mes = m[1].toLowerCase();
  const ano = m[2];
  if (!(mes in MESES_PT)) return null;
  return { label: `${mes}/${ano}`, ordem: Number(ano) * 12 + MESES_PT[mes] };
}

/* ================= ANÁLISE AGREGADA MULTI-MÊS/MULTI-CONTA (Fase B, 2026-09-16) =====
   Camada nova acima do motor por Nº/Serviço já existente (analisarLinhasFinanceiras) —
   nunca duplica a extração linha a linha, só agrega o que essa extração já devolve por
   fatura, mais os totais agregados da própria fatura (tabela "Detalhes da fatura").
   Ver REQUISITOS_ANALISE_FATURAS.md secção 3(C) e 4. */

// "Conta nº NNNNNNNNN" repete-se em cada página do cabeçalho da fatura — a 1ª
// ocorrência já chega. Nunca inventa uma conta: sem match, devolve null (a fatura
// fica de fora do agrupamento por conta, nunca atribuída "por defeito" a nenhuma).
function extrairContaDaFatura(texto) {
  const m = /Conta\s*nº\s*(\d{5,12})/.exec(texto);
  return m ? m[1] : null;
}

// "Esta fatura ... € X" (secção "Faturas a pagamento") — é o valor COM IVA, cruzado
// com o Total sem IVA × 1,23 pela verificação de rigor (ver reconciliarRubricas).
function extrairEstaFatura(texto) {
  const m = /Esta fatura[^€]*€\s*([\d.,]+)/.exec(texto);
  return m ? euroParaNumero(m[1]) : null;
}

// "€ 1.291,69" (formato PT: ponto = milhares, vírgula = decimal) ou "-" (zero
// literal, é o que a fatura escreve quando a coluna não se aplica — nunca null aqui,
// "-" é uma resposta confirmada da fatura, não uma ausência de dados).
function euroParaNumero(str) {
  if (str === undefined || str === null) return null;
  const limpo = String(str).replace(/[€\s]/g, "");
  if (limpo === "-" || limpo === "") return 0;
  const n = parseFloat(limpo.replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? null : n;
}

const TOKEN_VALOR_AGREGADO = "(?:€\\s*-?[\\d.,]+|-)";
// Lê uma linha "<rótulo> €X €Y €Z €W €V €T" da tabela agregada "Detalhes da fatura"
// (colunas fixas: Mensalidade/Suplementares/Comunicações/Encargos/Descontos/Total —
// mesma ordem em qualquer fatura Vodafone Business real, confirmado). Só procura
// rótulos EXATOS e conhecidos — nunca um parser genérico de tabela, para nunca
// confundir uma linha de "Detalhes dos serviços" com uma linha agregada.
function lerLinhaAgregada(zona, rotulo) {
  const escapado = rotulo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp(`${escapado}\\s+(${TOKEN_VALOR_AGREGADO})\\s+(${TOKEN_VALOR_AGREGADO})\\s+(${TOKEN_VALOR_AGREGADO})\\s+(${TOKEN_VALOR_AGREGADO})\\s+(${TOKEN_VALOR_AGREGADO})\\s+(${TOKEN_VALOR_AGREGADO})`);
  const m = re.exec(zona);
  if (!m) return null;
  return {
    mensalidade: euroParaNumero(m[1]), suplementares: euroParaNumero(m[2]),
    comunicacoes: euroParaNumero(m[3]), encargos: euroParaNumero(m[4]),
    descontos: euroParaNumero(m[5]), total: euroParaNumero(m[6]),
  };
}

// Rubricas estruturadas da tabela agregada — separado do motor por Nº/Serviço, que só
// vê os blocos individuais em "Detalhes dos serviços". Categorias e sub-rubricas de
// Comunicações são as conhecidas de faturas Vodafone Business reais (confirmadas com
// as 12 faturas testadas nesta sessão) — uma categoria que a fatura não tenha
// simplesmente não aparece no resultado (nunca inventada).
function extrairRubricasAgregadas(texto) {
  const fim = texto.indexOf("Detalhes dos serviços");
  const zona = fim === -1 ? texto : texto.slice(0, fim);
  const categorias = {};
  ["Serviços Móveis", "Serviços Fixos", "Soluções Empresariais"].forEach((rot) => {
    const v = lerLinhaAgregada(zona, rot);
    if (v) categorias[rot] = v;
  });
  const comunicacoes = {};
  ["Comunicações nacionais", "Comunicações Internacionais", "Comunicações efetuadas em Roaming", "Comunicações dados nacionais"].forEach((rot) => {
    const v = lerLinhaAgregada(zona, rot);
    if (v) comunicacoes[rot] = v.comunicacoes;
  });
  const totais = lerLinhaAgregada(zona, "Totais");
  return { categorias, comunicacoes, totais };
}

// Verificação cruzada obrigatória (requisitos, secção 4) — nunca aceitar um valor sem
// bater certo. Por categoria: Mensalidade+Suplementares+Comunicações+Encargos−Descontos
// = Total. Ao nível da fatura: soma da Mensalidade de todas as categorias vs. soma da
// Mensalidade dos números individuais (podem divergir por rubricas partilhadas, ex.
// aditivos de dados partilhados entre vários números — reportado, nunca escondido).
function reconciliarRubricas(rubricas, somaMensalidadePorNumero) {
  const avisos = [];
  Object.entries(rubricas.categorias).forEach(([rotulo, c]) => {
    const somaColunas = Number((c.mensalidade + c.suplementares + c.comunicacoes + c.encargos - c.descontos).toFixed(2));
    if (Math.abs(somaColunas - c.total) > 0.02) {
      avisos.push(`${rotulo}: Mensalidade+Suplementares+Comunicações+Encargos−Descontos (${euro(somaColunas)}) não bate com o Total apresentado (${euro(c.total)}).`);
    }
  });
  // Só faz sentido comparar se a fatura TEM tabela agregada — algumas faturas
  // (confirmado nas 5 da conta IoT da Cliente C) não têm secção "Detalhes da fatura"
  // nenhuma, só a grelha "Detalhes dos serviços"; sem categorias não é uma
  // divergência, é simplesmente não haver nada para comparar.
  if (somaMensalidadePorNumero !== null && Object.keys(rubricas.categorias).length > 0) {
    const somaMensalidadeCategorias = Number(Object.values(rubricas.categorias).reduce((s, c) => s + (c.mensalidade || 0), 0).toFixed(2));
    if (Math.abs(somaMensalidadeCategorias - somaMensalidadePorNumero) > 0.02) {
      avisos.push(`Mensalidade agregada (${euro(somaMensalidadeCategorias)}) não bate com a soma dos números individuais (${euro(somaMensalidadePorNumero)}) — pode haver rubricas partilhadas entre números (ex. aditivos de dados partilhados) não atribuídas a nenhum em concreto.`);
    }
  }
  if (rubricas.totais && rubricas.estaFatura !== undefined && rubricas.estaFatura !== null) {
    const comIva = Number((rubricas.totais.total * 1.23).toFixed(2));
    const diferenca = Math.abs(comIva - rubricas.estaFatura);
    // Tolerância de arredondamento de IVA — decisão explícita do utilizador (2026-09-17,
    // caso real Cliente A: 173,84€ "Esta fatura" vs 172,70€ Total×1,23, diferença de 1,14€
    // ≈ 0,66% do valor — arredondamento normal de IVA linha-a-linha, não uma divergência
    // real). Comparar 0,02€ fixos não escala com o valor da fatura; usar 1% relativo
    // (mínimo 0,02€, para não perder divergências genuínas em faturas pequenas) — cobre o
    // caso Cliente A sem deixar de sinalizar o caso Cliente C (IoT: diferença ~7% do valor,
    // continua a disparar o aviso).
    const TOLERANCIA_IVA_PERCENTUAL = 0.01;
    const limiar = Math.max(0.02, comIva * TOLERANCIA_IVA_PERCENTUAL);
    if (diferenca > limiar) {
      avisos.push(`"Esta fatura" (${euro(rubricas.estaFatura)}, com IVA) não reconcilia com o Total sem IVA × 1,23 (${euro(comIva)}) — a mostrar os dois valores, sem especular a causa.`);
    }
  }
  return { confirmado: avisos.length === 0, avisos };
}

// Agrupa várias faturas já analisadas individualmente por conta e por mês. Um
// cliente pode ter 1, 2 ou mais contas, cada uma com qualquer número de faturas
// anexadas (nunca presumir "sempre N meses" nem "sempre 2 contas" — decisão
// explícita do utilizador, 2026-09-16, depois do caso de referência Cliente C ter 2
// contas × 5 meses: outros clientes podem ter só 1 conta com 2 faturas). Cada fatura
// entra na conta que o seu próprio "Conta nº" diz — nunca por posição/ordem de
// upload.
function agruparPorContaEMes(faturasAnalisadas) {
  const porConta = new Map();
  faturasAnalisadas.forEach((f) => {
    if (!f.conta) return; // sem conta identificada — fica de fora, nunca atribuída "por defeito"
    if (!porConta.has(f.conta)) porConta.set(f.conta, []);
    porConta.get(f.conta).push(f);
  });
  return [...porConta.entries()].map(([conta, faturas]) => ({
    conta,
    periodos: faturas
      .map((f) => ({
        label: f.periodo ? f.periodo.label : "(período não identificado)",
        ordem: f.periodo ? f.periodo.ordem : 0,
        rubricas: f.rubricas,
        reconciliacao: f.reconciliacao,
        nomeFicheiro: f.nome,
        linhas: f.linhas,
      }))
      .sort((a, b) => a.ordem - b.ordem),
  }));
}

/* ================= MÉTRICAS POR ACESSO (Fase D, pré-requisito — 2026-09-16) =====
   Deixadas de fora de propósito na Fase B (decisão explícita do utilizador) — usam os
   mesmos `linhas` já extraídos e validados, nunca reextraem nada. Operam sempre sobre
   as linhas de UM período/fatura específico (tipicamente o mais recente de uma
   conta) — é assim que o Cliente C as calcula ("Top 10 consumidores · agosto"), nunca
   uma média entre meses. Mesma regra de rigor da Fase B: "—"/null quando a fatura não
   detalha, nunca supor um valor. */

// Ranking por consumo de DADOS em GB (nunca minutos/SMS — "top consumidores" no
// sentido do Cliente C é sempre sobre tráfego de dados). Só entram linhas com um
// consumoPrincipal do tipo "dados" — as que só têm pacote de voz/SMS ficam de fora
// deste ranking em concreto (aparecem à mesma em calcularDetalhePorAcesso).
function calcularTopConsumidores(linhas, limite) {
  return linhas
    .filter((l) => l.consumoPrincipal && l.consumoPrincipal.atribuido.tipo === "dados" && l.consumoPrincipal.utilizado)
    .map((l) => ({
      numero: l.numero,
      tarifario: l.tarifario,
      gb: Number((l.consumoPrincipal.utilizado.comparavel / 1024).toFixed(1)),
      esgotado: typeof l.utilizacaoRatio === "number" && l.utilizacaoRatio >= 0.999,
    }))
    .sort((a, b) => b.gb - a.gb)
    .slice(0, limite || 10);
}

// Distribuição por escalão de utilização de dados — mesmos 4 escalões do Cliente C
// (">5 GB", "1-5 GB", "<1 GB", "sem registo"). "Sem registo" inclui tanto as linhas
// sem nenhuma secção de consumo na fatura como as que só têm consumo de voz/SMS (sem
// pacote de dados a medir) — nunca finge um valor de dados que a fatura não deu.
function calcularDistribuicaoTrafego(linhas) {
  const comDados = linhas.filter((l) => l.consumoPrincipal && l.consumoPrincipal.atribuido.tipo === "dados" && l.consumoPrincipal.utilizado);
  const gbs = comDados.map((l) => l.consumoPrincipal.utilizado.comparavel / 1024);
  const maisDe5 = gbs.filter((g) => g > 5).length;
  const entre1e5 = gbs.filter((g) => g > 1 && g <= 5).length;
  const menosDe1 = gbs.filter((g) => g <= 1).length;
  const semRegisto = linhas.length - comDados.length;
  return [
    { escalao: "Mais de 5 GB", n: maisDe5 },
    { escalao: "1 a 5 GB", n: entre1e5 },
    { escalao: "Menos de 1 GB", n: menosDe1 },
    { escalao: "Sem registo na fatura", n: semRegisto },
  ];
}

// Parque por tarifário — nº de acessos + custo mensal total por tarifário, ordenado
// por nº de acessos (o tarifário mais representado primeiro, tal como o Cliente C).
function calcularParquePorTarifario(linhas) {
  const porTarifario = new Map();
  linhas.forEach((l) => {
    const chave = l.tarifario || "—";
    if (!porTarifario.has(chave)) porTarifario.set(chave, { tarifario: chave, nAcessos: 0, custoMensal: 0 });
    const g = porTarifario.get(chave);
    g.nAcessos += 1;
    g.custoMensal = Number((g.custoMensal + (Number(l.mensalidade) || 0)).toFixed(2));
  });
  return [...porTarifario.values()].sort((a, b) => b.nAcessos - a.nAcessos);
}

// Detalhe por acesso — 1 linha por número, plafond/utilizado em texto tal como na
// fatura (nunca só a %), e o estado (mesmos limiares do Cliente C: >=100% Esgotado,
// >=80% Alto, senão OK; "—" sem consumo nenhum registado).
function calcularDetalhePorAcesso(linhas) {
  return linhas.map((l) => {
    const c = l.consumoPrincipal;
    const pct = typeof l.utilizacaoRatio === "number" ? Math.round(l.utilizacaoRatio * 100) : null;
    const estado = pct === null ? "—" : pct >= 100 ? "Esgotado" : pct >= 80 ? "Alto" : "OK";
    return {
      numero: l.numero,
      tarifario: l.tarifario,
      plafond: c ? c.atribuido.texto : "—",
      utilizado: c && c.utilizado ? c.utilizado.texto : "—",
      pct,
      estado,
      mensalidade: Number(l.mensalidade) || 0,
    };
  });
}

/* ================= FASE D — PAINEL EXECUTIVO ESTILO Cliente C (2026-09-16) ==========
   Gerador do HTML autónomo (Chart.js por CDN, mesmo padrão de carregamento externo já
   usado para pdf.js/Babel — só dentro do ficheiro exportado, o dashboard em si não
   precisa de gráficos). Réplica da paleta/tipografia/estrutura de cartões do
   dashboard-madeca.html (referência gold standard, estudada em detalhe): --vf/--ink/
   --muted/--line/--bg/--card/--ok/--warn/--bad/--az. Generalizado para qualquer nº de
   contas (nunca presume "sempre 2, Móvel+IoT" — só a Cliente C calhou ter 2). */

// Soma um campo por mês, entre todas as contas — usado para o total agregado da Visão
// Geral (evolução mensal, gasto do mês mais recente). Uma conta sem fatura num mês
// simplesmente não contribui nada nesse mês (nunca inventa um valor a 0 que pareça um
// dado real — é ausência de dado, não um zero medido).
function agregarPorMes(contas, campo) {
  const porMes = new Map();
  contas.forEach((c) => c.periodos.forEach((p) => {
    const t = p.rubricas.totais;
    if (!t || t[campo] === null || t[campo] === undefined) return;
    if (!porMes.has(p.label)) porMes.set(p.label, { label: p.label, ordem: p.ordem, valor: 0 });
    porMes.get(p.label).valor = Number((porMes.get(p.label).valor + t[campo]).toFixed(2));
  }));
  return [...porMes.values()].sort((a, b) => a.ordem - b.ordem);
}

// KPIs e cartões de insight da "Visão geral" — sempre derivados dos dados já
// extraídos/reconciliados, nunca uma narrativa inventada. Insights genéricos
// (aplicam-se a qualquer cliente, não só à Cliente C): Atenção (acessos esgotados),
// Concentração (top acessos vs. tráfego total medido), Estável (variação do gasto
// total), Fidelização (data mais comum). "Ajuste possível" (aditivos subaproveitados)
// da Cliente C ficou de fora — é um padrão bespoke que não generaliza com segurança sem
// arriscar uma leitura errada para outro cliente.
function calcularKpisEInsights(contas) {
  const totalPorMes = agregarPorMes(contas, "total");
  const mesRecente = totalPorMes[totalPorMes.length - 1] || null;
  const mesAnterior = totalPorMes.length > 1 ? totalPorMes[totalPorMes.length - 2] : null;
  const gastoMesRecente = mesRecente ? mesRecente.valor : null;
  const mediaMensal = totalPorMes.length ? Number((totalPorMes.reduce((s, m) => s + m.valor, 0) / totalPorMes.length).toFixed(2)) : null;

  // Linhas/mensalidade+suplementares/comunicações do mês mais recente, somadas entre contas.
  let nLinhasRecente = 0, mensSuplRecente = 0, brutoRecente = 0, comunicacoesRecente = null, comunicacoesAnterior = null;
  const linhasRecenteTodas = [];
  contas.forEach((c) => {
    const pr = c.periodos[c.periodos.length - 1];
    if (!pr || pr.label !== (mesRecente && mesRecente.label)) return;
    nLinhasRecente += (pr.linhas || []).length;
    linhasRecenteTodas.push(...(pr.linhas || []));
    if (pr.rubricas.totais) {
      const t = pr.rubricas.totais;
      mensSuplRecente += (t.mensalidade || 0) + (t.suplementares || 0);
      brutoRecente += (t.total || 0) + Math.abs(t.descontos || 0);
    }
    const dadosNac = pr.rubricas.comunicacoes && pr.rubricas.comunicacoes["Comunicações dados nacionais"];
    if (typeof dadosNac === "number") comunicacoesRecente = (comunicacoesRecente || 0) + dadosNac;
  });
  if (mesAnterior) {
    contas.forEach((c) => {
      const pa = c.periodos.find((p) => p.label === mesAnterior.label);
      if (!pa) return;
      const dadosNac = pa.rubricas.comunicacoes && pa.rubricas.comunicacoes["Comunicações dados nacionais"];
      if (typeof dadosNac === "number") comunicacoesAnterior = (comunicacoesAnterior || 0) + dadosNac;
    });
  }
  const custoPorLinha = nLinhasRecente ? Number((gastoMesRecente / nLinhasRecente).toFixed(2)) : null;
  // % fixo / % variável (corrigido 2026-09-26, caso real Cliente A mai/2026 = "117%"):
  // mensalidades+suplementares vêm ANTES dos descontos, mas o total já os tem abatidos
  // (140,25€ = 124,02 + 39,39 − 23,16) — dividir um pelo outro passava de 100%. Agora
  // ambas as partes são medidas sobre o valor bruto (total + descontos), a parte
  // variável é o resto, e as duas ficam sempre entre 0 e 100 e somam 100.
  const custoFixoPercent = brutoRecente > 0 ? Math.min(100, Math.max(0, Math.round((mensSuplRecente / brutoRecente) * 100))) : null;
  const custoVariavelPercent = custoFixoPercent !== null ? 100 - custoFixoPercent : null;

  const insights = [];
  const detalheRecente = calcularDetalhePorAcesso(linhasRecenteTodas);
  const esgotados = detalheRecente.filter((d) => d.estado === "Esgotado");
  if (esgotados.length) {
    insights.push({ tipo: "red", rotulo: "Atenção", valor: `${esgotados.length} acesso${esgotados.length === 1 ? "" : "s"}`, texto: `esgotaram o plafond de dados no mês mais recente: ${esgotados.map((d) => d.numero).join(", ")}` });
  }
  const topRecente = calcularTopConsumidores(linhasRecenteTodas, 5);
  const totalGbMedido = calcularTopConsumidores(linhasRecenteTodas, 9999).reduce((s, t) => s + t.gb, 0);
  if (topRecente.length && totalGbMedido > 0) {
    const gbTop = topRecente.reduce((s, t) => s + t.gb, 0);
    insights.push({ tipo: "net", rotulo: "Concentração", valor: `${topRecente.length} acessos`, texto: `= ${Math.round((gbTop / totalGbMedido) * 100)}% do tráfego de dados medido no mês` });
  }
  if (totalPorMes.length > 1) {
    const valores = totalPorMes.map((m) => m.valor);
    const variacaoPercent = mediaMensal ? Math.round(((Math.max(...valores) - Math.min(...valores)) / mediaMensal) * 100) : null;
    insights.push({ tipo: "grn", rotulo: "Estável", valor: `${formatEuro(mediaMensal)}/mês`, texto: `média${variacaoPercent !== null ? `, variação de ${variacaoPercent}% entre o mês mais alto e o mais baixo` : ""}` });
  }
  const fidelizacoes = linhasRecenteTodas.map((l) => l.fidelizacao).filter(Boolean).flatMap((f) => f.split("; ")).map((f) => (f.match(/\d{2}-\d{2}-\d{4}/) || [])[0]).filter(Boolean);
  if (fidelizacoes.length) {
    const contagem = new Map();
    fidelizacoes.forEach((d) => contagem.set(d, (contagem.get(d) || 0) + 1));
    const [dataComum, n] = [...contagem.entries()].sort((a, b) => b[1] - a[1])[0];
    insights.push({ tipo: "azu", rotulo: "Fidelização", valor: dataComum, texto: `${n} de ${fidelizacoes.length} acesso(s) com data de fim de contrato conhecida renovam nesta data` });
  }

  return {
    totalPorMes, gastoMesRecente, mediaMensal, custoPorLinha, custoFixoPercent, custoVariavelPercent,
    comunicacoesRecente, comunicacoesAnterior, nLinhasRecente, insights,
    mesRecenteLabel: mesRecente ? mesRecente.label : null,
  };
}

// Formata uma data JS como AAAA-MM-DD, para o nome do ficheiro exportado — nunca
// sobrescrever uma análise anterior (decisão explícita do utilizador).
function dataISOCurta(d) {
  return d.toISOString().slice(0, 10);
}

// Escapa texto para dentro de HTML — nunca confiar em nome de cliente/tarifário/
// observação como HTML seguro (podem conter "&", "<", etc. vindos da fatura real).
function escaparHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Gera o painel HTML autónomo (Fase D) — réplica da paleta/tipografia/estrutura de
// cartões do dashboard-madeca.html (referência gold standard). Generalizado para
// qualquer nº de contas (nunca presume 2 nem nomes "Móvel"/"IoT" — rotula cada conta
// pela categoria dominante dos seus próprios tarifários). Chart.js só carregado AQUI
// dentro (CDN, mesmo padrão de dependência externa já usado para pdf.js/Babel) — o
// dashboard em si nunca precisou de gráficos.
function gerarHtmlAnaliseFaturas(nomeCliente, contas, dataAnalise, avisos) {
  const nomeUpper = escaparHtml(nomeCliente.toUpperCase());
  const kpis = calcularKpisEInsights(contas);
  const avisosLista = avisos || [];

  const contasInfo = contas.map((c) => {
    const periodoRecente = c.periodos[c.periodos.length - 1];
    const linhasRecentes = (periodoRecente && periodoRecente.linhas) || [];
    const categorias = linhasRecentes.map((l) => categorizarServico(l.tarifario));
    const contagemCat = new Map();
    categorias.forEach((cat) => contagemCat.set(cat, (contagemCat.get(cat) || 0) + 1));
    const categoriaDominante = [...contagemCat.entries()].sort((a, b) => b[1] - a[1])[0];
    return {
      conta: c.conta,
      idDom: c.conta.replace(/\D/g, "") || c.conta,
      rotulo: categoriaDominante ? categoriaDominante[0] : "Conta",
      periodos: c.periodos,
      periodoRecente,
      linhasRecentes,
      top10: calcularTopConsumidores(linhasRecentes, 10),
      dist: calcularDistribuicaoTrafego(linhasRecentes),
      parque: calcularParquePorTarifario(linhasRecentes),
      detalhe: calcularDetalhePorAcesso(linhasRecentes),
    };
  });

  const totalLinhasAtivas = contasInfo.reduce((s, c) => s + c.linhasRecentes.length, 0);
  const periodosLabelUnicos = [...new Set(contas.flatMap((c) => c.periodos.map((p) => p.label)))];
  const periodoTexto = periodosLabelUnicos.length > 1
    ? `${periodosLabelUnicos[0]}–${periodosLabelUnicos[periodosLabelUnicos.length - 1]}`
    : (periodosLabelUnicos[0] || "");
