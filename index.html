/* ================= APP ================= */

/* ================= ASSUNTOS EM PROGRESSO =================
   Lista simples de acompanhamento/lembretes por cliente — independente de Negócios e
   Propostas. Só guardada neste browser (localStorage), tal como o resto dos dados
   locais do dashboard (rascunhos, extras por cliente, etc.). */

const ASSUNTO_ESTADOS = ["Em aberto", "Em progresso", "Resolvido"];
const ASSUNTO_ESTADO_ESTILO = {
  "Em aberto": "bg-neutral-100 text-neutral-600 border-neutral-200",
  "Em progresso": "bg-blue-50 text-blue-800 border-blue-200",
  "Resolvido": "bg-emerald-50 text-emerald-800 border-emerald-200",
};
const ASSUNTO_IMPORTANCIAS = ["Alta", "Média", "Baixa"];
const ASSUNTO_IMPORTANCIA_ESTILO = {
  "Alta": "bg-red-50 text-red-700 border-red-200",
  "Média": "bg-amber-50 text-amber-800 border-amber-200",
  "Baixa": "bg-neutral-100 text-neutral-500 border-neutral-200",
};
const ASSUNTO_VAZIO = { cliente: "", estado: "Em aberto", importancia: "Média", comentario: "", dataPedido: new Date().toISOString().slice(0, 10), dataPrevista: "" };

const ASSUNTOS_FICHEIRO = "assuntos-em-progresso.json";

// Fonte de dados LOCAL: dados-privados/assuntos-em-progresso.json (dentro da pasta do
// projeto, via File System Access API) — sincroniza entre Macs via iCloud Drive,
// nunca via git. O localStorage continua a ser escrito sempre, como cópia rápida
// disponível antes de a pasta do projeto estar ligada nesta sessão (permissões da
// File System Access API não sincronizam entre Macs, só o próprio ficheiro).
//
// Migração única (decisão explícita do utilizador, 2026-09-08): assim que a pasta
// ficar ligada, se o ficheiro ainda não existir mas já houver dados no localStorage
// (versão anterior a esta pasta existir), esses dados são gravados no ficheiro novo
// automaticamente, uma única vez, antes de continuar — nunca perde o que já lá estava.
function useAssuntosLocal(ligacaoPasta) {
  const [assuntos, setAssuntos] = useState(() => {
    try { return JSON.parse(localStorage.getItem("assuntos-em-progresso") || "[]"); } catch { return []; }
  });
  const [carregadoDoFicheiro, setCarregadoDoFicheiro] = useState(false);

  useEffect(() => {
    if (!ligacaoPasta.pronto || carregadoDoFicheiro) return;
    (async () => {
      const doFicheiro = await lerJsonDadosPrivados(ligacaoPasta.handle, ASSUNTOS_FICHEIRO);
      if (doFicheiro) {
        setAssuntos(doFicheiro);
      } else if (assuntos.length > 0) {
        await guardarJsonDadosPrivados(ligacaoPasta.handle, ASSUNTOS_FICHEIRO, assuntos);
      }
      setCarregadoDoFicheiro(true);
    })();
  }, [ligacaoPasta.pronto]);

  useEffect(() => {
    try { localStorage.setItem("assuntos-em-progresso", JSON.stringify(assuntos)); } catch {}
    if (ligacaoPasta.pronto && carregadoDoFicheiro) {
      guardarJsonDadosPrivados(ligacaoPasta.handle, ASSUNTOS_FICHEIRO, assuntos);
    }
  }, [assuntos]);

  const adicionar = (a) => setAssuntos((prev) => [...prev, { ...a, id: a.id || `assunto-${Date.now()}-${Math.random().toString(36).slice(2, 7)}` }]);
  const atualizar = (id, campos) => setAssuntos((prev) => prev.map((a) => (a.id === id ? { ...a, ...campos } : a)));
  const remover = (id) => setAssuntos((prev) => prev.filter((a) => a.id !== id));

  return { assuntos, adicionar, atualizar, remover };
}

// Coleção "assuntos" no Firestore — doc id = assunto.id (mesmo formato do id local,
// "assunto-{timestamp}-{aleatorio}", ou o próprio id do documento de assuntos_inbox
// quando importado em modo nuvem, ver sincronizarAssuntosInbox). Mesmo padrão de
// useNegociosFirestore (doc id próprio, não NIF — useColecaoFirestore genérico usa
// sempre "n"/NIF, não serve aqui).
function useAssuntosFirestore(ativo) {
  const [itens, setItens] = useState([]);
  const [aCarregar, setACarregar] = useState(false);
  useEffect(() => {
    if (!ativo) { setItens([]); return; }
    setACarregar(true);
    const unsub = firebaseDb.collection("assuntos").onSnapshot(
      (snap) => { setItens(snap.docs.map((d) => d.data())); setACarregar(false); },
      (e) => { console.warn("Não foi possível ler assuntos do Firestore:", e.message); setACarregar(false); }
    );
    return unsub;
  }, [ativo]);
  const definir = (assunto) => firebaseDb.collection("assuntos").doc(String(assunto.id)).set(assunto);
  const remover = (id) => firebaseDb.collection("assuntos").doc(String(id)).delete();
  return { itens, aCarregar, definir, remover };
}

// "Assuntos em Progresso" (2026-09-20) — achado real: era a ÚNICA secção do dashboard
// sem migração para o Firestore, ao contrário de Clientes/Prospetos/Negócios/etc. Isso
// tornava-a invisível em qualquer browser sem acesso ao ficheiro iCloud local — em
// particular no site público (gracaam.github.io/Dashboard-Vodafone), que nunca tem
// "pasta do projeto" ligada. Um assunto importado de assuntos_inbox nesse site ficava
// preso só no localStorage desse browser específico, mesmo com processado:true a
// confirmar (erradamente lido como "arquivado") que a importação tinha corrido bem —
// nunca mais visível em lado nenhum. Mesmo padrão de useClientesNovos: local por
// omissão, migração única e explícita para a nuvem, nunca automática.
function useAssuntos(ligacaoPasta) {
  const local = useAssuntosLocal(ligacaoPasta);
  const firebaseUser = useFirebaseAuthUser();
  const { feita: nuvemMigrada, marcar: marcarMigrado } = useMigracaoNuvem("assuntos", firebaseUser);
  const nuvemAtiva = !!firebaseUser && nuvemMigrada;
  const nuvem = useAssuntosFirestore(nuvemAtiva);

  const assuntos = nuvemAtiva ? nuvem.itens : local.assuntos;
  const adicionar = nuvemAtiva
    ? (a) => nuvem.definir({ ...a, id: a.id || `assunto-${Date.now()}-${Math.random().toString(36).slice(2, 7)}` })
    : local.adicionar;
  // `.set(campos, {merge:true})`, não nuvem.definir (que sobrescreve o documento
  // inteiro) — só grava os campos alterados, nunca depende do cache local (nuvem.itens)
  // estar 100% fresco para reconstruir o resto do documento (mesmo cuidado já usado em
  // definirNegociosFechados, useClientesNovos).
  const atualizar = nuvemAtiva
    ? (id, campos) => firebaseDb.collection("assuntos").doc(String(id)).set(campos, { merge: true })
    : local.atualizar;
  // 🐛 Bug real corrigido (2026-09-25): apagar um assunto importado do telemóvel
  // (assuntos_inbox) fazia-o REAPARECER no próximo sync — sincronizarAssuntosInbox
  // em modo nuvem ignora `processado` de propósito (ver comentário na função, achado
  // de 2026-09-20) e só evita reimportar quem já existe em `idsExistentes`
  // (calculado a partir da lista `assuntos` atual); ao apagar, o id desaparece dessa
  // lista, e o documento em assuntos_inbox continua lá para ser reimportado. Corrigido
  // apagando também (best-effort, nunca bloqueia a remoção do assunto em si) o
  // documento de origem em assuntos_inbox, se existir — apagar um doc inexistente no
  // Firestore é um no-op seguro, por isso é seguro tentar sempre, mesmo para assuntos
  // criados diretamente aqui (nunca tiveram doc em assuntos_inbox).
  const removerComLimpezaInbox = async (id) => {
    const resultado = nuvemAtiva ? await nuvem.remover(id) : local.remover(id);
    try { await firebaseDb.collection("assuntos_inbox").doc(String(id)).delete(); } catch {}
    return resultado;
  };

  const [aMigrar, setAMigrar] = useState(false);
  const migrarParaNuvem = async () => {
    if (!firebaseUser || nuvemAtiva) return { ok: false };
    setAMigrar(true);
    for (const a of local.assuntos) await nuvem.definir(a);
    await marcarMigrado();
    setAMigrar(false);
    return { ok: true, n: local.assuntos.length };
  };

  // "Sincronizar assuntos locais em falta" (2026-09-20) — achado real de Augusto: a
  // migração "uma vez só" já tinha corrido antes de alguns assuntos locais existirem
  // (ex. recuperados de assuntos_inbox depois da migração), por isso ficaram só no
  // ficheiro/localStorage local, nunca na nuvem — e `migrarParaNuvem` recusa-se a
  // correr outra vez (`nuvemAtiva` já true), o que é correto para não duplicar os que
  // já lá estão. Compara por id (idempotente, mesmo padrão de
  // sincronizarAssuntosInbox) — só envia quem ainda não existir na coleção "assuntos",
  // nunca sobrescreve nem duplica os já migrados.
  const [aSincronizarFaltantes, setASincronizarFaltantes] = useState(false);
  const sincronizarLocalEmFaltaParaNuvem = async () => {
    if (!nuvemAtiva) return { ok: false };
    setASincronizarFaltantes(true);
    const idsNuvem = new Set(nuvem.itens.map((a) => a.id));
    const faltantes = local.assuntos.filter((a) => !idsNuvem.has(a.id));
    for (const a of faltantes) await nuvem.definir(a);
    setASincronizarFaltantes(false);
    return { ok: true, n: faltantes.length };
  };

  return {
    assuntos, adicionar, atualizar, remover: removerComLimpezaInbox, ligacaoPasta,
    firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar: local.assuntos.length,
    aCarregarNuvem: nuvem.aCarregar,
    sincronizarLocalEmFaltaParaNuvem, aSincronizarFaltantes, nLocalTotal: local.assuntos.length,
  };
}

const DIAS_SEMANA_ABREV = ["D", "S", "T", "Q", "Q", "S", "S"];

// Calendário mensal simples, sem dependências — mostra um ponto nos dias com pelo
// menos um assunto de "dataPrevista" nesse dia. Clicar num dia filtra a lista à
// esquerda (clicar outra vez remove o filtro); setas navegam entre meses. O mês
// exibido é estado local deste componente — navegar não altera o filtro ativo.
function CalendarioAssuntos({ assuntos, diaFiltro, onSelecionarDia }) {
  const hoje = new Date();
  const [mesAtual, setMesAtual] = useState({ ano: hoje.getFullYear(), mes: hoje.getMonth() });

  const contagemPorDia = useMemo(() => {
    const mapa = {};
    assuntos.forEach((a) => {
      if (!a.dataPrevista) return;
      mapa[a.dataPrevista] = (mapa[a.dataPrevista] || 0) + 1;
    });
    return mapa;
  }, [assuntos]);

  const primeiroDia = new Date(mesAtual.ano, mesAtual.mes, 1);
  const diasNoMes = new Date(mesAtual.ano, mesAtual.mes + 1, 0).getDate();
  const offsetInicio = primeiroDia.getDay();
  const hojeStr = hoje.toISOString().slice(0, 10);
  const formatarData = (d) => `${mesAtual.ano}-${String(mesAtual.mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const mudarMes = (delta) => setMesAtual((prev) => {
    const novo = new Date(prev.ano, prev.mes + delta, 1);
    return { ano: novo.getFullYear(), mes: novo.getMonth() };
  });

  const celulas = [...Array(offsetInicio).fill(null), ...Array.from({ length: diasNoMes }, (_, i) => i + 1)];

  return (
    <div className="border border-neutral-200 rounded-lg bg-white p-3 space-y-2 h-fit lg:sticky lg:top-4">
      <div className="flex items-center justify-between">
        <button onClick={() => mudarMes(-1)} className="text-neutral-400 hover:text-neutral-800 px-1.5 py-0.5 rounded hover:bg-neutral-50">‹</button>
        <div className="text-xs font-medium capitalize">{primeiroDia.toLocaleDateString("pt-PT", { month: "long", year: "numeric" })}</div>
        <button onClick={() => mudarMes(1)} className="text-neutral-400 hover:text-neutral-800 px-1.5 py-0.5 rounded hover:bg-neutral-50">›</button>
      </div>
      <div className="grid grid-cols-7 gap-0.5 text-center text-[10px] text-neutral-400">
        {DIAS_SEMANA_ABREV.map((d, i) => <div key={i}>{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-0.5">
        {celulas.map((d, i) => {
          if (d === null) return <div key={i} />;
          const dataStr = formatarData(d);
          const count = contagemPorDia[dataStr] || 0;
          const ativo = diaFiltro === dataStr;
          const ehHoje = dataStr === hojeStr;
          return (
            <button key={i} onClick={() => onSelecionarDia(dataStr)}
              title={count > 0 ? `${count} assunto${count === 1 ? "" : "s"} previsto${count === 1 ? "" : "s"}` : ""}
              className={`relative aspect-square flex flex-col items-center justify-center rounded-md text-[11px] transition-colors ${
                ativo ? "bg-red-600 text-white font-medium" : ehHoje ? "bg-neutral-100 font-medium text-neutral-900" : "text-neutral-700 hover:bg-neutral-50"}`}>
              {d}
              <span className={`w-1 h-1 rounded-full mt-0.5 ${count > 0 ? (ativo ? "bg-white" : "bg-red-500") : "bg-transparent"}`} />
            </button>
          );
        })}
      </div>
      {diaFiltro && (
        <button onClick={() => onSelecionarDia(diaFiltro)} className="text-[11px] text-neutral-400 hover:text-neutral-700">
          ✕ limpar filtro de dia ({new Date(diaFiltro).toLocaleDateString("pt-PT")})
        </button>
      )}
    </div>
  );
}

// Marcar "Resolvido" tira o assunto da lista ativa (arquivado, não apagado) — só
// muda de estado, os dados continuam todos lá, disponíveis na secção de arquivo.
// Cartão de um assunto — "✏️ Editar" (novo, 2026-09-25, pedido explícito do
// utilizador: antes só era possível mudar o Estado) alterna para um pequeno formulário
// inline com Comentário + Data prevista; Cliente/Data do pedido/Importância continuam
// só editáveis ao criar (decisão de manter o âmbito pedido, não abrir tudo). Convertido
// de função simples para componente próprio (React exige um componente de verdade
// para poder ter o seu próprio useState de edição, um por cartão).
function CartaoAssunto({ a, arquivado, atualizar, remover }) {
  const [aEditar, setAEditar] = useState(false);
  const [rascunho, setRascunho] = useState({ comentario: a.comentario, dataPrevista: a.dataPrevista || "" });

  const abrirEdicao = () => { setRascunho({ comentario: a.comentario, dataPrevista: a.dataPrevista || "" }); setAEditar(true); };
  const guardarEdicao = () => {
    if (!rascunho.comentario.trim()) return;
    atualizar(a.id, { comentario: rascunho.comentario, dataPrevista: rascunho.dataPrevista });
    setAEditar(false);
  };

  return (
    <div className={`border rounded-lg p-3 space-y-1.5 ${arquivado ? "border-neutral-100 bg-neutral-50 opacity-70" : "border-neutral-200 bg-white"}`}>
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <div className="flex items-center gap-2">
          <span className="text-sm font-medium">{a.cliente}</span>
          {!arquivado && <span className={`text-[10px] px-2 py-0.5 rounded-full border ${ASSUNTO_IMPORTANCIA_ESTILO[a.importancia]}`}>{a.importancia}</span>}
          {!aEditar && a.dataPrevista && (
            <span className="text-[10px] px-2 py-0.5 rounded-full border border-neutral-200 text-neutral-500">
              📅 previsto {new Date(a.dataPrevista).toLocaleDateString("pt-PT")}
            </span>
          )}
        </div>
        <span className="text-[11px] text-neutral-400">{a.dataPedido}</span>
      </div>

      {aEditar ? (
        <div className="space-y-2 pt-1">
          <textarea value={rascunho.comentario} onChange={(e) => setRascunho({ ...rascunho, comentario: e.target.value })} rows={2}
            className="w-full px-2.5 py-1.5 rounded-md border border-neutral-200 text-sm focus:outline-none focus:border-red-600 resize-none" />
          <div className="flex items-center gap-2">
            <label className="text-[11px] text-neutral-500">Data prevista:</label>
            <input type="date" value={rascunho.dataPrevista} onChange={(e) => setRascunho({ ...rascunho, dataPrevista: e.target.value })}
              className="px-2 py-1 rounded-md border border-neutral-200 text-xs" />
            <button onClick={guardarEdicao} className="text-[11px] px-2.5 py-1 rounded-md bg-red-600 text-white hover:bg-red-700 ml-auto">Guardar</button>

function AssuntosView({ ligacaoPasta }) {
  const { assuntos, adicionar, atualizar, remover, firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar, aCarregarNuvem,
    sincronizarLocalEmFaltaParaNuvem, aSincronizarFaltantes, nLocalTotal } = useAssuntos(ligacaoPasta);
  const [resultadoSincFaltantes, setResultadoSincFaltantes] = useState(null);
  const sincronizarFaltantesClick = async () => {
    const { n } = await sincronizarLocalEmFaltaParaNuvem();
    setResultadoSincFaltantes(n);
    setTimeout(() => setResultadoSincFaltantes(null), 8000);
  };
  const [form, setForm] = useState(null);
  const [mostrarArquivo, setMostrarArquivo] = useState(false);
  // Dia selecionado no calendário (formato "AAAA-MM-DD") — null = sem filtro. Clicar
  // no mesmo dia outra vez remove o filtro (ver onSelecionarDia).
  const [diaFiltro, setDiaFiltro] = useState(null);
  const onSelecionarDia = (dataStr) => setDiaFiltro((prev) => (prev === dataStr ? null : dataStr));

  const abrirNovo = () => setForm({ ...ASSUNTO_VAZIO });
  const guardar = () => {
    if (!form.cliente.trim() || !form.comentario.trim()) return;
    adicionar(form);
    setForm(null);
  };

  // Sincronização com a página mobile (Firestore) — decisão explícita do utilizador
  // (2026-09-18): automática sempre que esta tab abre, sem botão manual. Corre de
  // novo sempre que o login muda (login feito agora mesmo, ou sessão já persistida
  // deste browser reconhecida ao montar). Ver sincronizarAssuntosInbox.
  // Em modo nuvem, espera a 1ª leitura da coleção "assuntos" terminar
  // (aCarregarNuvem) antes de sincronizar — sem isso, `idsExistentes` podia estar
  // vazio por só ainda não ter chegado a resposta, levando a reimportar (sobrescrever)
  // um assunto já editado por engano.
  const [avisoSync, setAvisoSync] = useState("");

  useEffect(() => {
    if (!firebaseUser) return;
    if (nuvemAtiva && aCarregarNuvem) return;
    (async () => {
      const idsExistentes = new Set(assuntos.map((a) => a.id));
      const { importados } = await sincronizarAssuntosInbox(adicionar, nuvemAtiva, idsExistentes);
      if (importados > 0) {
        setAvisoSync(`☁️ ${importados} assunto${importados === 1 ? "" : "s"} novo${importados === 1 ? "" : "s"} do telemóvel importado${importados === 1 ? "" : "s"}.`);
        setTimeout(() => setAvisoSync(""), 8000);
      }
    })();
  }, [firebaseUser, nuvemAtiva, aCarregarNuvem]);

  const ORDEM_IMPORTANCIA = { Alta: 0, Média: 1, Baixa: 2 };
  const ativos = useMemo(() => [...assuntos].filter((a) => a.estado !== "Resolvido" && (!diaFiltro || a.dataPrevista === diaFiltro)).sort((a, b) =>
    ORDEM_IMPORTANCIA[a.importancia] - ORDEM_IMPORTANCIA[b.importancia] || (b.dataPedido || "").localeCompare(a.dataPedido || "")
  ), [assuntos, diaFiltro]);
  const arquivados = useMemo(() => [...assuntos].filter((a) => a.estado === "Resolvido" && (!diaFiltro || a.dataPrevista === diaFiltro)).sort((a, b) =>
    (b.dataPedido || "").localeCompare(a.dataPedido || "")
  ), [assuntos, diaFiltro]);

  const kpis = useMemo(() => {
    const hoje = new Date().toISOString().slice(0, 10);
    const abertos = assuntos.filter((a) => a.estado !== "Resolvido");
    return [
      { rotulo: "Em aberto", valor: abertos.length, tom: "vermelho" },
      { rotulo: "Importância alta", valor: abertos.filter((a) => a.importancia === "Alta").length, tom: "amarelo" },
      { rotulo: "Em atraso", valor: abertos.filter((a) => a.dataPrevista && a.dataPrevista < hoje).length, detalhe: "data prevista já passou", tom: "escuro" },
      { rotulo: "Resolvidos", valor: assuntos.length - abertos.length, tom: "verde" },
    ];
  }, [assuntos]);

  return (
    <div className="space-y-4">
      <CartoesKpi itens={kpis} />
      {avisoSync &&<div className="text-xs text-neutral-600 bg-neutral-50 border border-neutral-200 rounded-md px-3 py-2">{avisoSync}</div>}

      {/* Login (mesma sessão do Firebase Auth) serve 2 propósitos: sincronizar do
          telemóvel (assuntos_inbox, sempre) e, depois de migrado, ler/escrever
          Assuntos na nuvem (acessível de qualquer browser — ver useAssuntos). */}
      <MigracaoNuvemBanner nome="Assuntos" firebaseUser={firebaseUser} nuvemAtiva={nuvemAtiva}
        migrarParaNuvem={migrarParaNuvem} aMigrar={aMigrar} nParaMigrar={nParaMigrar} />
      {firebaseUser && !nuvemAtiva && (
        <div className="text-[11px] text-neutral-400">☁️ Sincronizado com o telemóvel — {firebaseUser.email}</div>
      )}
      {/* Já migrado, mas podem existir assuntos locais nascidos DEPOIS da migração
          "uma vez só" (ex. recuperados do telemóvel entretanto) — nunca chegaram à
          nuvem, e migrarParaNuvem recusa-se a correr outra vez (nuvemAtiva já true).
          Compara por id, idempotente — nunca duplica os já migrados. */}
      {nuvemAtiva && nLocalTotal > 0 && (
        <div className="flex items-center gap-2 flex-wrap text-[11px] text-neutral-400">
          <button onClick={sincronizarFaltantesClick} disabled={aSincronizarFaltantes}
            className="text-[11px] px-2 py-1 rounded-md border border-neutral-200 text-neutral-500 hover:border-neutral-400 disabled:opacity-40"><Icone nome="renovar" className="w-4 h-4 shrink-0" />
            {aSincronizarFaltantes ? "A sincronizar…" : "Sincronizar assuntos locais em falta para a nuvem"}
          </button>
          {resultadoSincFaltantes !== null && (
            <span>✓ {resultadoSincFaltantes} assunto{resultadoSincFaltantes === 1 ? "" : "s"} local{resultadoSincFaltantes === 1 ? "" : "is"} em falta enviado{resultadoSincFaltantes === 1 ? "" : "s"} para a nuvem.</span>
          )}
        </div>
      )}

      <div className="flex items-center justify-end">
        {!form && (
          <button onClick={abrirNovo} className="text-xs px-3 py-1.5 rounded-md bg-red-600 text-white hover:bg-red-700">
            + Novo assunto
          </button>
        )}
      </div>

      {form && (
        <div className="border border-neutral-200 rounded-lg p-4 space-y-3 bg-white">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Cliente</label>
              <input type="text" list="assuntos-clientes-dropdown" value={form.cliente}
                onChange={(e) => setForm({ ...form, cliente: e.target.value })}
                className="w-full px-3 py-2 rounded-md border border-neutral-200 text-sm focus:outline-none focus:border-red-600" />
              <datalist id="assuntos-clientes-dropdown">{CLIENTES_BASE.map((c) => <option key={c.n} value={c.e} />)}</datalist>
            </div>
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Data do pedido</label>
              <input type="date" value={form.dataPedido} onChange={(e) => setForm({ ...form, dataPedido: e.target.value })}

            </div>
            <div>

            </div>
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Estado</label>
              <select value={form.estado} onChange={(e) => setForm({ ...form, estado: e.target.value })}

                {ASSUNTO_ESTADOS.map((e) => <option key={e} value={e}>{e}</option>)}

            </div>
            <div>
              <label className="text-xs text-neutral-500 mb-1 block">Importância</label>

// Se uma vista rebentar com um erro de runtime, mostra uma mensagem em vez de deixar
// o ecrã todo em branco — e dá a opção de voltar a tentar sem teres de recarregar a página.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  render() {
    if (this.state.erro) {
      return (
        <div className="border border-red-200 bg-red-50 rounded-lg p-6 text-sm text-red-800">
          <div className="font-medium mb-1">⚠ Algo correu mal nesta vista</div>
          <div className="text-xs text-red-600 mb-3">{String(this.state.erro.message || this.state.erro)}</div>
          <button onClick={() => this.setState({ erro: null })}
            className="text-xs bg-red-600 text-white px-3 py-1.5 rounded-md hover:bg-red-700">
            Tentar outra vez
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// Descreve uma entrada de PASTA_POR_CATEGORIA_PRODUTOS em texto, para o tooltip do
// botão e para o prompt do link claude-cli:// — deixa explícito quando uma pasta tem
// exclusões/inclusões parciais, para o Claude Code nunca ler ficheiros a mais/menos
// por engano.
function descreverPastaCategoria(entrada) {
  if (entrada.apenas) return `"${entrada.pasta}" (só "${entrada.apenas.join('", "')}", não o resto da pasta)`;
  if (entrada.excluir) return `"${entrada.pasta}" (exceto "${entrada.excluir.join('", "')}", que pertence a outra categoria)`;
  return `"${entrada.pasta}"`;
}

// fica só a navegação por categoria/produto, sem indicador nem campo de preço. Layout
// e comportamento seguem o mockup aprovado por Augusto (mockup-produtos-vodafone-v2.jpg,
// 2026-09-15): abas com sublinhado (não pastilhas), quadros com barra vermelha só no
// topo, ficha técnica etiqueta/valor. Dados vêm de um ficheiro PRÓPRIO,
// "produtos-caracteristicas.json" — nunca de "autonomias-comerciais.json" (esse é só
// para a área de referência de preço/autonomia dentro do Excel de propostas, propósito
// diferente; ver comentário em ProdutosVodafoneView anterior a esta reescrita).
/* ================= PRODUTOS VODAFONE NA NUVEM (Fase 3, Passo 4, 2026-09-20) =================
   Decisão explícita do utilizador: migração completa (166 brochuras + JSON) — sem
   dados sensíveis, catálogo igual para todos os Macs. Storage: produtos_vodafone/
   {mesmo caminho relativo usado em PASTA_POR_CATEGORIA_PRODUTOS}/{ficheiro}.pdf —
   nunca uma estrutura nova, espelha exatamente a mesma árvore de "09_Produtos
   Vodafone/". Firestore: meta/produtos_caracteristicas (1 doc só, ~70KB, bem dentro
   do limite de 1MB por documento).

   ⚠️ "Atualizar a partir da pasta" (extração de características via Claude Code
   local) CONTINUA a precisar dos PDFs em disco — o Claude Code não tem acesso ao
   Firebase Storage, só ao sistema de ficheiros local. Por isso "+ Adicionar PDF"/
   "+ Novo Produto" passam a escrever nos DOIS sítios (Storage E disco, quando ambos
   disponíveis) em vez de só um — é uma pequena diferença face ao pedido original
   ("passam a escrever no Storage, não no disco"), documentada aqui: sem o disco, a
   extração de características ficava impossível. O catálogo (JSON) também precisa de
   um passo extra de sincronização depois de cada extração (ver
   sincronizarProdutosCaracteristicasNuvem, botão "🔄 Sincronizar catálogo com a
   nuvem") — o Claude Code continua a escrever só no ficheiro local
   dados-privados/produtos-caracteristicas.json, nunca diretamente no Firestore. */
async function lerProdutosCaracteristicasNuvem() {
  try {
    const doc = await firebaseDb.collection("meta").doc("produtos_caracteristicas").get();
    return doc.exists ? doc.data() : null;
  } catch (e) {
    console.warn("Não foi possível ler o catálogo de produtos (nuvem):", e.message);
    return null;
  }
}
async function sincronizarProdutosCaracteristicasNuvem(handleProjeto) {
  if (!handleProjeto) return false;
  const catalogo = await lerJsonDadosPrivados(handleProjeto, "produtos-caracteristicas.json");
  if (!catalogo) return false;
  await firebaseDb.collection("meta").doc("produtos_caracteristicas").set(catalogo);
  return true;
}
async function listarPdfsStorageProduto(subpasta) {
  try { return (await firebaseStorage.ref(`produtos_vodafone/${subpasta}`).listAll()).items; }
  catch { return []; }
}
async function guardarPdfProdutoNuvem(subpasta, file) {
  await firebaseStorage.ref(`produtos_vodafone/${subpasta}/${file.name}`).put(file, { contentType: "application/pdf" });
}

// Percorre "09_Produtos Vodafone/" inteira (recursivo) — usado só pela migração, para
// encontrar todos os PDFs reais independentemente de estarem ou não hoje mapeados em
// PASTA_POR_CATEGORIA_PRODUTOS (nunca deixar ficheiros de fora da migração por causa
// de um mapeamento incompleto).
async function listarPdfsRecursivo(dirHandle, caminhoRelativo) {
  const resultado = [];
  for await (const [nome, handle] of dirHandle.entries()) {
    const caminho = caminhoRelativo ? `${caminhoRelativo}/${nome}` : nome;
    if (handle.kind === "directory") {
      resultado.push(...(await listarPdfsRecursivo(handle, caminho)));
    } else if (nome.toLowerCase().endsWith(".pdf")) {
      resultado.push({ caminho, handle });
    }
  }
  return resultado;
}

// Migração única — copia as 166 brochuras (caminho relativo preservado) + o catálogo
// JSON. Precisa da pasta do projeto ligada nesta sessão (é a única fonte destes PDFs).
async function migrarProdutosVodafoneParaNuvem(handleProjeto) {
  const pasta09 = await handleProjeto.getDirectoryHandle("09_Produtos Vodafone", { create: false });
  const pdfs = await listarPdfsRecursivo(pasta09, "");
  let n = 0;
  for (const { caminho, handle } of pdfs) {
    const file = await handle.getFile();
    await firebaseStorage.ref(`produtos_vodafone/${caminho}`).put(file, { contentType: "application/pdf" });
    n++;
  }
  await sincronizarProdutosCaracteristicasNuvem(handleProjeto);
  return n;
}

// Controlo discreto de "+ Adicionar PDF" por quadro de produto — pedido explícito de
// Augusto (2026-09-15): grava o PDF diretamente na 1ª pasta mapeada para a categoria
// desse produto (PASTA_POR_CATEGORIA_PRODUTOS), reaproveitando a mesma ligação de
// pasta (File System Access API) já concedida para o Excel — nunca pede escolha manual
// de pasta. Fica discreto (1 linha de texto, sem dropzone grande) para não dominar o
// quadro; aceita clique (input ficheiro) e arrastar (só nesta linha, não no quadro
// todo). O ecrã de "liga a pasta do projeto" já é tratado antes deste componente
// renderizar (ver ProdutosVodafoneView), por isso aqui a pasta já está sempre pronta.
function AdicionarPdfProduto({ handleProjeto, subpasta, semTopo, nuvemAtiva }) {
  const [aEnviar, setAEnviar] = useState(false);
  const [estado, setEstado] = useState(""); // "" | "sucesso" | "substituido" | "erro" | "cancelado"
  const [mensagemErro, setMensagemErro] = useState("");
  const [aArrastar, setAArrastar] = useState(false);
  const inputRef = React.useRef(null);

  if (!subpasta) return null;

  const enviar = async (ficheiro) => {
    if (!ficheiro) return;
    setAEnviar(true);
    setEstado("");
    setMensagemErro("");
    try {
      let jaExiste = false;
      // Grava nos 2 sítios quando ambos disponíveis (decisão explícita, ver nota
      // acima de "Atualizar a partir da pasta") — o disco continua a ser preciso para
      // o Claude Code conseguir ler o PDF; a nuvem é a nova fonte de acesso remoto.
      if (handleProjeto) {
        // Verifica ANTES de escrever se já existe um ficheiro com este nome — pedido
        // explícito de Augusto (2026-09-15, depois de um upload de teste em "One Net"
        // ter parecido "não fazer nada" por o ficheiro já lá estar): nunca substituir em
        // silêncio, pedir sempre confirmação primeiro.
        const pasta09 = await handleProjeto.getDirectoryHandle("09_Produtos Vodafone", { create: true });
        const pastaDestino = await obterPastaAninhada(pasta09, subpasta);
        try {
          await pastaDestino.getFileHandle(ficheiro.name, { create: false });
          jaExiste = true;
        } catch (e) {
          jaExiste = false;
        }
        if (jaExiste && !window.confirm(`Já existe um ficheiro "${ficheiro.name}" nesta pasta. Substituir?`)) {
          setEstado("cancelado");
          setAEnviar(false);
          return;
        }
        const fileHandle = await pastaDestino.getFileHandle(ficheiro.name, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(ficheiro);
        await writable.close();
      }
      if (nuvemAtiva) await guardarPdfProdutoNuvem(subpasta, ficheiro);
      setEstado(jaExiste ? "substituido" : "sucesso");
    } catch (e) {
      console.warn("Não foi possível gravar o PDF do produto:", e);
      setEstado("erro");
      setMensagemErro(e && e.message ? e.message : "erro desconhecido");
    }
    setAEnviar(false);
  };

  return (
    <div className={semTopo ? "" : "mt-3 pt-3 border-t border-neutral-100"}>
      <div
        onDragOver={(e) => { e.preventDefault(); setAArrastar(true); }}
        onDragLeave={() => setAArrastar(false)}
        onDrop={(e) => { e.preventDefault(); setAArrastar(false); enviar(e.dataTransfer.files[0]); }}
        className={`flex items-center gap-1.5 text-xs rounded-md px-1.5 py-1 -mx-1.5 flex-wrap ${aArrastar ? "bg-red-50 text-red-700" : ""}`}>
        <input ref={inputRef} type="file" accept="application/pdf" className="hidden"
          onChange={(e) => { enviar(e.target.files[0]); e.target.value = ""; }} />
        <button onClick={() => inputRef.current && inputRef.current.click()} disabled={aEnviar}
          className="text-neutral-400 hover:text-red-600 disabled:opacity-50">
          {aEnviar ? "A adicionar…" : "+ Adicionar PDF"}
        </button>
        {estado === "sucesso" && <span className="text-emerald-700">✓ PDF adicionado — usa "Atualizar a partir da pasta" acima para o Claude Code o ler.</span>}
        {estado === "substituido" && <span className="text-amber-700">✓ Ficheiro existente substituído — usa "Atualizar a partir da pasta" acima para o Claude Code o reler.</span>}
        {estado === "cancelado" && <span className="text-neutral-400">Cancelado — o ficheiro existente não foi alterado.</span>}
        {estado === "erro" && <span className="text-red-600">Não consegui gravar ({mensagemErro}) — confirma a ligação à pasta do projeto.</span>}
      </div>
    </div>
  );
}

// Botão "📄 Ver PDF de origem" por quadro de produto — pedido explícito de Augusto
// (2026-09-17): abre o(s) PDF(s) da pasta do produto (resolvida com a mesma
// pastaOrigemProduto usada em "+ Adicionar PDF", nunca só o ficheiroFonte original —
// pode haver mais do que um PDF na pasta depois de "+ Adicionar PDF"). 1 PDF: abre
// direto. Vários: mostra lista para escolher. Sem pasta ligada / ficheiro não
// encontrado: aviso claro, nunca falha em silêncio.
// `ficheiros` normalizado como [{ nome, abrir() }] independentemente da fonte (disco
// ou Storage) — nunca 2 versões da lógica de listagem/render (2026-09-20, Fase 3).
function VerPdfOrigemProduto({ handleProjeto, subpasta, nuvemAtiva }) {
  const [aListar, setAListar] = useState(false);
  const [ficheiros, setFicheiros] = useState(null); // null = ainda não listado
  const [erro, setErro] = useState("");

  if (!subpasta) return null;

  const clicar = async () => {
    if (!handleProjeto && !nuvemAtiva) {
      setErro("Liga a pasta do projeto ou entra na nuvem para consultar os PDFs de origem.");
      return;
    }
    setAListar(true);
    setErro("");
    try {
      let pdfs = [];
      if (handleProjeto) {
        const pasta09 = await handleProjeto.getDirectoryHandle("09_Produtos Vodafone", { create: false });
        const pastaDestino = await obterPastaAninhadaSemCriar(pasta09, subpasta);
        for await (const [nome, h] of pastaDestino.entries()) {
          if (h.kind === "file" && nome.toLowerCase().endsWith(".pdf")) {
            pdfs.push({ nome, abrir: async () => { const file = await h.getFile(); window.open(URL.createObjectURL(file), "_blank"); } });
          }
        }
      } else if (nuvemAtiva) {
        const refs = await listarPdfsStorageProduto(subpasta);
        pdfs = refs.map((ref) => ({ nome: ref.name, abrir: async () => window.open(await ref.getDownloadURL(), "_blank") }));
      }
      if (!pdfs.length) {
        setErro("Não encontrei nenhum PDF nesta pasta — pode ter sido movido ou apagado.");
        setAListar(false);
        return;
      }
      if (pdfs.length === 1) {
        await pdfs[0].abrir();
        setAListar(false);
      } else {
        setFicheiros(pdfs);
      }
    } catch (e) {
      setErro("Não encontrei a pasta deste produto — pode ter sido movida ou apagada.");
      setAListar(false);
    }
  };

  const abrirComErro = async (f) => {
    try { await f.abrir(); } catch { setErro("Não consegui abrir o ficheiro — confirma se ainda existe."); }
  };

  return (
    <div className="mt-1.5 text-xs">
      <button onClick={clicar} disabled={aListar && !ficheiros}
        className="text-neutral-400 hover:text-red-600 disabled:opacity-50"><Icone nome="documento" className="w-4 h-4 shrink-0" />
        {aListar && !ficheiros ? "A procurar…" : "Ver PDF de origem"}
      </button>
      {ficheiros && (
        <div className="mt-1 flex flex-col items-start gap-0.5">
          {ficheiros.map((f) => (
            <button key={f.nome} onClick={() => abrirComErro(f)} className="text-red-600 hover:underline">
              {f.nome}
            </button>
          ))}
        </div>
      )}
      {erro && <div className="text-red-600 mt-1">{erro}</div>}
    </div>
  );
}

// Texto do prompt para o botão "Atualizar a partir da pasta" — pede para reler só a
// pasta da categoria (nunca a pasta toda de "09_Produtos Vodafone/") e nunca incluir
// preços/autonomia (isso é só para dados-privados/autonomias-comerciais.json, ficheiro
// diferente e propósito diferente).
function gerarPromptAtualizarCategoria(categoriaId, categoriaLabel, subpastas, nomeFicheiroNovo) {
  const temRestricao = subpastas.some((s) => s.excluir || s.apenas);
  const listaPastas = subpastas.length > 1
    ? `Esta categoria cruza VÁRIAS subpastas de "09_Produtos Vodafone/" — lê todas, não só a pasta atual (cwd): ${subpastas.map(descreverPastaCategoria).join(", ")}.`
    : temRestricao
      ? `Relê os PDFs desta pasta — ${descreverPastaCategoria(subpastas[0])}.`
      : `Relê todos os PDFs desta pasta.`;
  // "+ Novo Produto" (ver NovoProdutoCategoria) reaproveita este mesmo texto, só
  // acrescentando esta frase extra — pedido explícito de Augusto (2026-09-15): o
  // ficheiro novo pode não corresponder a nenhum produto já catalogado, por isso o
  // Claude Code tem de saber explicitamente para CRIAR uma entrada nova, não só
  // atualizar as existentes.
  const avisoNovoProduto = nomeFicheiroNovo
    ? ` Atenção: há um ficheiro novo nesta pasta, "${nomeFicheiroNovo}" — é um produto novo que ainda não existe no catálogo. Cria uma nova entrada para ele, além de rever/atualizar os produtos já existentes desta categoria.`
    : "";
  return `${listaPastas}${avisoNovoProduto} Categoria "${categoriaLabel}" do catálogo "Produtos Vodafone" do dashboard — atualiza as características desta categoria em dados-privados/produtos-caracteristicas.json. Cada produto: {nome, categoriaId: "${categoriaId}", subtitulo curto, caracteristicas: [{etiqueta, valor}], nota curta} — o campo categoriaId tem de ser exatamente "${categoriaId}" (o id técnico usado no dashboard para filtrar por categoria), nunca o rótulo "${categoriaLabel}". Para campanhas, inclui uma característica "Válida até" com a data se o PDF a indicar. NUNCA incluir preços nem dados de autonomia comercial (isso fica só em autonomias-comerciais.json, nunca aqui) — exceto quando a própria condição comercial for a característica da campanha (ex. "3 meses grátis"), aí é a característica, não um valor de tabela. Mantém simples (decisão explícita de Augusto, 2026-09-15): 2-3 características relevantes por produto chegam, não precisa de ser exaustivo. Quando a fonte só tiver nome e preço, sem nenhuma característica técnica real (ex. muitos produtos Smart Solutions — ICT), não forces uma ficha técnica nem inventes características — usa em vez disso só "subtitulo" com uma descrição curta (1-2 frases) do que o produto faz, e deixa "caracteristicas" vazio nesse caso. Extrai só o que os PDFs mostrarem — se algum produto tiver dados ambíguos ou em falta, pergunta antes de inventar. Se houver mais do que uma versão/geração da mesma oferta nas fontes, usa só a mais recente e assinala isso em notasVerificacao.`;
}

// Botão "+ Novo Produto" por categoria (ver ProdutosVodafoneView) — pedido explícito
// de Augusto (2026-09-15): diferente do "+ Adicionar PDF" de cada quadro (esse só
// enriquece um produto JÁ existente), este cria um produto de raiz a partir de um PDF
// que ainda não tem quadro nenhum. Por isso vive ao nível da categoria, não de um
// produto específico. Quando a categoria tem várias pastas mapeadas, pede a Augusto
// para escolher em qual gravar (não há "pasta do produto" prévia para resolver
// sozinho, ao contrário do "+ Adicionar PDF").
function NovoProdutoCategoria({ handleProjeto, categoriaId, categoriaLabel, subpastas, caminhoProjeto, nuvemAtiva }) {
  const [ficheiroPendente, setFicheiroPendente] = useState(null); // ficheiro à espera de escolha de pasta
  const [aEnviar, setAEnviar] = useState(false);
  const [estado, setEstado] = useState(""); // "" | "sucesso" | "substituido" | "cancelado" | "erro"
  const [mensagemErro, setMensagemErro] = useState("");
  const [linkManual, setLinkManual] = useState("");
  const inputRef = React.useRef(null);

  if (!subpastas || !subpastas.length) return null;

  const gravarEAtualizar = async (ficheiro, subpasta) => {
    setAEnviar(true);
    setEstado("");
    setMensagemErro("");
    setFicheiroPendente(null);
    try {
      const pasta09 = await handleProjeto.getDirectoryHandle("09_Produtos Vodafone", { create: true });
      const pastaDestino = await obterPastaAninhada(pasta09, subpasta);
      let jaExiste = false;
      try {
        await pastaDestino.getFileHandle(ficheiro.name, { create: false });
        jaExiste = true;
      } catch (e) {
        jaExiste = false;
      }
      if (jaExiste && !window.confirm(`Já existe um ficheiro "${ficheiro.name}" nesta pasta. Substituir?`)) {
        setEstado("cancelado");
        setAEnviar(false);
        return;
      }
      const fileHandle = await pastaDestino.getFileHandle(ficheiro.name, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(ficheiro);
      await writable.close();
      if (nuvemAtiva) await guardarPdfProdutoNuvem(subpasta, ficheiro);
      const url = construirLinkClaudeCode(
        gerarPromptAtualizarCategoria(categoriaId, categoriaLabel, subpastas, ficheiro.name),
        caminhoPastaProdutos(caminhoProjeto, subpasta)
      ).url;
      setLinkManual(url);
      setEstado(jaExiste ? "substituido" : "sucesso");
      try { window.location.href = url; } catch {}
    } catch (e) {
      console.warn("Não foi possível gravar o novo produto:", e);
      setEstado("erro");
      setMensagemErro(e && e.message ? e.message : "erro desconhecido");
    }
    setAEnviar(false);
  };

  const escolherFicheiro = (ficheiro) => {
    if (!ficheiro) return;
    if (subpastas.length === 1) {
      gravarEAtualizar(ficheiro, subpastas[0].pasta);
    } else {
      setFicheiroPendente(ficheiro); // espera pela escolha de pasta abaixo
    }
  };

  return (
    <div className="flex flex-col items-end gap-1">
      <input ref={inputRef} type="file" accept="application/pdf" className="hidden"
        onChange={(e) => { escolherFicheiro(e.target.files[0]); e.target.value = ""; }} />
      <button onClick={() => inputRef.current && inputRef.current.click()} disabled={aEnviar}
        className="text-xs text-red-600 hover:underline whitespace-nowrap disabled:opacity-50">
        {aEnviar ? "A criar…" : "+ Novo Produto"}
      </button>
      {ficheiroPendente && (
        <div className="text-xs text-neutral-500 text-right bg-neutral-50 border border-neutral-200 rounded-md p-2 max-w-xs">
          <div className="mb-1">Em que pasta gravar "{ficheiroPendente.name}"?</div>
          {subpastas.map((s, i) => (
            <button key={i} onClick={() => gravarEAtualizar(ficheiroPendente, s.pasta)}
              className="block w-full text-left px-1.5 py-1 rounded hover:bg-neutral-100 text-neutral-700">
              {s.pasta}
            </button>
          ))}
          <button onClick={() => setFicheiroPendente(null)} className="block w-full text-left px-1.5 py-1 rounded hover:bg-neutral-100 text-neutral-400 mt-1">
            Cancelar
          </button>
        </div>
      )}
      {estado === "sucesso" && <span className="text-xs text-emerald-700 text-right">✓ Gravado — a abrir o Terminal… <a href={linkManual} className="underline">se não abriu, clica aqui</a>.</span>}
      {estado === "substituido" && <span className="text-xs text-amber-700 text-right">✓ Ficheiro existente substituído — a abrir o Terminal… <a href={linkManual} className="underline">se não abriu, clica aqui</a>.</span>}
      {estado === "cancelado" && <span className="text-xs text-neutral-400">Cancelado.</span>}
      {estado === "erro" && <span className="text-xs text-red-600 text-right">Não consegui gravar ({mensagemErro}).</span>}
    </div>
  );
}

function ProdutosVodafoneView({ ligacaoPasta }) {
  const [dados, setDados] = useState(null);
  const [aCarregar, setACarregar] = useState(true);
  const [categoriaSel, setCategoriaSel] = useState("todos");
  const [procura, setProcura] = useState("");
  const [caminhoProjeto] = useState(() => {
    try { return localStorage.getItem("caminhoProjetoAbsoluto") || ""; } catch { return ""; }
  });

  // Fase 3, Passo 4 (2026-09-20) — migração completa (166 brochuras + catálogo) para
  // a nuvem: sem dados sensíveis, catálogo igual para todos os Macs. Ver nota grande
  // acima de AdicionarPdfProduto sobre "Atualizar a partir da pasta" continuar a
  // precisar da pasta local ligada (o Claude Code não acede ao Storage).
  const firebaseUserProdutos = useFirebaseAuthUser();
  const { feita: nuvemProdutosMigrada, marcar: marcarProdutosMigrados } = useMigracaoNuvem("produtos_vodafone", firebaseUserProdutos);
  const nuvemAtivaProdutos = !!firebaseUserProdutos && nuvemProdutosMigrada;
  const [aMigrarProdutos, setAMigrarProdutos] = useState(false);
  const [nParaMigrarProdutos, setNParaMigrarProdutos] = useState(0);
  const [aSincronizarCatalogo, setASincronizarCatalogo] = useState(false);
  useEffect(() => {
    if (nuvemAtivaProdutos || !ligacaoPasta.pronto) return;
    (async () => {
      try {
        const pasta09 = await ligacaoPasta.handle.getDirectoryHandle("09_Produtos Vodafone", { create: false });
        setNParaMigrarProdutos((await listarPdfsRecursivo(pasta09, "")).length);
      } catch { setNParaMigrarProdutos(0); }
    })();
  }, [nuvemAtivaProdutos, ligacaoPasta.pronto]);
  const migrarProdutosNuvem = async () => {
    if (!ligacaoPasta.pronto) return;
    setAMigrarProdutos(true);
    await migrarProdutosVodafoneParaNuvem(ligacaoPasta.handle);
    await marcarProdutosMigrados();
    setAMigrarProdutos(false);
  };
  const sincronizarCatalogoClick = async () => {
    setASincronizarCatalogo(true);
    const ok = await sincronizarProdutosCaracteristicasNuvem(ligacaoPasta.pronto ? ligacaoPasta.handle : null);
    if (ok) { const lidos = await lerProdutosCaracteristicasNuvem(); setDados(lidos); }
    setASincronizarCatalogo(false);
  };

  useEffect(() => {
    (async () => {
      if (nuvemAtivaProdutos) {
        setDados(await lerProdutosCaracteristicasNuvem());
        setACarregar(false);
        return;
      }
      if (!ligacaoPasta.pronto) { setACarregar(false); return; }
      const lidos = await lerJsonDadosPrivados(ligacaoPasta.handle, "produtos-caracteristicas.json");
      setDados(lidos);
      setACarregar(false);
    })();
  }, [ligacaoPasta.pronto, nuvemAtivaProdutos]);

  // Sem pasta ligada, mas com a nuvem ativa, continua a renderizar o catálogo — só o
  // "Atualizar a partir da pasta"/"+ Novo Produto" (que dependem do Claude Code local)
  // ficam por preencher até ligar a pasta outra vez.
  if (!ligacaoPasta.pronto && !nuvemAtivaProdutos) {
    return (
      <div className="space-y-3">
        <MigracaoNuvemBanner nome="Produtos Vodafone" firebaseUser={firebaseUserProdutos} nuvemAtiva={nuvemAtivaProdutos}
          migrarParaNuvem={migrarProdutosNuvem} aMigrar={aMigrarProdutos} nParaMigrar={nParaMigrarProdutos} />
        <div className="border border-dashed border-neutral-300 rounded-lg p-8 text-center text-sm text-neutral-400">
          Liga a pasta do projeto (aviso no topo do dashboard) para aceder ao catálogo de produtos — fica guardado em "dados-privados/", tal como os outros dados sensíveis.
        </div>
      </div>
    );
  }
  if (aCarregar) {
    return <div className="text-sm text-neutral-400 p-8 text-center">A carregar...</div>;
  }

  const todosProdutos = (dados && dados.produtos) || [];
  const categoriaLabel = (id) => (CATEGORIAS_PRODUTOS_VODAFONE.find((c) => c.id === id) || {}).label || id;
  const termo = procura.trim().toLowerCase();
  const produtosFiltrados = todosProdutos.filter((p) => {
    if (categoriaSel !== "todos" && p.categoriaId !== categoriaSel) return false;
    if (termo && !p.nome.toLowerCase().includes(termo) && !(p.subtitulo || "").toLowerCase().includes(termo)) return false;
    return true;
  });

  const subpastasCategoria = PASTA_POR_CATEGORIA_PRODUTOS[categoriaSel];
  const linkAtualizar = subpastasCategoria
    ? construirLinkClaudeCode(
        gerarPromptAtualizarCategoria(categoriaSel, categoriaLabel(categoriaSel), subpastasCategoria),
        caminhoPastaProdutos(caminhoProjeto, subpastasCategoria[0].pasta)
      ).url
    : "";

  const textoVazio = termo
    ? "Nenhum produto encontrado."
    : categoriaSel === "campanhas-em-vigor"
      ? "Sem campanhas em vigor no momento."
      : categoriaSel === "todos"
        ? "Ainda não há produtos transcritos."
        : "Ainda não há produtos transcritos para esta categoria.";

  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap mb-2">
        <MigracaoNuvemBanner nome="Produtos Vodafone" firebaseUser={firebaseUserProdutos} nuvemAtiva={nuvemAtivaProdutos}
          migrarParaNuvem={migrarProdutosNuvem} aMigrar={aMigrarProdutos} nParaMigrar={nParaMigrarProdutos} />
        {nuvemAtivaProdutos && ligacaoPasta.pronto && (
          <button onClick={sincronizarCatalogoClick} disabled={aSincronizarCatalogo}
            className="text-xs px-2.5 py-1.5 rounded-md bg-neutral-900 text-white hover:bg-neutral-800 disabled:opacity-40"><Icone nome="renovar" className="w-4 h-4 shrink-0" />
            {aSincronizarCatalogo ? "A sincronizar…" : "Sincronizar catálogo (JSON) com a nuvem"}
          </button>
        )}
      </div>
      <div className="flex items-start justify-between gap-4 pb-4 border-b-2 border-neutral-900">
        <div>
          <p className="text-sm text-neutral-500 mt-1">Catálogo de consulta com as características de cada produto — sem valores comerciais.</p>
        </div>
        <input value={procura} onChange={(e) => setProcura(e.target.value)} placeholder="Procurar produto…"
          className="w-64 px-3 py-2 rounded-md border border-neutral-300 text-sm focus:outline-none focus:border-red-600" />
      </div>

      <div className="flex flex-wrap items-center justify-between gap-3 border-b border-neutral-200 mt-4">
        <div className="flex flex-wrap gap-5">
          <button onClick={() => setCategoriaSel("todos")}
            className={`pb-2.5 text-sm whitespace-nowrap border-b-2 ${categoriaSel === "todos" ? "text-neutral-900 font-medium border-red-600" : "text-neutral-500 hover:text-neutral-700 border-transparent"}`}>
            Todos
          </button>
          {CATEGORIAS_PRODUTOS_VODAFONE.map((c) => (
            <button key={c.id} onClick={() => setCategoriaSel(c.id)}
              className={`pb-2.5 text-sm whitespace-nowrap border-b-2 ${categoriaSel === c.id ? "text-neutral-900 font-medium border-red-600" : "text-neutral-500 hover:text-neutral-700 border-transparent"}`}>
              {c.label}
            </button>
          ))}
        </div>

        {categoriaSel !== "todos" && (
          <div className="flex items-start gap-4 pb-2.5">
            {subpastasCategoria ? (
              <a href={linkAtualizar}
                title={
                  !caminhoProjeto ? 'Sem o caminho da pasta do projeto (separador Propostas), o link não propõe a pasta certa.'
                  : (subpastasCategoria.length > 1 || subpastasCategoria.some((s) => s.excluir || s.apenas))
                    ? `Pastas revistas: ${subpastasCategoria.map(descreverPastaCategoria).join(" · ")}`
                  : ""
                }
                className="text-xs text-red-600 hover:underline whitespace-nowrap">
                🔄 Atualizar a partir da pasta{subpastasCategoria.length > 1 ? ` (${subpastasCategoria.length} pastas)` : ""}
              </a>
            ) : (
              <span title={`Ainda não há uma subpasta de "09_Produtos Vodafone/" confirmada para "${categoriaLabel(categoriaSel)}" — pede à Claude para confirmar antes de ligar o botão.`}
                className="text-xs text-neutral-300 whitespace-nowrap cursor-not-allowed">
                🔄 Atualizar a partir da pasta
              </span>
            )}
            {subpastasCategoria && ligacaoPasta.pronto && (
              <NovoProdutoCategoria handleProjeto={ligacaoPasta.handle} categoriaId={categoriaSel}
                categoriaLabel={categoriaLabel(categoriaSel)} subpastas={subpastasCategoria} caminhoProjeto={caminhoProjeto} nuvemAtiva={nuvemAtivaProdutos} />
            )}
          </div>
        )}
      </div>

      <div className="mt-5">
        {produtosFiltrados.length === 0 ? (
          <div className="border border-dashed border-neutral-300 rounded-lg p-8 text-center text-sm text-neutral-400">
            {textoVazio}
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {produtosFiltrados.map((p) => (
              <CartaoProdutoVodafone key={p.nome} produto={p} categoriaLabel={categoriaLabel(p.categoriaId)}
                handleProjeto={ligacaoPasta.pronto ? ligacaoPasta.handle : null} categoriaSubpastas={PASTA_POR_CATEGORIA_PRODUTOS[p.categoriaId]} nuvemAtiva={nuvemAtivaProdutos} />
            ))}
          </div>
        )}
      </div>

      {dados && (
        <div className="text-[11px] text-neutral-400 mt-4">Atualizado em {dados.atualizadoEm}</div>
      )}
    </div>
  );
}

// ClientesView/ProspetosView (ver `todaCarteira` nesses 2 ficheiros); só a lista/

// Cartão compacto para os grupos de destaque (Elegíveis agora / A aproximar-se) —

        {estado}
        <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6" /></svg>
      </button>
      {aberto && (
        <div className="absolute z-20 mt-1.5 left-0 bg-white border rounded-2xl shadow-lg p-1.5 min-w-[180px]" style={{ borderColor: "var(--vf-border)" }} role="listbox">
          {opcoes.map((o) => (
            <button key={o} type="button" onMouseDown={() => { setAberto(false); if (o !== estado) onMudar(o); }}
              className="w-full flex items-center gap-2 px-2.5 min-h-[40px] rounded-xl text-sm text-left hover:bg-[#F6F2EE]">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: (CORES_ESTADO[o] || {}).color }} />

              {o === estado && <Icone nome="check" className="w-4 h-4 ml-auto" />}

          ))}

// Secção "Fidelização por trimestre" (2026-09-21) — funcionalidade nova dentro do
// mesmo separador "Carteira a Fidelizar" (decisão explícita do utilizador: não é
// substituição da carteira de oportunidades já existente acima, é uma fonte/pergunta
// diferente — proximidade do FIM de fidelização, não upsell). Auto-contida (chama o
// próprio hook), para poder viver dentro de CarteiraFidelizarView sem alterar a
// assinatura dela.
function SecaoFidelizacaoTrimestre({ ligacaoPasta, nCarteira }) {
  const { lista, atualizadoEm, aProcessar, processarUpload, definirEstado, criarClienteSeNaoExistir, registarFechoFidelizacao, anularFechoFidelizacao, todosClientes, obterNotasFidelizacao } = useFidelizacaoTrimestre(ligacaoPasta);
  const [aviso, setAviso] = useState("");
  const inputRef = React.useRef(null);
  // Cliente pendente de confirmação para criar em "Clientes" — só quando o estado passa
  // a "Fechado" E o NIF ainda não existe lá (pedido explícito do utilizador, 2026-09-25:
  // mesma lógica de confirmação já usada na transição Prospect → Cliente em Negócios,
  // nunca automático sem confirmar). Se o cliente já existir (o caso mais comum aqui —
  // achado real de Augusto, 2026-09-25), não há ambiguidade nenhuma a resolver: regista-
  // se uma nota na ficha dele sozinho, sem banner (ver registarFechoFidelizacao).
  const [criacaoPendente, setCriacaoPendente] = useState(null);
  const [aCriarCliente, setACriarCliente] = useState(false);

  const escolherFicheiro = () => inputRef.current && inputRef.current.click();
  const aoEscolher = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const resultado = await processarUpload(file);
    if (!resultado.ok) return;
    const partes = [`${resultado.nAtualizados} cliente(s) atualizado(s)`, `${resultado.nMantidos} mantido(s) do trimestre anterior`];
    if (resultado.removidos.length) {
      partes.push(`${resultado.removidos.length} removido(s) por negócio implementado (${resultado.removidos.map((r) => r.e).join(", ")})`);
    }
    setAviso(partes.join(" · "));
    setTimeout(() => setAviso(""), 10000);
  };

  const mudarEstado = async (c, novoEstado) => {
    const eraFechado = c.estado === "Fechado";
    const atualizado = await definirEstado(c.n, novoEstado);
    if (!atualizado) return;
    // Reverter de "Fechado" para outro estado — remove a nota correspondente (bug real
    // reportado por Augusto, 2026-09-25: a nota ficava a dizer "fechado" mesmo depois
    // do estado voltar atrás).
    if (eraFechado && novoEstado !== "Fechado") {
      const removida = await anularFechoFidelizacao(c.n);
      setAviso(`"${atualizado.e}" deixou de estar Fechado${removida ? " — nota de fidelização removida da ficha" : ""}.`);
      setTimeout(() => setAviso(""), 6000);
      return;
    }
    if (novoEstado !== "Fechado") return;
    if (todosClientes.some((cl) => cl.n === c.n)) {
      await registarFechoFidelizacao(atualizado);
      setAviso(`"${atualizado.e}" marcado como Fechado — nota adicionada à ficha em Clientes.`);
      setTimeout(() => setAviso(""), 6000);
    } else {
      setCriacaoPendente(atualizado);
    }
  };
  const confirmarCriarCliente = async () => {
    if (!criacaoPendente) return;
    setACriarCliente(true);
    await criarClienteSeNaoExistir(criacaoPendente);
    setAviso(`"${criacaoPendente.e}" marcado como Fechado e adicionado a Clientes.`);
    setTimeout(() => setAviso(""), 8000);
    setCriacaoPendente(null);
    setACriarCliente(false);
  };
  const ignorarCriarCliente = () => setCriacaoPendente(null);

  const elegiveisAgora = useMemo(() => lista.filter((c) => c.servico6M > 0), [lista]);
  const aAproximarSe = useMemo(
    () => lista.filter((c) => c.servico12M > 0).sort((a, b) => b.servico12M - a.servico12M || a.e.localeCompare(b.e)),
    [lista]
  );
  const curtoPrazo = useMemo(() => lista.filter((c) => c.servico8D > 0 || c.servico60D > 0), [lista]);

  const [filtro, setFiltro] = useState("todos"); // "todos" | "elegiveis" | "aproximar"
  const nifsClientes = useMemo(() => new Set(todosClientes.map((cl) => cl.n)), [todosClientes]);
  // Registos fechados antes de existir `dataFechado` (2026-09-26): a data vem da nota
  // "Negócio de fidelização fechado em DD/MM/AAAA." na ficha do cliente. Só para
  // mostrar — nunca gravada de volta no registo. Sem nota, fica sem data.
  const [datasDasNotas, setDatasDasNotas] = useState({});
  const chaveSemData = lista.filter((c) => c.estado === "Fechado" && !c.dataFechado && nifsClientes.has(c.n)).map((c) => c.n).join(",");
  useEffect(() => {
    if (!chaveSemData) return;
    let cancelado = false;
    (async () => {
      const datas = {};
      for (const nif of chaveSemData.split(",")) {
        const notas = await obterNotasFidelizacao(nif);
        const nota = Array.isArray(notas) ? [...notas].reverse().find((n) => n.tipo === "fidelizacao-fechada") : null;
        const m = nota && (nota.texto || "").match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if (m) datas[nif] = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).toISOString();
      }
      if (!cancelado) setDatasDasNotas(datas);
    })();
    return () => { cancelado = true; };
  }, [chaveSemData]);
  const fechadosTrimestre = useMemo(() => lista.filter((c) => c.estado === "Fechado").length, [lista]);
  const TOM_ELEGIVEL = { background: "#CCFBF1", color: "#0F5F58" };
  const TOM_APROXIMAR = { background: "#FEF3C7", color: "#92400E" };
  const FILTROS = [["todos", "Todos"], ["elegiveis", "Elegíveis agora"], ["aproximar", "A aproximar-se"]];

  const grupo = (titulo, subtitulo, itens, campo, tom) => (
    <div>
      <div className="flex items-baseline gap-2 mb-3">
        <div className="font-display font-bold text-xl">{titulo}</div>
        <div className="text-sm" style={{ color: "var(--vf-muted)" }}>{itens.length} · {subtitulo}</div>
      </div>
      {itens.length === 0 ? (
        <div className="text-sm px-1" style={{ color: "var(--vf-muted)" }}>Nenhum cliente neste grupo.</div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {itens.map((c) => (
            <CartaoClienteFidelizacao key={c.n} c={c.dataFechado || !datasDasNotas[c.n] ? c : { ...c, dataFechado: datasDasNotas[c.n] }} valor={c[campo]} tom={tom} ehCliente={nifsClientes.has(c.n)} onMudarEstado={mudarEstado} />
          ))}
        </div>
      )}
    </div>
  );

  return (
    <div className="space-y-5">
      <AcoesCabecalho>
        <div className="inline-flex p-1 rounded-2xl border bg-white" style={{ borderColor: "var(--vf-border)" }} role="tablist">
          {FILTROS.map(([id, rotulo]) => (
            <button key={id} type="button" onClick={() => setFiltro(id)} role="tab" aria-selected={filtro === id}
              className="min-h-[40px] px-4 rounded-xl text-sm font-semibold transition-colors"
              style={filtro === id ? { background: "var(--vf-ink)", color: "#fff" } : { color: "var(--vf-muted)" }}>
              {rotulo}
            </button>
          ))}
        </div>
      </AcoesCabecalho>

      <CartoesKpi itens={[
        { rotulo: "Clientes na carteira", valor: nCarteira, tom: "escuro" },
        { rotulo: "Elegíveis agora", valor: elegiveisAgora.length, detalhe: "fim de fidelização em 3-6 meses", tom: "vermelho" },
        { rotulo: "A aproximar-se", valor: aAproximarSe.length, detalhe: "fim em 7-12 meses", tom: "amarelo" },
        { rotulo: "Fechados no trimestre", valor: fechadosTrimestre, tom: "verde" },
      ]} />

      <div className="flex items-center justify-between gap-4 flex-wrap bg-white border rounded-[18px] px-5 py-4" style={{ borderColor: "var(--vf-border)" }}>
        <div className="text-sm" style={{ color: "var(--vf-muted)" }}>
          Ficheiro trimestral "Cliente_a_3_6_12.xlsx" — contagens de serviços por intervalo até ao fim de fidelização, nunca datas exatas.
          {atualizadoEm && <> Última atualização: {new Date(atualizadoEm).toLocaleDateString("pt-PT")}.</>}
        </div>
        <input ref={inputRef} type="file" accept=".xlsx,.xls" onChange={aoEscolher} className="hidden" />
        <button onClick={escolherFicheiro} disabled={aProcessar} className="bg-red-600 disabled:opacity-40">
          <Icone nome="upload" className="w-4 h-4 shrink-0" />
          {aProcessar ? "A processar…" : "Carregar ficheiro do trimestre"}
        </button>
      </div>

      {aviso && <div className="text-sm rounded-2xl px-4 py-3" style={{ background: "#CCFBF1", color: "#0F5F58" }}>{aviso}</div>}

      {criacaoPendente && (
        <div className="border rounded-[18px] p-4 text-sm space-y-3" style={{ background: "#DBEAFE", borderColor: "#BFDBFE", color: "#1D4ED8" }}>
          <div>
            <span className="font-semibold">{criacaoPendente.e}</span> (NIF {criacaoPendente.n}) passou a Fechado.
            Este NIF ainda não existe em Clientes — criar a ficha agora?
          </div>
          <div className="flex items-center gap-2">
            <button onClick={confirmarCriarCliente} disabled={aCriarCliente} className="bg-red-600 disabled:opacity-50">
              {aCriarCliente ? "A criar…" : "Confirmar"}
            </button>
            <button onClick={ignorarCriarCliente} disabled={aCriarCliente} className="vf-sec disabled:opacity-50">
              Ignorar
            </button>
          </div>
        </div>
      )}

      {lista.length === 0 ? (
        <div className="border border-dashed rounded-[18px] p-8 text-center text-sm" style={{ borderColor: "#D6CCC6", color: "var(--vf-muted)" }}>
          Carrega o ficheiro trimestral acima para veres aqui os clientes mais próximos do fim de fidelização.
        </div>
      ) : (
        <>
          {filtro !== "aproximar" && grupo("Elegíveis agora", "fidelização a terminar em 3-6 meses", elegiveisAgora, "servico6M", TOM_ELEGIVEL)}
          {filtro !== "elegiveis" && grupo("A aproximar-se", "fim em 7-12 meses, por importância", aAproximarSe, "servico12M", TOM_APROXIMAR)}

          {filtro === "todos" && curtoPrazo.length > 0 && (
            <div>
              <div className="text-sm font-semibold mb-2" style={{ color: "var(--vf-muted)" }}>Prazos mais curtos ({curtoPrazo.length}) — fora do foco do trimestre, só para consulta</div>
              <div className="bg-white border rounded-[18px] overflow-hidden" style={{ borderColor: "var(--vf-border)" }}>
                {curtoPrazo.map((c) => (
                  <div key={c.n} className="flex items-center justify-between gap-2 px-5 py-2.5 text-sm border-b last:border-b-0" style={{ borderColor: "#F1ECE8" }}>
                    <span>{c.e} <span style={{ color: "var(--vf-muted)" }}>— NIF {c.n}</span></span>
                    <span className="whitespace-nowrap text-xs" style={{ color: "var(--vf-muted)" }}>
                      {c.servico8D > 0 && <span className="mr-2">&lt;8D: {c.servico8D}</span>}
                      {c.servico60D > 0 && <span>8-60D: {c.servico60D}</span>}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function CarteiraFidelizarView({ ligacaoPasta }) {
  const { todos, firebaseUser, nuvemAtiva, migrarParaNuvem, aMigrar, nParaMigrar, servicosExcel, livresExcel } = useCarteiraFidelizar(ligacaoPasta);

  return (
    <div className="space-y-3">
      <SecaoFidelizacaoTrimestre ligacaoPasta={ligacaoPasta} nCarteira={todos.length} />

      <MigracaoNuvemBanner nome="Carteira a Fidelizar" firebaseUser={firebaseUser} nuvemAtiva={nuvemAtiva}
        migrarParaNuvem={migrarParaNuvem} aMigrar={aMigrar} nParaMigrar={nParaMigrar} />

      {!nuvemAtiva && (
        <LigacaoExcel itens={[
          { tipo: "carteira-servicos", nome: "Serviços ativos na carteira.xlsx", fonte: servicosExcel.fonte, aCarregar: servicosExcel.aCarregar, precisaPermissao: servicosExcel.precisaPermissao, onContinuar: servicosExcel.continuar, onLigar: servicosExcel.ligar, onRecarregar: servicosExcel.recarregar },
          { tipo: "carteira-livres", nome: "Dados Clientes desprotegido.xlsx", fonte: livresExcel.fonte, aCarregar: livresExcel.aCarregar, precisaPermissao: livresExcel.precisaPermissao, onContinuar: livresExcel.continuar, onLigar: livresExcel.ligar, onRecarregar: livresExcel.recarregar },
        ]} />
      )}

      {/* Lista/filtros/cartões de oportunidade removidos da UI a pedido explícito do
          utilizador (2026-09-21) — os dados ligados acima continuam a alimentar
          "Preencher Telefone/Email a partir da Carteira" em Clientes/Prospetos, só
          deixaram de ter uma vista de navegação própria aqui. */}
      <div className="text-xs text-neutral-400 px-1">
        {todos.length > 0
          ? `${todos.length} registo(s) ligado(s) — usados para preencher automaticamente Telefone/Email em "Clientes" e "Prospetos".`
          : 'Liga os 2 ficheiros acima para os dados de contacto ficarem disponíveis a preencher automaticamente em "Clientes" e "Prospetos".'}
      </div>
    </div>
  );
}

function App() {
  const [pontoAtivo, setPontoAtivo] = useState("assuntos");
  const ligacaoPasta = useLigacaoExcel("pastaProjeto", true);
  const firebaseUser = useFirebaseAuthUser();
  const ponto = PONTOS.find((p) => p.id === pontoAtivo);

  return (
    <div className="min-h-screen" style={{ background: "var(--vf-bg)", color: "var(--vf-ink)" }}>
      <aside className="fixed inset-y-0 left-0 w-[248px] flex flex-col z-20" style={{ background: "#1B1416" }}>
        <div className="flex items-center gap-3 px-5 pt-6 pb-7">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-display font-extrabold text-[15px]" style={{ background: "var(--vf-red)" }}>VB</div>
          <div className="leading-tight">
            <div className="text-white font-display font-bold text-[15px]">Dashboard</div>
            <div className="text-xs" style={{ color: "var(--vf-side-text)" }}>Vodafone Business</div>
          </div>
        </div>
        <nav className="flex-1 overflow-y-auto px-3 space-y-1">
          {PONTOS.map((p) => {
            const ativo = pontoAtivo === p.id;
            return (
              <button key={p.id} onClick={() => setPontoAtivo(p.id)}
                className={`w-full flex items-center gap-3 px-3 min-h-[44px] rounded-xl text-sm text-left transition-colors ${ativo ? "text-white font-semibold" : "hover:bg-white/5 hover:text-white"}`}
                style={ativo ? { background: "var(--vf-red)" } : { color: "var(--vf-side-text)" }}>
                <Icone nome={p.icone} />
                <span className="truncate">{p.label}</span>
              </button>
            );
          })}
        </nav>
        <div className="px-5 py-5 border-t border-white/10">
          <div className="flex items-center gap-2 text-xs" style={{ color: "var(--vf-side-text)" }}>
            <span className={`w-2 h-2 rounded-full ${firebaseUser ? "bg-emerald-400" : "bg-neutral-500"}`} />
            {firebaseUser ? "Sincronizado na nuvem" : "Só neste computador"}
          </div>
          <div className="text-white text-sm font-semibold mt-1.5">Augusto Graça</div>
        </div>
      </aside>

      <main className="ml-[248px] px-10 py-9">
        <div className="max-w-6xl">
          <header className="mb-7 flex items-end justify-between gap-6 flex-wrap">
            <div>
              <div className="text-xs font-bold tracking-[0.14em] uppercase" style={{ color: "var(--vf-red)" }}>{ponto.eyebrow}</div>
              <h1 className="font-display font-extrabold text-[44px] leading-[1.05] mt-1.5 tracking-tight">{ponto.label}</h1>
            </div>
            <div id="vf-acoes-cabecalho" className="flex items-center gap-2 flex-wrap" />
          </header>

        <AvisoPastaProjeto ligacaoPasta={ligacaoPasta} />

        <ErrorBoundary key={pontoAtivo}>
          {pontoAtivo === "assuntos" && <AssuntosView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "negocios" && <NegociosView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "comissoes" && <ComissoesView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "clientes" && <ClientesView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "prospetos" && <ProspetosView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "propostas" && <PropostasView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "produtos" && <ProdutosVodafoneView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "faturas" && <AnaliseFaturasView ligacaoPasta={ligacaoPasta} />}
          {pontoAtivo === "carteira" && <CarteiraFidelizarView ligacaoPasta={ligacaoPasta} />}
        </ErrorBoundary>
        {!PONTOS.find((p) => p.id === pontoAtivo).ready && (
          <div className="border border-dashed border-neutral-300 rounded-lg p-8 text-center text-sm text-neutral-500">
            "{PONTOS.find((p) => p.id === pontoAtivo).label}" ainda não está construído — é o próximo ponto na lista.
          </div>
        )}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
